座位号；大件行李放车厢两端的大件行李架。","steps":["检票口屏看站台号 → 下站台按地面车厢号地标排队","上车核对车厢号与座位号（A、F 一般靠窗）","28 寸以上行李箱放大件行李处，小包放头顶"],"pitfalls":["停站时间常常只有 2–5 分钟，下车透口气别走远","行李别堵住过道和车门，贵重物品随身带"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次、席别与站台信息的官方查询入口"}]},{"id":"trip-04","title":"第一次选座位：二等/一等/商务、硬座/硬卧/软卧","merged_from":["第一次坐二等座","第一次坐一等座","第一次坐商务座","第一次坐硬座","第一次坐硬卧","第一次坐软卧","第一次坐绿皮火车","第一次坐高铁","第一次坐动车"],"tags":["交通","火车"],"cost":{"money":"差价可达数倍","time":"0","willpower":"低"},"evidence":"B","body":{"plain":"高铁动车分二等座、一等座、商务座，价格与舒适度递增；普速车分硬座、硬卧、软卧。名字里的「硬」「软」说的是铺位形式，不是新旧好坏。","steps":["4 小时以内：二等座足够","过夜：选卧铺，下铺最方便也最贵","长途白天想舒服：一等座；想省钱：二等座靠窗"],"pitfalls":["硬卧上铺最便宜但上下不便，中铺最尴尬","绿皮车部分车次没有空调，夏天要留意车次信息"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"席别与票价查询"}]},{"id":"trip-05","title":"第一次坐夜车和十小时以上的长途","merged_from":["第一次坐夜车","第一次坐十小时以上火车"],"tags":["交通","火车"],"cost":{"money":"卧铺票价","time":"8–30 小时","willpower":"中"},"evidence":"C","body":{"plain":"过夜优先卧铺，夕发朝至能省一晚住宿。带耳塞、眼罩、充电宝和一件外套，车上餐饮偏贵，自己带够吃喝更实在。","steps":["选夕发朝至的车次，订卧铺下铺或中铺","上车先铺床、把贵重物品贴身放","按到站时间定闹钟，提前 30 分钟收拾"],"pitfalls":["夜车最容易坐过站，闹钟要设在到站前","卧铺下铺白天常被人坐，贵重物品别放床上"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次时刻与卧铺席别信息"}]},{"id":"trip-06","title":"第一次遇到火车晚点、中途停车、没赶上车","merged_from":["第一次火车中途停车","第一次火车晚点","第一次没赶上火车"],"tags":["交通","火车","应急"],"cost":{"money":"可能改签费","time":"不确定","willpower":"中"},"evidence":"A","body":{"plain":"晚点在雨季和节假日很常见。处理原则看原因：铁路原因或自然灾害导致不能乘车，应办理退票或改签、差额退还；因为你自己没赶到，则按企业公布的规则办。","steps":["在 12306 APP 看正晚点，判断后续换乘是否来得及","晚点影响换乘：找列车长开客运记录，作为后续处理的凭证","没赶上车：立刻在 APP 或改签窗口改签当日余票"],"pitfalls":["开车后一般不能退票，别指望「先出站再说」","换乘只留十几分钟，一旦晚点就全线崩，建议至少留 30 分钟"]},"sources":[{"name":"《铁路旅客运输规程》（交通运输部令 2022 年第 37 号，2023-01-01 施行）","url":"https://www.gov.cn/zhengce/2022-11/17/content_5728978.htm","note":"因铁路运输企业原因或自然灾害不能正常运输时，应办理退票或改签，票价差额退还"},{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"正晚点查询与改签入口"}]},{"id":"trip-07","title":"第一次坐过站与上车补票","merged_from":["第一次坐过站","第一次补票"],"tags":["交通","火车","应急"],"cost":{"money":"补票，未主动补票可能加收 50%","time":"数十分钟","willpower":"中"},"evidence":"A","body":{"plain":"坐过站不要自己买反方向票——找列车长开客运记录，由铁路安排最近的车次免费送回。无票或越站乘车要补票；未经同意又不主动补票的，会被补收票款并可能加收已乘区间应补票款的 50%。","steps":["立刻找列车长说明坐过站，索取客运记录","在下一站凭记录安排返回，不要擅自出站","车上主动补票，别等查到再补"],"pitfalls":["「等着被查到再说」会触发加收条款","客运记录是免费返程的凭证，丢了就要重新买票"]},"sources":[{"name":"《铁路旅客运输规程》（交通运输部令 2022 年第 37 号，2023-01-01 施行）","url":"https://www.gov.cn/zhengce/2022-11/17/content_5728978.htm","note":"第二十七条相关：未经同意无票乘车未主动补票的，补收票款并可以加收 50% 已乘区间应补票款"}]},{"id":"trip-08","title":"第一次在车上吃饭、睡觉与充电","merged_from":["第一次在火车上买东西","第一次在火车上吃饭","第一次在火车上睡觉","第一次在火车上充电"],"tags":["交通","火车"],"cost":{"money":"餐饮 15–60 元","time":"全程","willpower":"低"},"evidence":"C","body":{"plain":"高铁有餐车和推车，普速车有盒饭，价格普遍高于地面。充电口位置各车型不同，一般在座位下方或前排座椅背，自己带插线板和充电宝最保险。","steps":["上车先找到充电口，确认是否可用","自带水和耐放的吃的，餐车错峰去","睡觉定闹钟，背包当枕头，贵重物品贴身"],"pitfalls":["车上餐饮贵且选择少","充电口常被占，别指望一定有空位"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"列车服务信息"}]},{"id":"trip-09","title":"第一次在车上找列车员、丢东西","merged_from":["第一次找列车员","第一次火车上丢东西"],"tags":["交通","火车","应急"],"cost":{"money":"0","time":"越快越好","willpower":"中"},"evidence":"B","body":{"plain":"车上丢东西，当场找列车员或列车长是最快的；已经下车就打 12306 客服登记，越早越有可能找回。","steps":["立刻找列车员，说清车厢、座位号、物品特征","下车后打 12306 客服登记失物信息","关注 12306 APP 的失物招领，或联系终到站服务台"],"pitfalls":["记不清座位号会明显降低找回概率","贵重物品别放行李架深处或座位下方"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"客服与失物招领入口"}]},{"id":"trip-10","title":"第一次在火车上和陌生人聊天","merged_from":["第一次火车上认识陌生人"],"tags":["社交","交通"],"cost":{"money":"0","time":"全程","willpower":"低"},"evidence":"C","body":{"plain":"车厢是最容易破冰的公共场景，但边界要自己划：不透露住址和单位、不跟陌生人下车、不替陌生人看行李。","steps":["用中性话题开场，比如「你到哪站」","不聊收入、住址、身份证件信息","感觉不对就戴耳机、看窗外，自然地结束对话"],"pitfalls":["替陌生人看行李有风险，可能牵涉违禁品","别扫来源不明的二维码或加不明群"]},"sources":[{"name":"《铁路旅客运输规程》（交通运输部令 2022 年第 37 号，2023-01-01 施行）","url":"https://www.gov.cn/zhengce/2022-11/17/content_5728978.htm","note":"实名制与禁止、限制携带物品的管理规定背景"}]},{"id":"trip-11","title":"第一次一个人坐火车","merged_from":["第一次一个人坐火车"],"tags":["交通","火车","独立"],"cost":{"money":"票价","time":"半天到一天","willpower":"中"},"evidence":"C","body":{"plain":"一个人坐火车，核心是三件事：时间留够、证件带齐、信息提前存好。全程自己盯检票信息，不依赖别人提醒。","steps":["提前 40 分钟到站，节假日再提前","手机存好车次、座位、出站后路线截图","到站前 30 分钟开始收行李，别等人流散了才动"],"pitfalls":["深夜到站要提前查好接驳，别在站外临时决定","行李不要托付给陌生人看管"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次与车站信息查询"}]},{"id":"trip-12","title":"第一次站内换乘（含只有十几分钟）","merged_from":["第一次站内换乘","第一次只有十几分钟换乘","第一次换乘时找不到路","第一次换乘错方向","第一次换乘没赶上下一趟车","第一次同站换乘"],"tags":["交通","火车","换乘"],"cost":{"money":"0","time":"20–40 分钟","willpower":"中"},"evidence":"B","body":{"plain":"同站换乘不用出站，下车后找「中转换乘」指示，直接回候车层再检票。稳妥的做法是预留 20 分钟以上；只有十几分钟时，走错一次就赶不上。","steps":["下车前问列车员哪节车厢离换乘通道最近","跟着「中转换乘」标识走，不要跟着出站人流","刷证进候车区，直接找下一程检票口"],"pitfalls":["十分钟级别的换乘不要排电梯，走楼梯更快","不同车站换乘通道位置差别很大，别照搬经验"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"中转换乘查询功能"}]},{"id":"trip-13","title":"第一次跨站换乘","merged_from":["第一次跨站换乘","第一次异站换乘"],"tags":["交通","换乘"],"cost":{"money":"市内交通 5–100 元","time":"60–120 分钟","willpower":"中"},"evidence":"B","body":{"plain":"两趟车停在不同车站（比如北京站和北京西站）时，必须出站坐地铁或打车，时间至少留 90 分钟，行李多就更久。","steps":["用地图查两站之间的最短路线与耗时","把两站之间的时间按最坏路况算，预留 ≥90 分钟","到站先出站，再按导航走，别在站内绕"],"pitfalls":["把「北京」当成一个站是新手最常见的错误，买票时务必看清站名","早晚高峰的跨站打车时间会翻倍"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次与车站信息（含同城多站）"}]},{"id":"trip-14","title":"第一次火车转地铁、转公交","merged_from":["第一次转乘地铁","第一次火车转地铁","第一次火车转公交"],"tags":["交通","接驳"],"cost":{"money":"2–10 元","time":"30–60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"大站基本都有地铁接驳，跟着「地铁」指示牌走就行；公交更便宜，但受路况影响大，赶时间不要选。","steps":["出站看地铁标识，直接进站","用地图确认末班车时间","深夜到站直接打车，别赌末班车"],"pitfalls":["多数城市地铁末班在 22:30–23:30，公交更早","跨市的地铁/城际线可能不适用当地交通码"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市客运（地铁、公交）由交通运输主管部门管理，具体以当地运营方公告为准"}]},{"id":"trip-15","title":"第一次火车转飞机、机场转机与国际转机","merged_from":["第一次火车转飞机","第一次机场转机","第一次国际转机"],"tags":["交通","飞机","换乘"],"cost":{"money":"视票价","time":"3 小时以上","willpower":"中"},"evidence":"C","body":{"plain":"火车转飞机必须留足时间，建议 3 小时以上；国际转机还要看是否同一航站楼、要不要过境签、行李是否直挂。","steps":["出发前确认航站楼与值机截止时间","问清行李是否直挂；不直挂要自取再托运","国际转机留 ≥2 小时并确认签证与过境要求"],"pitfalls":["廉航多不联程，行李要自己取再托运","不同航站楼之间的摆渡很耗时"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"民航运输由民航主管部门管理，具体以承运航司与机场公告为准"}]},{"id":"trip-16","title":"第一次中转停留超过一天","merged_from":["第一次中转时间超过一天"],"tags":["交通","换乘","旅行"],"cost":{"money":"住宿 100–400 元","time":"1 天以上","willpower":"中"},"evidence":"C","body":{"plain":"中转停留一天以上，本质是加了一次短途旅行：把大件寄存、订车站周边的酒店、只带随身包轻装出门。","steps":["车站寄存处或自助柜存大件行李","订车站周边或地铁沿线的酒店，方便次日返程","按返程时间倒推设置闹钟，留出安检时间"],"pitfalls":["证件、充电器、常用药不要锁进寄存柜","旺季车站周边酒店会满，提前订"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车站服务与行李寄存信息"}]},{"id":"trip-17","title":"第一次自己规划换乘路线","merged_from":["第一次自己规划换乘路线"],"tags":["交通","换乘","方法"],"cost":{"money":"0","time":"30–60 分钟","willpower":"中"},"evidence":"B","body":{"plain":"排路线的原则只有两条：按最坏情况估时间，并给每一段准备一个备选班次。别用理想时刻表安排自己的一天。","steps":["列出每段交通的实际耗时（含进出站、安检）","每段加 30% 缓冲","查每段的末班时间与备选班次，截图存到手机"],"pitfalls":["换乘时间按「到站时间」算而不是「发车时间」算，容易误判","跨城末班车一旦错过，通常只能过夜"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次、时刻与中转换乘查询"}]},{"id":"trip-18","title":"第一次坐地铁：买票、扫码与刷证","merged_from":["第一次坐地铁","第一次买地铁票","第一次扫码坐地铁","第一次刷身份证坐地铁"],"tags":["交通","地铁"],"cost":{"money":"2–15 元","time":"5 分钟","willpower":"低"},"evidence":"B","body":{"plain":"现在多数城市地铁用手机扫码或交通卡，单程票反而最少用。扫码要「进站刷一次、出站刷一次」，按里程扣费。","steps":["打开本地地铁 APP 或支付宝/微信出行码","进站刷码或刷卡，出站再刷一次","保留行程记录，异常扣费可申诉"],"pitfalls":["漏刷出站会按最远站扣费","各城市交通码不通用，跨市要重新开通"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市轨道交通由交通运输主管部门管理，票务规则以当地运营方公告为准"}]},{"id":"trip-19","title":"第一次地铁坐错方向、坐过站与赶末班车","merged_from":["第一次坐错地铁方向","第一次坐过地铁站","第一次地铁换乘","第一次赶地铁末班车"],"tags":["交通","地铁","应急"],"cost":{"money":"0–20 元","time":"10–30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"坐反方向不用出站，到下一站下车到对面站台坐回去即可；坐过站同理。末班车一定要提前查，错过基本只能打车。","steps":["看站台屏确认列车终点与方向","坐错方向：下一站下车，看清指示换到对面","赶末班：提前 20 分钟进站，别卡点"],"pitfalls":["部分线路末班车只开到中途站","末班车之后换乘通道会关闭，别指望站内换乘"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市轨道交通运营管理相关规定与当地公告"}]},{"id":"trip-20","title":"第一次坐公交与下错站","merged_from":["第一次坐公交","第一次下错公交站"],"tags":["交通","公交"],"cost":{"money":"1–5 元","time":"20–60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"公交要提前按铃或喊站，报站语音有时候不灵；用地图 APP 盯着实时位置最稳。","steps":["上车扫码或刷卡，记好下车站名","地图上看剩余站数，提前一站按铃","下车先看站牌，确认方向再走"],"pitfalls":["部分线路分段计价，上下车都要刷","末班车比地铁早很多"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市公共汽电车客运管理相关规定"}]},{"id":"trip-21","title":"第一次坐长途大巴与买汽车票","merged_from":["第一次坐长途大巴","第一次买汽车票","第一次一个人坐长途大巴"],"tags":["交通","大巴"],"cost":{"money":"几十到几百元","time":"2–10 小时","willpower":"中"},"evidence":"C","body":{"plain":"长途大巴实行实名购票，在汽车站或官方小程序买票。路上的不确定性比火车大：堵车、中途上下客都会拖时间。","steps":["车站窗口或官方小程序购票，核对发车站","提前 30 分钟到站，行李放行李舱并记住位置","全程系安全带，备好水和晕车药"],"pitfalls":["别坐站外拉客的「黑车」，没有票据也没保险","中途停车时间短，别走远"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"道路客运由交通运输主管部门管理，以当地汽车站与承运企业公告为准"}]},{"id":"trip-22","title":"第一次打出租车与东西落在车上","merged_from":["第一次打出租车","第一次东西落在出租车里"],"tags":["交通","出租车","应急"],"cost":{"money":"起步价起","time":"越快越好","willpower":"低"},"evidence":"B","body":{"plain":"下车要发票（上面有车牌号），这是找回失物最直接的凭据。发现东西落了，打 12328 交通运输服务监督电话或联系出租车公司。","steps":["下车主动要发票，或记下车牌","发现丢失立刻打 12328 / 平台客服，说明时间、路线、车型","能联系到司机就约定送回地点，必要时付车费"],"pitfalls":["不给发票的车不要坐","现金支付难追溯，扫码支付能查到收款方"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"12328 交通运输服务监督电话，巡游出租汽车管理"}]},{"id":"trip-23","title":"第一次打网约车：上车点、拼车、绕路与取消","merged_from":["第一次打网约车","第一次找网约车上车点","第一次拼车","第一次遇到司机绕路","第一次网约车取消订单"],"tags":["交通","网约车"],"cost":{"money":"10–100 元","time":"5–30 分钟","willpower":"低"},"evidence":"B","body":{"plain":"网约车按平台规则运行，关键在于上车前核对车牌与司机信息，行程中把行程分享给家人。绕路、乱收费都在平台内投诉，别私下解决。","steps":["定位到明确的上车点（商场出口、路口），别让司机猜","核对车牌、车型、司机头像再上车","打开行程分享，下车再结束行程","有异议在平台内投诉，保留行程单"],"pitfalls":["车牌与订单不符坚决不上车","拼车会绕路，赶时间别拼","频繁取消会被平台限制或收取费用"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"网络预约出租汽车经营服务管理，由交通运输主管部门监管"}]},{"id":"trip-24","title":"第一次半夜打车与在陌生城市打车","merged_from":["第一次半夜打车","第一次在陌生城市打车"],"tags":["交通","网约车","安全"],"cost":{"money":"几十元","time":"10–30 分钟","willpower":"中"},"evidence":"C","body":{"plain":"半夜或陌生城市优先用平台叫车，因为平台有轨迹、有录音、可追溯。上车前拍车牌发给家人，坐后排，到了再下车。","steps":["在光亮、有人流的地方等车","拍车牌 + 分享行程给家人","坐后排，不透露独自居住等信息"],"pitfalls":["站口拉客的「黑车」不要坐","不要因为便宜就上无牌无证的车"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"出租汽车与网约车的行业监管规定"}]},{"id":"trip-25","title":"第一次独自在陌生城市换乘、走完整套跨城交通","merged_from":["第一次一个人在陌生城市换乘","第一次独自完成一整套跨城交通"],"tags":["交通","独立","换乘"],"cost":{"money":"视行程","time":"半天到一天","willpower":"中"},"evidence":"C","body":{"plain":"把整段行程拆成「到站 → 出站/换乘 → 下一程」三步，每一步提前截图存好，比临场找路省一半时间，也不容易慌。","steps":["出发前把每段的车次、站名、入口截图存到相册","每段留 30% 缓冲，别排满","每到一站先确认下一程的时间与位置","行李尽量精简成一个箱子加一个包"],"pitfalls":["别把所有东西都托运或寄存，证件和充电宝随身","手机电量是这条链路上最关键的资源"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次、车站与中转换乘查询"}]}],"additions":[{"title":"第一次用电子临时乘车身份证明进站","why":"没带身份证是最常见的出行事故，12306 APP 里能直接办"},{"title":"第一次买计次票 / 定期票","why":"通勤族能省下不少钱，但很多人不知道有这回事"},{"title":"第一次在车站寄存行李","why":"中转、半日游都用得上"},{"title":"第一次坐城际 / 市域铁路","why":"介于地铁和火车之间，购票与进站规则不同"},{"title":"第一次带大件行李或自行车上车","why":"有尺寸与包装要求，临到安检才发现会被拦"},{"title":"第一次在车上遇到邻座纠纷或外放噪音","why":"知道找谁、怎么说，比忍完全程强"},{"title":"第一次坐高铁无座票","why":"无座票不是站着全程，车厢连接处和空座都能用"},{"title":"第一次用积分兑换车票","why":"常旅客积分能直接换票，过期作废"}],"_file":"01-出行篇.json"},{"section":"18 安全与紧急情况篇","emoji":"🚨","source_count":50,"merged_count":21,"note":"由原大纲 50 条合并。急救类引中国红十字会总会，地震引中国地震局，诈骗举报引 12321/12377；消防与警务条目因官网为脚本渲染无法逐条抓取正文，已按规范降级标注。","entries":[{"id":"sos-01","title":"第一次手机丢失","merged_from":["第一次手机丢失"],"tags":["安全","数码"],"cost":{"money":"0–数千元","time":"1–3 小时","willpower":"中"},"evidence":"C","body":{"plain":"手机丢了，第一件事不是找手机，而是切断它能造成的损失：先挂失 SIM 卡、冻结支付、再远程锁定与抹除。","steps":["借别人的手机打运营商客服挂失 SIM（移动 10086 / 联通 10010 / 电信 10000）","用另一台设备登录云账号，开「查找设备」→ 远程锁定或抹除","打支付宝 95188、微信支付客服冻结账户","报警并留好报案回执，方便后续申诉"],"pitfalls":["先挂 SIM 再谈找回，否则验证码会被用来登录你的账号","别在陌生设备上登录网银"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"运营商与支付机构的挂失、冻结流程以各自官方客服为准"}]},{"id":"sos-02","title":"第一次身份证、银行卡、钱包丢失","merged_from":["第一次身份证丢失","第一次银行卡丢失","第一次钱包丢失"],"tags":["安全","证件"],"cost":{"money":"补办费几十元","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"证件和卡分开处理：银行卡先电话挂失（防资金损失），身份证去派出所或政务大厅挂失补办，钱包丢了要报警留记录。","steps":["银行卡：打银行客服口头挂失，再去网点补卡","身份证：就近派出所或政务服务中心挂失、补办，可先办临时身份证应急","钱包：报警备案，留回执（涉及后续纠纷时是证据）","把证件照、卡号提前存在加密相册里"],"pitfalls":["身份证被冒用办卡的风险主要靠「挂失记录」来举证，一定要留","补办期间出行用临时身份证或电子证照"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"居民身份证挂失申报与补办由公安机关办理"}]},{"id":"sos-03","title":"第一次护照在境外丢失","merged_from":["第一次护照丢失"],"tags":["安全","证件","出国"],"cost":{"money":"补办费","time":"1–数天","willpower":"高"},"evidence":"C","body":{"plain":"在境外丢护照，顺序是：报警拿证明 → 联系中国使领馆补办旅行证 → 再改签行程。别抱侥幸直接去机场。","steps":["到当地警察局报案，索取报警证明（多数国家补证必需）","联系中国驻当地使领馆，申请补发护照或旅行证","复印/拍照留存原护照与签证页，必要时联系移民局补入境记录"],"pitfalls":["没有报警证明，很多使领馆不受理补证","先确认签证是否需要重新办理再订机票"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"中国公民在境外证件遗失，由中国驻外使领馆受理补发"}]},{"id":"sos-04","title":"第一次被诈骗：电话、短信与转账之后怎么办","merged_from":["第一次被诈骗","第一次收到诈骗电话","第一次收到钓鱼短信","第一次被骗转账","第一次联系银行止付"],"tags":["安全","诈骗","应急"],"cost":{"money":"可能损失全部余额","time":"越快越好","willpower":"高"},"evidence":"B","body":{"plain":"被骗转账后的黄金时间是前几十分钟：先打银行客服要求止付/冻结，再打 110 报警，同时把诈骗短信、号码举报到 12321。","steps":["立刻打银行客服（卡背面号码）要求止付、冻结账户、查询资金去向","打 110 报警，带上转账记录、对方账号、聊天截图","把诈骗短信/骚扰电话举报到 12321，网络诈骗信息举报到 12377","把对方账号提交给银行与警方，越早越可能拦截"],"pitfalls":["不要相信「网上追款」「黑客帮你要回钱」，那是二次诈骗","不要因为羞愧而拖延，止付窗口很短"]},"sources":[{"name":"12321 网络不良与垃圾信息举报受理中心","url":"https://www.12321.cn","note":"受理垃圾短信、诈骗电话与不良信息的举报"},{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"转账被骗后应第一时间联系银行止付并向公安机关报案"}]},{"id":"sos-05","title":"第一次报警与去派出所","merged_from":["第一次报警","第一次去派出所"],"tags":["安全","法律"],"cost":{"money":"0","time":"1–3 小时","willpower":"中"},"evidence":"C","body":{"plain":"报警说清三件事：在哪、发生了什么、有没有人受伤。到派出所做笔录前，先把时间线和证据在手机备忘里列好。","steps":["拨 110，说清地点、事由、人数与伤情","保存现场照片、聊天记录、转账凭证","到派出所如实陈述，笔录可以要求核对后签字","索取报案回执或受案登记表，后续要用"],"pitfalls":["报案不等于立案，拿回执才能证明你报过案","别自行删改聊天记录，证据链会断"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"公安机关受案、立案与报案回执相关规定"}]},{"id":"sos-06","title":"第一次遇到交通事故（自己或别人）","merged_from":["第一次遇到交通事故","第一次看到别人发生事故"],"tags":["安全","交通","应急"],"cost":{"money":"视责任","time":"1–数小时","willpower":"中"},"evidence":"B","body":{"plain":"先保人再保车：有人受伤先打 120，再打 122/110 报警，最后才谈保险。别私了到连证据都没留。","steps":["开双闪、摆三角牌，人员撤到护栏外","有人受伤打 120，同时打 122 报警","拍照取证：全景、接触点、刹车痕、车牌、路况","联系保险公司报案，留好事故认定书"],"pitfalls":["高速上不要在车道内理论，二次事故更致命","伤者不要随意搬动（除非有起火等危险）"]},"sources":[{"name":"交通运输部（道路运输与交通事故处理规定）","url":"https://www.mot.gov.cn","note":"道路交通事故处理程序与道路运输安全规定"}]},{"id":"sos-07","title":"第一次拨打 120 / 110 / 119","merged_from":["第一次叫救护车","第一次拨打 120","第一次拨打 110","第一次拨打 119"],"tags":["安全","应急"],"cost":{"money":"0","time":"几分钟","willpower":"低"},"evidence":"C","body":{"plain":"三个号码分工不同：120 医疗急救、110 治安与刑事、119 火灾与救援（现在也承担综合救援）。拨打时说清地址、人数、伤情，并保持电话畅通。","steps":["确认地址：小区名 + 楼栋 + 单元 + 门牌，或最近的路口/店铺名","说清人数、伤情/火情、是否需要破拆救援","派人到路口接应，保持电话不占线","按接线员指示做，不要先挂电话"],"pitfalls":["地址说不清是延误救援的最大原因","不要为了「快点来」夸大伤情，会占用资源"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"120/110/119 职责分工与报警要求，以各地主管部门公告为准"},{"name":"国家消防救援局","url":"https://www.119.gov.cn","note":"国家消防救援局（119 接处警与消防科普）"}]},{"id":"sos-08","title":"第一次遇到火灾：初期处置、用灭火器、逃生","merged_from":["第一次遇到火灾","第一次使用灭火器","第一次火灾逃生"],"tags":["安全","应急"],"cost":{"money":"0","time":"几分钟","willpower":"中"},"evidence":"B","body":{"plain":"记住顺序：先报警（119）、再决定灭还是跑。能灭就用灭火器对准火焰根部；灭不了立刻关门撤离，不要乘电梯、不要回房间拿东西。","steps":["喊人 + 打 119，说明楼层与起火物","灭火器：拔销、握管、压把，站在上风方向对准火焰根部左右扫射","逃生：低姿、湿毛巾捂口鼻、摸门把手（烫就不要开）、走安全通道","到安全地点后清点人数，告诉消防员是否还有人被困"],"pitfalls":["楼道烟火比火本身更致命，别冲进浓烟","高层不要跳楼，退到有窗房间封门缝等待救援"]},"sources":[{"name":"国家消防救援局","url":"https://www.119.gov.cn","note":"消防科普与火场逃生要点（官网为脚本渲染，具体以站内最新指引为准）"},{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训中包含火灾现场自救互救内容"}]},{"id":"sos-09","title":"第一次被困电梯","merged_from":["第一次被困电梯"],"tags":["安全","应急"],"cost":{"money":"0","time":"10–60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"电梯不是密闭铁盒，有通风，别扒门、别爬顶。按警铃或用手机打 96333（多数城市电梯应急电话）等救援。","steps":["按轿厢内警铃/对讲，说明楼栋与人数","打电梯维保电话或 96333，也可打 119","保持体力，不要强行扒门或爬出轿厢","救援到位后听从指挥再出轿厢"],"pitfalls":["强行扒门是伤亡主因","如果电梯下坠，背靠轿厢、屈膝缓冲"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"电梯困人救援由维保单位与消防救援承担，各地设有 96333 应急专线"}]},{"id":"sos-10","title":"第一次停电、停水","merged_from":["第一次停电","第一次停水"],"tags":["独立生活","应急"],"cost":{"money":"0","time":"数小时","willpower":"低"},"evidence":"C","body":{"plain":"停电先看是不是只有自家跳闸（看电闸、问邻居），整栋都停就等物业/供电公司。停水时先储一桶水，停水可能伴随水质变化。","steps":["检查自家空气开关，跳闸就复位","打 95598（供电）或物业确认是否区域停电","储水、关热水器电源，冰箱尽量少开门","恢复供电后先检查电器是否正常"],"pitfalls":["停电时点蜡烛容易引发火灾，用充电灯","恢复供水初期水可能发黄，放一会儿再用"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"供电服务热线 95598，供水与物业由当地主管部门与物业公司负责"}]},{"id":"sos-11","title":"第一次遇到暴雨、台风、洪水","merged_from":["第一次遭遇极端天气","第一次遇到暴雨","第一次遇到台风","第一次遇到洪水"],"tags":["安全","应急"],"cost":{"money":"0","time":"数小时到数天","willpower":"中"},"evidence":"B","body":{"plain":"极端天气的原则是「不外出、不涉水、不停地下空间」。暴雨时地铁站、地下车库、下穿隧道是最危险的地方。","steps":["关注气象台预警等级，红色预警就取消一切出行","暴雨：不进地下空间、不涉水过路（15 厘米急流就能冲倒人）","台风：收阳台物品、关窗、远离广告牌与大树","洪水：往高处转移，不要为了财物返回"],"pitfalls":["车在积水中熄火不要二次点火，弃车求生","不要在桥下、涵洞躲雨"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"气象灾害预警与应急响应，以中央气象台与当地应急部门发布为准"}]},{"id":"sos-12","title":"第一次遇到地震","merged_from":["第一次遇到地震"],"tags":["安全","应急"],"cost":{"money":"0","time":"数十秒","willpower":"中"},"evidence":"B","body":{"plain":"地震来了先躲后撤：室内「伏地、遮挡、手抓牢」，躲桌子下护住头颈；震动停止后再走楼梯撤离，不要跳楼、不要坐电梯。","steps":["震动时：伏地 → 躲到坚固桌下或内墙墙角 → 护住头颈","远离窗户、吊灯、高柜","震动停止后走安全通道下楼，到空旷地","准备应急包：水、手电、口哨、常用药、证件复印件"],"pitfalls":["地震时不要跑向阳台或电梯","户外远离建筑外墙、电线杆与广告牌"]},"sources":[{"name":"中国地震局","url":"https://www.cea.gov.cn","note":"中国地震局：地震避险与应急准备科普"}]},{"id":"sos-13","title":"第一次迷路、在陌生地方找不到人","merged_from":["第一次在陌生地方找不到人"],"tags":["安全","出行"],"cost":{"money":"0–几十元","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"迷路时先停下来定位，而不是继续乱走：打开地图看路名/地标，或找店铺、保安、地铁站问路。约好走散后的固定集合点最省事。","steps":["打开地图定位，或用商店门牌、路口标识确认位置","向店员、保安、交警问路（别跟陌生人走）","手机没电就借店铺充电或打给同行人","走散前先约定集合点与「找不到就回原地」规则"],"pitfalls":["别为了抄近路走小巷或工地","不要上陌生人的车「顺路带你」"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"城市公共服务与求助渠道（公安、城管、地铁站务）"}],"note":"「第一次迷路」归 15 旅行与出国篇成条，此处只保留陌生环境中迷路/找不到人时的应急处理"},{"id":"sos-14","title":"第一次夜间独自回家、发现有人跟踪","merged_from":["第一次夜间独自回家","第一次发现有人跟踪"],"tags":["安全","应急"],"cost":{"money":"打车费","time":"20–60 分钟","willpower":"中"},"evidence":"C","body":{"plain":"夜间安全的核心是「不暴露路线、不落单、不硬刚」。怀疑被跟踪就去人多明亮处、进店、报警，不要直接回家。","steps":["走主路、有人流、有监控的路线，耳机只戴一只","怀疑被跟踪：改变节奏试探，确认后进便利店/商场或上公交","打电话给家人朋友并共享位置，必要时拨 110","不要直接回住处；确需回家就先在楼下等人接"],"pitfalls":["不要为了甩人钻进小巷或无人楼道","不要与对方正面冲突"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"遇到跟踪、骚扰可随时拨打 110，公安机关受理报案"}]},{"id":"sos-15","title":"第一次遇到陌生人纠缠","merged_from":["第一次遇到陌生人纠缠"],"tags":["安全","社交"],"cost":{"money":"0","time":"几分钟","willpower":"中"},"evidence":"C","body":{"plain":"应对纠缠的通用做法：不对视纠缠、不解释、不跟着走，直接走向人多处并大声求助，让第三人介入。","steps":["简短拒绝后就离开，不做过多解释","走向店员、保安、路人，明确说「我不认识他，请帮我」","情况升级立刻报警并录像取证","记下对方特征、车牌、时间地点"],"pitfalls":["「给个面子」「帮个小忙」是常见搭讪话术，别接","不要为对方带路或上对方车辆"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"骚扰、纠缠可报警处理，公共场所可向安保人员求助"}]},{"id":"sos-16","title":"第一次帮助受伤的人：该不该停","merged_from":["第一次帮助受伤的人"],"tags":["安全","急救","社会"],"cost":{"money":"0","time":"10–30 分钟","willpower":"中"},"evidence":"C","body":{"plain":"该停，但要按顺序做：先确保自己安全（车流、火源、电），再打 120/110，然后在不造成二次伤害的前提下帮忙。","steps":["判断现场是否安全，先保护自己（开双闪、站到护栏外）","打 120 说清地点与伤情，按接线员指导操作","不要随意搬动伤者；出血就加压止血","留在现场直到救援到场，并向急救人员说明情况"],"pitfalls":["好心搬动颈椎/脊柱受伤者可能造成瘫痪","不要给伤者喂水喂药"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训：现场评估、呼救与基础救护原则"}]},{"id":"sos-17","title":"第一次学心肺复苏（CPR）与 AED","merged_from":["第一次做心肺复苏培训","第一次学会 AED","第一次真正学习急救"],"tags":["急救","技能"],"cost":{"money":"培训常免费","time":"半天","willpower":"中"},"evidence":"B","body":{"plain":"CPR 与 AED 是救回心脏骤停的唯一有效手段，值得专门去上一次线下课。核心动作是：判断无反应无呼吸 → 呼救取 AED → 胸外按压 30:2。","steps":["判断：拍肩呼喊无反应、无正常呼吸 → 立即呼救并让人取 AED","按压：两乳头连线中点，深度 5–6 厘米，频率 100–120 次/分","AED 到手就开机，按语音提示贴片、放电，不要碰触患者","持续到患者恢复或急救人员接手"],"pitfalls":["不敢按、按得太浅是最常见问题，宁可用力","AED 有语音提示，非专业人员也能用"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"中国红十字会总会：救护员培训与心肺复苏、AED 课程"}]},{"id":"sos-18","title":"第一次处理割伤、烫伤、扭伤、鼻出血","merged_from":["第一次处理割伤","第一次处理烫伤","第一次处理扭伤","第一次处理鼻出血"],"tags":["急救","家庭"],"cost":{"money":"几十元","time":"10–30 分钟","willpower":"低"},"evidence":"B","body":{"plain":"四件事各有标准动作：割伤按压止血、烫伤冲冷水、扭伤制动冷敷、鼻出血低头捏鼻。别用土办法。","steps":["割伤：清水冲洗 → 干净纱布加压 10 分钟 → 深/脏伤口去医院","烫伤：流动冷水冲 15–20 分钟，别涂牙膏酱油，起大水泡就医","扭伤：停止活动、冷敷、抬高，48 小时内别热敷揉搓","鼻出血：低头前倾、捏鼻翼 10 分钟，别仰头"],"pitfalls":["烫伤涂牙膏、酱油会加重损伤并影响医生判断","鼻出血仰头会让血流入咽喉"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训：创伤止血、烧烫伤与软组织损伤处理原则"}]},{"id":"sos-19","title":"第一次遇到严重过敏与食物中毒","merged_from":["第一次遇到严重过敏","第一次食物中毒","第一次面对突发疾病"],"tags":["急救","健康"],"cost":{"money":"医疗费","time":"数小时","willpower":"高"},"evidence":"B","body":{"plain":"严重过敏（呼吸困难、喉头紧、全身风团）是急症，直接打 120；已知过敏者随身带医生开的急救药。食物中毒先留样、补水、就医。","steps":["过敏：立即脱离过敏原，出现呼吸困难/意识改变立刻打 120","有医嘱的肾上腺素笔按说明使用，并告知急救人员","食物中毒：保留可疑食物与呕吐物样本，少量多次补液","多人同时发病要同时报告市场监管部门"],"pitfalls":["不要把严重过敏当普通过敏硬扛","不要自行催吐（误食腐蚀性物质时尤其危险）"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训：急症识别与呼救"},{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"食品安全事故应向市场监管部门报告"}]},{"id":"sos-20","title":"第一次独自处理突发事故、为家人处理紧急情况","merged_from":["第一次在陌生城市遇到紧急情况","第一次独自解决突发事故","第一次为家人处理紧急情况"],"tags":["应急","独立"],"cost":{"money":"视情况","time":"数小时","willpower":"高"},"evidence":"C","body":{"plain":"独自面对突发事故时，用一个固定顺序压住慌乱：先保证人身安全 → 打对电话 → 留证据 → 通知家人。事后把经过写下来。","steps":["确认现场安全，把人撤到安全位置","按事故类型打 120 / 110 / 119，说清地点","拍照、录音、留单据与联系人","给家人发位置与一句话说明，指定一个联系人对外沟通"],"pitfalls":["慌乱时最容易忘了留证据，事后维权很难","别在同一时间做多个决定，按顺序来"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"各类突发事件的主管部门与求助电话（公安、急救、消防、应急管理）"}]},{"id":"sos-21","title":"第一次意识到紧急联系人与「提前知道怎么办」有多重要","merged_from":["第一次知道紧急联系人有多重要","第一次意识到“提前知道怎么办”真的能救命"],"tags":["安全","方法"],"cost":{"money":"0","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"紧急联系人不是填个名字就完事：要写在手机锁屏可见处、告诉家人你的过敏史与常用药，并把关键号码背下来两个。","steps":["在手机锁屏页或医疗急救卡里写明紧急联系人与过敏史","家人之间互相存好常用医院、社区电话、物业电话","把 120/110/119 之外的两个关键号码背下来（如家人、社区医生）","每半年更新一次信息"],"pitfalls":["手机没电或丢失时，纸质卡片反而最可靠","别把紧急联系人只存在聊天记录里"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会倡导的家庭应急准备与急救知识普及"}]}],"additions":[{"title":"第一次给家人建一份「应急信息卡」","why":"过敏史、常用药、主治医生、保险单号，出事时能救命"},{"title":"第一次准备家庭应急包","why":"水、手电、口哨、常用药、证件复印件，地震火灾都用得上"},{"title":"第一次在手机上开启地震预警","why":"多数国产手机系统已内置，几十秒预警足够躲到桌下"}],"_file":"18-安全与紧急情况篇.json"}],"stats":{"entries":46,"sections":2,"sources":53}};
const S = DATA.sections;
const state = {q:'', grades:new Set(), secs:new Set()};

function budget(c){
  if(!c) return '';
  const parts=[];
  if(c.money) parts.push('钱 '+c.money);
  if(c.time) parts.push('时间 '+c.time);
  if(c.willpower) parts.push('毅力 '+c.willpower);
  return parts.join(' · ');
}
function text(e){
  return [e.title,(e.body&&e.body.plain)||'',(e.body&&e.body.steps||[]).join(' '),(e.body&&e.body.pitfalls||[]).join(' '),(e.sources||[]).map(s=>s.name+' '+s.note).join(' '),(e.tags||[]).join(' ')].join(' ').toLowerCase();
}
function hl(s,q){
  if(!q) return esc(s);
  const i=s.toLowerCase().indexOf(q);
  if(i<0) return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const q=state.q.trim().toLowerCase();
  const list=document.getElementById('list');
  let html='', shown=0;
  for(const sec of S){
    if(state.secs.size && !state.secs.has(sec.section)) continue;
    const items=sec.entries.filter(e=>(!state.grades.size||state.grades.has(e.evidence)) && (!q||text(e).includes(q)));
    if(!items.length) continue;
    shown+=items.length;
    html+='<section><h2>'+esc(sec.emoji+' '+sec.section)+'</h2><p class="sechint">'+items.length+' 条 · 原大纲 '+sec.source_count+' 条合并而来</p>';
    for(const e of items){
      html+='<article id="'+e.id+'"><h3><a href="#'+e.id+'">'+hl(e.title,q)+'</a></h3>';
      html+='<div class="meta"><span class="tag grade">证据 '+esc(e.evidence)+'</span>'+(budget(e.cost)?'<span class="tag">'+esc(budget(e.cost))+'</span>':'')+(e.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
      html+='<p class="plain">'+hl(e.body.plain,q)+'</p>';
      html+='<details><summary>怎么做 / 坑在哪 / 依据</summary><ul>'+(e.body.steps||[]).map(s=>'<li>'+hl(s,q)+'</li>').join('')+'</ul>';
      if((e.body.pitfalls||[]).length) html+='<ul class="pit">'+e.body.pitfalls.map(s=>'<li>坑：'+hl(s,q)+'</li>').join('')+'</ul>';
      html+='<div class="src">依据：'+(e.sources||[]).map(s=>'<div>· <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>'+(s.note?' —— '+esc(s.note):'')+'</div>').join('')+'</div>';
      html+='</details></article>';
    }
    if(sec.additions&&sec.additions.length){ html+='<div class="addbox"><b>待补条目（我建议新增，尚未写正文）</b><ul>'+sec.additions.map(a=>'<li>'+esc(a.title)+' —— '+esc(a.why)+'</li>').join('')+'</ul></div>'; }
    html+='</section>';
  }
  list.innerHTML = html || '<p class="empty">没有匹配的条目，换个关键词试试。</p>';
  document.getElementById('stats').innerHTML='<span><b>'+shown+'</b> 条正在显示</span><span>全站 <b>'+DATA.stats.entries+'</b> 条</span><span><b>'+DATA.stats.sections+'</b> 篇</span><span><b>'+DATA.stats.sources+'</b> 条出处链接</span>';
}

function chips(){
  const g=document.getElementById('gradechips');
  ['A','B','C'].forEach(k=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent='证据 '+k; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ state.grades.has(k)?state.grades.delete(k):state.grades.add(k); b.setAttribute('aria-pressed',state.grades.has(k)); render(); };
    g.appendChild(b);
  });
  const s=document.getElementById('secchips');
  S.forEach(sec=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=sec.section; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ state.secs.has(sec.section)?state.secs.delete(sec.section):state.secs.add(sec.section); b.setAttribute('aria-pressed',state.secs.has(sec.section)); render(); };
    s.appendChild(b);
  });
}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value; render();});
