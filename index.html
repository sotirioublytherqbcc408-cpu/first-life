、心跳快的就停下。"],"pitfalls":["喝别人递来的、离开过视线的酒，是很多意外发生的起点。","把喝醉当成社交能力，第二天丢东西、丢钱、丢人的例子最多。"]},"sources":[{"name":"娱乐场所管理条例（中国政府网）","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_6297.htm","note":"规定歌舞娱乐场所不得接纳未成年人，营业时间、治安与消防要求。 已用 curl 抓取本页并核对到关键词：「未成年人」、「歌舞」。"},{"name":"中华人民共和国未成年人保护法（12309中国检察网）","url":"https://www.12309.gov.cn/12309/flfg/1979629425639190529.html","note":"规定父母或其他监护人的监护职责，以及学校、社会对未成年人的保护义务。 已用 curl 抓取本页并核对到关键词：「监护人」、「监护职责」。"}]},{"id":"fun-07","title":"第一次去 KTV、第一次去夜店","merged_from":["第一次去 KTV","第一次去夜店"],"tags":["娱乐","夜生活"],"cost":{"money":"人均几十到几百元","time":"3–5 小时","willpower":"中"},"evidence":"A","body":{"plain":"KTV 和夜店都属于娱乐场所，进门有安检、有年龄限制，也有明确的营业时间规定。","steps":["订包厢前问清最低消费、时长和是否含酒水，避免结账时超出预算。","点歌用手机扫码或包厢内的点歌屏，不会用直接叫服务员。","去夜店尽量结伴、说好集合点和回家方式，手机保持有电。","随身包不要放在视线外，贵重物品不要带太多。"],"pitfalls":["结账时才发现有最低消费和开瓶费。","和不熟的人拼场喝到断片，是最危险的场景。"]},"sources":[{"name":"娱乐场所管理条例（中国政府网）","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_6297.htm","note":"规定歌舞娱乐场所不得接纳未成年人，营业时间、治安与消防要求。 已用 curl 抓取本页并核对到关键词：「未成年人」、「歌舞」。"},{"name":"中华人民共和国未成年人保护法（12309中国检察网）","url":"https://www.12309.gov.cn/12309/flfg/1979629425639190529.html","note":"规定父母或其他监护人的监护职责，以及学校、社会对未成年人的保护义务。 已用 curl 抓取本页并核对到关键词：「监护人」、「监护职责」。"}]},{"id":"fun-08","title":"第一次参加演唱会、第一次参加音乐节、第一次参加大型活动","merged_from":["第一次参加演唱会","第一次参加音乐节","第一次参加大型活动"],"tags":["娱乐","演出","大型活动"],"cost":{"money":"门票几百到上千元","time":"半天到一天","willpower":"中"},"evidence":"A","body":{"plain":"现在的大型演出普遍实名购票、实名入场，票、证、人要对上，转票和退票都比以前麻烦。","steps":["买票只走官方票务渠道，购票时用本人身份证，入场带好身份证原件。","按票面时间提前到场，安检要过包，带不进去的东西（自拍杆、瓶装水、专业相机）提前放酒店。","进场先看安全出口的位置，记住自己和朋友看台的编号。","散场别急着挤，等人流过去再走，约好走散后的集合点。"],"pitfalls":["从黄牛手里买转让票，实名信息对不上，进不了场。","全程举着手机录像，既看不清也挡后面的人。"]},"sources":[{"name":"文旅部公安部进一步加强大型营业性演出活动规范管理（司法部智慧普法平台）","url":"http://legalinfo.moj.gov.cn/zhfxfzzx/fzzxyw/202309/t20230914_486225.html","note":"2023年两部门通知：大型演出实行实名购票、实名入场，面向公众销售门票比例不低于85%。 已用 curl 抓取本页并核对到关键词：「实名」、「85」。"},{"name":"大型群众性活动安全管理条例（国务院令第505号，中国政府网）","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_6196.htm","note":"规定大型活动应由公安机关实施安全许可，参加者应遵守现场安全管理规定。 已用 curl 抓取本页并核对到关键词：「公安机关」、「安全许可」。"}]},{"id":"fun-09","title":"第一次去电影院、第一次看 IMAX","merged_from":["第一次去电影院","第一次看 IMAX"],"tags":["娱乐","电影"],"cost":{"money":"30–150 元","time":"2–3 小时","willpower":"低"},"evidence":"B","body":{"plain":"电影票现在大多支持退改签，但规则由影院和票务平台定，买票时看清再付款。","steps":["在官方票务平台或影院小程序买票，付款前留意退改签说明，部分场次支持开场前改签。","选座中间偏后（比如第 6–9 排中间）视线最好，看 IMAX 更要往后坐，太靠前脖子受不了。","取票用取票码或身份证，提前 15 分钟进场，避免错过开场。","遇到放映故障、声音异常，立即找工作人员，一般可以补场或退票。"],"pitfalls":["在非官方渠道买低价票，影厅核销不了。","买了不支持退改的场次又临时有事，只能作废。"]},"sources":[{"name":"电影票全面支持「退改签」，APP付款前需弹出退改签协议（文汇报）","url":"https://www.whb.cn/zhuzhan/yingshi/20180918/213480.html","note":"报道中国电影发行放映协会2018年发布的电影票退改签规定；协会官网只有JS页面，curl 取不到原文，故本条降为权威媒体报道（B级）。 已用 curl 抓取本页并核对到关键词：「退改签」、「电影票」。"},{"name":"市场监督管理投诉举报处理暂行办法（市场监管总局令第20号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2020/content_5483878.htm","note":"规定通过12315平台等渠道投诉的受理条件、处理时限与程序。 已用 curl 抓取本页并核对到关键词：「投诉」、「受理」。"}]},{"id":"fun-10","title":"第一次去博物馆、第一次去美术馆、第一次看展览","merged_from":["第一次去博物馆","第一次去美术馆","第一次看展览"],"tags":["娱乐","文化","展览"],"cost":{"money":"多数免费，特展另计","time":"2–3 小时","willpower":"低"},"evidence":"A","body":{"plain":"博物馆大多免费开放，但基本都要提前预约，热门馆的周末名额经常几天前就满了。","steps":["在博物馆官方公众号或小程序预约，选分时段入场，带好身份证或预约码。","大件行李在存包处寄存，水和食物一般不能带进展厅。","先看导览图，挑两三个重点展厅慢慢看，别想着一次看完。","拍照关闪光灯，很多展品禁止拍照，看到标识就收手机。"],"pitfalls":["不预约直接到门口，遇到限流只能白跑。","在展厅里边走边大声聊天，是最容易被工作人员提醒的行为。"]},"sources":[{"name":"博物馆条例（中国政府网）","url":"https://www.gov.cn/zhengce/content/2015-03/02/content_9508.htm","note":"规定博物馆应当向公众开放，并逐步实行免费开放、公告开放时间。 已用 curl 抓取本页并核对到关键词：「免费开放」、「开放时间」。"}]},{"id":"fun-11","title":"第一次去游乐园、第一次坐过山车","merged_from":["第一次去游乐园","第一次坐过山车"],"tags":["娱乐","游乐园","安全"],"cost":{"money":"门票几百元","time":"一天","willpower":"中"},"evidence":"A","body":{"plain":"大型游乐设施属于特种设备，必须检验合格才能运营，坐之前先看清楚身高体重的限制和警示。","steps":["进园先拿地图或打开官方 App，查清各项目的排队时间和身高要求。","坐过山车前把眼镜、手机、帽子交给同行的人或放进储物柜，口袋清空。","系好安全带后自己要再拉一下确认，工作人员检查时不要抢着按。","心脏、颈椎、腰椎有问题或者刚吃完饭、喝了酒的，直接跳过刺激项目。"],"pitfalls":["为了赶项目一路小跑，中暑和低血糖比排队更常见。","在设施运行中站起来或举起双手超过安全杆，后果非常严重。"]},"sources":[{"name":"中华人民共和国特种设备安全法（国家市场监督管理总局）","url":"https://www.samr.gov.cn/tzsbj/zcfg/flfg/art/2019/art_39715c5a62f64e32aa522fcc2afd6298.html","note":"大型游乐设施属于特种设备，须经检验合格并在显著位置公示安全注意事项后方可运营。 已用 curl 抓取本页并核对到关键词：「大型游乐设施」、「检验」。"},{"name":"市场监督管理投诉举报处理暂行办法（市场监管总局令第20号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2020/content_5483878.htm","note":"规定通过12315平台等渠道投诉的受理条件、处理时限与程序。 已用 curl 抓取本页并核对到关键词：「投诉」、「受理」。"}]},{"id":"fun-12","title":"第一次参加体育比赛（观赛）、第一次去体育场","merged_from":["第一次参加体育比赛","第一次去体育场"],"tags":["娱乐","体育","大型活动"],"cost":{"money":"门票几十到上千元","time":"2–4 小时","willpower":"低"},"evidence":"A","body":{"plain":"体育场里的比赛属于大型群众性活动，举办方要经过公安机关的安全许可，观众要遵守现场安全管理规定。","steps":["实名购票的按票面信息带身份证入场，安检后按看台和排号找座位。","进场先确认最近的出口和疏散通道，散场时跟着人流走。","不要带违禁物品（激光笔、瓶装液体、烟花爆竹），带不进去只能丢在门口。","比赛中不要向场内投掷物品，也不要翻越护栏。"],"pitfalls":["散场时逆着人流走，是最容易被挤倒的时刻。","在客队看台穿主队球衣，容易引发冲突。"]},"sources":[{"name":"大型群众性活动安全管理条例（国务院令第505号，中国政府网）","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_6196.htm","note":"规定大型活动应由公安机关实施安全许可，参加者应遵守现场安全管理规定。 已用 curl 抓取本页并核对到关键词：「公安机关」、「安全许可」。"},{"name":"市场监督管理投诉举报处理暂行办法（市场监管总局令第20号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2020/content_5483878.htm","note":"规定通过12315平台等渠道投诉的受理条件、处理时限与程序。 已用 curl 抓取本页并核对到关键词：「投诉」、「受理」。"}]},{"id":"fun-13","title":"第一次参加朋友聚餐、第一次请客、第一次买单、第一次 AA","merged_from":["第一次参加朋友聚餐","第一次请客吃饭","第一次买单","第一次 AA"],"tags":["餐饮","社交","金钱"],"cost":{"money":"人均几十到几百元","time":"2 小时","willpower":"低"},"evidence":"C","body":{"plain":"买单这件事没有标准答案，但有标准做法：谁发起、谁先说，说清楚就不会尴尬。","steps":["聚餐前说清是 AA 还是有人请客，别等结账时再推让。","AA 用转账或群收款，按人头平摊最简单；有人没喝酒就少算一份酒水钱，大家心里都舒服。","请客的人提前去结账，不要在桌上把账单传来传去。","点菜按人数配：几人点几道，再加一个汤，吃不完打包。"],"pitfalls":["说好 AA 却有人一直往后躲，最后没人愿意再组局。","点菜时谁都不点、最后点一堆没人吃的菜。"]},"sources":[{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"},{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"}]},{"id":"fun-14","title":"第一次预订餐厅、不会点菜、服务员推荐菜与菜品踩雷投诉","merged_from":["第一次预订餐厅","第一次遇到不会点菜的情况","第一次遇到服务员推荐菜","第一次发现菜品踩雷","第一次投诉餐厅"],"tags":["餐饮","消费维权"],"cost":{"money":"人均几十到几百元","time":"1–2 小时","willpower":"中"},"evidence":"A","body":{"plain":"餐厅里能拿回钱的两件事只有两件：菜有问题（异物、变质、没熟），和商家没按约定提供服务。口味不合不算。","steps":["预订时问清是否留位、留多久、低消和是否收服务费；需要交定金的，弄清定金和订金的区别。","不会点菜就按人数配：人数加一或减一，荤素各半，先点这些，不够再加。","服务员推荐的招牌菜可以点，但先问价格和分量，海鲜按重量计价的尤其要问清。","菜品有问题当场叫服务员，要求更换或退掉这道菜并保留小票；协商不成拨打 12315 投诉。"],"pitfalls":["把口味不好当成投诉理由，市场监管部门不受理纯口味纠纷。","结账才发现收了茶位费、服务费，其实提前问一句就能避免。"]},"sources":[{"name":"市场监督管理投诉举报处理暂行办法（市场监管总局令第20号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2020/content_5483878.htm","note":"规定通过12315平台等渠道投诉的受理条件、处理时限与程序。 已用 curl 抓取本页并核对到关键词：「投诉」、「受理」。"},{"name":"中华人民共和国食品安全法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296653.html","note":"规定餐饮服务提供者的食品安全责任，以及消费者受到损害时的赔偿与投诉依据。 已用 curl 抓取本页并核对到关键词：「食品安全法」、「餐饮服务」。"}]},{"id":"fun-15","title":"第一次参加正式宴会、第一次商务宴请","merged_from":["第一次参加正式宴会","第一次商务宴请"],"tags":["餐饮","社交","职场"],"cost":{"money":"因人而异","time":"2–3 小时","willpower":"中"},"evidence":"B","body":{"plain":"正式场合的规矩可以概括成一句：跟着主人和主宾的节奏走，别抢在前面。","steps":["入座前先看座位牌或等主人安排，主宾位一般面向门口。","等主人或主宾动筷再动筷，转盘顺时针转、转到自己面前再夹菜。","敬酒从主宾开始，双手端杯、杯口略低；不喝酒就用茶或饮料代替，说明原因即可。","商务宴请提前确认谁买单，谈事的话把重要内容留到饭后单独交流。"],"pitfalls":["领导还没坐下自己先坐主位，第一印象就没了。","在饭桌上把合同和价格谈死，气氛尴尬且容易谈崩。"]},"sources":[{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"},{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"}]},{"id":"fun-a1","title":"第一次看懂餐厅的附加费：茶位费、服务费、开瓶费","merged_from":[],"tags":["餐饮","消费"],"cost":{"money":"人均十几到几十元","time":"5 分钟","willpower":"低"},"evidence":"A","body":{"plain":"结账时才发现被加收费用，是餐饮消费最常见的纠纷。关键是：收费项目必须事先明示，没提前告知的可以拒付。","steps":["入座先看菜单、桌牌、点餐小程序上的收费说明","对未提前告知的茶位费、服务费、开瓶费当场提出异议","要求提供消费明细，核对菜品单价与数量","协商不成保留小票与菜单照片，向市场监管部门投诉"],"pitfalls":["只口头问一句「有没有服务费」，结账时才发现另收","拍不到菜单价格证明，事后举证困难"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"消费者有权知悉服务真实情况，经营者应按约定提供服务"},{"name":"国家市场监督管理总局（明码标价与预付式消费监管）","url":"https://www.samr.gov.cn/","note":"经营者应明码标价，不得收取未予标明的费用"}],"addition":true,"why":"结账时才发现被加收费用，是餐饮消费最常见的纠纷"},{"id":"fun-a2","title":"第一次处理演出、赛事的退票与改期","merged_from":[],"tags":["娱乐","维权"],"cost":{"money":"视票面","time":"数天到数周","willpower":"中"},"evidence":"B","body":{"plain":"实名制之下演出票退改规则复杂。遇到延期或取消，主办方通常要提供退票渠道；个人原因退票则看购票时的退改规则。","steps":["购票时截图保存退改规则与实名要求","遇延期/取消，按主办方公告的期限申请退票，保留申请记录","个人原因退票按购票平台规则办理，注意手续费与截止时间","协商不成向文旅部门或 12315 投诉，必要时走小额诉讼"],"pitfalls":["只在大麦/猫眼等平台投诉，不找主办方，处理进度慢","错过退票窗口，票款无法退回"]},"sources":[{"name":"文旅部、公安部关于大型营业性演出活动规范管理的部署","url":"http://legalinfo.moj.gov.cn/zhfxfzzx/fzzxyw/202309/t20230914_486225.html","note":"大型营业性演出活动的规范管理与退票要求"},{"name":"文化和旅游部","url":"https://www.mct.gov.cn/","note":"演出市场经营与消费者权益的行业管理"}],"addition":true,"why":"实名制下演出票退改规则复杂，遇到延期取消时该找谁很多人不清楚"},{"id":"fun-a3","title":"第一次买预付卡（健身卡、洗浴卡）并防跑路","merged_from":[],"tags":["娱乐","消费"],"cost":{"money":"几百到上万元","time":"30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"预付式消费是投诉高发区。办卡前记住三条：看合同、看备案、控制金额与期限，尽量别一次付一年以上。","steps":["先查经营者资质与门店租赁期限，判断能开多久","签书面合同，看清退卡条件、转让规则与违约责任","单用途预付卡有备案与限额要求，问清是否备案","金额分期付，别一次性支付长期费用；保留合同、发票与转账记录"],"pitfalls":["被「最后一天优惠」逼着当场付款","只留一张收据，没有合同，跑路后维权无据"]},"sources":[{"name":"《单用途商业预付卡管理办法（试行）》（商务部令 2012 年第 9 号）","url":"https://www.gov.cn/zhengce/2012-09/21/content_5712346.htm","note":"单用途商业预付卡的备案、限额与退卡要求"},{"name":"《中华人民共和国消费者权益保护法实施条例》","url":"http://sft.gd.gov.cn/sfw/zwgk/zcwj/content/mpost_4398318.html","note":"预付式消费的经营者义务与消费者权利"}],"addition":true,"why":"预付式消费是投诉高发区，办卡前要看合同、看备案、控制金额"}],"additions":[],"cross_ref":[{"title":"第一次预订餐厅","owner":"本篇（06 消费与网购篇同名，建议由餐饮娱乐篇成条）"},{"title":"第一次商务宴请","owner":"本篇（08 求职与工作篇同名，建议由餐饮娱乐篇成条）"}],"_file":"17-餐饮娱乐篇.json","label":"餐饮娱乐篇"},{"section":"18 安全与紧急情况篇","source_count":50,"merged_count":24,"note":"由原大纲 50 条合并。急救类引中国红十字会总会，地震引中国地震局，诈骗举报引 12321/12377；消防与警务条目因官网为脚本渲染无法逐条抓取正文，已按规范降级标注。","entries":[{"id":"sos-01","title":"第一次手机丢失","merged_from":["第一次手机丢失"],"tags":["安全","数码"],"cost":{"money":"0–数千元","time":"1–3 小时","willpower":"中"},"evidence":"C","body":{"plain":"手机丢了，第一件事不是找手机，而是切断它能造成的损失：先挂失 SIM 卡、冻结支付、再远程锁定与抹除。","steps":["借别人的手机打运营商客服挂失 SIM（移动 10086 / 联通 10010 / 电信 10000）","用另一台设备登录云账号，开「查找设备」→ 远程锁定或抹除","打支付宝 95188、微信支付客服冻结账户","报警并留好报案回执，方便后续申诉"],"pitfalls":["先挂 SIM 再谈找回，否则验证码会被用来登录你的账号","别在陌生设备上登录网银"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"运营商与支付机构的挂失、冻结流程以各自官方客服为准"}]},{"id":"sos-02","title":"第一次身份证、银行卡、钱包丢失","merged_from":["第一次身份证丢失","第一次银行卡丢失","第一次钱包丢失"],"tags":["安全","证件"],"cost":{"money":"补办费几十元","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"证件和卡分开处理：银行卡先电话挂失（防资金损失），身份证去派出所或政务大厅挂失补办，钱包丢了要报警留记录。","steps":["银行卡：打银行客服口头挂失，再去网点补卡","身份证：就近派出所或政务服务中心挂失、补办，可先办临时身份证应急","钱包：报警备案，留回执（涉及后续纠纷时是证据）","把证件照、卡号提前存在加密相册里"],"pitfalls":["身份证被冒用办卡的风险主要靠「挂失记录」来举证，一定要留","补办期间出行用临时身份证或电子证照"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"居民身份证挂失申报与补办由公安机关办理"}]},{"id":"sos-03","title":"第一次护照在境外丢失","merged_from":["第一次护照丢失"],"tags":["安全","证件","出国"],"cost":{"money":"补办费","time":"1–数天","willpower":"高"},"evidence":"C","body":{"plain":"在境外丢护照，顺序是：报警拿证明 → 联系中国使领馆补办旅行证 → 再改签行程。别抱侥幸直接去机场。","steps":["到当地警察局报案，索取报警证明（多数国家补证必需）","联系中国驻当地使领馆，申请补发护照或旅行证","复印/拍照留存原护照与签证页，必要时联系移民局补入境记录"],"pitfalls":["没有报警证明，很多使领馆不受理补证","先确认签证是否需要重新办理再订机票"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"中国公民在境外证件遗失，由中国驻外使领馆受理补发"}]},{"id":"sos-04","title":"第一次被诈骗：电话、短信与转账之后怎么办","merged_from":["第一次被诈骗","第一次收到诈骗电话","第一次收到钓鱼短信","第一次被骗转账","第一次联系银行止付"],"tags":["安全","诈骗","应急"],"cost":{"money":"可能损失全部余额","time":"越快越好","willpower":"高"},"evidence":"B","body":{"plain":"被骗转账后的黄金时间是前几十分钟：先打银行客服要求止付/冻结，再打 110 报警，同时把诈骗短信、号码举报到 12321。","steps":["立刻打银行客服（卡背面号码）要求止付、冻结账户、查询资金去向","打 110 报警，带上转账记录、对方账号、聊天截图","把诈骗短信/骚扰电话举报到 12321，网络诈骗信息举报到 12377","把对方账号提交给银行与警方，越早越可能拦截"],"pitfalls":["不要相信「网上追款」「黑客帮你要回钱」，那是二次诈骗","不要因为羞愧而拖延，止付窗口很短"]},"sources":[{"name":"12321 网络不良与垃圾信息举报受理中心","url":"https://www.12321.cn","note":"受理垃圾短信、诈骗电话与不良信息的举报"},{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"转账被骗后应第一时间联系银行止付并向公安机关报案"}]},{"id":"sos-05","title":"第一次报警与去派出所","merged_from":["第一次报警","第一次去派出所"],"tags":["安全","法律"],"cost":{"money":"0","time":"1–3 小时","willpower":"中"},"evidence":"C","body":{"plain":"报警说清三件事：在哪、发生了什么、有没有人受伤。到派出所做笔录前，先把时间线和证据在手机备忘里列好。","steps":["拨 110，说清地点、事由、人数与伤情","保存现场照片、聊天记录、转账凭证","到派出所如实陈述，笔录可以要求核对后签字","索取报案回执或受案登记表，后续要用"],"pitfalls":["报案不等于立案，拿回执才能证明你报过案","别自行删改聊天记录，证据链会断"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"公安机关受案、立案与报案回执相关规定"}]},{"id":"sos-06","title":"第一次遇到交通事故（自己或别人）","merged_from":["第一次遇到交通事故","第一次看到别人发生事故"],"tags":["安全","交通","应急"],"cost":{"money":"视责任","time":"1–数小时","willpower":"中"},"evidence":"B","body":{"plain":"先保人再保车：有人受伤先打 120，再打 122/110 报警，最后才谈保险。别私了到连证据都没留。","steps":["开双闪、摆三角牌，人员撤到护栏外","有人受伤打 120，同时打 122 报警","拍照取证：全景、接触点、刹车痕、车牌、路况","联系保险公司报案，留好事故认定书"],"pitfalls":["高速上不要在车道内理论，二次事故更致命","伤者不要随意搬动（除非有起火等危险）"]},"sources":[{"name":"交通运输部（道路运输与交通事故处理规定）","url":"https://www.mot.gov.cn","note":"道路交通事故处理程序与道路运输安全规定"}]},{"id":"sos-07","title":"第一次拨打 120 / 110 / 119","merged_from":["第一次叫救护车","第一次拨打 120","第一次拨打 110","第一次拨打 119"],"tags":["安全","应急"],"cost":{"money":"0","time":"几分钟","willpower":"低"},"evidence":"C","body":{"plain":"三个号码分工不同：120 医疗急救、110 治安与刑事、119 火灾与救援（现在也承担综合救援）。拨打时说清地址、人数、伤情，并保持电话畅通。","steps":["确认地址：小区名 + 楼栋 + 单元 + 门牌，或最近的路口/店铺名","说清人数、伤情/火情、是否需要破拆救援","派人到路口接应，保持电话不占线","按接线员指示做，不要先挂电话"],"pitfalls":["地址说不清是延误救援的最大原因","不要为了「快点来」夸大伤情，会占用资源"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"120/110/119 职责分工与报警要求，以各地主管部门公告为准"},{"name":"《中华人民共和国消防法》（2021 修正全文，北京市人民政府门户网站转载）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202307/t20230726_3207767.html","note":"各单位与个人有维护消防安全、保护消防设施、报告火警的义务；任何人发现火灾都应当立即报警（已 curl 核验页面含「消防法」「火灾」65 处、「灭火」15 处、「疏散」12 处）（原 119.gov.cn 对脚本请求返回 412，改用可核验的法律全文）"}]},{"id":"sos-08","title":"第一次遇到火灾：初期处置、用灭火器、逃生","merged_from":["第一次遇到火灾","第一次使用灭火器","第一次火灾逃生"],"tags":["安全","应急"],"cost":{"money":"0","time":"几分钟","willpower":"中"},"evidence":"A","body":{"plain":"记住顺序：先报警（119）、再决定灭还是跑。能灭就用灭火器对准火焰根部；灭不了立刻关门撤离，不要乘电梯、不要回房间拿东西。","steps":["喊人 + 打 119，说明楼层与起火物","灭火器：拔销、握管、压把，站在上风方向对准火焰根部左右扫射","逃生：低姿、湿毛巾捂口鼻、摸门把手（烫就不要开）、走安全通道","到安全地点后清点人数，告诉消防员是否还有人被困"],"pitfalls":["楼道烟火比火本身更致命，别冲进浓烟","高层不要跳楼，退到有窗房间封门缝等待救援"]},"sources":[{"name":"《中华人民共和国消防法》（2021 修正全文，北京市人民政府门户网站转载）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202307/t20230726_3207767.html","note":"各单位与个人有维护消防安全、保护消防设施、报告火警的义务；任何人发现火灾都应当立即报警（已 curl 核验页面含「消防法」「火灾」65 处、「灭火」15 处、「疏散」12 处）"},{"name":"中国红十字会总会（救护培训与火场自救互救）","url":"https://www.redcross.org.cn","note":"救护培训课程含火灾现场的自救互救内容"}]},{"id":"sos-09","title":"第一次被困电梯","merged_from":["第一次被困电梯"],"tags":["安全","应急"],"cost":{"money":"0","time":"10–60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"电梯不是密闭铁盒，有通风，别扒门、别爬顶。按警铃或用手机打 96333（多数城市电梯应急电话）等救援。","steps":["按轿厢内警铃/对讲，说明楼栋与人数","打电梯维保电话或 96333，也可打 119","保持体力，不要强行扒门或爬出轿厢","救援到位后听从指挥再出轿厢"],"pitfalls":["强行扒门是伤亡主因","如果电梯下坠，背靠轿厢、屈膝缓冲"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"电梯困人救援由维保单位与消防救援承担，各地设有 96333 应急专线"}]},{"id":"sos-10","title":"第一次停电、停水","merged_from":["第一次停电","第一次停水"],"tags":["独立生活","应急"],"cost":{"money":"0","time":"数小时","willpower":"低"},"evidence":"C","body":{"plain":"停电先看是不是只有自家跳闸（看电闸、问邻居），整栋都停就等物业/供电公司。停水时先储一桶水，停水可能伴随水质变化。","steps":["检查自家空气开关，跳闸就复位","打 95598（供电）或物业确认是否区域停电","储水、关热水器电源，冰箱尽量少开门","恢复供电后先检查电器是否正常"],"pitfalls":["停电时点蜡烛容易引发火灾，用充电灯","恢复供水初期水可能发黄，放一会儿再用"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"供电服务热线 95598，供水与物业由当地主管部门与物业公司负责"}]},{"id":"sos-11","title":"第一次遇到暴雨、台风、洪水","merged_from":["第一次遭遇极端天气","第一次遇到暴雨","第一次遇到台风","第一次遇到洪水"],"tags":["安全","应急"],"cost":{"money":"0","time":"数小时到数天","willpower":"中"},"evidence":"B","body":{"plain":"极端天气的原则是「不外出、不涉水、不停地下空间」。暴雨时地铁站、地下车库、下穿隧道是最危险的地方。","steps":["关注气象台预警等级，红色预警就取消一切出行","暴雨：不进地下空间、不涉水过路（15 厘米急流就能冲倒人）","台风：收阳台物品、关窗、远离广告牌与大树","洪水：往高处转移，不要为了财物返回"],"pitfalls":["车在积水中熄火不要二次点火，弃车求生","不要在桥下、涵洞躲雨"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"气象灾害预警与应急响应，以中央气象台与当地应急部门发布为准"}]},{"id":"sos-12","title":"第一次遇到地震","merged_from":["第一次遇到地震"],"tags":["安全","应急"],"cost":{"money":"0","time":"数十秒","willpower":"中"},"evidence":"B","body":{"plain":"地震来了先躲后撤：室内「伏地、遮挡、手抓牢」，躲桌子下护住头颈；震动停止后再走楼梯撤离，不要跳楼、不要坐电梯。","steps":["震动时：伏地 → 躲到坚固桌下或内墙墙角 → 护住头颈","远离窗户、吊灯、高柜","震动停止后走安全通道下楼，到空旷地","准备应急包：水、手电、口哨、常用药、证件复印件"],"pitfalls":["地震时不要跑向阳台或电梯","户外远离建筑外墙、电线杆与广告牌"]},"sources":[{"name":"中国地震局","url":"https://www.cea.gov.cn","note":"中国地震局：地震避险与应急准备科普"}]},{"id":"sos-13","title":"第一次迷路、在陌生地方找不到人","merged_from":["第一次在陌生地方找不到人"],"tags":["安全","出行"],"cost":{"money":"0–几十元","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"迷路时先停下来定位，而不是继续乱走：打开地图看路名/地标，或找店铺、保安、地铁站问路。约好走散后的固定集合点最省事。","steps":["打开地图定位，或用商店门牌、路口标识确认位置","向店员、保安、交警问路（别跟陌生人走）","手机没电就借店铺充电或打给同行人","走散前先约定集合点与「找不到就回原地」规则"],"pitfalls":["别为了抄近路走小巷或工地","不要上陌生人的车「顺路带你」"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"城市公共服务与求助渠道（公安、城管、地铁站务）"}],"note":"「第一次迷路」归 15 旅行与出国篇成条，此处只保留陌生环境中迷路/找不到人时的应急处理"},{"id":"sos-14","title":"第一次夜间独自回家、发现有人跟踪","merged_from":["第一次夜间独自回家","第一次发现有人跟踪"],"tags":["安全","应急"],"cost":{"money":"打车费","time":"20–60 分钟","willpower":"中"},"evidence":"C","body":{"plain":"夜间安全的核心是「不暴露路线、不落单、不硬刚」。怀疑被跟踪就去人多明亮处、进店、报警，不要直接回家。","steps":["走主路、有人流、有监控的路线，耳机只戴一只","怀疑被跟踪：改变节奏试探，确认后进便利店/商场或上公交","打电话给家人朋友并共享位置，必要时拨 110","不要直接回住处；确需回家就先在楼下等人接"],"pitfalls":["不要为了甩人钻进小巷或无人楼道","不要与对方正面冲突"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"遇到跟踪、骚扰可随时拨打 110，公安机关受理报案"}]},{"id":"sos-15","title":"第一次遇到陌生人纠缠","merged_from":["第一次遇到陌生人纠缠"],"tags":["安全","社交"],"cost":{"money":"0","time":"几分钟","willpower":"中"},"evidence":"C","body":{"plain":"应对纠缠的通用做法：不对视纠缠、不解释、不跟着走，直接走向人多处并大声求助，让第三人介入。","steps":["简短拒绝后就离开，不做过多解释","走向店员、保安、路人，明确说「我不认识他，请帮我」","情况升级立刻报警并录像取证","记下对方特征、车牌、时间地点"],"pitfalls":["「给个面子」「帮个小忙」是常见搭讪话术，别接","不要为对方带路或上对方车辆"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"骚扰、纠缠可报警处理，公共场所可向安保人员求助"}]},{"id":"sos-16","title":"第一次帮助受伤的人：该不该停","merged_from":["第一次帮助受伤的人"],"tags":["安全","急救","社会"],"cost":{"money":"0","time":"10–30 分钟","willpower":"中"},"evidence":"C","body":{"plain":"该停，但要按顺序做：先确保自己安全（车流、火源、电），再打 120/110，然后在不造成二次伤害的前提下帮忙。","steps":["判断现场是否安全，先保护自己（开双闪、站到护栏外）","打 120 说清地点与伤情，按接线员指导操作","不要随意搬动伤者；出血就加压止血","留在现场直到救援到场，并向急救人员说明情况"],"pitfalls":["好心搬动颈椎/脊柱受伤者可能造成瘫痪","不要给伤者喂水喂药"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训：现场评估、呼救与基础救护原则"}]},{"id":"sos-17","title":"第一次学心肺复苏（CPR）与 AED","merged_from":["第一次做心肺复苏培训","第一次学会 AED","第一次真正学习急救"],"tags":["急救","技能"],"cost":{"money":"培训常免费","time":"半天","willpower":"中"},"evidence":"B","body":{"plain":"CPR 与 AED 是救回心脏骤停的唯一有效手段，值得专门去上一次线下课。核心动作是：判断无反应无呼吸 → 呼救取 AED → 胸外按压 30:2。","steps":["判断：拍肩呼喊无反应、无正常呼吸 → 立即呼救并让人取 AED","按压：两乳头连线中点，深度 5–6 厘米，频率 100–120 次/分","AED 到手就开机，按语音提示贴片、放电，不要碰触患者","持续到患者恢复或急救人员接手"],"pitfalls":["不敢按、按得太浅是最常见问题，宁可用力","AED 有语音提示，非专业人员也能用"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"中国红十字会总会：救护员培训与心肺复苏、AED 课程"}]},{"id":"sos-18","title":"第一次处理割伤、烫伤、扭伤、鼻出血","merged_from":["第一次处理割伤","第一次处理烫伤","第一次处理扭伤","第一次处理鼻出血"],"tags":["急救","家庭"],"cost":{"money":"几十元","time":"10–30 分钟","willpower":"低"},"evidence":"B","body":{"plain":"四件事各有标准动作：割伤按压止血、烫伤冲冷水、扭伤制动冷敷、鼻出血低头捏鼻。别用土办法。","steps":["割伤：清水冲洗 → 干净纱布加压 10 分钟 → 深/脏伤口去医院","烫伤：流动冷水冲 15–20 分钟，别涂牙膏酱油，起大水泡就医","扭伤：停止活动、冷敷、抬高，48 小时内别热敷揉搓","鼻出血：低头前倾、捏鼻翼 10 分钟，别仰头"],"pitfalls":["烫伤涂牙膏、酱油会加重损伤并影响医生判断","鼻出血仰头会让血流入咽喉"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训：创伤止血、烧烫伤与软组织损伤处理原则"}]},{"id":"sos-19","title":"第一次遇到严重过敏与食物中毒","merged_from":["第一次遇到严重过敏","第一次食物中毒","第一次面对突发疾病"],"tags":["急救","健康"],"cost":{"money":"医疗费","time":"数小时","willpower":"高"},"evidence":"B","body":{"plain":"严重过敏（呼吸困难、喉头紧、全身风团）是急症，直接打 120；已知过敏者随身带医生开的急救药。食物中毒先留样、补水、就医。","steps":["过敏：立即脱离过敏原，出现呼吸困难/意识改变立刻打 120","有医嘱的肾上腺素笔按说明使用，并告知急救人员","食物中毒：保留可疑食物与呕吐物样本，少量多次补液","多人同时发病要同时报告市场监管部门"],"pitfalls":["不要把严重过敏当普通过敏硬扛","不要自行催吐（误食腐蚀性物质时尤其危险）"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会救护培训：急症识别与呼救"},{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"食品安全事故应向市场监管部门报告"}]},{"id":"sos-20","title":"第一次独自处理突发事故、为家人处理紧急情况","merged_from":["第一次在陌生城市遇到紧急情况","第一次独自解决突发事故","第一次为家人处理紧急情况"],"tags":["应急","独立"],"cost":{"money":"视情况","time":"数小时","willpower":"高"},"evidence":"C","body":{"plain":"独自面对突发事故时，用一个固定顺序压住慌乱：先保证人身安全 → 打对电话 → 留证据 → 通知家人。事后把经过写下来。","steps":["确认现场安全，把人撤到安全位置","按事故类型打 120 / 110 / 119，说清地点","拍照、录音、留单据与联系人","给家人发位置与一句话说明，指定一个联系人对外沟通"],"pitfalls":["慌乱时最容易忘了留证据，事后维权很难","别在同一时间做多个决定，按顺序来"]},"sources":[{"name":"中国政府网（政策与办事服务入口）","url":"https://www.gov.cn","note":"各类突发事件的主管部门与求助电话（公安、急救、消防、应急管理）"}]},{"id":"sos-21","title":"第一次意识到紧急联系人与「提前知道怎么办」有多重要","merged_from":["第一次知道紧急联系人有多重要","第一次意识到“提前知道怎么办”真的能救命"],"tags":["安全","方法"],"cost":{"money":"0","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"紧急联系人不是填个名字就完事：要写在手机锁屏可见处、告诉家人你的过敏史与常用药，并把关键号码背下来两个。","steps":["在手机锁屏页或医疗急救卡里写明紧急联系人与过敏史","家人之间互相存好常用医院、社区电话、物业电话","把 120/110/119 之外的两个关键号码背下来（如家人、社区医生）","每半年更新一次信息"],"pitfalls":["手机没电或丢失时，纸质卡片反而最可靠","别把紧急联系人只存在聊天记录里"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"红十字会倡导的家庭应急准备与急救知识普及"}]},{"id":"sos-a1","title":"第一次给家人做一张「应急信息卡」","merged_from":[],"tags":["安全","家庭"],"cost":{"money":"0","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"一张卡片写清：过敏史、常用药、主治医院与医生、紧急联系人、保险单号。钱包里放一份，手机锁屏里存一份。","steps":["列出每个家庭成员的过敏史、慢性病、常用药","写上主治医院、科室与医生电话","填两个紧急联系人与保险单号","打印两份：一份放钱包，一份贴冰箱"],"pitfalls":["信息过期比没有更危险，每半年核对一次","不要写身份证号、银行卡号"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"家庭应急准备与急救信息登记"}],"addition":true,"why":"出事时急救人员最需要这些信息，而家人往往说不清"},{"id":"sos-a2","title":"第一次准备家庭应急包","merged_from":[],"tags":["安全","家庭"],"cost":{"money":"200–500 元","time":"半天","willpower":"中"},"evidence":"C","body":{"plain":"应急包的目标是：家里断水断电、或需要立刻撤离时，能撑过 72 小时。","steps":["按人头备 3 天饮用水与免煮食物","手电、备用电池、口哨、多功能刀、充电宝","常用药与急救包（纱布、创可贴、碘伏）","证件复印件、少量现金、备用钥匙"],"pitfalls":["要放在拿得到的地方，别塞进储藏室最深处","每半年检查一次有效期与电池"]},"sources":[{"name":"中国红十字会总会（救护培训与急救知识）","url":"https://www.redcross.org.cn","note":"家庭应急物资与救护常识"},{"name":"中国地震局","url":"https://www.cea.gov.cn","note":"地震应急准备建议"}],"addition":true,"why":"水、手电、口哨、常用药、证件复印件，地震火灾都用得上"},{"id":"sos-a3","title":"第一次在手机上开启地震预警","merged_from":[],"tags":["安全","数码"],"cost":{"money":"0","time":"2 分钟","willpower":"低"},"evidence":"B","body":{"plain":"多数国产手机系统内置地震预警（在设置里搜「地震预警」），能提前几秒到几十秒报警，够你躲到桌子下。","steps":["在手机设置里搜索「地震预警」并开启","确认定位与通知权限都打开","把预警音量调到最大，熟悉警报声","提醒家人也各开一遍"],"pitfalls":["关掉通知权限等于没开","预警时间随距离变化，只有几秒也要按伏地、遮挡、抓牢来做"]},"sources":[{"name":"中国地震局","url":"https://www.cea.gov.cn","note":"中国地震局：地震预警与避险科普"}],"addition":true,"why":"手机里就有这个功能，几十秒预警足够躲到桌下"}],"additions":[],"_file":"18-安全与紧急情况篇.json","label":"安全与紧急情况篇"}],"stats":{"entries":438,"sections":18,"sources":744}};
const S = DATA.sections;
const state = {q:'', grades:new Set(), secs:new Set(), effort:new Set(), free:false};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function budget(c){ if(!c) return '';
  const p=[]; if(c.money) p.push('钱 '+c.money); if(c.time) p.push('时间 '+c.time); if(c.willpower) p.push('毅力 '+c.willpower); return p.join(' · ');
}
function text(e){ const b=e.body||{};
  return [e.title,b.plain||'',(b.steps||[]).join(' '),(b.pitfalls||[]).join(' '),(e.sources||[]).map(s=>s.name+' '+s.note).join(' '),(e.tags||[]).join(' ')].join(' ').toLowerCase();
}
function hl(s,q){ if(!q) return esc(s);
  const i=String(s).toLowerCase().indexOf(q); if(i<0) return esc(s);
  return esc(String(s).slice(0,i))+'<mark>'+esc(String(s).slice(i,i+q.length))+'</mark>'+esc(String(s).slice(i+q.length));
}
function isFree(e){const m=((e.cost||{}).money||'').trim();return /^0|^不花|免费|0 ?元/.test(m);}
function effort(e){return ((e.cost||{}).willpower||'').trim();}

function visible(e,q){
  if(state.grades.size && !state.grades.has(e.evidence)) return false;
  if(state.effort.size && !state.effort.has(effort(e))) return false;
  if(state.free && !isFree(e)) return false;
  if(q && !text(e).includes(q)) return false;
  return true;
}

function render(){
  const q=state.q.trim().toLowerCase();
  let html='', shown=0;
  for(const sec of S){
    if(state.secs.size && !state.secs.has(sec.section)) continue;
    const items=sec.entries.filter(e=>visible(e,q));
    if(!items.length) continue;
    shown+=items.length;
    const sid='sec-'+sec.section.slice(0,2);
    html+='<section id="'+sid+'"><h2>'+esc(sec.label||sec.section)+'</h2><p class="sechint">'+items.length+' 条 · 原大纲 '+sec.source_count+' 条合并而来</p>';
    for(const e of items){
      html+='<article id="'+e.id+'"><h3><a href="#'+e.id+'">'+hl(e.title,q)+'</a></h3>';
      html+='<div class="meta"><span class="tag grade">证据 '+esc(e.evidence)+'</span>'
        +(e.addition?'<span class="tag" title="'+esc(e.why||'')+'">增补</span>':'')
        +(budget(e.cost)?'<span class="tag">'+esc(budget(e.cost))+'</span>':'')
        +(e.tags||[]).slice(0,4).map(t=>'<span class="tag tap" data-kw="'+esc(t)+'">'+esc(t)+'</span>').join('')
        +'<button class="chip copyentry" data-id="'+e.id+'">链接</button></div>';
      html+='<p class="plain">'+hl(e.body.plain,q)+'</p>';
      html+='<details><summary>怎么做 / 坑在哪 / 依据</summary><ul>'+(e.body.steps||[]).map(s=>'<li>'+hl(s,q)+'</li>').join('')+'</ul>';
      if((e.body.pitfalls||[]).length) html+='<ul class="pit">'+e.body.pitfalls.map(s=>'<li>坑：'+hl(s,q)+'</li>').join('')+'</ul>';
      html+='<div class="src">依据：'+(e.sources||[]).map(s=>'<div>· <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>'+(s.note?' —— '+esc(s.note):'')+'</div>').join('')+'</div>';
      html+='</details></article>';
    }
    html+='</section>';
  }
  document.getElementById('list').innerHTML = html || '<p class="empty">没有匹配的条目。换个词，或在左侧清空筛选。</p>';
  document.getElementById('stats').innerHTML='<span><b>'+shown+'</b> 条正在显示</span><span>全站 <b>'+DATA.stats.entries+'</b> 条</span><span><b>'+DATA.stats.sections+'</b> 篇</span><span><b>'+DATA.stats.sources+'</b> 条出处链接</span>';
}

function buildSidebar(){
  const ul=document.getElementById('seclist');
  S.forEach(sec=>{
    const sid='sec-'+sec.section.slice(0,2);
    const li=document.createElement('li');
    li.innerHTML='<a href="#'+sid+'" data-sec="'+esc(sec.section)+'"><span>'+esc(sec.label||sec.section)+'</span><span class="n">'+sec.entries.length+'</span></a>';
    ul.appendChild(li);
  });
  const gc=document.getElementById('gradechips');
  ['A','B','C'].forEach(k=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent='证据 '+k; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ state.grades.has(k)?state.grades.delete(k):state.grades.add(k); b.setAttribute('aria-pressed',state.grades.has(k)); render(); };
    gc.appendChild(b);
  });
  const cc=document.getElementById('costchips');
  ['低','中','高'].forEach(k=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent='毅力 '+k; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ state.effort.has(k)?state.effort.delete(k):state.effort.add(k); b.setAttribute('aria-pressed',state.effort.has(k)); render(); };
    cc.appendChild(b);
  });
  const fb=document.createElement('button'); fb.className='chip'; fb.textContent='不花钱'; fb.setAttribute('aria-pressed','false');
  fb.onclick=()=>{ state.free=!state.free; fb.setAttribute('aria-pressed',state.free); render(); };
  cc.appendChild(fb);
  // 热门关键词：按出现次数取前 24 个 tag
  const freq={};
  S.forEach(s=>s.entries.forEach(e=>(e.tags||[]).forEach(t=>{ freq[t]=(freq[t]||0)+1; })));
  const kc=document.getElementById('kwcloud');
  Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,24).forEach(([t,n])=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=t; b.title=n+' 条';
    b.onclick=()=>{ document.getElementById('q').value=t; state.q=t; render(); closeDrawer(); window.scrollTo({top:0}); };
    kc.appendChild(b);
  });
}

/* 抽屉开关（手机） */
const drawer=document.getElementById('drawer'), overlay=document.getElementById('overlay');
function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('show'); }
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('show'); }
document.getElementById('menubtn').onclick=()=>drawer.classList.contains('open')?closeDrawer():openDrawer();
overlay.onclick=closeDrawer;
drawer.addEventListener('click',e=>{ if(e.target.closest('a')) closeDrawer(); });

/* 搜索与清空 */
document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value; render(); });
document.getElementById('clearbtn').onclick=()=>{
  state.q=''; state.grades.clear(); state.secs.clear(); state.effort.clear(); state.free=false;
  document.getElementById('q').value='';
  document.querySelectorAll('.chip[aria-pressed]').forEach(c=>c.setAttribute('aria-pressed','false'));
  render();
};

/* 卡片上的关键词 / 复制链接 */
document.addEventListener('click', async ev=>{
  const t=ev.target;
  if(!t||!t.classList) return;
  if(t.classList.contains('tag')&&t.dataset.kw){
    document.getElementById('q').value=t.dataset.kw; state.q=t.dataset.kw; render(); window.scrollTo({top:0}); return;
  }
  if(t.classList.contains('copyentry')){
    const url=location.href.split('#')[0]+'#'+t.getAttribute('data-id');
    try{ await navigator.clipboard.writeText(url); const o=t.textContent; t.textContent='已复制'; setTimeout(()=>t.textContent=o,1200);}catch(e){}
  }
});

/* 深链：带 #条目id 打开时，渲染完再定位并展开 */
function gotoHash(){
  const id=decodeURIComponent(location.hash.slice(1)); if(!id) return;
  const el=document.getElementById(id); if(!el) return;
  const d=el.querySelector('details'); if(d) d.open=true;
  el.scrollIntoView({block:'start'});
  el.style.transition='background .6s'; el.style.background='var(--accent-soft)';
  setTimeout(()=>{ el.style.background=''; },1600);
}

/* 滚动时高亮左侧当前篇章 */
function spy(){
  const links=[...document.querySelectorAll('#seclist a')];
  const obs=new IntersectionObserver(es=>{
    es.forEach(en=>{ if(!en.isIntersecting) return;
      links.forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+en.target.id));
    });
  },{rootMargin:'-15% 0px -75% 0px'});
  document.querySelectorAll('section[id]').forEach(s=>obs.observe(s));
}

/* 向下滑收起顶栏，向上滑立刻露出：手机上不再一直占着那一行 */
(function(){
  const bar=document.getElementById('topbar');
  let lastY=window.scrollY, ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      const y=window.scrollY, dy=y-lastY;
      if(dy>6 && y>140) bar.classList.add('hidden');
      else if(dy<-6) bar.classList.remove('hidden');
      if(y<40) bar.classList.remove('hidden');
      lastY=y; ticking=false;
    });
  },{passive:true});
})();

document.getElementById('foot').innerHTML='<div><b>关于本站</b><br>把每个人都会遇到、却没人教过的「第一次」整理成可检索的说明书。条目由原始大纲（18 篇 / 1028 条）合并而来，每条保留了溯源；正文尽量引用官方文件，证据分 A/B/C 三级（A 法规与官方文件，B 官方科普或权威媒体，C 经验性、多家一致）。<br>只讲流程与依据，不构成医疗、法律或投资建议，具体以官方最新规定为准。</div><div style="margin-top:.6rem">生成时间 '+DATA.generated+' · 数据内联在本文件，断网、转发都能用。</div>';

buildSidebar(); render(); spy(); gotoHash();
window.addEventListener('hashchange', ()=>{ gotoHash(); });
</script>
