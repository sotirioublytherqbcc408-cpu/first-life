["第一次坐过站","第一次补票"],"tags":["交通","火车","应急"],"cost":{"money":"补票，未主动补票可能加收 50%","time":"数十分钟","willpower":"中"},"evidence":"A","body":{"plain":"坐过站不要自己买反方向票——找列车长开客运记录，由铁路安排最近的车次免费送回。无票或越站乘车要补票；未经同意又不主动补票的，会被补收票款并可能加收已乘区间应补票款的 50%。","steps":["立刻找列车长说明坐过站，索取客运记录","在下一站凭记录安排返回，不要擅自出站","车上主动补票，别等查到再补"],"pitfalls":["「等着被查到再说」会触发加收条款","客运记录是免费返程的凭证，丢了就要重新买票"]},"sources":[{"name":"《铁路旅客运输规程》（交通运输部令 2022 年第 37 号，2023-01-01 施行）","url":"https://www.gov.cn/zhengce/2022-11/17/content_5728978.htm","note":"第二十七条相关：未经同意无票乘车未主动补票的，补收票款并可以加收 50% 已乘区间应补票款"}]},{"id":"trip-08","title":"第一次在车上吃饭、睡觉与充电","merged_from":["第一次在火车上买东西","第一次在火车上吃饭","第一次在火车上睡觉","第一次在火车上充电"],"tags":["交通","火车"],"cost":{"money":"餐饮 15–60 元","time":"全程","willpower":"低"},"evidence":"C","body":{"plain":"高铁有餐车和推车，普速车有盒饭，价格普遍高于地面。充电口位置各车型不同，一般在座位下方或前排座椅背，自己带插线板和充电宝最保险。","steps":["上车先找到充电口，确认是否可用","自带水和耐放的吃的，餐车错峰去","睡觉定闹钟，背包当枕头，贵重物品贴身"],"pitfalls":["车上餐饮贵且选择少","充电口常被占，别指望一定有空位"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"列车服务信息"}]},{"id":"trip-09","title":"第一次在车上找列车员、丢东西","merged_from":["第一次找列车员","第一次火车上丢东西"],"tags":["交通","火车","应急"],"cost":{"money":"0","time":"越快越好","willpower":"中"},"evidence":"B","body":{"plain":"车上丢东西，当场找列车员或列车长是最快的；已经下车就打 12306 客服登记，越早越有可能找回。","steps":["立刻找列车员，说清车厢、座位号、物品特征","下车后打 12306 客服登记失物信息","关注 12306 APP 的失物招领，或联系终到站服务台"],"pitfalls":["记不清座位号会明显降低找回概率","贵重物品别放行李架深处或座位下方"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"客服与失物招领入口"}]},{"id":"trip-10","title":"第一次在火车上和陌生人聊天","merged_from":["第一次火车上认识陌生人"],"tags":["社交","交通"],"cost":{"money":"0","time":"全程","willpower":"低"},"evidence":"C","body":{"plain":"车厢是最容易破冰的公共场景，但边界要自己划：不透露住址和单位、不跟陌生人下车、不替陌生人看行李。","steps":["用中性话题开场，比如「你到哪站」","不聊收入、住址、身份证件信息","感觉不对就戴耳机、看窗外，自然地结束对话"],"pitfalls":["替陌生人看行李有风险，可能牵涉违禁品","别扫来源不明的二维码或加不明群"]},"sources":[{"name":"《铁路旅客运输规程》（交通运输部令 2022 年第 37 号，2023-01-01 施行）","url":"https://www.gov.cn/zhengce/2022-11/17/content_5728978.htm","note":"实名制与禁止、限制携带物品的管理规定背景"}]},{"id":"trip-11","title":"第一次一个人坐火车","merged_from":["第一次一个人坐火车"],"tags":["交通","火车","独立"],"cost":{"money":"票价","time":"半天到一天","willpower":"中"},"evidence":"C","body":{"plain":"一个人坐火车，核心是三件事：时间留够、证件带齐、信息提前存好。全程自己盯检票信息，不依赖别人提醒。","steps":["提前 40 分钟到站，节假日再提前","手机存好车次、座位、出站后路线截图","到站前 30 分钟开始收行李，别等人流散了才动"],"pitfalls":["深夜到站要提前查好接驳，别在站外临时决定","行李不要托付给陌生人看管"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次与车站信息查询"}]},{"id":"trip-12","title":"第一次站内换乘（含只有十几分钟）","merged_from":["第一次站内换乘","第一次只有十几分钟换乘","第一次换乘时找不到路","第一次换乘错方向","第一次换乘没赶上下一趟车","第一次同站换乘"],"tags":["交通","火车","换乘"],"cost":{"money":"0","time":"20–40 分钟","willpower":"中"},"evidence":"B","body":{"plain":"同站换乘不用出站，下车后找「中转换乘」指示，直接回候车层再检票。稳妥的做法是预留 20 分钟以上；只有十几分钟时，走错一次就赶不上。","steps":["下车前问列车员哪节车厢离换乘通道最近","跟着「中转换乘」标识走，不要跟着出站人流","刷证进候车区，直接找下一程检票口"],"pitfalls":["十分钟级别的换乘不要排电梯，走楼梯更快","不同车站换乘通道位置差别很大，别照搬经验"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"中转换乘查询功能"}]},{"id":"trip-13","title":"第一次跨站换乘","merged_from":["第一次跨站换乘","第一次异站换乘"],"tags":["交通","换乘"],"cost":{"money":"市内交通 5–100 元","time":"60–120 分钟","willpower":"中"},"evidence":"B","body":{"plain":"两趟车停在不同车站（比如北京站和北京西站）时，必须出站坐地铁或打车，时间至少留 90 分钟，行李多就更久。","steps":["用地图查两站之间的最短路线与耗时","把两站之间的时间按最坏路况算，预留 ≥90 分钟","到站先出站，再按导航走，别在站内绕"],"pitfalls":["把「北京」当成一个站是新手最常见的错误，买票时务必看清站名","早晚高峰的跨站打车时间会翻倍"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次与车站信息（含同城多站）"}]},{"id":"trip-14","title":"第一次火车转地铁、转公交","merged_from":["第一次转乘地铁","第一次火车转地铁","第一次火车转公交"],"tags":["交通","接驳"],"cost":{"money":"2–10 元","time":"30–60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"大站基本都有地铁接驳，跟着「地铁」指示牌走就行；公交更便宜，但受路况影响大，赶时间不要选。","steps":["出站看地铁标识，直接进站","用地图确认末班车时间","深夜到站直接打车，别赌末班车"],"pitfalls":["多数城市地铁末班在 22:30–23:30，公交更早","跨市的地铁/城际线可能不适用当地交通码"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市客运（地铁、公交）由交通运输主管部门管理，具体以当地运营方公告为准"}]},{"id":"trip-15","title":"第一次火车转飞机、机场转机与国际转机","merged_from":["第一次火车转飞机","第一次机场转机","第一次国际转机"],"tags":["交通","飞机","换乘"],"cost":{"money":"视票价","time":"3 小时以上","willpower":"中"},"evidence":"C","body":{"plain":"火车转飞机必须留足时间，建议 3 小时以上；国际转机还要看是否同一航站楼、要不要过境签、行李是否直挂。","steps":["出发前确认航站楼与值机截止时间","问清行李是否直挂；不直挂要自取再托运","国际转机留 ≥2 小时并确认签证与过境要求"],"pitfalls":["廉航多不联程，行李要自己取再托运","不同航站楼之间的摆渡很耗时"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"民航运输由民航主管部门管理，具体以承运航司与机场公告为准"}]},{"id":"trip-16","title":"第一次中转停留超过一天","merged_from":["第一次中转时间超过一天"],"tags":["交通","换乘","旅行"],"cost":{"money":"住宿 100–400 元","time":"1 天以上","willpower":"中"},"evidence":"C","body":{"plain":"中转停留一天以上，本质是加了一次短途旅行：把大件寄存、订车站周边的酒店、只带随身包轻装出门。","steps":["车站寄存处或自助柜存大件行李","订车站周边或地铁沿线的酒店，方便次日返程","按返程时间倒推设置闹钟，留出安检时间"],"pitfalls":["证件、充电器、常用药不要锁进寄存柜","旺季车站周边酒店会满，提前订"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车站服务与行李寄存信息"}]},{"id":"trip-17","title":"第一次自己规划换乘路线","merged_from":["第一次自己规划换乘路线"],"tags":["交通","换乘","方法"],"cost":{"money":"0","time":"30–60 分钟","willpower":"中"},"evidence":"B","body":{"plain":"排路线的原则只有两条：按最坏情况估时间，并给每一段准备一个备选班次。别用理想时刻表安排自己的一天。","steps":["列出每段交通的实际耗时（含进出站、安检）","每段加 30% 缓冲","查每段的末班时间与备选班次，截图存到手机"],"pitfalls":["换乘时间按「到站时间」算而不是「发车时间」算，容易误判","跨城末班车一旦错过，通常只能过夜"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次、时刻与中转换乘查询"}]},{"id":"trip-18","title":"第一次坐地铁：买票、扫码与刷证","merged_from":["第一次坐地铁","第一次买地铁票","第一次扫码坐地铁","第一次刷身份证坐地铁"],"tags":["交通","地铁"],"cost":{"money":"2–15 元","time":"5 分钟","willpower":"低"},"evidence":"B","body":{"plain":"现在多数城市地铁用手机扫码或交通卡，单程票反而最少用。扫码要「进站刷一次、出站刷一次」，按里程扣费。","steps":["打开本地地铁 APP 或支付宝/微信出行码","进站刷码或刷卡，出站再刷一次","保留行程记录，异常扣费可申诉"],"pitfalls":["漏刷出站会按最远站扣费","各城市交通码不通用，跨市要重新开通"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市轨道交通由交通运输主管部门管理，票务规则以当地运营方公告为准"}]},{"id":"trip-19","title":"第一次地铁坐错方向、坐过站与赶末班车","merged_from":["第一次坐错地铁方向","第一次坐过地铁站","第一次地铁换乘","第一次赶地铁末班车"],"tags":["交通","地铁","应急"],"cost":{"money":"0–20 元","time":"10–30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"坐反方向不用出站，到下一站下车到对面站台坐回去即可；坐过站同理。末班车一定要提前查，错过基本只能打车。","steps":["看站台屏确认列车终点与方向","坐错方向：下一站下车，看清指示换到对面","赶末班：提前 20 分钟进站，别卡点"],"pitfalls":["部分线路末班车只开到中途站","末班车之后换乘通道会关闭，别指望站内换乘"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市轨道交通运营管理相关规定与当地公告"}]},{"id":"trip-20","title":"第一次坐公交与下错站","merged_from":["第一次坐公交","第一次下错公交站"],"tags":["交通","公交"],"cost":{"money":"1–5 元","time":"20–60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"公交要提前按铃或喊站，报站语音有时候不灵；用地图 APP 盯着实时位置最稳。","steps":["上车扫码或刷卡，记好下车站名","地图上看剩余站数，提前一站按铃","下车先看站牌，确认方向再走"],"pitfalls":["部分线路分段计价，上下车都要刷","末班车比地铁早很多"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城市公共汽电车客运管理相关规定"}]},{"id":"trip-21","title":"第一次坐长途大巴与买汽车票","merged_from":["第一次坐长途大巴","第一次买汽车票","第一次一个人坐长途大巴"],"tags":["交通","大巴"],"cost":{"money":"几十到几百元","time":"2–10 小时","willpower":"中"},"evidence":"C","body":{"plain":"长途大巴实行实名购票，在汽车站或官方小程序买票。路上的不确定性比火车大：堵车、中途上下客都会拖时间。","steps":["车站窗口或官方小程序购票，核对发车站","提前 30 分钟到站，行李放行李舱并记住位置","全程系安全带，备好水和晕车药"],"pitfalls":["别坐站外拉客的「黑车」，没有票据也没保险","中途停车时间短，别走远"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"道路客运由交通运输主管部门管理，以当地汽车站与承运企业公告为准"}]},{"id":"trip-22","title":"第一次打出租车与东西落在车上","merged_from":["第一次打出租车","第一次东西落在出租车里"],"tags":["交通","出租车","应急"],"cost":{"money":"起步价起","time":"越快越好","willpower":"低"},"evidence":"B","body":{"plain":"下车要发票（上面有车牌号），这是找回失物最直接的凭据。发现东西落了，打 12328 交通运输服务监督电话或联系出租车公司。","steps":["下车主动要发票，或记下车牌","发现丢失立刻打 12328 / 平台客服，说明时间、路线、车型","能联系到司机就约定送回地点，必要时付车费"],"pitfalls":["不给发票的车不要坐","现金支付难追溯，扫码支付能查到收款方"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"12328 交通运输服务监督电话，巡游出租汽车管理"}]},{"id":"trip-23","title":"第一次打网约车：上车点、拼车、绕路与取消","merged_from":["第一次打网约车","第一次找网约车上车点","第一次拼车","第一次遇到司机绕路","第一次网约车取消订单"],"tags":["交通","网约车"],"cost":{"money":"10–100 元","time":"5–30 分钟","willpower":"低"},"evidence":"B","body":{"plain":"网约车按平台规则运行，关键在于上车前核对车牌与司机信息，行程中把行程分享给家人。绕路、乱收费都在平台内投诉，别私下解决。","steps":["定位到明确的上车点（商场出口、路口），别让司机猜","核对车牌、车型、司机头像再上车","打开行程分享，下车再结束行程","有异议在平台内投诉，保留行程单"],"pitfalls":["车牌与订单不符坚决不上车","拼车会绕路，赶时间别拼","频繁取消会被平台限制或收取费用"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"网络预约出租汽车经营服务管理，由交通运输主管部门监管"}]},{"id":"trip-24","title":"第一次半夜打车与在陌生城市打车","merged_from":["第一次半夜打车","第一次在陌生城市打车"],"tags":["交通","网约车","安全"],"cost":{"money":"几十元","time":"10–30 分钟","willpower":"中"},"evidence":"C","body":{"plain":"半夜或陌生城市优先用平台叫车，因为平台有轨迹、有录音、可追溯。上车前拍车牌发给家人，坐后排，到了再下车。","steps":["在光亮、有人流的地方等车","拍车牌 + 分享行程给家人","坐后排，不透露独自居住等信息"],"pitfalls":["站口拉客的「黑车」不要坐","不要因为便宜就上无牌无证的车"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"出租汽车与网约车的行业监管规定"}]},{"id":"trip-25","title":"第一次独自在陌生城市换乘、走完整套跨城交通","merged_from":["第一次一个人在陌生城市换乘","第一次独自完成一整套跨城交通"],"tags":["交通","独立","换乘"],"cost":{"money":"视行程","time":"半天到一天","willpower":"中"},"evidence":"C","body":{"plain":"把整段行程拆成「到站 → 出站/换乘 → 下一程」三步，每一步提前截图存好，比临场找路省一半时间，也不容易慌。","steps":["出发前把每段的车次、站名、入口截图存到相册","每段留 30% 缓冲，别排满","每到一站先确认下一程的时间与位置","行李尽量精简成一个箱子加一个包"],"pitfalls":["别把所有东西都托运或寄存，证件和充电宝随身","手机电量是这条链路上最关键的资源"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车次、车站与中转换乘查询"}]},{"id":"trip-a1","title":"第一次用电子临时乘车身份证明进站","merged_from":[],"tags":["出行","火车"],"cost":{"money":"0","time":"3 分钟","willpower":"低"},"evidence":"A","body":{"plain":"没带身份证也能坐车：在 12306 APP 里申请「电子临时乘车身份证明」，刷二维码进站，但每月有申请次数限制。","steps":["12306 APP 首页找「临时乘车身份证明」并完成人脸核验","生成二维码，进站和出站都刷这个码","注意有效期与每月次数上限"],"pitfalls":["把它当长期替代品不行，次数用完只能去车站公安制证窗口","出发前先确认身份证在不在包里"]},"sources":[{"name":"河南省政务服务网：没带身份证如何坐高铁","url":"https://m.henan.gov.cn/2025/10-16/3235536.html","note":"临时乘车身份证明的办理方式与使用限制"}],"addition":true,"why":"没带证件是最常见的出行事故，而这件事很少有人知道能在线解决"},{"id":"trip-a2","title":"第一次买计次票、定期票","merged_from":[],"tags":["出行","火车","省钱"],"cost":{"money":"按次数打包，通常更便宜","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"固定两地往返的人可以买计次票或定期票（例如 20 次 / 90 天），通常比单次买便宜，但退改规则更紧、过期作废。","steps":["在 12306 查询你常走的线路是否支持计次/定期票","按出行频率选次数与有效期","提前预约席位，别临时再约"],"pitfalls":["并非所有线路都开通，先查再买","退票规则与普通票不同，没用完的次数过期就没了"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"计次票、定期票的产品与规则以 12306 页面为准"}],"addition":true,"why":"通勤族能实打实省钱，但很多人不知道有这类票"},{"id":"trip-a3","title":"第一次在车站寄存行李","merged_from":[],"tags":["出行","寄存"],"cost":{"money":"10–30 元/天","time":"5 分钟","willpower":"低"},"evidence":"C","body":{"plain":"中转或半日游时把箱子存在车站寄存处或自助柜，按天收费，凭单据取回。","steps":["找车站「行李寄存」标识或自助寄存柜","寄存前取出证件、充电器、常用药","保存好凭条或柜号，记下营业时间"],"pitfalls":["贵重物品不要寄存","有的寄存处夜间不营业，赶夜车要注意"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"车站服务项目与收费标准应对外公布"}],"addition":true,"why":"中转、半日游都用得上，现场找不到会耽误行程"},{"id":"trip-a4","title":"第一次坐城际、市域铁路","merged_from":[],"tags":["出行","城际"],"cost":{"money":"按里程","time":"按线路","willpower":"低"},"evidence":"B","body":{"plain":"城际与市域铁路介于地铁和火车之间：有的能刷交通卡、有的必须实名购票，进站与安检规则也各不相同。","steps":["出行前查清这条线是「铁路」还是「地铁」制式，用哪个 APP 购票","支持刷卡/刷码的线路，出站也要刷一次","预留安检与换乘时间，别按地铁的节奏算"],"pitfalls":["以为能随到随走，结果需要实名购票","不同线路的票与交通码互不通用"]},"sources":[{"name":"交通运输部官网（城市客运与网约车管理）","url":"https://www.mot.gov.cn","note":"城际铁路与市域（郊）铁路的运营与票务以运营方公告为准"}],"addition":true,"why":"这类线路越开越多，规则又不统一，第一次坐最容易懵"},{"id":"trip-a5","title":"第一次带大件行李、自行车上车","merged_from":[],"tags":["出行","火车"],"cost":{"money":"可能需托运","time":"提前 30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"铁路对随身携带品的尺寸重量有明确限制，超了要么办托运、要么进不了站；折叠自行车多数车站要求装包且符合尺寸。","steps":["出发前查清随身携带品的尺寸与重量限制","超限的走行李托运，别赌安检放行","自行车拆解打包，符合规定再进站"],"pitfalls":["临到安检口才发现超限，只能当场寄快递","不同车站的执行尺度略有差别"]},"sources":[{"name":"《铁路旅客运输规程》（交通运输部令 2022 年第 37 号）","url":"https://www.gov.cn/zhengce/2022-11/17/content_5728978.htm","note":"旅客随身携带物品与托运行李的相关规定"}],"addition":true,"why":"有尺寸与包装要求，临到安检才发现会被拦下"},{"id":"trip-a6","title":"第一次遇到邻座纠纷、外放噪音","merged_from":[],"tags":["出行","沟通"],"cost":{"money":"0","time":"几分钟","willpower":"中"},"evidence":"C","body":{"plain":"车厢矛盾优先找列车员，而不是自己硬刚：乘务人员有劝阻和调座的手段，你只要给出座位号和事实。","steps":["先礼貌提醒一次，说明具体影响","无效就找列车员，报车厢与座位号","持续争执可要求调座，避免正面冲突"],"pitfalls":["拍摄他人正面可能涉及肖像权，取证要克制","别把口角升级成肢体冲突"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"列车服务与乘务人员职责范围"}],"addition":true,"why":"知道找谁、怎么说，比忍完全程强"},{"id":"trip-a7","title":"第一次坐高铁无座票","merged_from":[],"tags":["出行","火车"],"cost":{"money":"与二等座同价","time":"全程","willpower":"中"},"evidence":"B","body":{"plain":"无座票不等于站到底：可以站在车厢连接处，也可以坐空座，但座位主人上来要让开。","steps":["上车先看车厢里的空座与座位上方/车门口的到站提示","坐空座时记住这一站之后它会不会被占用","餐车与车厢连接处可临时休息"],"pitfalls":["别占着别人的座位不放","长途无座很累，可以试着改签或候补有座车次"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"无座票的售卖与乘车规则"}],"addition":true,"why":"很多人以为无座就是站一路，其实有办法少站几段"},{"id":"trip-a8","title":"第一次用积分兑换车票","merged_from":[],"tags":["出行","火车","省钱"],"cost":{"money":"0（用积分）","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"12306 的会员积分可以直接兑换车票，但积分有有效期、过期作废，兑换票的退改规则也与普通票不同。","steps":["在 12306 开通「铁路畅行」会员并累积积分","查看可兑换车次与所需积分","兑换后留意退改签限制"],"pitfalls":["积分到期会清零，临时想起来往往已经过期","并非所有车次都开放积分兑换"]},"sources":[{"name":"中国铁路 12306 官方网站","url":"https://www.12306.cn","note":"铁路畅行会员积分规则"}],"addition":true,"why":"常旅客积分能直接换票，白白过期太可惜"}],"additions":[],"_file":"01-出行篇.json","label":"出行篇"},{"section":"02 飞机篇","source_count":50,"merged_count":23,"note":"压缩前 50 条原始大纲条目，合并为 20 条；merged_from 保留全部原始标题。","entries":[{"id":"plane-01","title":"第一次买机票：选航班、看懂机场代码与退改签规则","merged_from":["第一次买机票","第一次选择航班","第一次看机场代码"],"tags":["交通","飞机"],"cost":{"money":"因人而异","time":"30—60 分钟","willpower":"低"},"evidence":"B","body":{"plain":"买机票不是挑最便宜的就行。票价、退改签规则、行李额是三件独立的事，同一航线不同价格的票，能退能改的程度差很远。机票上写的是机场三字码，一座城市有两个机场时，光看城市名容易买错。","steps":["先定日期时段，再看直飞还是中转；中转要留够衔接时间。","在航司官网或正规 OTA 比价，重点看退改签规则、免费行李额、是否代码共享。","核对机场三字码和航站楼，乘机人信息用你出行会带的证件。"],"pitfalls":["最便宜的票通常退改最严，买前一定点开规则看清楚。","别找“先占座后倒卖”的代理，出问题找不到人。"]},"sources":[{"name":"民航局航旅指南·客票销售","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217590.html","note":"乘机有效证件种类；购票证件须与值机、安检证件一致；折扣越大退改限制越严；行程单是报销凭证且一般只能打印一次。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-02","title":"第一次去机场与找到正确的航站楼（T1/T2/T3）","merged_from":["第一次去机场","第一次找 T1/T2/T3"],"tags":["交通","飞机"],"cost":{"money":"因人而异（机场大巴/地铁/打车）","time":"1—2 小时","willpower":"低"},"evidence":"B","body":{"plain":"去机场的难点不在路上，在于你去的是哪个航站楼。同一座机场的 T1、T2、T3 之间可能隔着几公里，走错了再折腾回来很容易误机。","steps":["出发前一晚确认三件事：机场全名、航站楼编号、起飞时间。","用航司 App 或机场官网查该航班的航站楼，别只看订票页面截图。","到机场先按指示牌确认航站楼，再找该航司的值机岛。","国内航班提前量各机场不同，国际航班还要留出海关和边检时间。"],"pitfalls":["订票信息里的“机场”可能只写城市名，务必点开详情看航站楼。","廉航可能使用与主楼不同的航站楼，甚至不在同一个地铁站。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"民航局航旅指南·客票销售","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217590.html","note":"乘机有效证件种类；购票证件须与值机、安检证件一致；折扣越大退改限制越严；行程单是报销凭证且一般只能打印一次。"}]},{"id":"plane-03","title":"第一次值机：网上值机、柜台办理与拿登机牌","merged_from":["第一次办理值机","第一次网上值机","第一次拿登机牌","第一次打印登机牌"],"tags":["交通","飞机"],"cost":{"money":"免费（选座/加座可能收费）","time":"20—60 分钟","willpower":"低"},"evidence":"B","body":{"plain":"值机就是把票换成登机牌，同时把要托运的行李交出去。可以网上值机也可以到柜台办，有没有托运行李是关键。","steps":["没有托运行李：起飞前在航司 App 网上值机、选座，保存电子登机牌截图。","有托运行李：到航司柜台出示购票时的身份证件，交行李，领登机牌。","登机牌重点看四项：航班号、登机口、登机时间、座位号。","登机牌丢了可凭有效证件到值机柜台补办，网上打印的可以重新打印。"],"pitfalls":["各机场停止办理乘机手续的时间不同，晚到柜台关了只能改签。","需托运的行李尽量在柜台一次办完，登机口临时托运可能无法同机到达。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-04","title":"第一次托运行李、行李超重与购买额外行李额","merged_from":["第一次托运行李","第一次购买额外行李","第一次行李超重"],"tags":["交通","飞机"],"cost":{"money":"超重或超件按航司标准收费","time":"20—40 分钟","willpower":"低"},"evidence":"B","body":{"plain":"托运行李的尺寸、重量、件数和免费额度都由航空公司自己定，不是全国统一。买票时看清你那张票含多少公斤，比到柜台再补钱便宜得多。","steps":["买票时在航司官网查行李规则：免费件数、单件重量和尺寸。","出发前自己称重量尺寸；大概率超就提前在 App 买额外行李额，通常比现场买便宜。","柜台托运后确认行李票贴在登机牌上，留好凭证。","箱子上挂一张写有姓名电话的名签，方便查找。"],"pitfalls":["托运行李里别放现金、珠宝、数码产品和易碎物品；锂电池、充电宝禁止托运。","纸箱、编织袋要打包，行李箱要上锁，否则航司可以拒绝收运。"]},"sources":[{"name":"民航局航旅指南·行李运输（含随身携带及托运物品要求）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"免费行李额与超限行李费由承运人制定并公布；锂电池、充电宝禁止托运，≤100Wh可随身携带，100—160Wh需航司批准且每人限2块，>160Wh禁止；火种、管制器具等禁止随身携带和托运。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-05","title":"第一次分清什么能随身、什么能托运：液体、充电宝与禁区","merged_from":["第一次知道什么不能托运","第一次知道什么不能随身带","第一次处理液体","第一次携带充电宝坐飞机"],"tags":["交通","飞机"],"cost":{"money":"丢弃或托运可能产生额外费用","time":"20 分钟","willpower":"中"},"evidence":"A","body":{"plain":"安检拦下的东西九成是三类：液体、充电宝、火种。记三条：液体国内航班不能随身，充电宝只能随身不能托运，火种两头都不行。","steps":["液体：国内航班一律禁止随身携带、可托运；自用化妆品每种限一件，容器不超过100毫升。","充电宝不能托运：100Wh以内可随身，100—160Wh需航司批准且限2块，超过160Wh禁止，还必须有清晰3C标识。","拿不准的一律托运或留在家，安检处可以问能否暂存。"],"pitfalls":["“100毫升”指容器大小，大瓶只装一点点也过不了。","打火机、火柴等火种既不能随身也不能托运。"]},"sources":[{"name":"民航局航旅指南·行李运输（含随身携带及托运物品要求）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"免费行李额与超限行李费由承运人制定并公布；锂电池、充电宝禁止托运，≤100Wh可随身携带，100—160Wh需航司批准且每人限2块，>160Wh禁止；火种、管制器具等禁止随身携带和托运。"},{"name":"深圳市交通运输局：乘坐国内航班携带液态物品的注意事项","url":"https://www.sz.gov.cn/hdjl/ywzsk/jtj/hkhx/content/mpost_12970475.html","note":"国内航班一律禁止随身携带液态物品，可托运；少量自用化妆品每种限带一件，容器容积不得超过100毫升，须置于独立袋内并接受开瓶检查；100毫升指容器大小而非瓶内剩余量。"},{"name":"民航局：禁止旅客携带无3C标识及被召回的充电宝乘坐境内航班","url":"http://www.caac.gov.cn/XWZX/MHYW/202506/t20250626_227805.html","note":"2025年6月26日发布：自6月28日起禁止旅客携带没有3C标识、3C标识不清晰、被召回型号或批次的充电宝乘坐境内航班。"}]},{"id":"plane-06","title":"第一次过机场安检","merged_from":["第一次过机场安检"],"tags":["交通","飞机"],"cost":{"money":"免费","time":"15—40 分钟","willpower":"低"},"evidence":"A","body":{"plain":"机场安检和火车站类似，只是更细：人要过安检门，随身行李要过X光机。把它当成一次“清口袋”的流程，会顺利很多。","steps":["排队前先把身份证件和登机牌拿在手上，接受证件核验。","把笔记本电脑、充电宝、雨伞、外套、口袋里的金属物品单独取出放在筐里。","液体、化妆品如果带了合规的小瓶，也拿出来单独过检。","通过后收好证件和登机牌，再慢慢整理行李，不要堵在传送带口。"],"pitfalls":["穿靴子、系皮带、戴大件首饰会拖慢速度，赶时间就少穿。","被要求开箱检查不要慌，配合就行；禁止随身携带但可以托运的物品，安检会告知你可托运、自行处置或暂存。"]},"sources":[{"name":"《民用航空安全检查规则》（交通运输部令2016年第76号）","url":"https://www.gov.cn/zhengce/2016-09/02/content_5717924.htm","note":"第四十条：对液体、凝胶、气溶胶等液态物品的安全检查按民航局规定执行；第四十一条：禁止随身携带但可托运的物品，安检机构应告知旅客可托运、自行处置或暂存。"},{"name":"民航局航旅指南·行李运输（含随身携带及托运物品要求）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"免费行李额与超限行李费由承运人制定并公布；锂电池、充电宝禁止托运，≤100Wh可随身携带，100—160Wh需航司批准且每人限2块，>160Wh禁止；火种、管制器具等禁止随身携带和托运。"}]},{"id":"plane-07","title":"第一次找登机口、坐摆渡车与登机","merged_from":["第一次找登机口","第一次坐摆渡车","第一次登机"],"tags":["交通","飞机"],"cost":{"money":"免费","time":"20—40 分钟","willpower":"低"},"evidence":"B","body":{"plain":"过完安检，你要做的就是找到登机口并按时登机。登机口号码会变，尤其是延误或换机型的时候，登机牌上印的不一定是最终位置。","steps":["按登机牌上的登机口号码找候机区，同时留意航班显示屏和广播。","到登机口后看屏幕确认航班号和状态，再坐下等候。","开始登机时按广播提示的舱位或座位区域排队，出示登机牌和证件。","如果登机口在远机位，要坐摆渡车过去，下车后跟着人流和指示牌上飞机。"],"pitfalls":["登机口一般在起飞前10分钟或15分钟关闭（各航司不同），别掐着点。","登机口临时变更很常见，看到屏幕变化立刻走，别只顾着刷手机。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"民航局航旅指南·不正常航班","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217596.html","note":"航班状态变化后30分钟内发布延误或取消信息；航司自身原因在始发地延误或取消应提供餐食住宿，非航司原因协助安排但费用自理；经停地延误和备降均提供餐食住宿；可要求开具航班延误/取消证明。"}]},{"id":"plane-08","title":"第一次坐进机舱：找座位、放行李、起飞降落与颠簸","merged_from":["第一次找飞机座位","第一次把行李放行李舱","第一次飞机起飞","第一次飞机降落","第一次遇到飞机颠簸"],"tags":["交通","飞机"],"cost":{"money":"免费","time":"全程","willpower":"低"},"evidence":"B","body":{"plain":"上飞机后三件事：对号入座、把随身行李放进行李架、系好安全带。起飞降落和遇气流时的颠簸都是正常过程。","steps":["按登机牌座位号入座；紧急出口那排不许老弱病残孕幼乘坐，也不许放行李。","随身行李放头顶行李架，易碎和贵重物品自己抱着；开架时先扶住再开。","入座后看一遍安全须知，起飞、降落和颠簸期间系好安全带、不要走动或开行李架。","降落时耳朵不舒服，做吞咽、打哈欠或嚼东西缓解。"],"pitfalls":["大件随身行李会在登机口被临时托运，可能无法同机到达。","滑行、起飞、下降和颠簸期间不能离开座位，也不能打开行李架。"]},"sources":[{"name":"民航局航旅指南·客舱安全与服务","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217600.html","note":"登机口或客舱门会检查随身行李尺寸，超大会被临时托运且可能无法同机到达；须对号入座；行李架取放要小心；全程建议系好安全带。"},{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"}]},{"id":"plane-09","title":"第一次在飞机上吃饭、睡觉、充电与看电影","merged_from":["第一次飞机上吃饭","第一次飞机上睡觉","第一次飞机上充电","第一次飞机上看电影"],"tags":["交通","飞机"],"cost":{"money":"部分航班餐食免费，其余按航司规定","time":"按航程长短","willpower":"低"},"evidence":"B","body":{"plain":"机上服务跟航司和航程有关：短途可能只发一瓶水，长途一般有正餐。能不能充电、有没有屏幕，取决于机型和舱位。","steps":["登机后先看座位前方口袋里的菜单或服务说明，了解这趟有没有餐、有无娱乐系统。","吃饭时把小桌板放平，起飞、降落和颠簸阶段要收起。","手机、耳机充电优先用自己的充电宝或机上USB口；充电宝全程不能托运也不能放行李架充电。","睡觉前系好安全带，把随身贵重物品放在身上而不是行李架。"],"pitfalls":["不要指望所有飞机都有充电口和屏幕，尤其是廉航和短途航线。","机上不要使用明令禁止的电子设备；颠簸时不要起身去拿行李。"]},"sources":[{"name":"民航局航旅指南·客舱安全与服务","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217600.html","note":"登机口或客舱门会检查随身行李尺寸，超大会被临时托运且可能无法同机到达；须对号入座；行李架取放要小心；全程建议系好安全带。"},{"name":"民航局航旅指南·客票销售","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217590.html","note":"乘机有效证件种类；购票证件须与值机、安检证件一致；折扣越大退改限制越严；行程单是报销凭证且一般只能打印一次。"}]},{"id":"plane-10","title":"第一次遇到航班延误、取消与改签","merged_from":["第一次飞机延误","第一次航班取消","第一次航班改签"],"tags":["交通","飞机"],"cost":{"money":"航司原因通常免费改签；非航司原因费用自理","time":"2 小时以上","willpower":"中"},"evidence":"A","body":{"plain":"航班延误或取消后只有两个选择：退票或改签。航司应在状态变化后30分钟内发布信息并说明原因；吃住谁掏钱，看原因是不是航司自己的。","steps":["看航司 App 或短信确认状态和原因，别只听传言。","改签找航司柜台或原购票渠道；航司原因的非自愿变更应免费改期或签转。","索赔或报销要索取“航班延误/取消证明”，原因有异议可通过12326确认。","食宿：航司自身原因在始发地延误应提供餐食住宿，非航司原因费用自理，经停地延误和备降都提供。"],"pitfalls":["大面积延误时先排队的人先拿到座位。","是否补偿写在航司运输总条件里，别默认“延误就有钱赔”。"]},"sources":[{"name":"民航局航旅指南·不正常航班","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217596.html","note":"航班状态变化后30分钟内发布延误或取消信息；航司自身原因在始发地延误或取消应提供餐食住宿，非航司原因协助安排但费用自理；经停地延误和备降均提供餐食住宿；可要求开具航班延误/取消证明。"},{"name":"《航班正常管理规定》（交通运输部令2016年第56号）","url":"https://www.gov.cn/gongbao/content/2016/content_5115843.htm","note":"航班延误、取消后的信息告知、退改签、食宿服务与补偿要求，是航司运输总条件和延误处置的依据。"}]},{"id":"plane-11","title":"第一次错过航班（误机、漏乘）","merged_from":["第一次错过航班"],"tags":["交通","飞机"],"cost":{"money":"按客票规则，通常需自行承担改签或重购","time":"1—3 小时","willpower":"中"},"evidence":"B","body":{"plain":"误机就是你自己没赶上：柜台已停止办理乘机手续，或登机口已关闭。这时候机票多半不能全额退，只能按客票规则改签或重新买票。","steps":["发现赶不上时立刻联系航司或原购票渠道，问清楚还能不能改、改签多少钱。","能改就尽快改到最近有座的航班，尤其当天末班之后就没别的选择。","若是前一段交通延误造成的，保留车票和行程记录，必要时联系保险或平台。","改不了就重新买票，同时确认旧票的退票规则，能退一点是一点。"],"pitfalls":["各机场停止办理乘机手续的时间不同，别按高铁的节奏估算。","登机口会提前关闭，过了时间即使飞机还在也不能登机。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-12","title":"第一次转机与中转（含在陌生机场转机）","merged_from":["第一次转机","第一次中转","第一次在陌生机场转机"],"tags":["交通","飞机"],"cost":{"money":"同航司联程通常无需额外费用","time":"1—4 小时","willpower":"中"},"evidence":"B","body":{"plain":"转机分两种：一张票到底的联程，和分开买的两段票。前者行李往往能直挂、误机由航司负责衔接；后者前段一旦延误，损失基本自己承担。","steps":["值机时问清：行李能否直挂、中转要不要重新取行李和安检。","下飞机后跟着“中转/Transfer”指示走，别跟着“到达/出口”的人流出去。","到中转柜台或服务台确认下一段航班状态和登机口，再看屏幕有没有变更。","中转时间紧就提前告诉乘务员或地服，请他们协助引导。"],"pitfalls":["分开买的两段票不是联程，前段延误导致误机，后段只能按自愿退改处理。","国际转国内可能要重新入境和安检，时间别算太满。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-13","title":"第一次坐长途国际航班与十几个小时的飞行","merged_from":["第一次长途国际航班","第一次经历十几个小时的飞行"],"tags":["交通","飞机","出国"],"cost":{"money":"因人而异（票价、选座、餐食）","time":"10 小时以上","willpower":"中"},"evidence":"B","body":{"plain":"十几个小时在飞机上，真正的门槛是证件、行李和时间安排，而不是“能不能熬”。国际航班多了海关和边检两道手续，证件签证必须提前核对。","steps":["出发前核对护照有效期、签证和目的地入境要求；护照随身带，不要放进托运箱。","国际出发多了海关检查（有申报走红色通道，没有走绿色通道）和边检，要留足时间。","值机时确认行李是否直挂、中途是否要重新提取。","上机后按当地时间安排作息，多喝水，隔一段时间起身活动。"],"pitfalls":["购票证件要和值机、安检用的证件一致，改证件等于重新出票。","护照有效期不够会被拒绝登机，出发前自己查一遍。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"民航局航旅指南·客票销售","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217590.html","note":"乘机有效证件种类；购票证件须与值机、安检证件一致；折扣越大退改限制越严；行程单是报销凭证且一般只能打印一次。"}]},{"id":"plane-14","title":"第一次坐廉航（低成本航空）","merged_from":["第一次坐廉航"],"tags":["交通","飞机"],"cost":{"money":"票价低，但行李、选座、餐食多为付费项","time":"与普通航班相近","willpower":"低"},"evidence":"B","body":{"plain":"廉航把机票拆开卖：便宜的只是把你从A送到B，行李额、选座、餐食、退改都要另外加钱。真正决定总价的，是你带多少行李。","steps":["买票时先看总价：票价加行李额加选座费，再和其他航司比。","只带随身行李的话，提前确认随身行李的尺寸和件数限制，廉航查得比全服务航司更严。","需要托运就提前在官网买行李额，机场柜台现场买通常更贵。","留意廉航使用的航站楼和值机截止时间，有的机场廉航柜台关闭得更早。"],"pitfalls":["登机口会检查随身行李尺寸，超一点也要现场付费托运。","廉航退改规则通常很严，行程不确定就别买最低价那档。"]},"sources":[{"name":"民航局航旅指南·行李运输（含随身携带及托运物品要求）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"免费行李额与超限行李费由承运人制定并公布；锂电池、充电宝禁止托运，≤100Wh可随身携带，100—160Wh需航司批准且每人限2块，>160Wh禁止；火种、管制器具等禁止随身携带和托运。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-15","title":"第一次行李损坏、丢失与找行李服务台","merged_from":["第一次行李损坏","第一次行李丢失","第一次找行李服务台"],"tags":["交通","飞机"],"cost":{"money":"赔偿按国家规定限额","time":"1—3 小时","willpower":"中"},"evidence":"A","body":{"plain":"下飞机后行李没出来或箱子破了，第一件事是去到达厅的行李查询柜台登记，而不是回家。航空公司的赔偿限额由国家规定。","steps":["确认行李确实没出来，带上行李票和登机牌到行李查询柜台办理事故登记。","填写行李事故单，写清行李特征、价值、联系方式和送达地址，留存一份单据。","托运行李损坏、丢失按国家规定赔偿：托运行李每公斤100元，随身携带物品每人3000元。","后续有争议可拨打12326或通过民航服务质量监督平台投诉。"],"pitfalls":["不办登记直接离开机场，之后很难再主张。","托运箱里别放现金、珠宝、数码产品，这类损失通常不在赔偿范围内。"]},"sources":[{"name":"《国内航空运输承运人赔偿责任限额规定》（民航总局令第164号）","url":"http://www.caac.gov.cn/XXGK/XXGK/FLFG/201511/t20151102_8468.html","note":"第三条：承运人对每名旅客赔偿责任限额40万元，随身携带物品3000元，托运行李每公斤100元。"},{"name":"民航局航旅指南·投诉维权（12326）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217603.html","note":"民航服务质量监督电话12326、平台www.12326.cn；投诉需真实姓名与身份证件信息、具体请求与事实，且为6个月内发生；消费者事务中心7个工作日内反馈是否受理，被投诉人10个工作日内回复。"}]},{"id":"plane-16","title":"第一次在机场过夜与在机场吃饭","merged_from":["第一次在机场过夜","第一次在机场吃饭"],"tags":["交通","飞机"],"cost":{"money":"因人而异（机场餐饮偏贵）","time":"数小时至一晚","willpower":"中"},"evidence":"C","body":{"plain":"在机场过夜多半是因为中转、凌晨航班或延误。机场是公共场所，能休息但睡不好，最需要提前解决的是哪里能坐、哪里能充电、哪里能吃到热饭。","steps":["先确认机场是否24小时开放，部分机场夜间会关闭区域或清场。","找靠近登机口、有监控和插座的位置，行李当枕头或锁在行李车上。","餐饮集中在出发大厅和安检后，价格普遍高于市区；液体过不了安检，进去再买。","设好闹钟，留意广播和航班显示屏，别睡过登机时间。"],"pitfalls":["不要睡在无人角落或把行李撒手不管。","部分机场夜间会清场重新安检，先问清楚再决定睡哪。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"民航局航旅指南·不正常航班","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217596.html","note":"航班状态变化后30分钟内发布延误或取消信息；航司自身原因在始发地延误或取消应提供餐食住宿，非航司原因协助安排但费用自理；经停地延误和备降均提供餐食住宿；可要求开具航班延误/取消证明。"}]},{"id":"plane-17","title":"第一次在机场免税店购物","merged_from":["第一次机场免税店购物"],"tags":["交通","飞机","消费"],"cost":{"money":"因人而异，注意免税额度","time":"20—60 分钟","willpower":"中"},"evidence":"B","body":{"plain":"机场免税店分出境免税店和进境免税店。影响钱包的不是折扣，是免税额度——买超了要在入境时申报补税。","steps":["先分清是出境买还是入境买：出境免税店在安检后、出境前；进境免税店在入境口岸。","额度：进境居民旅客在境外获取的自用物品免税额度5000元；设有进境免税店的口岸，连同免税店商品总值在15000元以内（含）免税放行。","买烟酒另有专门限额，超过免税额度的部分要主动申报。","保留小票和提货单，液体类免税品通常在登机口或到达后提货。"],"pitfalls":["免税不等于免申报，超额度不申报属于违规。","额度会随政策调整，以海关总署最新公告为准。"]},"sources":[{"name":"进境行李物品税收监管须知（人民日报海外版·海关答疑）","url":"http://paper.people.com.cn/rmrbhwb/pad/content/202510/18/content_30110106.html","note":"进境居民旅客在境外获取的自用物品免税额度为5000元；在设有进境免税店的口岸，连同口岸进境免税店所购免税商品总值在15000元以内（含）免税放行。具体以海关总署最新公告为准。"},{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"}]},{"id":"plane-18","title":"第一次坐商务舱、头等舱","merged_from":["第一次坐商务舱","第一次坐头等舱"],"tags":["交通","飞机"],"cost":{"money":"票价明显高于经济舱","time":"与同航班相同","willpower":"低"},"evidence":"B","body":{"plain":"商务舱和头等舱买的主要是空间、顺序和服务：更大的座椅、优先值机和登机、更好的餐食。国内航线常见的舱位等级就包括头等舱、公务舱、经济舱。","steps":["值机时走专门的优先柜台，托运行李额度和优先行李牌通常也更高。","安检可能有专用通道，登机时按广播提示优先登机。","上机后先熟悉座椅功能：能不能放平、小桌板在哪里、充电口和娱乐屏幕怎么用。","餐食一般单独点单，登机后乘务员会来确认，想吃哪个提前说。"],"pitfalls":["同样的票价，不同航司的“商务舱”硬件差别很大，买之前看清机型。","打折的商务舱可能不含休息室或其他权益，看具体舱位规则。"]},"sources":[{"name":"民航局航旅指南·客票销售","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217590.html","note":"乘机有效证件种类；购票证件须与值机、安检证件一致；折扣越大退改限制越严；行程单是报销凭证且一般只能打印一次。"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令2021年第3号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"第八条要求运输总条件包含客票销售和退票、变更实施细则与超售处置规定；第十五条要求售票时告知退改规则；第三十七条明确免费行李额、超限行李费、行李损坏丢失赔偿标准须在运输总条件中列明。"}]},{"id":"plane-19","title":"第一次一个人坐飞机与独自走完值机到登机","merged_from":["第一次一个人坐飞机","第一次一个人完成值机到登机"],"tags":["交通","飞机"],"cost":{"money":"因人而异","time":"2—4 小时","willpower":"低"},"evidence":"B","body":{"plain":"一个人坐飞机没有想象中难，流程是固定的：值机—托运—安检—找登机口—登机。真正要提前做的，是把证件、充电、时间三件事管好。","steps":["出发前把证件、登机牌（电子或纸质）、行李票放在同一个顺手的位置。","按机场指示牌走，每个环节都有工作人员可以问，不确定就问。","过完安检先找登机口再看时间，剩得多再去吃饭或逛店。","到达目的地后跟着“到达/行李提取”指示走到行李转盘，取到行李再出站。"],"pitfalls":["手机保持有电，值机和登机都要用。","一个人出门容易被搭讪或推销，机场里只跟穿制服的工作人员确认信息，不跟陌生人换钱、代购、带东西。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"民航局航旅指南·投诉维权（12326）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217603.html","note":"民航服务质量监督电话12326、平台www.12326.cn；投诉需真实姓名与身份证件信息、具体请求与事实，且为6个月内发生；消费者事务中心7个工作日内反馈是否受理，被投诉人10个工作日内回复。"}]},{"id":"plane-20","title":"第一次坐凌晨航班","merged_from":["第一次凌晨航班"],"tags":["交通","飞机"],"cost":{"money":"打车费用可能更高（夜间加价）","time":"视航班时间","willpower":"中"},"evidence":"B","body":{"plain":"凌晨航班最大的问题不是飞机，而是怎么在半夜到机场、到了之后怎么熬。公共交通多半已经停运，安检和商铺也可能只开一部分。","steps":["提前一天确认机场夜间交通方案：地铁末班车时间、机场大巴夜班线路或打车。","算好出门时间，凌晨安检通道可能只开部分，排队时间不比白天短。","候机时待在有人、有监控、有插座的位置，贵重物品不离身。","上机后尽量按目的地时间补觉，落地后晒点太阳，调整会快一些。"],"pitfalls":["别指望机场所有店铺都开着，水和吃的提前准备（液体过完安检再买）。","深夜打车要核对车牌和司机信息，把行程分享给家人或朋友。"]},"sources":[{"name":"民航局航旅指南·乘机（办理乘机手续、乘机流程、登机牌）","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217602.html","note":"国内出发流程：换登机牌与托运行李、安检、按登机口候机；登机牌含航班号、登机口、登机时间、座位号；登机口起飞前10或15分钟关闭（各航司不同）；登机口可能临时变更，以显示屏和广播为准。"},{"name":"民航局航旅指南·不正常航班","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217596.html","note":"航班状态变化后30分钟内发布延误或取消信息；航司自身原因在始发地延误或取消应提供餐食住宿，非航司原因协助安排但费用自理；经停地延误和备降均提供餐食住宿；可要求开具航班延误/取消证明。"}]},{"id":"plane-a1","title":"第一次忘带身份证：民航临时乘机证明怎么办","merged_from":[],"tags":["飞机","证件","应急"],"cost":{"money":"0–几十元","time":"30–60 分钟","willpower":"低"},"evidence":"B","body":{"plain":"到机场才发现没带身份证，不用直接放弃航班：多数机场设有公安制证点或支持线上申领「临时乘机证明」，凭它过安检登机。","steps":["先到出发层问询处或机场公安制证点，说明航班与时间","按指引在「民航临时乘机证明」小程序做人脸核验并生成二维码","留足时间：办证加安检通常要 30–60 分钟","平时把身份证照片存在手机加密相册，只能应急佐证，不能代替证件"],"pitfalls":["身份证过期同样不能用，别指望过期证件能过安检","临时证明有有效期与使用范围限制，返程要另外办"]},"sources":[{"name":"民航局航旅指南","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"民航局航旅指南对乘机证件要求的说明"}],"addition":true,"why":"大纲没写，但这是机场最高频的意外"},{"id":"plane-a2","title":"第一次搞懂行程单：报销凭证只能打印一次","merged_from":[],"tags":["飞机","报销"],"cost":{"money":"0","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"行程单是机票的付款与报销凭证，一般只能打印一次；退票改签时往往要交回原件，所以拿到先拍照留底。","steps":["在航司柜台、官网或自助机打印行程单，注意打印期限","打印后先拍照存档，再交给财务","退改签前问清是否需要交回原件","电子发票逐步推广，出差前先问公司财务认哪种凭证"],"pitfalls":["以为能随时补打，过期或已打印就开不出来","把唯一原件直接交出去，之后无法核对金额与税费"]},"sources":[{"name":"民航局航旅指南","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"航旅指南中关于行程单用途与打印次数的说明"},{"name":"《公共航空运输旅客服务管理规定》（交通运输部令 2021 年第 3 号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"承运人应公示客票与退改规则"}],"addition":true,"why":"行程单是报销凭证且一般只能打印一次，是典型新手坑"},{"id":"plane-a3","title":"第一次向 12326 投诉航班服务问题","merged_from":[],"tags":["飞机","维权"],"cost":{"money":"0","time":"30 分钟","willpower":"中"},"evidence":"B","body":{"plain":"对航班延误、行李、服务不满，除了找航司，还可以向民航服务质量监督热线 12326 投诉；投诉有期限，越早越好。","steps":["先向航司或机场书面投诉，留下工单号","未解决或不满意的，打 12326 或通过民航局投诉渠道提交","准备好票号、航班号、时间、证据（截图、录音、行李单）","注意投诉时限，别拖到几个月后再提"],"pitfalls":["只口头反映不留证据，后续很难推进","把天气等不可抗力当成航司责任，诉求容易落空"]},"sources":[{"name":"《公共航空运输旅客服务管理规定》（交通运输部令 2021 年第 3 号）","url":"https://www.gov.cn/zhengce/2021-03/03/content_5711514.htm","note":"旅客服务与投诉处理的相关规定"},{"name":"民航局航旅指南","url":"https://www.caac.gov.cn/INDEX/HLFW/HKLXCS/202303/t20230316_217597.html","note":"民航服务监督渠道说明"}],"addition":true,"why":"投诉有时限与材料要求，先知道规则比事后着急有用"}],"additions":[],"_file":"02-飞机篇.json","label":"飞机篇"},{"section":"03 酒店住宿篇","source_count":45,"merged_count":19,"note":"压缩前 45 条原始大纲条目，合并为 16 条；merged_from 保留全部原始标题。","entries":[{"id":"hotel-01","title":"第一次订酒店：平台、房型与退订规则","merged_from":["第一次订酒店","第一次选择房型","第一次订大床房","第一次订双床房","第一次订套房"],"tags":["住宿"],"cost":{"money":"因人而异（淡旺季差别大）","time":"20—40 分钟","willpower":"低"},"evidence":"A","body":{"plain":"订酒店要看三件事：位置、房型、能不能免费取消。大床房是一张大床、双床房是两张床，套房带独立客厅，价格和面积往上走。","steps":["先按行程定区域，再按预算筛酒店；通勤时间和打车费常常比房价差更值钱。","选房型时看清床型、面积、是否含早、窗户朝向。","付款前点开“退订规则”，确认最晚免费取消时间；行程不确定就选可免费取消的价格。","下单后存好订单号和酒店电话，出发前再确认一次。"],"pitfalls":["部分酒店的大床房和双床房是同一房型的两种布置，同性朋友出行要提前确认。","预付特价房常常不可退，行程没定时别贪这个便宜。"]},"sources":[{"name":"《在线旅游经营服务管理暂行规定》（文化和旅游部令第4号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-09/01/content_5538951.htm","note":"第十二条：提供交通、住宿、游览等预订服务应当建立公开、透明、可查询的预订渠道，促成预订服务依约履行；第十三条：不得擅自屏蔽、删除旅游者的评价。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-02","title":"第一次看酒店评分和差评","merged_from":["第一次看酒店评分","第一次看酒店差评"],"tags":["住宿"],"cost":{"money":"免费","time":"10—20 分钟","willpower":"低"},"evidence":"A","body":{"plain":"评分看趋势，差评看细节。刷出来的好评通常空泛，差评才告诉你这家酒店真正的短板在哪——隔音、热水、卫生、位置，还是前台态度。","steps":["先看最近三个月的评分变化，再看差评集中在哪个方面。","按关键词筛差评：隔音、异味、热水、空调、卫生、押金、发票。","注意区分“酒店本身的问题”和“房型/楼层的问题”，后者可以靠备注规避。","平台不得擅自屏蔽、删除旅游者的评价，看到明显异常的整片好评要提高警惕。"],"pitfalls":["只看总评分容易被高分小店坑，一定点进差评看具体内容。","图片和实拍差距大的，多半是样板间，看住客上传的实景图更准。"]},"sources":[{"name":"《在线旅游经营服务管理暂行规定》（文化和旅游部令第4号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-09/01/content_5538951.htm","note":"第十二条：提供交通、住宿、游览等预订服务应当建立公开、透明、可查询的预订渠道，促成预订服务依约履行；第十三条：不得擅自屏蔽、删除旅游者的评价。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-03","title":"第一次订民宿","merged_from":["第一次订民宿"],"tags":["住宿"],"cost":{"money":"因人而异，通常需预付","time":"20—40 分钟","willpower":"中"},"evidence":"A","body":{"plain":"民宿和酒店最大的区别是：房源由个人或小机构经营，标准参差、退订规则更硬、沟通全靠房东或管家。订之前把谁接待、怎么进房、能不能开发票问清楚。","steps":["先确认具体地址和交通，别只看“距景区X公里”这种模糊描述。","看评价里关于房东响应、卫生、隔音、热水的反馈，重点看差评。","下单前问清三件事：进门方式、退订规则、能否开发票。","入住当天保存房东电话，确认到店时间。"],"pitfalls":["民宿常见“照骗”和临时换房，截图保存房源页面，出现不符可作为凭证。","部分民宿不接待未成年或外籍客人，订前先问。"]},"sources":[{"name":"《在线旅游经营服务管理暂行规定》（文化和旅游部令第4号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-09/01/content_5538951.htm","note":"第十二条：提供交通、住宿、游览等预订服务应当建立公开、透明、可查询的预订渠道，促成预订服务依约履行；第十三条：不得擅自屏蔽、删除旅游者的评价。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-04","title":"第一次住青旅（青年旅舍）","merged_from":["第一次住青旅"],"tags":["住宿"],"cost":{"money":"床位通常几十元起，因人而异","time":"按天计","willpower":"中"},"evidence":"A","body":{"plain":"青旅卖的是床位不是房间：一间房放四到八张床，共用卫生间和公共区域。好处是便宜、容易认识人，代价是隐私和作息得迁就别人。","steps":["订之前看清是几人间、混住还是分性别、有没有独立卫浴和储物柜。","入住同样要出示身份证件登记，这是旅馆业的法定要求，青旅也不例外。","进房后把贵重物品放进储物柜并自己带锁，或使用前台提供的保管服务。","公共区域保持安静，晚上关灯、早上轻手轻脚，耳机比外放好用。"],"pitfalls":["青旅隔音和作息差异大，睡眠浅、要赶早班机的建议带耳塞和眼罩。","贵重物品不要放在床上或公共区域，旅馆对旅客遗留物品有保管义务，但丢了举证很难。"]},"sources":[{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-05","title":"第一次住五星级酒店","merged_from":["第一次住五星级酒店"],"tags":["住宿"],"cost":{"money":"房价明显高于普通酒店","time":"按天计","willpower":"低"},"evidence":"A","body":{"plain":"星级是国家标准评出来的，不是酒店自己封的。五星级在客房面积、餐饮、游泳池、健身房、叫醒与送餐等服务上都有评分项，设施更全，但附加收费项目也更多。","steps":["办入住时问清：含不含早餐、早餐时间、健身房和泳池是否免费。","房卡一般要插卡取电，出门带走房间会断电。","需要叫醒、送餐、洗衣、加床，直接拨房间电话找客房服务。","退房前核对账单，尤其是迷你吧、餐厅挂账和洗衣费用。"],"pitfalls":["星级说明的是硬件和服务配置，不代表每间房都好，订房时仍要看具体房型和评价。","发生重大安全责任事故会被取消星级，看近期口碑更实际。"]},"sources":[{"name":"《旅游饭店星级的划分与评定》（GB/T 14308—2010）全文","url":"https://www.cjs.gov.cn/gk/zxfg/853563.htm","note":"星级评定按必备项目、设施设备、服务功能评价等打分；五星级对客房、游泳池、健身房、叫醒与送餐服务等均有对应评分项。"},{"name":"上海市文化和旅游局：《旅游饭店星级的划分与评定》（GB/T14308—2010）","url":"https://whlyj.sh.gov.cn/zcfg/20150721/0022-23701.html","note":"标准修订说明：强化安全管理，将突发事件应急预案列为各星级必备条件；评定星级后发生重大安全责任事故将被取消星级。"}]},{"id":"hotel-06","title":"第一次一个人住酒店","merged_from":["第一次一个人住酒店"],"tags":["住宿"],"cost":{"money":"因人而异","time":"按天计","willpower":"低"},"evidence":"B","body":{"plain":"一个人住酒店，重点从“住得舒服”变成“住得安全”。选房、进房、叫外卖、开门，这几个动作都需要一点分寸感。","steps":["尽量选正规连锁、位置在主路或商场附近的酒店，避免偏僻的独栋小旅馆。","办入住时可以让前台安排在靠近电梯、走廊有人流的房间；房号不要随手写在纸上丢在房间。","进房后先确认门锁、防盗链能用，把门反锁并挂上防盗链。","有人敲门先通过猫眼确认身份，自称维修、送水的一律先打电话给前台核实。"],"pitfalls":["不要给陌生人开门，也不要在电话里透露“我一个人住”。","外卖和快递一般送到大堂或指定位置，让配送员上楼是有风险的。"]},"sources":[{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-07","title":"第一次到前台办入住：报预订、出示证件、交押金、拿房卡","merged_from":["第一次到酒店前台","第一次办理入住","第一次说“我预订了房间”","第一次出示身份证","第一次交酒店押金","第一次做信用卡预授权","第一次拿房卡","第一次刷房卡进电梯"],"tags":["住宿"],"cost":{"money":"押金通常几百元，退房后退还","time":"10—20 分钟","willpower":"低"},"evidence":"A","body":{"plain":"办入住就四步：报预订、出示身份证件、交押金或刷预授权、拿房卡。旅馆接待住宿必须登记并查验身份证件。","steps":["到前台说“你好，我预订了房间”，报预订人姓名、手机号或订单号。","把身份证交给前台登记；几个人住就登记几个人。","押金可以现金、扫码或信用卡预授权。预授权是冻结额度作押金，不是直接扣款，结算后按实际消费扣。","拿到房卡确认房号、早餐时间和WiFi密码，问清退房时间。"],"pitfalls":["预授权解冻可能不是实时的，退房后过几天才释放。","押金退还方式和时限应当事先说清，符合条件应及时退还，无故拖延可依《消保法实施条例》第二十条主张。"]},"sources":[{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"},{"name":"中国建设银行·信用卡常见问题《预授权交易》","url":"http://ebank2.ccb.com/cn/home/question/20130930_1380524364.html","note":"预授权是商户在持卡人账户上冻结一笔资金用作押金，实际结算时按实际消费金额扣款，冻结额度在结算或撤销后释放。"},{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"第二十条：经营者收取押金的，应当事先与消费者约定退还押金的方式、程序和时限，不得对退还押金设置不合理条件；符合条件应当及时退还。"}]},{"id":"hotel-08","title":"第一次进房间：找房间、插电卡、开空调、用淋浴和马桶","merged_from":["第一次找到自己的房间","第一次使用酒店电卡","第一次打开酒店空调","第一次使用酒店淋浴","第一次使用酒店马桶"],"tags":["住宿"],"cost":{"money":"免费","time":"10—20 分钟","willpower":"低"},"evidence":"C","body":{"plain":"酒店房间的设备逻辑都差不多：门锁用卡、进门插卡取电、空调在墙上或床头、热水一般是即热或储水式。第一次住先花五分钟把房间摸一遍。","steps":["按房号找到房间，房卡贴感应区开门；进门先插卡取电。","空调面板先确认模式和风速，出风口别对着床直吹。","洗澡前先放一会儿热水试温，确认冷热方向再站进去，地面滑先铺防滑垫。","马桶旁通常有冲水按钮或感应区，用不惯智能马桶盖就先找“停止”键。"],"pitfalls":["热水可能要放一会儿才热，别以为坏了就叫维修。","房卡是取电钥匙，出门带走房间就断电，充电设备要留意。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"},{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"}]},{"id":"hotel-09","title":"第一次用房间里的一次性用品、保险箱和客房服务","merged_from":["第一次使用酒店一次性用品","第一次使用酒店保险箱","第一次叫客房服务"],"tags":["住宿"],"cost":{"money":"一次性用品通常免费，迷你吧和部分物品收费","time":"随时","willpower":"低"},"evidence":"A","body":{"plain":"房间里的东西分两类：免费的和收费的。一次性牙具、拖鞋、茶包一般免费，迷你吧的饮料和零食往往收费。保险箱是旅馆应提供的财物保管设施。","steps":["先用一遍房间里的免费物品，收费物品看价目牌再动。","贵重物品放进保险箱，设置自己记得住的密码；退房前一定要清空。","需要送水、加被子、要拖鞋，直接拨房间电话的客房服务键（一般是0或总机）。","叫客房服务时说明房号、需求和时间，送东西的人到了先通过猫眼确认。"],"pitfalls":["保险箱密码忘记要打电话给前台开，退房前务必检查一遍保险箱和床头柜。","迷你吧的东西拿了就计费，有些酒店用感应托盘，挪动也会记账。"]},"sources":[{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-10","title":"第一次让外卖和快递送到酒店","merged_from":["第一次叫外卖送到酒店","第一次让快递送到酒店"],"tags":["住宿","生活"],"cost":{"money":"同城外卖价格正常，超区可能加价","time":"30—60 分钟","willpower":"低"},"evidence":"C","body":{"plain":"酒店对外卖和快递的通行做法是：送到大堂、外卖柜或指定取餐点，由你自己下楼取，配送员一般不上楼。","steps":["外卖地址写清酒店名和门牌，备注“送到大堂或外卖柜”。","下单后电话联系配送员，告诉他放哪里、怎么找。","快递地址写“某某酒店 转 入住人姓名+手机号”，提前跟前台说一声。","收到取件通知及时去取，离店前确认没有未取的快递。"],"pitfalls":["不要备注“送到房间门口”，多数酒店不允许配送员上楼。","离店后才到的快递很麻烦，寄之前先算好时间。"]},"sources":[{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-11","title":"第一次发现房间有问题：换房、投诉卫生与噪音","merged_from":["第一次发现酒店房间有问题","第一次要求换房","第一次投诉酒店卫生","第一次投诉酒店噪音","第一次半夜找前台"],"tags":["住宿"],"cost":{"money":"换房通常免费","time":"30—90 分钟","willpower":"中"},"evidence":"A","body":{"plain":"房间有问题——卫生不到位、隔壁太吵、空调坏了——第一反应应该是打电话给前台，而不是忍一晚。换房是最常见的解决办法。","steps":["发现问题先拍照或拍视频留证，尤其是卫生和设施损坏。","打房间电话给前台，说明房号和问题，直接提出诉求：换房、加做清洁或安排维修。","换房后检查新房间；如果是降级房型，可以要求补差价或相应补偿。","前台处理不了，退房后可通过平台投诉，或走12315、当地文旅部门渠道。"],"pitfalls":["半夜噪音先找前台协调，别自己上门理论。","只口头反馈往往没人跟进，留好照片和时间点才有依据。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"},{"name":"《在线旅游经营服务管理暂行规定》（文化和旅游部令第4号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-09/01/content_5538951.htm","note":"第十二条：提供交通、住宿、游览等预订服务应当建立公开、透明、可查询的预订渠道，促成预订服务依约履行；第十三条：不得擅自屏蔽、删除旅游者的评价。"}]},{"id":"hotel-12","title":"第一次用酒店早餐、健身房和泳池","merged_from":["第一次使用酒店早餐","第一次使用酒店健身房","第一次使用酒店泳池"],"tags":["住宿"],"cost":{"money":"含早房价更贵；健身房泳池通常免费或按酒店规定","time":"1—2 小时","willpower":"低"},"evidence":"A","body":{"plain":"酒店的早餐、健身房、泳池属于配套服务，是否免费、几点开放、要不要预约差别很大。进门先问一句，比到了门口被拦下体面。","steps":["办入住时问早餐时间、地点和是否含早；不含早现场买通常比预订含早贵。","健身房、泳池问开放时间和是否要房卡登记，有的需要预约或签安全告知。","泳池一般要求戴泳帽、穿泳衣，有些酒店不提供浴巾拖鞋，自己带一套。","运动后及时补水，别在空腹或酒后使用器械和泳池。"],"pitfalls":["泳池和健身房可能有身高、年龄或健康限制，带小孩或身体不适先问清楚。","免费设施不等于没有责任，使用前看清现场安全提示。"]},"sources":[{"name":"《旅游饭店星级的划分与评定》（GB/T 14308—2010）全文","url":"https://www.cjs.gov.cn/gk/zxfg/853563.htm","note":"星级评定按必备项目、设施设备、服务功能评价等打分；五星级对客房、游泳池、健身房、叫醒与送餐服务等均有对应评分项。"},{"name":"上海市文化和旅游局：《旅游饭店星级的划分与评定》（GB/T14308—2010）","url":"https://whlyj.sh.gov.cn/zcfg/20150721/0022-23701.html","note":"标准修订说明：强化安全管理，将突发事件应急预案列为各星级必备条件；评定星级后发生重大安全责任事故将被取消星级。"}]},{"id":"hotel-13","title":"第一次在酒店遇到停电和火警","merged_from":["第一次酒店停电","第一次酒店火警"],"tags":["住宿","安全"],"cost":{"money":"免费","time":"视情况","willpower":"中"},"evidence":"A","body":{"plain":"酒店停电和火警是两件事：停电通常等一会儿就恢复；火警响起时，无论真假都要按疏散通道走，不坐电梯、不留在房间观望。","steps":["停电先打前台确认是整栋还是单个房间，问预计恢复时间，不要自己开配电箱。","房间备一个小手电或用手电筒功能，停电时先找到门和房卡。","火警响起：穿鞋、拿房卡和手机，沿疏散指示从楼梯下楼，不乘电梯、不回去取行李。","到安全区域后听酒店和消防人员安排，需要时拨打119。"],"pitfalls":["不要躲进房间等救援，疏散通道能走就走。","公共场所应保障疏散通道和安全出口畅通，发现被堵立即向酒店反映。"]},"sources":[{"name":"《中华人民共和国消防法》","url":"http://www.npc.gov.cn/zgrdw//npc///xinwen/2019-05/07/content_2086831.htm","note":"任何单位、个人发现火灾都应当立即报警；公共场所应当保障疏散通道、安全出口畅通，并设置消防安全标志。"},{"name":"上海市文化和旅游局：《旅游饭店星级的划分与评定》（GB/T14308—2010）","url":"https://whlyj.sh.gov.cn/zcfg/20150721/0022-23701.html","note":"标准修订说明：强化安全管理，将突发事件应急预案列为各星级必备条件；评定星级后发生重大安全责任事故将被取消星级。"}]},{"id":"hotel-14","title":"第一次退房与超过退房时间","merged_from":["第一次退房","第一次超过退房时间"],"tags":["住宿"],"cost":{"money":"超时可能加收费用","time":"10—30 分钟","willpower":"低"},"evidence":"B","body":{"plain":"国家没有统一规定退房时间。行业惯例是14:00后入住、12:00前退房，但2009年修订的《中国旅游饭店行业规范》已删掉“12点退房、超时加收房费”的条款，现行要求是明示住宿时间结算方法。","steps":["退房前一天问清退房时间和结算方式，看清房卡套或预订页面的说明。","退房时交回房卡、报房号，确认没有额外消费；需要延迟退房提前跟前台申请。","确认押金退还方式：现金或扫码押金当场退，预授权解冻可能要几天。"],"pitfalls":["超时费各家标准不同，事先明示过的才有约束力，没告知就收高额超时费可以拒付并投诉。","退房时别急着走，先看一眼账单再签字。"]},"sources":[{"name":"经济日报《酒店退房时间有统一规定吗？》（光明网转载）","url":"https://m.gmw.cn/2025-07/07/content_1304076899.htm","note":"国家没有统一规定退房时间；2009年修订的《中国旅游饭店行业规范》删除了“中午12点退房、超时加收房费”的具体规定，现行要求饭店在前厅显著位置明示客房价格和住宿时间结算方法。"},{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"第二十条：经营者收取押金的，应当事先与消费者约定退还押金的方式、程序和时限，不得对退还押金设置不合理条件；符合条件应当及时退还。"}]},{"id":"hotel-15","title":"第一次把东西落在酒店、忘记带走房间东西","merged_from":["第一次忘记带走房间东西","第一次把东西落在酒店"],"tags":["住宿"],"cost":{"money":"邮寄费用一般自付","time":"30 分钟—数天","willpower":"低"},"evidence":"A","body":{"plain":"东西落在酒店，越早联系越容易找回来。旅馆对旅客遗留的物品有保管义务，退房后想起来也可以打电话回去问。","steps":["发现后立刻打酒店前台电话，报房号、入住日期和物品描述，请客房部去找。","酒店确认找到后，商量领取或邮寄方式；邮寄一般由你承担运费并提供地址。","如果是贵重物品，说明特征和购买凭证，方便核对。","长时间无人认领的物品，酒店会按规定处理，所以别拖。"],"pitfalls":["退房前养成“三查”习惯：床头柜和枕头下、插座上的充电器、保险箱和浴室挂钩。","寄存或邮寄都要留好沟通记录和快递单号。"]},"sources":[{"name":"《旅馆业治安管理办法》（三亚市公安局·法规公文）","url":"https://gaj.sanya.gov.cn/gajsite/fggwxx/202308/58a817746e92447ebd758c17d38e8192.shtml","note":"第六条：旅馆接待旅客住宿必须登记，登记时应当查验旅客的身份证件；第七条：旅馆应当设置旅客财物保管箱、柜或者保管室、保险柜；第八条：旅馆对旅客遗留的物品应当妥为保管。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量；消费者享有人身、财产安全不受损害的权利，受到损害可以要求赔偿。"}]},{"id":"hotel-16","title":"第一次申请酒店发票与处理押金问题","merged_from":["第一次申请酒店发票","第一次处理酒店押金问题"],"tags":["住宿"],"cost":{"money":"开票不额外收费","time":"10—30 分钟","willpower":"低"},"evidence":"A","body":{"plain":"住宿费要发票是你的权利：收取款项的一方应当向付款方开具发票。押金是另一件事——它是担保不是消费，符合条件就应当及时退还。","steps":["退房时说“开一下发票”，提供单位名称和纳税人识别号；电子发票发到邮箱或手机。","通过平台预订的，看清是酒店开票还是平台开票。","押金没退：先问清退还方式、程序和时间，保留押金条、支付记录和订单截图。","符合条件仍被拖延或设置不合理条件，可向12315投诉或依法主张。"],"pitfalls":["开票信息填错要作废重开，当场核对一遍最快。","押金条别丢，它是主张退还押金最直接的凭证。"]},"sources":[{"name":"《中华人民共和国发票管理办法》（国务院令第764号，广东省税务局）","url":"https://guangdong.chinatax.gov.cn/gdsw/dgsw_gkwj/2023-10/20/content_a644a5a7b80c4e9ba704d8cba10a7bd8.shtml","note":"销售商品、提供服务的单位和个人，对外发生经营业务收取款项，收款方应当向付款方开具发票。"},{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"第二十条：经营者收取押金的，应当事先与消费者约定退还押金的方式、程序和时限，不得对退还押金设置不合理条件；符合条件应当及时退还。"}]},{"id":"hotel-a1","title":"第一次用自助入住机和手机开房门","merged_from":[],"tags":["酒店","住宿"],"cost":{"money":"0","time":"5 分钟","willpower":"低"},"evidence":"C","body":{"plain":"越来越多连锁酒店支持自助机办入住、手机蓝牙开锁。省时间，但身份核验这一步不会省：仍要刷身份证并做人脸比对。","steps":["在自助机刷身份证、按提示完成人脸核验，取房卡或电子房卡","手机开门要打开蓝牙与酒店 App/小程序，并在前台确认房间号","出门前确认房卡或电子钥匙能正常开门、能进电梯"],"pitfalls":["没在前台登记就找别人代刷开房是违规的，出问题无法举证","电子房卡依赖手机电量，长途旅行备一张实体卡更稳"]},"sources":[{"name":"国家市场监督管理总局","url":"https://www.samr.gov.cn/","note":"住宿业经营者应依法登记住宿旅客信息，具体操作以酒店与当地公安要求为准"}],"addition":true,"why":"连锁酒店越来越普遍，但大纲里没有这一环"},{"id":"hotel-a2","title":"第一次遇到到店无房（酒店超售）","merged_from":[],"tags":["酒店","维权"],"cost":{"money":"可能涉及差价","time":"1–3 小时","willpower":"中"},"evidence":"C","body":{"plain":"旺季到店被告知没房（超售）是常见事故。处理顺序：先要同档次替代方案，再谈差价，最后走平台与投诉渠道。","steps":["出示订单与支付记录，要求酒店给出书面说明","要求安排同档次或更高档次房间，明确差价由谁承担","通过预订平台客服留工单，别只在柜台口头交涉","协商不成可向市场监管部门或平台投诉，保留打车、住宿票据"],"pitfalls":["接受「自己再找一家」就走，后续维权缺凭证","把订单截图删掉，平台介入时会缺证据"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者应按约定提供商品或服务，未按约定提供应承担相应责任"}],"addition":true,"why":"到店无房是旺季常见事故，处理路径值得单独成条"},{"id":"hotel-a3","title":"第一次分清住宿发票的专票与普票","merged_from":[],"tags":["酒店","报销"],"cost":{"money":"0","time":"10 分钟","willpower":"低"},"evidence":"C","body":{"plain":"出差住宿报销，发票开错票种要作废重开。开票前先问公司财务：要增值税专用发票还是普通发票，抬头与税号是什么。","steps":["离店前确认开票信息：单位名称、纳税人识别号、地址电话、开户行账号","专票需要提供完整开票资料，普票只需名称与税号","核对票面金额、入住日期与订单一致","电子发票保存 PDF 原件，别只存截图"],"pitfalls":["先开了普票再想换专票，往往要作废重开甚至无法重开","票面项目与实际不符（写「餐饮」而不是「住宿」）会被财务退回"]},"sources":[{"name":"国家市场监督管理总局","url":"https://www.samr.gov.cn/","note":"经营者应按规定开具发票，具体票种与开票资料以税务部门与单位财务要求为准"}],"addition":true,"why":"开错票种要作废重开，是典型返工点"}],"additions":[],"_file":"03-酒店住宿篇.json","label":"酒店住宿篇"},{"section":"04 独立生活篇","source_count":70,"merged_count":30,"note":"原始 70 条中，「第一次住大学宿舍」归 07 学校与大学篇、「第一次停电」「第一次停水」归 18 安全与紧急情况篇，本篇不重复写；其余 67 条合并为 26 条。","entries":[{"id":"life-01","title":"第一次离开父母独立生活：先明白“没人管我了”是什么意思","merged_from":["第一次离开父母独立生活","第一次意识到“没人管我了”"],"tags":["生活"],"cost":{"money":"因人而异（房租+生活费是主要开支）","time":"长期","willpower":"中"},"evidence":"A","body":{"plain":"独立生活的分界线不是搬出去住，而是你成了完全民事行为能力人：签的合同自己认，交的费用自己扛，出事没人替你兜。","steps":["盘一遍每月固定支出：房租、水电网燃气、物业、交通、吃饭，算出一个底线数字。","把证件、银行卡、租房合同、缴费账号集中收好，重要文件拍照备份。","给自己定三条底线：不借高息贷款、不给陌生人转账、不签看不懂的合同。","遇到问题找对应责任方：房东、物业、社区、12345或12315。"],"pitfalls":["独立生活第一年最容易出问题的是钱和合同，不是做饭洗衣。","父母能帮的是建议，签字的还是你。"]},"sources":[{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"},{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"}]},{"id":"life-02","title":"第一次一个人住","merged_from":["第一次一个人住"],"tags":["生活"],"cost":{"money":"房租是最大开支","time":"长期","willpower":"中"},"evidence":"A","body":{"plain":"一个人住最大的变化是：安全、吃饭、作息都要自己安排。房子可以小，但门锁、燃气、电路必须可靠。","steps":["入住第一周做一次安全检查：门锁能否反锁、燃气有无异味、插座和电线有无老化、烟雾报警器是否可用。","把物业、房东、开锁、维修、社区电话存进手机；一个人住最好给一两个熟人留备用钥匙或告知住址。","养成出门前“水电气门窗”五件事过一遍的习惯。","做饭、用电、用燃气按设备说明来，发现火灾立即拨打119。"],"pitfalls":["一个人住最怕的是意外没人发现，和信任的人保持联系不是示弱。","不要在出租屋私拉电线、用大功率电器取暖，老房子的线路很容易扛不住。"]},"sources":[{"name":"《中华人民共和国消防法》","url":"http://www.npc.gov.cn/zgrdw//npc///xinwen/2019-05/07/content_2086831.htm","note":"任何单位、个人发现火灾都应当立即报警；住宅区的物业服务企业应当对管理区域内的共用消防设施进行维护管理，提供消防安全防范服务。"},{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"}]},{"id":"life-03","title":"第一次找房、找中介与看房","merged_from":["第一次找房","第一次联系房东","第一次联系中介","第一次看房","第一次检查房屋设施"],"tags":["生活","租房"],"cost":{"money":"中介费通常为半个月到一个月租金（各地与各机构不同）","time":"1—2 周","willpower":"高"},"evidence":"A","body":{"plain":"找房三步：定预算和通勤圈、约看房、验房。中介要有备案并公示收费；房东直租要核实房产证和身份证是不是同一人。","steps":["预算要把通勤时间算进去，别只看房租便宜。","约看房白天去一次、晚上再去一次，看采光、水压、下水、隔音和手机信号。","验房清单：水龙头水压、马桶冲水、热水器、空调、插座、门锁、窗户密封、墙面渗水。","问清费用：房租、押金、中介费、物业费、水电燃气费怎么算，谁承担维修；核对房东身份证和房产证。"],"pitfalls":["中介应当在经营场所公示营业执照、备案证明和收费标准。","厨房、卫生间、阳台和地下储藏室不得出租供人居住。"]},"sources":[{"name":"《房地产经纪管理办法》","url":"https://www.gov.cn/gongbao/content/2011/content_1918920.htm","note":"房地产经纪机构应当在经营场所醒目位置公示营业执照、备案证明、服务项目与收费标准、投诉电话；签订经纪服务合同前，应当向委托人说明合同内容并书面告知相关事项。"},{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"}]},{"id":"life-04","title":"第一次签租房合同","merged_from":["第一次签租房合同"],"tags":["生活","租房"],"cost":{"money":"一般不额外收费，注意押金数额","time":"30—60 分钟","willpower":"高"},"evidence":"A","body":{"plain":"租房合同是你在城市里最重要的一份合同。房租、押金、租期、维修责任、退租条件五项要写清楚，口头承诺不算。","steps":["核对出租人身份：房东本人的身份证加房产证；二房东要看他与房东的合同里是否允许转租。","写清五项条款：租金与支付方式、押金退还条件、租期与续租、维修责任、提前退租怎么处理。","把家具家电清单、已有损坏、水电燃气表起始读数写进合同附件，30日内可办理租赁登记备案。","交房租和押金走可留痕的方式，备注写明“X月房租/押金”。"],"pitfalls":["不要签没有双方身份信息和房屋地址的“合同”。","押金退还条件不写清楚，退租时最容易扯皮。"]},"sources":[{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"},{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"}]},{"id":"life-05","title":"第一次交房租和押金","merged_from":["第一次交房租","第一次交押金"],"tags":["生活","租房"],"cost":{"money":"押金通常为1个月租金（各地行情不同）","time":"15—30 分钟","willpower":"低"},"evidence":"A","body":{"plain":"房租是消费，押金是担保，性质不一样。押金是覆盖你可能的欠费或损坏，正常退租时应当返还，所以一定要留凭证。","steps":["签合同当天交押金，索要收据或在合同中写明“收到押金XX元”，并保留转账记录。","按月交租的，固定一个日期和一种支付方式，备注写清月份和房号。","每次交完租把截图存进一个固定相册或文件夹，避免一年后对不上账。","退租前提前核对：有无欠费、有无损坏、押金怎么退、多久到账。"],"pitfalls":["现金交押金一定要收据，转账一定要备注，这是退租时要回押金的唯一凭据。","房东以“墙面有痕迹”“正常磨损”为由扣押金，可以要求给出具体项目和金额。"]},"sources":[{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"},{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"}]},{"id":"life-06","title":"第一次合租与第一次整租","merged_from":["第一次合租","第一次整租"],"tags":["生活","租房"],"cost":{"money":"合租便宜但共享空间，整租贵但自由","time":"长期","willpower":"中"},"evidence":"A","body":{"plain":"合租是几个人分摊一套房，整租是你一个人承担整套。合租省钱但要共用空间、分摊费用；整租省心但更贵。","steps":["合租前确认：每人独立房间还是床位、水电燃气物业费怎么分、公共区域卫生怎么排。","合租最好各签各的合同或写清份额，钱不要只由一个人代收代付。","整租要确认宽带、燃气开户、门禁卡、车位是否包含在房租里。","合同里写清“最小出租单位是原设计房间”，避免住进隔断房。"],"pitfalls":["合租最大的坑是费用分摊没写清楚，一个月几十块的水电费能吵半年。","隔断房、群租房价格低，但安全和合规都有问题。"]},"sources":[{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"},{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"}]},{"id":"life-07","title":"第一次交水费","merged_from":["第一次交水费"],"tags":["生活","缴费"],"cost":{"money":"按用量计费，各地水价不同","time":"10—20 分钟","willpower":"低"},"evidence":"A","body":{"plain":"水费按抄表用量乘以当地水价计算，缴费周期一般是两个月或一个月。要弄清楚的是：你家水表在哪、是物业代收还是供水公司直收。","steps":["入住时记下水表读数并拍照，写进交接单。","搞清楚缴费方式：供水公司App或公众号、支付宝/微信生活缴费、物业代收。","绑定户号或地址后按时缴费，保留缴费记录。","发现账单明显异常（漏水、表被误抄），先自查家里有没有长流水，再联系供水公司或物业核对。"],"pitfalls":["用水单位和个人应当按时缴纳水费，欠费可能被停水。","停水一般应履行通知义务，遇到未通知就停水，可以先找供水公司或物业问明原因。"]},"sources":[{"name":"《城市供水条例》","url":"https://slt.fujian.gov.cn/xxgk/fggw/xzfg/202102/t20210208_5533872.htm","note":"第二十四条：用水单位和个人应当按照规定的计量标准和水价标准按时缴纳水费；条例对擅自停止供水、未履行停水通知义务的情形规定了责任。"},{"name":"《物业管理条例》","url":"http://xxgk.jlcity.gov.cn/gzbm/fcj_1/xbgkml/202009/t20200903_828790.html","note":"业主应当根据物业服务合同的约定交纳物业服务费用；物业服务企业应当按照合同约定提供服务。"}]},{"id":"life-08","title":"第一次交电费","merged_from":["第一次交电费"],"tags":["生活","缴费"],"cost":{"money":"居民生活用电实行阶梯电价","time":"10—20 分钟","willpower":"低"},"evidence":"A","body":{"plain":"居民电费按阶梯电价算：用得越多，超出部分的单价越高，分档和电价由各省制定。现在绝大多数地方可以在手机上交。","steps":["入住时记录电表读数并拍照；确认是“一户一表”还是物业代收。","在国家电网/南方电网的官方渠道或支付宝、微信生活缴费里绑定户号。","设置余额提醒或自动缴费，避免欠费停电。","电费突然变高先排查：空调、电热水器、取暖器是大头，也可能是抄表或计费问题。"],"pitfalls":["居民生活用电实行阶梯电价，分档电量和电价各省不同，别拿外省标准套自己家。","租房时如果电费由房东按“每度X元”代收，要看合同约定，明显高于当地电价的可以协商。"]},"sources":[{"name":"《关于居民生活用电试行阶梯电价的指导意见》（发改价格〔2011〕2617号）","url":"https://zfxxgk.ndrc.gov.cn/web/iteminfo.jsp?id=19692","note":"居民生活用电实行阶梯电价，分档电量与具体电价标准由各省（区、市）制定并公布。"},{"name":"《供电营业规则》（国家发展改革委令第14号）","url":"https://www.gov.cn/gongbao/2024/issue_11326/202405/content_6949617.html","note":"第六十条：供电企业应当改善供电可靠性，减少设备检修和电力系统事故对用户的停电次数及每次停电持续时间；新建居住区居民住宅供电设施按一户一表标准建设。"}]},{"id":"life-09","title":"第一次开燃气与交燃气费","merged_from":["第一次交燃气费","第一次开燃气"],"tags":["生活","缴费"],"cost":{"money":"开通可能有押金或工本费，各地不同","time":"1—3 天","willpower":"中"},"evidence":"A","body":{"plain":"新租房用燃气通常要走“开户—安检—通气”流程，不能自己动手接管。用户不得擅自拆改燃气设施。","steps":["确认房子有没有燃气户号，没有就带身份证和租赁合同到燃气公司营业厅或App申请开户。","预约上门安检和通气，工作人员检查管道、灶具和热水器，合格后才开通。","开通后在公众号或App缴费，记下燃气表读数。","闻到燃气味：不开灯、不打火、不打电话，先开窗关阀，到室外再报警或打抢修电话。"],"pitfalls":["用户不得擅自拆改燃气设施，改管道必须报燃气公司。","老旧灶具没有熄火保护、软管超期是常见隐患，通气时可以让师傅一并检查。"]},"sources":[{"name":"《城镇燃气管理条例》（国务院令第583号）","url":"https://www.gov.cn/zhengce/zhengceku/2010-11/25/content_5115.htm","note":"燃气经营者应当指导用户安全用气；用户应当遵守安全用气规则，不得擅自拆改燃气设施；发现燃气泄漏应当立即采取措施并报告。"},{"name":"《中华人民共和国消防法》","url":"http://www.npc.gov.cn/zgrdw//npc///xinwen/2019-05/07/content_2086831.htm","note":"任何单位、个人发现火灾都应当立即报警；住宅区的物业服务企业应当对管理区域内的共用消防设施进行维护管理，提供消防安全防范服务。"}]},{"id":"life-10","title":"第一次交物业费","merged_from":["第一次交物业费"],"tags":["生活","缴费"],"cost":{"money":"按建筑面积计算，各地标准不同","time":"15—30 分钟","willpower":"低"},"evidence":"A","body":{"plain":"物业费是买公共区域服务的钱：楼道保洁、电梯维保、绿化、门岗、公共照明。业主应当按物业服务合同的约定交纳。","steps":["入住时向物业确认收费标准、计费面积和缴费周期，索要收费依据。","确认是物业直收还是房东代收，租房时看清合同里物业费由谁承担。","通过物业App、公众号或前台缴费，保留发票或电子票据。","对服务不满意，先书面反映并留记录，再通过业主委员会、社区或12345反映，而不是直接拒交。"],"pitfalls":["物业费一般按建筑面积计，不是按套内面积，签约前问清楚。","拒交物业费解决不了服务问题，还可能被追缴，走投诉和协商渠道更有效。"]},"sources":[{"name":"《物业管理条例》","url":"http://xxgk.jlcity.gov.cn/gzbm/fcj_1/xbgkml/202009/t20200903_828790.html","note":"业主应当根据物业服务合同的约定交纳物业服务费用；物业服务企业应当按照合同约定提供服务。"},{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"}]},{"id":"life-11","title":"第一次自己买菜：菜市场与超市采购","merged_from":["第一次自己买菜","第一次去菜市场","第一次去超市采购"],"tags":["生活","吃饭"],"cost":{"money":"因人而异，菜市场通常更便宜","time":"30—60 分钟","willpower":"低"},"evidence":"A","body":{"plain":"买菜的核心是两件事：买多少、怎么放。一个人吃，最贵的不是单价，是买多了烂在冰箱里。","steps":["先想好这两三天要吃什么，按菜谱列清单再出门，避免看到什么买什么。","菜市场可以少量买、可以问价、可以挑；超市明码标价、有包装食品的标签信息更全。","挑菜看新鲜度：叶菜要挺、根茎要硬、鱼虾要闻起来没有异味；散装熟食少买。","回家按“先吃叶菜、后吃根茎”的顺序放冰箱，生熟分开，肉类分小份冷冻。"],"pitfalls":["超市里切好、洗好的净菜比散装贵不少，一个人吃可以自己处理。","不要囤太多，尤其是叶菜和豆制品，坏掉的钱比省下的多。"]},"sources":[{"name":"《中华人民共和国食品安全法》","url":"https://www.gov.cn/zhengce/2015-04/25/content_2853643.htm","note":"食品经营者应当保证食品安全；消费者因不符合食品安全标准的食品受到损害的，可以向经营者要求赔偿。"},{"name":"重庆市卫生健康委员会：《每日科普问答·对诺如病毒如何进行有效预防应对？》","url":"https://wsjkw.cq.gov.cn/ztzl_242/jkkp/202502/t20250221_14326014_zzb.html","note":"家庭预防肠道传染病的关键是保持环境清洁、做好卫生间等重点区域清洁与通风、饭前便后洗手。"}]},{"id":"life-12","title":"第一次下厨房：燃气灶、电饭煲与空气炸锅","merged_from":["第一次自己做饭","第一次煎鸡蛋","第一次炒菜","第一次煮面","第一次使用燃气灶","第一次使用电饭煲","第一次使用空气炸锅"],"tags":["生活","吃饭"],"cost":{"money":"自己做比外卖便宜","time":"30—60 分钟","willpower":"中"},"evidence":"A","body":{"plain":"第一次做饭不用会很多菜，先掌握四件事：燃气灶点火、煮饭、煮面、煎鸡蛋。这四样做熟，日常吃饭就解决了。","steps":["燃气灶：先按旋钮再打火，火没着就关上等几秒再试，人不要离开正在烧的锅。","电饭煲：米淘一遍，按内胆刻度加水，按下煮饭键，跳起来后焖几分钟。","煮面：水开下面，中途加一次凉水，面条浮起能夹断就熟了。","煎鸡蛋：锅烧热倒油、打蛋、转小火，蛋白凝固后加盐出锅；空气炸锅按说明预热，食材平铺、中途翻面。"],"pitfalls":["油锅起火千万不能用水浇，关火盖锅盖。","燃气灶、电饭煲、空气炸锅工作时人都不要离开。"]},"sources":[{"name":"《城镇燃气管理条例》（国务院令第583号）","url":"https://www.gov.cn/zhengce/zhengceku/2010-11/25/content_5115.htm","note":"燃气经营者应当指导用户安全用气；用户应当遵守安全用气规则，不得擅自拆改燃气设施；发现燃气泄漏应当立即采取措施并报告。"},{"name":"《中华人民共和国消防法》","url":"http://www.npc.gov.cn/zgrdw//npc///xinwen/2019-05/07/content_2086831.htm","note":"任何单位、个人发现火灾都应当立即报警；住宅区的物业服务企业应当对管理区域内的共用消防设施进行维护管理，提供消防安全防范服务。"},{"name":"广东省市场监督管理局《家电也有“保质期”？新国标实施，快自查你家有没有“超龄”电器》","url":"https://amr.gd.gov.cn/zwdt/tpzl/content/post_4843640.html","note":"《家用和类似用途电器的安全使用年限和再生利用通则》自2026年1月1日起实施，要求家电生产者标明家电安全使用年限。"}]},{"id":"life-13","title":"第一次洗碗和清理厨房","merged_from":["第一次洗碗","第一次清理厨房"],"tags":["生活","家务"],"cost":{"money":"洗涤剂和耗材成本很低","time":"20—40 分钟","willpower":"中"},"evidence":"C","body":{"plain":"厨房清洁的重点不是“擦干净”，而是别让油和食物残渣积累。做完饭顺手擦一遍，比一周大扫除一次省力得多。","steps":["洗碗按“先不油的、后油的”顺序：杯子、碗、盘、锅；洗完沥干再收。","灶台趁热擦，油污还没凝固的时候一抹就掉；油烟机滤网定期拆下来用热水加洗涤剂泡。","台面、水槽、垃圾桶周边是油污和细菌集中的地方，做完饭顺手擦干。","厨房垃圾当天倒掉，避免异味和招虫。"],"pitfalls":["洗碗布和海绵要定期更换或消毒，湿漉漉的抹布比碗更脏。","不要用同一个砧板又切生肉又切熟食，生熟分开是一句老话但确实有用。"]},"sources":[{"name":"重庆市卫生健康委员会：《每日科普问答·对诺如病毒如何进行有效预防应对？》","url":"https://wsjkw.cq.gov.cn/ztzl_242/jkkp/202502/t20250221_14326014_zzb.html","note":"家庭预防肠道传染病的关键是保持环境清洁、做好卫生间等重点区域清洁与通风、饭前便后洗手。"},{"name":"《北京市生活垃圾管理条例》","url":"https://www.bjrd.gov.cn/zyfb/zt/d15jrdcwhd16chy/hywjcwh16/202101/t20210128_2236930.html","note":"生活垃圾按厨余垃圾、可回收物、有害垃圾、其他垃圾四类投放；产生生活垃圾的单位和个人是分类投放的责任主体。"}]},{"id":"life-14","title":"第一次洗衣服：手洗、洗衣机、烘干机与晾晒","merged_from":["第一次洗衣服","第一次手洗衣服","第一次使用洗衣机","第一次使用烘干机","第一次晒衣服"],"tags":["生活","家务"],"cost":{"money":"洗衣液和电费都是小钱","time":"40—90 分钟","willpower":"中"},"evidence":"C","body":{"plain":"洗衣服搞清三件事：能不能机洗、会不会串色、会不会缩水。看不清标签就搜一下材质。","steps":["先看洗涤标签，按颜色分深浅，内衣袜子单独洗。","洗衣机：衣物别塞太满，洗衣液按刻度加，选普通洗；第一次用先空转看漏不漏水。","手洗：温水加洗衣液泡十几分钟，重点搓领口袖口，漂洗到没泡沫。","晾晒：深色衣服翻面阴干防掉色，针织衫平铺防变形。","烘干机：看清能不能烘，选低温档，毛衣和化纤别高温烘。"],"pitfalls":["红色、深蓝色新衣服第一次单独洗，串色是洗坏衣服最常见的原因。","洗衣机滤网和胶圈要定期清理，不然衣服洗完有味道。"]},"sources":[{"name":"广东省市场监督管理局《家电也有“保质期”？新国标实施，快自查你家有没有“超龄”电器》","url":"https://amr.gd.gov.cn/zwdt/tpzl/content/post_4843640.html","note":"《家用和类似用途电器的安全使用年限和再生利用通则》自2026年1月1日起实施，要求家电生产者标明家电安全使用年限。"},{"name":"《部分商品修理更换退货责任规定》（国家市场监督管理总局）","url":"https://www.samr.gov.cn/zw/zfxxgk/zc/xzgfxwj/art/2019/art_f943e66de125437d92df701e1654c47c.html","note":"第八条：三包有效期自开具发票之日起计算；第九条：产品自售出之日起7日内发生性能故障，消费者可以选择退货、换货或者修理。"}]},{"id":"life-15","title":"第一次换床单和晒被子","merged_from":["第一次换床单","第一次晒被子"],"tags":["生活","家务"],"cost":{"money":"几乎不花钱","time":"20—40 分钟","willpower":"低"},"evidence":"C","body":{"plain":"换床单是四件东西：床单、被套、枕套，加上床垫保护垫（如果有）。晒被子则是除潮除味，不是杀菌仪式。","steps":["先把旧床单被套拆下来直接放进洗衣机，避免顺手又铺回去。","床单从床尾开始对角包角，四个角都塞进床垫下，睡起来才不跑。","被套用“翻面套法”：先把被芯平铺、被套反着铺上去，从开口处把被芯卷进去再翻出来。","枕套直接套，拍松枕头。被子天气好时晾晒两三个小时，拍打后收进来。"],"pitfalls":["换下来的床品要当天洗，堆着容易返潮发味。","被子不要长时间暴晒，化纤被和羽绒被晒久了会变脆。"]},"sources":[{"name":"广东省市场监督管理局《家电也有“保质期”？新国标实施，快自查你家有没有“超龄”电器》","url":"https://amr.gd.gov.cn/zwdt/tpzl/content/post_4843640.html","note":"《家用和类似用途电器的安全使用年限和再生利用通则》自2026年1月1日起实施，要求家电生产者标明家电安全使用年限。"},{"name":"重庆市卫生健康委员会：《每日科普问答·对诺如病毒如何进行有效预防应对？》","url":"https://wsjkw.cq.gov.cn/ztzl_242/jkkp/202502/t20250221_14326014_zzb.html","note":"家庭预防肠道传染病的关键是保持环境清洁、做好卫生间等重点区域清洁与通风、饭前便后洗手。"}]},{"id":"life-16","title":"第一次清洁卫生间与疏通下水道","merged_from":["第一次清洁卫生间","第一次清理下水道"],"tags":["生活","家务"],"cost":{"money":"清洁剂几十元，疏通器更便宜","time":"30—60 分钟","willpower":"中"},"evidence":"C","body":{"plain":"卫生间清洁的顺序是：先清台面和镜面，再刷马桶，最后拖地——从干净的地方往脏的地方走，省得来回返工。","steps":["戴手套，开窗或开排风扇通风，清洁剂不要随意混用（尤其是含氯和含酸的）。","台面、镜子用湿布擦后再用干布擦亮；马桶内壁用马桶刷加洁厕剂，静置几分钟再刷。","地漏和下水口的头发先用手或夹子清出来，再倒疏通剂或用疏通器；倒完按说明用热水冲。","最后拖地、擦干地面，把垃圾和用过的抹布一起处理掉。"],"pitfalls":["洁厕灵和84消毒液混用会产生有毒气体，绝对不要混。","下水道反复堵要找物业或维修师傅看管道，光靠疏通剂治标不治本。"]},"sources":[{"name":"重庆市卫生健康委员会：《每日科普问答·对诺如病毒如何进行有效预防应对？》","url":"https://wsjkw.cq.gov.cn/ztzl_242/jkkp/202502/t20250221_14326014_zzb.html","note":"家庭预防肠道传染病的关键是保持环境清洁、做好卫生间等重点区域清洁与通风、饭前便后洗手。"},{"name":"《物业管理条例》","url":"http://xxgk.jlcity.gov.cn/gzbm/fcj_1/xbgkml/202009/t20200903_828790.html","note":"业主应当根据物业服务合同的约定交纳物业服务费用；物业服务企业应当按照合同约定提供服务。"}]},{"id":"life-17","title":"第一次倒垃圾、垃圾分类与换垃圾袋","merged_from":["第一次倒垃圾","第一次垃圾分类","第一次换垃圾袋"],"tags":["生活","家务"],"cost":{"money":"免费","time":"5—15 分钟","willpower":"低"},"evidence":"A","body":{"plain":"垃圾分类是各地条例规定的义务：一般分为厨余垃圾、可回收物、有害垃圾、其他垃圾四类。具体投放时间和地点，看你所在小区的规定。","steps":["先确认你所在城市和小区的要求：有的定时定点投放，有的小区有集中垃圾房。","家里至少准备两个桶：厨余和其他；有害垃圾（电池、灯管、药品）单独攒，投到指定回收点。","倒垃圾时把袋口扎紧，厨余垃圾尽量沥干水分，避免漏汤。","换垃圾袋时顺手擦一下桶底，垃圾桶定期清洗。"],"pitfalls":["不要图省事把电池、灯管混进其他垃圾，这类有害垃圾要单独投放。","分类错了被劝导是常事，第一次不知道就看一下垃圾房墙上的分类指引。"]},"sources":[{"name":"《北京市生活垃圾管理条例》","url":"https://www.bjrd.gov.cn/zyfb/zt/d15jrdcwhd16chy/hywjcwh16/202101/t20210128_2236930.html","note":"生活垃圾按厨余垃圾、可回收物、有害垃圾、其他垃圾四类投放；产生生活垃圾的单位和个人是分类投放的责任主体。"},{"name":"重庆市卫生健康委员会：《每日科普问答·对诺如病毒如何进行有效预防应对？》","url":"https://wsjkw.cq.gov.cn/ztzl_242/jkkp/202502/t20250221_14326014_zzb.html","note":"家庭预防肠道传染病的关键是保持环境清洁、做好卫生间等重点区域清洁与通风、饭前便后洗手。"}]},{"id":"life-18","title":"第一次买清洁用品和生活用品","merged_from":["第一次买清洁用品","第一次买生活用品"],"tags":["生活","消费"],"cost":{"money":"首批采买通常两三百元","time":"1—2 小时","willpower":"低"},"evidence":"C","body":{"plain":"刚搬进新家，别想着一次买齐。分两批最省钱：第一批是“今晚就要用的”，第二批是“住下来才发现要的”。","steps":["清洁用品首批：洗洁精、洗衣液、抹布、拖把、垃圾袋、马桶刷、洁厕剂、手套。","生活用品首批：纸巾、洗漱用品、拖鞋、衣架、水杯、床上四件套、插线板。","按需买，先算用量再囤货；纸巾、洗衣液这类大包装适合囤，清洁剂和药品类别囤太多。","电器和家居小物认准有正规厂名厂址和3C认证的产品，留好发票。"],"pitfalls":["大促囤货看着便宜，很多人搬家时才发现一半没用完。","便宜到离谱的插线板、充电器是火灾隐患，别在这上面省钱。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量、明码标价；消费者享有人身、财产安全不受损害的权利，受到损害可以依法要求赔偿。"},{"name":"《部分商品修理更换退货责任规定》（国家市场监督管理总局）","url":"https://www.samr.gov.cn/zw/zfxxgk/zc/xzgfxwj/art/2019/art_f943e66de125437d92df701e1654c47c.html","note":"第八条：三包有效期自开具发票之日起计算；第九条：产品自售出之日起7日内发生性能故障，消费者可以选择退货、换货或者修理。"}]},{"id":"life-19","title":"第一次买家具、买家电与安装组装","merged_from":["第一次买家具","第一次买家电","第一次安装家具","第一次组装桌子","第一次独自购买家具"],"tags":["生活","消费"],"cost":{"money":"家具家电是搬家最大的一笔支出","time":"半天到数天","willpower":"中"},"evidence":"A","body":{"plain":"买家具家电有三件事比价格重要：尺寸能不能进门、包不包安装、售后找谁。装不上、进不了电梯就是白买。","steps":["量三次尺寸：房间可用面积、门口和电梯尺寸、楼梯转角宽度。","下单前问清包不包安装、送货上几楼、有无电梯费和组装费。","家电看清能效标识、容量和安装条件，需要打孔改管的提前确认。","留好发票和三包凭证；家电安全使用年限看生产者标注。自己组装家具先清点配件，螺丝先别拧死。"],"pitfalls":["三包有效期自开具发票之日起计算，售出7日内发生性能故障可退换修。","组装家具装错了很难拆，宁可按说明多花半小时。"]},"sources":[{"name":"《部分商品修理更换退货责任规定》（国家市场监督管理总局）","url":"https://www.samr.gov.cn/zw/zfxxgk/zc/xzgfxwj/art/2019/art_f943e66de125437d92df701e1654c47c.html","note":"第八条：三包有效期自开具发票之日起计算；第九条：产品自售出之日起7日内发生性能故障，消费者可以选择退货、换货或者修理。"},{"name":"广东省市场监督管理局《家电也有“保质期”？新国标实施，快自查你家有没有“超龄”电器》","url":"https://amr.gd.gov.cn/zwdt/tpzl/content/post_4843640.html","note":"《家用和类似用途电器的安全使用年限和再生利用通则》自2026年1月1日起实施，要求家电生产者标明家电安全使用年限。"}]},{"id":"life-20","title":"第一次换灯泡、修水龙头与处理漏水","merged_from":["第一次换灯泡","第一次修水龙头","第一次处理漏水","第一次叫维修师傅"],"tags":["生活","家务"],"cost":{"money":"灯泡几元到几十元，师傅上门几十到上百元","time":"30 分钟—半天","willpower":"中"},"evidence":"A","body":{"plain":"家里的小故障分两类：能自己动手的（换灯泡、拧水龙头）和必须叫人的（电路、燃气、管道）。分清楚能省钱也能保命。","steps":["换灯泡：先关灯断开关，等旧灯泡冷却再拧下来，按原瓦数和口径买新的。","水龙头滴水多半是阀芯或密封圈老化，关掉角阀再拆，拧不动别硬拧。","漏水先关总阀或角阀，接住水再判断是软管、接口还是管道的问题。","涉及电路、燃气、主水管、墙体渗水的直接叫物业或师傅；叫前拍好视频，问清上门费和收费标准。"],"pitfalls":["带电、带气的活都不要自己上。","上门维修前先谈好价格和是否保修，避免拆完再加价。"]},"sources":[{"name":"《物业管理条例》","url":"http://xxgk.jlcity.gov.cn/gzbm/fcj_1/xbgkml/202009/t20200903_828790.html","note":"业主应当根据物业服务合同的约定交纳物业服务费用；物业服务企业应当按照合同约定提供服务。"},{"name":"《供电营业规则》（国家发展改革委令第14号）","url":"https://www.gov.cn/gongbao/2024/issue_11326/202405/content_6949617.html","note":"第六十条：供电企业应当改善供电可靠性，减少设备检修和电力系统事故对用户的停电次数及每次停电持续时间；新建居住区居民住宅供电设施按一户一表标准建设。"}]},{"id":"life-21","title":"第一次家里断网","merged_from":["第一次家里断网"],"tags":["生活"],"cost":{"money":"报修免费，换设备可能要钱","time":"30 分钟—2 天","willpower":"中"},"evidence":"A","body":{"plain":"断网先别急着骂运营商，八成问题出在自己家：路由器死机、网线松了、欠费停机。按顺序排查能省一次等待。","steps":["先看光猫和路由器的指示灯：电源、光信号、网络灯，哪个不亮或变红，问题就在哪一段。","把光猫和路由器断电重启，等两分钟再开；检查网线和电源有没有松动。","用手机流量查一下宽带账号是否欠费、是否到期。","以上都正常还是上不了网，打运营商客服报修，记下工单号；对处理结果不满意可以走电信用户申诉渠道。"],"pitfalls":["客服电话先问清“是否收费、什么时候上门”，避免白等一天。","路由器用了四五年、发热严重、频繁掉线的，换一台比反复报修省事。"]},"sources":[{"name":"《电信用户申诉处理办法》（工业和信息化部）","url":"https://www.gov.cn/zhengce/2022-08/23/content_5722711.htm","note":"用户对电信业务经营者的处理结果不满意，或者经营者未在规定时限内答复的，可以向电信用户申诉受理机构提出申诉。"},{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"经营者提供商品或者服务应当保证质量、明码标价；消费者享有人身、财产安全不受损害的权利，受到损害可以依法要求赔偿。"}]},{"id":"life-22","title":"第一次钥匙忘在屋里、钥匙丢失与找开锁师傅","merged_from":["第一次钥匙忘在屋里","第一次钥匙丢失","第一次找开锁师傅"],"tags":["生活","安全"],"cost":{"money":"开锁几十到几百元不等","time":"30—90 分钟","willpower":"中"},"evidence":"A","body":{"plain":"钥匙忘在屋里或丢了，最稳的是找有备案的正规开锁师傅，并准备好证明你是这间房子住户的材料。","steps":["先找备用钥匙：自己有没有放在公司、朋友或邻居那里，物业是否代管。","找师傅走正规渠道：物业推荐、公安机关公布的备案名单，或有备案信息的平台商家。","师傅上门会查验身份并登记，你要准备身份证和能证明居住的材料（租赁合同、水电缴费记录）。","开锁后建议当场换锁芯，尤其是钥匙丢在外面的时候。"],"pitfalls":["楼道、门上贴的开锁小广告不要随便打。","开锁时要求登记并留联系方式是有依据的，拒绝登记的要提高警惕。"]},"sources":[{"name":"沈阳市公安局：《开锁业经营应当遵守的规定》","url":"https://gaj.shenyang.gov.cn/bmfw/zagl/202504/t20250404_4832192.html","note":"从事开锁业经营活动应当经公安机关备案并由公安机关向社会公布经营者名单；开锁应当查验并登记委托人身份信息，由见证人、开锁技术人员分别签名、注明联系方式并留存备查。"},{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"}]},{"id":"life-23","title":"第一次和邻居打交道、和物业沟通与处理噪音","merged_from":["第一次和邻居打交道","第一次和物业沟通","第一次处理噪音问题"],"tags":["生活","邻里"],"cost":{"money":"基本不花钱","time":"多次沟通","willpower":"高"},"evidence":"A","body":{"plain":"邻里纠纷里最常见的是噪音。处理顺序是：先自己确认、再友好沟通、再找物业或社区、最后才是投诉举报。越往后越需要证据。","steps":["先确认噪音来源和时间规律，记录几天，别一上来就认定是楼上。","第一次沟通选对方方便的时间，说事实和影响，不说“你这个人怎么这样”。","沟通无效找物业或社区居委会调解，把之前的记录给他们看。","持续扰民可以拨打12345或向公安、生态环境部门反映；社会生活噪声纠纷可以通过协商、调解等途径解决。"],"pitfalls":["半夜敲门理论最容易被激化成冲突，白天说比半夜说有用得多。","上门沟通最好有人陪同或提前告知物业，避免各说各话。"]},"sources":[{"name":"《中华人民共和国噪声污染防治法》","url":"http://www.npc.gov.cn/npc//c2/c30834/202112/t20211224_315601.html","note":"对邻里之间因社会生活噪声产生的纠纷，规定可以通过协商、调解等途径解决，也可向有关部门投诉举报。"},{"name":"《物业管理条例》","url":"http://xxgk.jlcity.gov.cn/gzbm/fcj_1/xbgkml/202009/t20200903_828790.html","note":"业主应当根据物业服务合同的约定交纳物业服务费用；物业服务企业应当按照合同约定提供服务。"}]},{"id":"life-24","title":"第一次退租与拿回租房押金","merged_from":["第一次退租","第一次拿回租房押金"],"tags":["生活","租房"],"cost":{"money":"押金通常1个月租金","time":"半天到数周","willpower":"高"},"evidence":"A","body":{"plain":"退租的关键是按合同来、留痕迹。租期届满要返还房屋，返还时符合按约定使用后的状态——正常磨损不算损坏。","steps":["提前按合同约定的时间通知房东，确认退租日期和交接方式。","交接前打扫干净，把家电家具恢复到清单上的状态，拍一套带时间的照片和视频。","交接时一起抄水电燃气表读数，结清费用，双方在交接单上签字。","要求押金按约定方式和时限退还，走转账并保留记录；被无理克扣可要求说明具体项目和金额。"],"pitfalls":["退租当天一定要拿到书面交接凭证，口头说“过几天转你”最容易拖。","押金退还方式和时限最好在签约时就写进合同。"]},"sources":[{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"},{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"}]},{"id":"life-25","title":"第一次搬家、打包全部家当与寄大件行李","merged_from":["第一次搬家","第一次打包全部家当","第一次寄大件行李"],"tags":["生活"],"cost":{"money":"同城搬家几百元，跨城看距离和重量","time":"1—3 天","willpower":"高"},"evidence":"A","body":{"plain":"搬家分自己搬和找人搬：自己搬省钱但累，找人搬要谈清价格和赔付；大件行李走快递，要看尺寸重量和保价。","steps":["提前一周打包，按“最后用的先装”排序，箱上写房间和内容。","易碎品单独包；证件、现金、首饰、电子设备随身带，不进纸箱。","找搬家公司问清起步价、楼层费、有无电梯、拆装费、超公里费，写进订单或聊天记录。","寄大件先量尺寸称重量，问清上限、是否上门取件和保价；搬完结清费用并变更各平台地址。"],"pitfalls":["最贵的不是运费，是“到楼下再加价”，价格要提前写清。","寄大件要如实填写物品名称，禁寄、限寄物品不要寄。"]},"sources":[{"name":"《快递暂行条例》（国务院令第697号）","url":"http://www.gov.cn/zhengce/content/2018-03/27/content_5277801.htm","note":"经营快递业务的企业应当按约定时限投递快件，并告知收件人当面验收；寄件人应当如实填写运单，遵守禁止、限制寄递物品的规定。"},{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"}]},{"id":"life-26","title":"第一次独立安排生活费与规划一个月开支","merged_from":["第一次独立安排自己的生活费","第一次一个月自己规划开支"],"tags":["生活","钱"],"cost":{"money":"因人而异（房租+吃饭占大头）","time":"每月 1—2 小时","willpower":"中"},"evidence":"A","body":{"plain":"自己管钱的第一步不是省钱，是知道钱去哪了。把支出分成固定（房租、水电、通勤）和浮动（吃饭、社交、购物），先保固定再管浮动。","steps":["第一个月先记账不设限，看看真实花销，再定预算。","把固定支出单独放一张卡或一个账户，发工资先划走，剩下的才是可花的钱。","给浮动支出设一个上限，超了就砍娱乐和购物，别动吃饭和交通。","留一笔应急钱，目标是覆盖一到三个月的固定支出；不用信用卡和网贷去填日常消费的窟窿。"],"pitfalls":["最常见的失控是“先花后还”：分期和最低还款看着轻松，越滚越大。","记账不用记到分，抓住房租、吃饭、交通、网购这四项就能看出问题。"]},"sources":[{"name":"《中华人民共和国民法典》全文（新华社受权发布，北京市人大常委会转载）","url":"http://www.bjrd.gov.cn/zyfb/zt/13jqgrd3chybjdbtzt/1303bjtwjbg/202101/t20210111_2214501.html","note":"第十八条：成年人为完全民事行为能力人，可以独立实施民事法律行为；第七百零三条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同；第七百三十三条：租赁期限届满，承租人应当返还租赁物。"},{"name":"《商品房屋租赁管理办法》（住房和城乡建设部令第6号）","url":"https://www.gov.cn/gongbao/content/2011/content_1845070.htm","note":"第八条：出租住房应以原设计的房间为最小出租单位，人均租住建筑面积不得低于当地政府规定的最低标准，厨房、卫生间、阳台和地下储藏室不得出租供人员居住；第九条：出租人应按合同约定履行维修义务；第十一条：转租须经出租人书面同意；第十四条：租赁合同订立后30日内办理房屋租赁登记备案。"}]},{"id":"life-a1","title":"第一次办宽带装机与路由器设置","merged_from":[],"tags":["独立生活","网络"],"cost":{"money":"几百元/年","time":"1–3 天","willpower":"低"},"evidence":"B","body":{"plain":"搬进新家第一件事往往是装宽带：先确认小区能进哪家运营商，再约装、拉线、设 WiFi。合同期与拆机费一定要问清。","steps":["先问物业或邻居：本楼已覆盖哪几家运营商、能不能装","比价时看的是「年费 + 是否需买光猫/路由器 + 合约期 + 违约金」","约装当天确认入户方式（明线/暗管）、测速留截图","装完立刻改路由器管理密码和 WiFi 密码，别用默认密码"],"pitfalls":["被「免费升级」绑了两年合约，搬家时赔违约金","只测一次速就签字，后续不达标难主张"]},"sources":[{"name":"工业和信息化部（电信服务与用户权益）","url":"https://www.miit.gov.cn/","note":"电信服务与用户权益保护由工业和信息化主管部门监管，具体资费与合约以运营商合同为准"}],"addition":true,"why":"大纲有「第一次家里断网」，却没有「第一次装宽带」，而后者是搬新家绕不开的"},{"id":"life-a2","title":"第一次给出租屋做安全自查（燃气、电路、门锁）","merged_from":[],"tags":["独立生活","安全"],"cost":{"money":"0–几百元","time":"1 小时","willpower":"中"},"evidence":"A","body":{"plain":"一个人住的风险集中在三件事：燃气泄漏、电路超载、门锁不安全。入住第一周就该查一遍，发现隐患及时要求房东整改。","steps":["燃气：闻味、看胶管是否老化、灶具是否有熄火保护，装一个燃气报警器","电路：确认漏保开关有效，别用「一插多」大功率取暖器","门锁：确认是否为可技术开启的 A 级锁，争取换 B 级以上锁芯","把发现的问题书面发给房东，保留聊天记录"],"pitfalls":["燃气胶管和直排式热水器是出租屋最致命的两处隐患","把多个大功率电器插在一个插线板上，是冬季火灾主因之一"]},"sources":[{"name":"《中华人民共和国消防法》（2021 修正）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202307/t20230726_3207767.html","note":"《消防法》规定单位与个人有维护消防安全、保护消防设施、报告火警的义务"}],"addition":true,"why":"一个人住的真实风险集中在燃气、电路和老旧门锁，比会不会做饭重要得多"},{"id":"life-a3","title":"第一次和室友分摊水电网费","merged_from":[],"tags":["独立生活","合租"],"cost":{"money":"每月几十到几百元","time":"10 分钟","willpower":"中"},"evidence":"C","body":{"plain":"合租最容易起矛盾的就是钱：水电网燃气怎么分。趁关系好时先定规则，比事后算账容易得多。","steps":["入住前约定分摊方式：按人头平摊，还是按房间面积/使用量","约定由谁代缴、每月几号结算、用哪个工具记账","把规则写在合租协议或群里，保留转账记录","耗电差异大的设备（取暖器、矿机）单独约定"],"pitfalls":["只口头说「到时候再说」，第一个月账单出来就尴尬","代缴的人垫付后不收据，时间一长算不清"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"民事活动应遵循公平与诚实信用原则，合租费用分摊以各方约定为准"}],"addition":true,"why":"合租的高频矛盾点，大纲只写到「第一次合租」"},{"id":"life-a4","title":"第一次交取暖费（北方集中供暖）","merged_from":[],"tags":["独立生活","北方"],"cost":{"money":"每平米十几到三十元","time":"10 分钟","willpower":"低"},"evidence":"C","body":{"plain":"北方的取暖费是每年一笔固定大额支出，通常在供暖季前缴纳（多为 10—11 月），按建筑面积或使用面积计费。","steps":["问清本地计费方式（按面积还是按热量）、单价与缴费截止日","确认由房东还是租客承担，写进租房合同","通过供热公司官方渠道缴费，保留凭证","供暖期内温度不达标，向供热公司报修并留记录"],"pitfalls":["租房时没约定取暖费归属，供暖季前临时扯皮","欠费可能影响供暖甚至影响个人信用记录（部分地区）"]},"sources":[{"name":"中国政府网（政策与价格管理入口）","url":"https://www.gov.cn/zhengce/","note":"供热价格与供暖服务由地方政府价格主管部门与供热单位管理，具体标准以当地公告为准"}],"addition":true,"why":"北方租房的一笔固定大额支出，南方读者可跳过"}],"additions":[],"_file":"04-独立生活篇.json","label":"独立生活篇"},{"section":"05 金钱篇","source_count":70,"merged_count":24,"entries":[{"id":"money-01","title":"第一次去银行开卡：Ⅰ类户、Ⅱ类户与手机银行","merged_from":["第一次拥有自己的银行卡","第一次去银行办卡","第一次开通手机银行"],"tags":["金钱","银行","开户"],"cost":{"money":"一般 0 元；部分银行收工本费或年费，以网点公示为准","time":"1 小时左右（含排队）","willpower":"低"},"evidence":"A","body":{"plain":"银行卡不是「办一张卡」这么简单。同一个人在同一家银行只能有一个Ⅰ类户，也就是能大额收支、能绑各种业务的主账户；再开的通常是Ⅱ、Ⅲ类户，额度小得多。办卡当天顺手把手机银行开通，后面转账、查流水、挂失都在手机上办。","steps":["带身份证去网点（有的银行可线上预约取号），跟大堂经理说要开个人结算账户。","现场确认开Ⅰ类户还是Ⅱ类户；这家银行你已有Ⅰ类户的话，就只能开Ⅱ、Ⅲ类。","设置取款密码和手机银行登录密码，绑定本人实名手机号。","当场下载银行 App，登一次、查一次余额，确认能用再走。"],"pitfalls":["别把卡借给别人收款，也别帮陌生人「走一下账」，这类账户很容易被用于诈骗并被公安冻结。","长期不动的账户可能被收小额账户管理费，问清有没有免费条件。","办卡时被推销的理财和信用卡可以拒绝，不影响开卡。"]},"sources":[{"name":"《人民币银行结算账户管理办法》（中国人民银行令〔2003〕第5号）","url":"https://www.pbc.gov.cn/tiaofasi/144941/144957/2817125/index.html","note":"第二章「开立」；个人凭有效身份证件以实名开立银行结算账户（页面可检索到「银行结算账户」）"},{"name":"《中国人民银行关于加强支付结算管理防范电信网络新型违法犯罪有关事项的通知》（银发〔2016〕261号）","url":"https://www.jsjrb.gov.cn/art/2016/10/21/art_34_25394.html","note":"原文第2条：个人通过自助柜员机转账（向非本人同行账户），发卡行在受理24小时后办理资金转账，24小时内可申请撤销；同文规定个人银行账户分类（Ⅰ、Ⅱ、Ⅲ类户）"}]},{"id":"money-02","title":"第一次存取现金、打流水与开存款证明","merged_from":["第一次取现金","第一次存现金","第一次看银行流水","第一次打印银行流水","第一次办理存款证明","第一次办理收入证明"],"tags":["金钱","银行","证明"],"cost":{"money":"柜台办理多为免费；补打历史流水可能收费","time":"30 分钟到 1 小时","willpower":"低"},"evidence":"A","body":{"plain":"存取现金在柜台和 ATM 都能办，但金额一大就会碰到反洗钱规则：单日现金收支到一定数额，银行要按规定上报，这是制度要求，不是针对你。流水和存款证明则是办签证、贷款、租房时最常被要的材料，带公章的版本只能去柜台办。","steps":["大额取现要提前预约，跨行取现注意手续费和单笔上限。","存现金后核对回单上的金额、账号、日期，票据留到余额确认无误。","手机银行和自助机可以先打流水，需要用章的去柜台办。","开存款证明、收入证明要说明用途和收款方，通常当场出。","收好原件，很多机构只要原件不要复印件。"],"pitfalls":["单日现金收支人民币 5 万元以上，金融机构会按规定做反洗钱报告；不用紧张，但也别为了避开它故意拆成多笔。","存款证明一般要冻结对应金额一段时间，开之前想清楚这笔钱这期间能不能动。","流水上有你的全部收支记录，转给别人前先遮掉无关部分。"]},"sources":[{"name":"《金融机构大额交易和可疑交易报告管理办法》（中国人民银行令〔2016〕第3号）","url":"https://www.pbc.gov.cn/fxqzhongxin/3558093/3558113/3561784/index.html","note":"第五条：当日单笔或累计现金收支人民币5万元以上、非自然人账户划转200万元以上等，金融机构须报告"},{"name":"《存款保险条例》（国务院令第660号）第五条","url":"https://www.gov.cn/zhengce/zhengceku/2015-03/31/content_9562.htm","note":"第五条原文：存款保险实行限额偿付，最高偿付限额为人民币50万元"}]},{"id":"money-03","title":"第一次转账：跨行、大额与限额","merged_from":["第一次转账","第一次跨行转账","第一次大额转账","第一次遇到银行卡限额"],"tags":["金钱","银行","转账"],"cost":{"money":"多数手机银行跨行转账免手续费；柜面大额按银行标准","time":"几分钟到半天","willpower":"低"},"evidence":"A","body":{"plain":"手机银行转账基本秒到，但「限额」是按账户和渠道分开设的：Ⅰ类户、手机银行、柜面，额度各不相同。真的大额转账，最省事的是去柜面办，或者提前在 App 里把限额调上去。","steps":["先在手机银行查「转账限额」，确认单笔和单日各是多少。","给新收款人第一次转账，先转一块钱试，确认姓名卡号对得上再转全额。","跨行大额可走大额支付系统，工作时间内通常几分钟到账，非工作时间顺延。","转完保存电子回单，写清时间、金额、对方账号。","限额不够就带身份证去柜面办，柜面一般不受手机端限额限制。"],"pitfalls":["在自助柜员机向非本人同行账户转账，发卡行要等受理 24 小时后才办理资金转账，24 小时内可以申请撤销；急着到账别用 ATM。","收款人姓名和卡号必须完全一致，写错会退回，可能拖好几天。","别在公共 Wi-Fi 下做大额转账，也别把验证码告诉任何自称银行客服的人。"]},"sources":[{"name":"《中国人民银行关于加强支付结算管理防范电信网络新型违法犯罪有关事项的通知》（银发〔2016〕261号）","url":"https://www.jsjrb.gov.cn/art/2016/10/21/art_34_25394.html","note":"原文第2条：个人通过自助柜员机转账（向非本人同行账户），发卡行在受理24小时后办理资金转账，24小时内可申请撤销；同文规定个人银行账户分类（Ⅰ、Ⅱ、Ⅲ类户）"},{"name":"《金融机构大额交易和可疑交易报告管理办法》（中国人民银行令〔2016〕第3号）","url":"https://www.pbc.gov.cn/fxqzhongxin/3558093/3558113/3561784/index.html","note":"第五条：当日单笔或累计现金收支人民币5万元以上、非自然人账户划转200万元以上等，金融机构须报告"}]},{"id":"money-04","title":"第一次改密码、挂失、补卡与销户","merged_from":["第一次修改银行卡密码","第一次银行卡挂失","第一次补银行卡","第一次注销银行卡"],"tags":["金钱","银行","挂失"],"cost":{"money":"挂失和补卡一般收工本费，各银行标准不同","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"卡丢了第一件事是挂失，不是等找到。挂失分临时和正式：临时挂失大多能在手机银行或客服电话上做，先把资金冻住；正式挂失、补卡和销户都要走柜台。销户前要把绑定的代扣代发全部清掉，不然会有一堆后续麻烦。","steps":["发现卡丢了，立刻用手机银行或客服电话做临时挂失。","带身份证去网点办正式挂失和补卡，卡号一般会变，需要重新绑定。","改密码在柜台或自助机办；忘记原密码要本人带证件重置。","销户前问清有没有绑定的代扣、代发工资、贷款还款，逐个解约。","销户当场拿回单，剪掉旧卡的磁条和芯片。"],"pitfalls":["挂失后原卡又找到了，要先解挂才能继续用。","补卡换号以后，绑定的水电代扣和 App 快捷支付都要重新设一遍。","有未结清的贷款或信用卡欠款时销户会被拒绝，先结清。"]},"sources":[{"name":"《人民币银行结算账户管理办法》（中国人民银行令〔2003〕第5号）","url":"https://www.pbc.gov.cn/tiaofasi/144941/144957/2817125/index.html","note":"第二章「开立」；个人凭有效身份证件以实名开立银行结算账户（页面可检索到「银行结算账户」）"},{"name":"《银行保险机构消费者权益保护管理办法》（银保监会令2022年第9号）","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"规定银行保险机构在营销宣传、收费、理赔、投诉处理等环节的消费者保护义务"}]},{"id":"money-05","title":"第一次办信用卡：账单日、还款日与最低还款额","merged_from":["第一次使用信用卡","第一次申请信用卡"],"tags":["金钱","信用卡","征信"],"cost":{"money":"年费按卡种；按时全额还款不产生利息","time":"申请到发卡约一周到一个月","will
