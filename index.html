再表白。被表白时也不必当场给答案。","steps":["先制造自然的相处机会，看对方是否主动找你、主动分享","表白选一对一的场合，别在大庭广众之下逼对方表态","把话说具体：「我想和你在一起」，然后给对方时间","被表白时如果拿不准，就说「我需要想一想，X 天前答复你」，别拖着不给回音","被拒绝就接受，道谢、退场，不在原地纠缠"],"pitfalls":["当众表白、录视频、叫上一堆朋友壮声势，是把对方架在火上烤","被拒绝后反复追问「为什么」，会把关系彻底做死","表白失败会疼，这是正常反应，需要几天时间消化，不必因此否定自己"]},"sources":[{"name":"科普中国《表白失败的痛，是一种什么痛？》","url":"https://cloud.kepuchina.cn/newSearch/imgText?id=7058886952936415232","note":"解释表白被拒后的心理反应与调适方式（人民网科普中国联合专业学会出品）"},{"name":"中国青年报《86.6%受访青年认为「爱」是一种需要培养的能力》","url":"https://zqb.cyol.com/pc/content/202608/20/content_429640.html","note":"受访青年认为表达与经营关系的能力可以后天培养"}]},{"id":"love-03","title":"第一次约会：一起吃饭、一起看电影","merged_from":["第一次约会","第一次一起吃饭","第一次一起看电影"],"tags":["恋爱","相处"],"cost":{"money":"人均几十到几百元","time":"2–4 小时","willpower":"低"},"evidence":"C","body":{"plain":"第一次约会的目的不是「拿下」，是互相看看合不合适。活动安排要留有说话的余地，吃饭和看电影都比密室、长途出游温和。","steps":["选交通方便、不太吵的地方，第一次别安排一整天","提前问清忌口和过敏，点菜时照顾对方","买单谁付都可以，第一次通常由发起方付，之后可以 AA 或轮流请","结束后发一条消息确认对方是否安全到家，比长篇表白更好","第二次约会提前约，给对方拒绝的空间"],"pitfalls":["全程看手机、聊前任、问收入，是第一次约会最常见的三个雷","把请吃饭当投资，事后要求回报，会让人很有压力","第一次就去对方家里或过夜的地方，风险高，边界要自己守住"]},"sources":[{"name":"中国青年报《双向付出是受访青年认为最重要的恋爱能力》","url":"https://zqb.cyol.com/pad/content/202608/24/content_429815.html","note":"受访青年对恋爱中付出与回应关系的看法"},{"name":"人民日报夜读《一段好的关系，不是从不争吵》","url":"https://www.peopleapp.com/column/30052855989-500007636335","note":"关系是在日常相处中磨合出来的"}]},{"id":"love-04","title":"第一次牵手、拥抱与确定关系","merged_from":["第一次牵手","第一次拥抱","第一次正式确定关系"],"tags":["恋爱","边界"],"cost":{"money":"无","time":"因人而异","willpower":"中"},"evidence":"A","body":{"plain":"身体接触的前提是对方愿意，任何时候都可以说不，也都可以收回。确定关系则最好说清：我们是什么关系、要不要公开、是否只和彼此交往。","steps":["从小的接触开始，观察对方的反应，犹豫就停下来问一句","任何一步都可以问：「我可以牵你的手吗」，直接问并不扫兴","确定关系时把关键的事说清楚：是否专一、是否公开、怎么称呼","把自己不能接受的事提前说（比如查手机、突然失联）","关系变了、想法变了，及时说，不要靠冷淡逼对方提分手"],"pitfalls":["「都在一起了」不能构成任何身体接触的许可，违背意愿的言语、肢体行为可能构成性骚扰","不明说的暧昧会持续消耗双方，该界定就界定","被拒绝亲密接触不等于不喜欢你，节奏不同很正常"]},"sources":[{"name":"《中华人民共和国民法典》人格权编","url":"http://gongbao.court.gov.cn/Details/7f184078694d811fb3314f6af9accf.html","note":"第九百九十条：人格权包括生命权、身体权、健康权等；第一千零一十条：违背他人意愿，以言语、文字、图像、肢体行为等方式对他人实施性骚扰的，受害人有权依法请求行为人承担民事责任"}]},{"id":"love-05","title":"第一次送/收恋爱礼物、第一次过纪念日","merged_from":["第一次送恋爱礼物","第一次收到恋爱礼物","第一次买情侣礼物","第一次过纪念日"],"tags":["恋爱","礼物"],"cost":{"money":"几十到几千元不等","time":"半天","willpower":"低"},"evidence":"B","body":{"plain":"恋爱礼物的价值在「被记住」，不在价格。纪念日也是同一个逻辑：提前记住、当天有回应，比临时补救重要。","steps":["平时记下对方随口提过想要什么，节日直接送这个","预算按自己的收入定，不要为了礼物借钱或刷爆信用卡","纪念日提前设提醒，当天有事也要说一声并补上","收到不合适的礼物先道谢，事后可以坦白喜好","礼物不要附条件（「我送你这么贵，你得……」）"],"pitfalls":["攀比礼物价码会把人拖进消费陷阱，也是被官方点名整治的人情负担","用礼物补偿长期缺席，关系只会更空","分手后索要礼物，除大额彩礼类财物外通常很难要回，出手前先想清楚"]},"sources":[{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"提出对天价彩礼、铺张浪费、低俗婚闹、随礼攀比等不正之风的整治"},{"name":"中国青年报《双向付出是受访青年认为最重要的恋爱能力》","url":"https://zqb.cyol.com/pad/content/202608/24/content_429815.html","note":"关系中双向付出比单向投入更重要"}]},{"id":"love-06","title":"第一次一起旅行、第一次一起住酒店","merged_from":["第一次一起旅行","第一次住酒店","第一次共同旅行"],"tags":["恋爱","旅行"],"cost":{"money":"交通+住宿+门票，按目的地","time":"2–7 天","willpower":"中"},"evidence":"B","body":{"plain":"一起旅行是关系的压力测试：钱怎么花、计划变了怎么办、累了会不会互相埋怨，几天里全都看得到。住酒店则要按实名登记办，两人都要带身份证。","steps":["出发前把预算、行程松紧、谁订票订房说清楚，别默认对方全包","订房看清是否可退、几人间、含不含早，登记入住时每人都要出示身份证件","行程留出空白时间，不要把每天都排满","费用可以 AA、轮流付或按收入比例分，事前定规则比事后算账好","旅途中出现分歧，当天解决，别攒到回家再吵"],"pitfalls":["第一次长途旅行就暴露消费观差异，是很常见的分手触发点，早点谈钱不是煞风景","酒店入住需实名登记，用别人的证件或帮人「代开房」都是违规的","行程太满导致又累又饿，是吵架的高发场景"]},"sources":[{"name":"《中华人民共和国民法典》人格权编与婚姻家庭编","url":"http://gongbao.court.gov.cn/Details/7f184078694d811fb3314f6af9accf.html","note":"人格权编关于隐私权、个人信息保护的规定；出行住宿中的个人信息与隐私同样受法律保护"},{"name":"人民日报夜读《一段好的关系，不是从不争吵》","url":"https://www.peopleapp.com/column/30052855989-500007636335","note":"关系中的磨合与修复"}]},{"id":"love-07","title":"第一次吵架、第一次冷战、第一次严重争吵","merged_from":["第一次吵架","第一次冷战","第一次和伴侣严重争吵"],"tags":["恋爱","沟通"],"cost":{"money":"无","time":"几小时到几周","willpower":"高"},"evidence":"B","body":{"plain":"吵架本身不致命，处理方式才致命。好的吵架有三条底线：不翻旧账、不人身攻击、不玩消失。","steps":["情绪上头时先喊停：「我们现在都在气头上，半小时后再谈」","谈的时候一次只谈一件事，用「我感到……」而不是「你总是……」","对方说话时不打断，先复述一遍他的意思，确认自己没听错","得出具体约定（下次遇到类似情况怎么做），不是逼对方认错","严重争吵后仍谈不拢，可以请第三方（共同朋友、婚姻家庭辅导机构）帮忙"],"pitfalls":["冷战看似体面，实则是在用沉默惩罚对方，拖久了感情就凉了","提分手当威胁，用多了对方会当真","把吵架内容截图发给朋友评理，会让对方彻底失去安全感"]},"sources":[{"name":"人民日报夜读《一段好的关系，不是从不争吵》","url":"https://www.peopleapp.com/column/30052855989-500007636335","note":"关系中的冲突是常态，关键在于修复"},{"name":"中国青年报《86.6%受访青年认为「爱」是一种需要培养的能力》","url":"https://zqb.cyol.com/pc/content/202608/20/content_429640.html","note":"沟通与修复能力可以后天学习"}]},{"id":"love-08","title":"第一次向对象道歉、第一次哄人","merged_from":["第一次道歉","第一次哄对象"],"tags":["恋爱","沟通"],"cost":{"money":"可能一顿饭/一份小礼物","time":"几分钟到几天","willpower":"中"},"evidence":"C","body":{"plain":"哄人不是靠话术，是靠「让对方感到被在意」。有效的顺序是：先接住情绪，再谈事实，最后给出具体改变。","steps":["先承认对方的感受：「你生气很正常，是我让你难受了」","说清自己错在哪一件具体的事，不用「我错了行了吧」","给一个能落地的改变，比如「以后加班晚归我提前发消息」","给对方台阶，但别要求立刻原谅，也不要反复追问「还生气吗」","如果确实不是自己的错，先安抚情绪，等平静了再讲道理"],"pitfalls":["用买东西代替道歉，短期有效长期伤关系","道歉后马上索取「那你也不许再提」，等于没道歉","把「哄」当哄骗，问题攒到下一次会更难收场"]},"sources":[{"name":"人民日报夜读《一段好的关系，不是从不争吵》","url":"https://www.peopleapp.com/column/30052855989-500007636335","note":"冲突之后的沟通与修复方式"}]},{"id":"love-09","title":"第一次见对方朋友、第一次见对方父母","merged_from":["第一次见对方朋友","第一次见对方父母","第一次带对象见自己父母"],"tags":["恋爱","家庭"],"cost":{"money":"礼物和饭局开销","time":"半天到一天","willpower":"中"},"evidence":"C","body":{"plain":"见朋友是看对方在熟人面前的样子，见父母是让两个系统第一次接触。第一次上门的原则是：礼数到位、少说多听、不替对方做主。","steps":["提前打听清楚对方父母的称呼、忌口和家里的基本情况","带一份实用、不过分贵重的礼物（水果、茶叶、地方特产都行）","见面主动问好、帮忙端菜收拾，但不要抢着进厨房乱动","被问到收入、房子等敏感问题时，礼貌回答或把话头递给对象","离开后向对象复盘父母的反应，统一口径，下一次才好安排"],"pitfalls":["第一次上门就谈婚期、谈彩礼，容易把场面谈僵","在对方父母面前纠正、调侃对象，是当场最容易踩的雷","自己父母不同意时，要先和对象在同一阵线商量，别让对象单独挨批"]},"sources":[{"name":"中国青年报《双向付出是受访青年认为最重要的恋爱能力》","url":"https://zqb.cyol.com/pad/content/202608/24/content_429815.html","note":"关系中双方共同面对外部压力的重要性"},{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"倡导文明节俭的婚俗，反对天价彩礼和铺张浪费"}]},{"id":"love-10","title":"第一次讨论未来、第一次发现价值观不同","merged_from":["第一次讨论未来","第一次发现价值观不同","第一次理解什么是长期关系"],"tags":["恋爱","关系"],"cost":{"money":"无","time":"一次长谈","willpower":"中"},"evidence":"B","body":{"plain":"长期关系不是靠感觉撑着的，是靠几个绕不开的问题答案一致：在哪个城市、要不要孩子、钱怎么管、双方父母怎么照顾。早谈不伤感情，晚谈才伤。","steps":["挑一个都不赶时间的晚上，从「三年后你希望过什么样的生活」问起","把几件大事逐条对齐：城市、工作方向、生育意愿、金钱观、父母养老","发现分歧先分清：是可协商的偏好，还是不可退让的底线","不可退让的部分，早点承认「我们不合适」比拖着更负责","对齐后写下来不用，但要定期回看——人会变，答案也会变"],"pitfalls":["「以后再说」说得太多，几年后才发现彼此要的生活完全不同","为了维持关系而假意答应对方，最后报复性反弹","把价值观分歧当成对方人品问题，谈起来就变成指责"]},"sources":[{"name":"《中长期青年发展规划（2016—2025年）》","url":"http://politics.people.com.cn/n1/2017/0414/c1001-29209632.html","note":"中共中央、国务院印发，其中「青年婚恋」部分提出引导青年树立文明健康的婚恋观、为青年婚恋交友提供服务"},{"name":"中国青年报《双向付出是受访青年认为最重要的恋爱能力》","url":"https://zqb.cyol.com/pad/content/202608/24/content_429815.html","note":"长期关系中的相互投入与共同规划"}]},{"id":"love-11","title":"第一次讨论钱、共同消费与共同管理钱","merged_from":["第一次讨论钱","第一次共同消费","第一次共同管理钱"],"tags":["恋爱","金钱"],"cost":{"money":"按消费水平","time":"一次长谈","willpower":"中"},"evidence":"A","body":{"plain":"谈恋爱谈钱不庸俗，含糊才危险。做法很简单：日常消费定规则，大额支出先商量，婚后财产则按法律规定区分共同财产和个人财产。","steps":["先定日常规则：AA、轮流请、按收入比例分，选一种并说清楚","共同旅行、家电这类大额支出，事前定预算和分摊方式","建一个共同账户只放共同开销，各自保留独立账户","知道法律规定：婚姻关系存续期间的工资奖金等收益原则上属于夫妻共同财产，夫妻对共同财产有平等的处理权","借钱给对方的家人朋友，要单独商量，别擅自做主"],"pitfalls":["一方长期垫付却不说，最后变成心里的一本账，是关系杀手","借钱给对方不写借条、不留转账记录，分手后很难主张","把对方的钱当自己的钱管，容易演变成控制"]},"sources":[{"name":"《中华人民共和国民法典》婚姻家庭编","url":"http://gongbao.court.gov.cn/Details/7f184078694d811fb3314f6af9accf.html","note":"第一千零六十二条：夫妻在婚姻关系存续期间所得的工资、奖金、劳务报酬等为夫妻共同财产，夫妻对共同财产有平等的处理权；第一千零六十三条：一方的婚前财产等为个人财产"}]},{"id":"love-12","title":"第一次异地恋、处理异地矛盾","merged_from":["第一次异地恋","第一次处理异地矛盾"],"tags":["恋爱","异地"],"cost":{"money":"交通与通讯开销","time":"数月到数年","willpower":"高"},"evidence":"B","body":{"plain":"异地恋真正难的不是距离，是不确定感。缓解的办法很朴素：固定的联系节奏、可见的未来计划、以及把见面安排落到实处。","steps":["约定固定的联系时间，比如每天一段语音、每周一次长视频","定下一个可预期的结束时间：谁在什么时候去谁的城市","见面提前订票订房，把日期写进日历，别只说「有空去看你」","矛盾尽量视频或电话说，文字容易越聊越冷","遇到对方失联或频繁取消，直接问清楚，不要靠猜"],"pitfalls":["调查显示，异地恋能否成功，受访者认为双方的理解信任最重要，而不是联系频率","把「你不秒回就是不在乎」当标准，会消耗掉仅剩的耐心","长期没有结束异地的计划，感情会在等待里慢慢熄火"]},"sources":[{"name":"新华网《调查：异地恋要成功 81.1%认为双方理解信任最重要》","url":"http://www.xinhuanet.com/politics/2016-07/29/c_129187530.htm","note":"调查显示 81.1% 的受访者认为理解与信任是异地恋成功的关键"}]},{"id":"love-13","title":"第一次讨论结婚、彩礼与房子","merged_from":["第一次讨论结婚","第一次讨论彩礼","第一次讨论房子"],"tags":["婚姻","家庭"],"cost":{"money":"彩礼/首付等大额支出，因人而异","time":"数月到数年","willpower":"高"},"evidence":"A","body":{"plain":"结婚是两个人的事，也是两个家庭的事。彩礼、房子这类事，最好在订婚之前谈清楚：谁出多少、写谁的名字、钱给谁。谈不拢就别硬推。","steps":["先和伴侣统一口径，再各自和自家父母沟通，别让双方父母直接对线","把大额事项列成清单：彩礼、三金、婚房、婚礼、装修，逐项说清出资方","房子涉及出资和登记的，保留好转账记录和聊天记录","了解法律规定：未办理结婚登记但已共同生活，一方请求返还按习俗给付的彩礼，法院会综合共同生活及孕育情况、彩礼实际使用、当地习俗等因素确定是否返还及比例","谈不拢就暂停，先把婚期放一放，比勉强办完再闹更省事"],"pitfalls":["天价彩礼、铺张浪费、低俗婚闹、随礼攀比都是被官方点名整治的不正之风","把彩礼当「买断」，之后要求对方服从，是矛盾的起点","所有钱都走现金、不给凭据，日后说不清"]},"sources":[{"name":"《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》","url":"http://gongbao.court.gov.cn/Details/d2fa08a82a91337bf6515842d1522e.html","note":"第六条：双方未办理结婚登记但已共同生活，一方请求返还按照习俗给付的彩礼的，人民法院应当根据彩礼实际使用及嫁妆情况，综合考虑共同生活及孕育情况、双方过错等事实，结合当地习俗确定是否返还及返还比例"},{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"开展对天价彩礼、铺张浪费、低俗婚闹、随礼攀比等不正之风的整治"}]},{"id":"love-14","title":"第一次订婚","merged_from":["第一次订婚"],"tags":["婚姻","仪式"],"cost":{"money":"订婚宴与彩礼，因人而异","time":"半天到一天","willpower":"中"},"evidence":"A","body":{"plain":"订婚是民俗仪式，不是法律程序：办了订婚不等于结婚，法律上也不产生夫妻关系。涉及大额财物的，最好留下书面和转账记录。","steps":["先和伴侣商量要不要办、办多大、请哪些人","把彩礼、三金、婚期这些关键事项在订婚前后谈成书面或明确的聊天记录","订婚宴的费用和随礼分配提前说好，避免当天扯皮","明确下一步：什么时候去领结婚证、民政局需要预约吗","异地办理的，先了解婚姻登记「全国通办」的适用范围"],"pitfalls":["把订婚当成已经「定死」，之后一方反悔就涉及彩礼返还纠纷","在酒桌上口头定下的条件，事后各说各话","为了面子办超出能力的宴席，婚后一起还债"]},"sources":[{"name":"《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》","url":"http://gongbao.court.gov.cn/Details/d2fa08a82a91337bf6515842d1522e.html","note":"彩礼返还纠纷的审理规则，明确未办理结婚登记情形下的处理方式"},{"name":"司法部、民政部负责人就《婚姻登记条例》修订答记者问","url":"https://www.mca.gov.cn/n152/n166/c1662004999980004609/content.html","note":"婚姻登记「全国通办」：此前 21 个省（区、市）开展跨省通办试点，方便群众异地登记"}]},{"id":"love-15","title":"第一次领结婚证","merged_from":["第一次领结婚证"],"tags":["婚姻","手续"],"cost":{"money":"工本费（部分地区已免）","time":"半天","willpower":"低"},"evidence":"A","body":{"plain":"结婚以登记为准：双方亲自到婚姻登记机关共同申请，材料齐了当场就能领证。现在的《婚姻登记条例》要求出具的是本人居民身份证和签字声明，不再要户口簿。","steps":["确认双方符合结婚条件：自愿、达到法定婚龄（男不得早于 22 周岁，女不得早于 20 周岁）、非直系血亲或三代以内旁系血亲","线上或电话预约婚姻登记机关，问清办公时间和是否需要预约","带好双方的居民身份证，现场签署无配偶以及无直系血亲和三代以内旁系血亲关系的声明","异地办理的按「全国通办」政策执行，具体受理范围以当地婚姻登记机关公布为准","领证后需要迁户口、改社保信息的，再去对应部门办理"],"pitfalls":["只办婚礼不领证，法律上不是夫妻，财产、继承、医疗签字都受影响","用虚假材料登记，可能被撤销婚姻并承担相应后果","婚前可以自愿做婚前保健检查，《母婴保健法》设有婚前保健一章，很多地方提供免费婚检"]},"sources":[{"name":"《婚姻登记条例》（2025 年修订）","url":"https://www.gov.cn/zhengce/content/202504/content_7017751.htm","note":"第七条：内地居民结婚，男女双方应当亲自到婚姻登记机关共同申请结婚登记；第八条：申请结婚登记的内地居民应当出具本人的居民身份证、本人无配偶以及与对方当事人没有直系血亲和三代以内旁系血亲关系的签字声明"},{"name":"《中华人民共和国民法典》婚姻家庭编","url":"http://gongbao.court.gov.cn/Details/7f184078694d811fb3314f6af9accf.html","note":"第一千零四十七条：结婚年龄，男不得早于二十二周岁，女不得早于二十周岁；第一千零四十八条：直系血亲或者三代以内的旁系血亲禁止结婚"}]},{"id":"love-16","title":"第一次办婚礼、第一次当伴郎伴娘","merged_from":["第一次办婚礼","第一次当伴郎伴娘"],"tags":["婚姻","仪式"],"cost":{"money":"几万到几十万不等，因人而异","time":"筹备 3–12 个月","willpower":"高"},"evidence":"A","body":{"plain":"婚礼是仪式，法律上结婚以登记为准。办婚礼的钱最好自己出自己定，按预算挑环节，别为了面子把婚后生活压垮。","steps":["先定预算和桌数，再选场地、婚庆和四大金刚（司仪、摄影、摄像、化妆）","和婚庆公司签书面合同，写清服务项目、时间、违约和退款条款","提前领证，别把领证拖到婚礼之后","当伴郎伴娘提前了解流程：什么时候站位、拿什么、红包给谁","婚礼当天分工到人，新人只负责出场，别什么都自己盯"],"pitfalls":["低俗婚闹是被官方点名整治的对象，闹伴娘、闹新郎都可能违法","婚庆合同不写细，加项加钱是常见纠纷","婚礼花费远超承受能力，是小家庭起步阶段最大的压力来源之一"]},"sources":[{"name":"《婚姻登记条例》（2025 年修订）","url":"https://www.gov.cn/zhengce/content/202504/content_7017751.htm","note":"结婚登记的条件与程序；婚姻关系自登记成立，婚姻登记机关可以为当事人提供颁证仪式等服务"},{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"整治天价彩礼、铺张浪费、低俗婚闹、随礼攀比等不正之风"}]},{"id":"love-17","title":"第一次成为丈夫/妻子、共同面对家庭问题","merged_from":["第一次成为丈夫/妻子","第一次共同面对家庭问题"],"tags":["婚姻","家庭"],"cost":{"money":"家庭共同开支","time":"长期","willpower":"高"},"evidence":"A","body":{"plain":"婚后第一件要建立的秩序是：夫妻是一个决策单位，双方父母是重要但外部的关系。钱怎么管、年怎么过、谁家多待几天，最好提前定规则。","steps":["开一次家庭会议，把收入、债务、每月固定开支摊开说","定下共同账户与个人账户的比例，各自保留独立可支配的钱","过年在谁家、多久回一次、父母生病怎么分担，提前商量出方案","夫妻之间有相互扶养的义务，一方遇到困难时另一方不能撒手","遇到婆媳、翁婿矛盾，先由各自的孩子去和自己父母沟通"],"pitfalls":["把原生家庭的意见直接搬进小家庭，是矛盾的主要来源","一方管全部钱、另一方一无所知，风险很大","婚后才知道对方有大额债务，往往已经来不及，婚前就该谈清"]},"sources":[{"name":"《中华人民共和国民法典》婚姻家庭编","url":"http://gongbao.court.gov.cn/Details/7f184078694d811fb3314f6af9accf.html","note":"第一千零五十九条：夫妻有相互扶养的义务；第一千零六十二条：夫妻共同财产范围与平等处理权；第一千零六十三条：夫妻一方的个人财产"}]},{"id":"love-18","title":"第一次共同租房","merged_from":["第一次共同租房"],"tags":["婚姻","居住"],"cost":{"money":"押一付三或押一付一，按城市","time":"找房 1–4 周","willpower":"中"},"evidence":"A","body":{"plain":"共同租房最容易出问题的是合同主体和押金：合同上写谁的名字、押金谁出、分手后谁搬走。这些最好在签合同前就说清楚。","steps":["看房确认：房东身份、房产证或授权委托书、押金与付款方式","签书面租赁合同，写清租金、押金、租期、维修责任和违约金","两个人共同居住的，建议双方都在合同上签字，或另附一份内部约定","按规定办理房屋租赁登记备案，具体材料和时限问当地住建部门","交租金和押金走银行转账，备注用途，保留凭证"],"pitfalls":["只有一方签合同，另一方在纠纷时没有承租人身份，维权困难","押金退还条件不写清楚，退租时容易被扣","合租关系变化（分手、搬走）要及时和房东沟通，擅自转租可能违约"]},"sources":[{"name":"《商品房屋租赁管理办法》（住房和城乡建设部）","url":"https://www.mohurd.gov.cn/gongkai/zc/wjk/art/2023/art_17339_775492.html","note":"第十四条、第十五条：房屋租赁当事人应当在租赁合同订立后到房屋所在地建设（房地产）主管部门办理房屋租赁登记备案；材料齐全且符合法定形式的，三个工作日内办理并开具备案证明"}]},{"id":"love-19","title":"第一次怀孕、第一次陪产检","merged_from":["第一次怀孕","第一次陪伴产检"],"tags":["育儿","流程"],"cost":{"money":"产检费用，医保可报销部分项目","time":"整个孕期","willpower":"高"},"evidence":"A","body":{"plain":"这里只说流程和手续：确认怀孕后，一般要到医院建档、办生育登记，之后按医生安排定期产检。检查项目和频次听医生的，网上说法一律不要替代就诊。","steps":["到当地医院或妇幼保健机构就诊确认，并按医院要求建档（很多医院需提前预约）","办理生育登记：多地已实现网上办、掌上办，可通过当地政务服务平台办理","按《母婴保健法》的孕产期保健要求接受保健服务，按期产检","参加孕妇学校或医院安排的课程，了解分娩流程和待产准备","提前准备证件材料：身份证、医保卡、结婚证等，具体以医院和当地要求为准"],"pitfalls":["自己按网上的说法判断身体状况，是风险最高的做法，有异常立刻就医","错过建档时间可能导致无法在目标医院产检分娩，早点问清规则","产检单据、发票留存好，生育医疗费用报销和生育津贴申领都要用"]},"sources":[{"name":"《中华人民共和国母婴保健法》","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647619.htm","note":"第三章「孕产期保健」：医疗保健机构应当为育龄妇女和孕产妇提供孕产期保健服务"},{"name":"《国家卫生健康委办公厅关于完善生育登记制度的指导意见》","url":"https://zc.gjzwfw.gov.cn/art/2022/11/29/art_14_60866.html","note":"全面推行网上办理，各地应普遍实现可通过网上办事大厅、移动客户端等信息平台办理生育登记"}]},{"id":"love-20","title":"第一次生孩子、第一次成为父母","merged_from":["第一次生孩子","第一次成为父母"],"tags":["育儿","流程"],"cost":{"money":"住院分娩费用，医保按政策报销","time":"产假 98 天起（各地另有延长）","willpower":"高"},"evidence":"A","body":{"plain":"生育相关的事听医生的，这里只讲手续和权益：住院分娩走医保结算，产假和生育津贴有法定依据，孩子出生后要办出生医学证明、户口和医保。","steps":["提前办好生育登记和医保备案，住院时带齐身份证、医保卡、产检资料","分娩后按医院流程办理《出生医学证明》，核对姓名、性别、出生时间等信息","了解产假：女职工生育享受 98 天产假，产前可以休假 15 天，各地还有延长生育假的规定","生育津贴按《社会保险法》由生育保险支付，单位或社保经办机构办理，具体标准问当地医保部门","新手父母提前分工：谁负责夜里、谁负责白天，别硬扛"],"pitfalls":["出生医学证明上的信息要当场核对，之后更改很麻烦","生育津贴和产假待遇各地标准不同，以当地医保、人社部门公布为准","把育儿全压在一方身上，是产后矛盾最主要的来源"]},"sources":[{"name":"《女职工劳动保护特别规定》（国务院令第619号）","url":"https://www.gov.cn/zhengce/2012-05/07/content_2602602.htm","note":"第七条：女职工生育享受 98 天产假，其中产前可以休假 15 天；难产的增加产假 15 天；生育多胞胎的每多生育 1 个婴儿增加产假 15 天"},{"name":"《中华人民共和国社会保险法》","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647616.htm","note":"第五十五条、第五十六条：生育保险待遇包括生育医疗费用和生育津贴；职工在规定情形下可以享受生育津贴"}]},{"id":"love-21","title":"第一次给孩子取名字、办证件","merged_from":["第一次给孩子取名字","第一次给孩子办证件"],"tags":["育儿","手续"],"cost":{"money":"工本费，多数证件免费","time":"出生后 1 个月内跑完主要手续","willpower":"中"},"evidence":"A","body":{"plain":"孩子的名字会写在出生医学证明和户口本上，改起来麻烦，取名时想清楚。证件按顺序办：出生医学证明 → 出生登记（上户口）→ 医保参保。","steps":["取名避开生僻字和可能引起歧义的字，先确认能不能打出来、能不能上户口","在医院办理《出生医学证明》，新生儿父母或监护人应在出生后一个月内持证明等材料向公安机关申报出生登记","上户口到父亲或母亲户籍地派出所办理，带上出生医学证明、父母身份证、结婚证等","尽快办医保参保：按国家医保局说法，新生儿原则上在出生后 90 天内按规定参保缴费，自出生之日起符合规定的医疗费用可纳入报销","办好后把证件复印或拍照存档，交幼儿园、入学都要用"],"pitfalls":["名字里有冷僻字，机票、银行、学籍系统都可能卡住","出生医学证明丢了要补发，趁早多留几份复印件和电子扫描件","错过新生儿参保时限，出生后的医疗费用可能无法追溯报销"]},"sources":[{"name":"《出生医学证明管理办法》","url":"http://www.dt.gov.cn/dtszf/gbtokzcsdjzc/202311/29632b823dd14e829bcec7683c553a7e.shtml","note":"首次签发、换发、补发与专用章管理规定；第三十九条：新生儿父母或其他监护人应该在新生儿出生后一个月内，持《出生医学证明》等有关材料向公安机关申报出生登记"},{"name":"《中华人民共和国户口登记条例》第七条","url":"https://ga.sz.gov.cn/ZT/LHLY/LYZCWJ/content/post_12162011.html","note":"婴儿出生后一个月以内，由户主、亲属、抚养人或者邻居向婴儿常住地户口登记机关申报出生登记"},{"name":"国家医疗保障局《新生儿参保都有哪些福利？》","url":"https://www.nhsa.gov.cn/art/2025/7/16/art_14_17289.html","note":"新生儿原则上在出生后 90 天内按规定参保缴费，自出生之日起所发生的符合规定的医疗费用均可纳入医保报销范围"}]},{"id":"love-22","title":"第一次给孩子买东西、第一次带孩子出门","merged_from":["第一次给孩子买东西","第一次带孩子出门"],"tags":["育儿","安全"],"cost":{"money":"用品开销，按需","time":"长期","willpower":"中"},"evidence":"A","body":{"plain":"给婴儿买东西，安全标准比品牌重要；带孩子出门，交通和看护是两件最不能省的事。买之前先问「这个东西有没有国家标准」。","steps":["奶瓶、玩具、衣物看是否有 3C 认证或国家标准标识，避免三无产品","婴儿床、推车、安全座椅重点看结构和固定方式，安装后要试摇晃","带婴幼儿乘车必须使用儿童安全座椅，这是法律对监护人的明确要求","出门前查天气、带够尿布奶粉和一件备用衣物，路线尽量短","推车过马路走人行横道，任何时候不要让婴儿车离开手"],"pitfalls":["二手安全座椅有过碰撞史的风险，尽量别买二手","让孩子在车里由大人抱着乘车，看起来安全其实最危险","把孩子单独留在车内几分钟也不行，夏季车内升温极快"]},"sources":[{"name":"《中华人民共和国未成年人保护法》第十八条","url":"http://www.jcy.gansu.gov.cn/info/1239/28469.htm","note":"未成年人的父母或者其他监护人应当为未成年人提供安全的家庭生活环境，采取配备儿童安全座椅、教育未成年人遵守交通规则等措施，防止未成年人受到交通事故的伤害"},{"name":"国家医疗保障局《新生儿参保都有哪些福利？》","url":"https://www.nhsa.gov.cn/art/2025/7/16/art_14_17289.html","note":"新生儿 90 天内参保，出生之日起符合规定的医疗费用可纳入医保报销"}]},{"id":"love-23","title":"第一次讨论分手、第一次分手与被分手","merged_from":["第一次讨论分手","第一次分手","第一次被分手"],"tags":["恋爱","关系"],"cost":{"money":"可能涉及共同财物处理","time":"数周到数月","willpower":"高"},"evidence":"B","body":{"plain":"提分手要么不提，要么说清楚。最伤人的不是分手本身，而是拖着、冷着、用消失逼对方先开口。","steps":["想清楚是「关系里的问题」还是「这段关系本身」，前者先谈，后者再分","当面或视频说，别用一条消息消失；说清原因，但不列举对方的全部缺点","一次说清，不留「以后再说」的余地，暧昧的收尾会让双方反复拉扯","处理共同财物：房租、押金、共同买的电器、共同欠款，列清单商定","被分手的一方先接受现实，不要在深夜连续发消息挽回"],"pitfalls":["反复分分合合比一次分手更消耗人，定下来的事就别回头试探","分手时翻旧账、泄露对方隐私，可能涉及名誉权、隐私权纠纷","把分手当成要挟手段，用多了就真的会成真"]},"sources":[{"name":"科普中国《为何有些人更难走出失恋阴影？》","url":"https://cloud.kepuchina.cn/newSearch/imgText?id=6893211941717913600","note":"解释失恋后的心理反应与个体差异"},{"name":"中国青年报《双向付出是受访青年认为最重要的恋爱能力》","url":"https://zqb.cyol.com/pad/content/202608/24/content_429815.html","note":"对关系中付出与回应的调查"}]},{"id":"love-24","title":"第一次失恋、面对前任与真正放下一个人","merged_from":["第一次失恋","第一次面对前任","第一次真正放下一个人","第一次发现恋爱不是全部","第一次知道什么是边界"],"tags":["恋爱","心理"],"cost":{"money":"无","time":"几周到一年不等","willpower":"高"},"evidence":"B","body":{"plain":"失恋是一段需要时间的应激反应，不是「不够坚强」。放下的标志不是忘记，而是想起时不再影响你的日常决定。","steps":["先允许自己难受，找朋友、家人或心理咨询把情绪说出来","做减法：取关、静音、不主动看对方动态，减少反复刺激","把生活重新排满：作息、运动、工作、和朋友见面","遇到前任保持基本礼貌即可，不必假装朋友，也不必刻意羞辱","给边界立规矩：不见、不聊深夜、不打听对方的新关系"],"pitfalls":["深夜发长消息、反复看聊天记录，是延长痛苦的常见方式","用新恋情盖住旧伤口，很容易把伤害转给下一个人","恋爱不是生活的全部，把全部重心放在一个人身上，关系和个人都很脆弱"]},"sources":[{"name":"科普中国《为何有些人更难走出失恋阴影？》","url":"https://cloud.kepuchina.cn/newSearch/imgText?id=6893211941717913600","note":"失恋阴影的心理学解释与恢复建议"},{"name":"人民网科普中国《「不」字难以说出口？你的「心理界限」可能出了问题》","url":"https://cloud.kepuchina.cn/search/imgText?id=402279","note":"心理界限的建立方法，同样适用于与前任保持距离"},{"name":"海南省卫生健康委《心理健康素养十条》","url":"https://wst.hainan.gov.cn/jkcbw/jkjkzt/jkcbzyys/202111/t20211101_3336495.html","note":"情绪问题出现时的自我调适与求助建议"}]},{"id":"love-a1","title":"第一次做婚前医学检查","merged_from":[],"tags":["婚姻","健康"],"cost":{"money":"多地免费","time":"半天","willpower":"低"},"evidence":"A","body":{"plain":"婚前医学检查是《母婴保健法》里明确的一项保健服务，很多地方对登记结婚的双方提供免费婚检，对生育规划很实用。","steps":["到户籍地或登记地的妇幼保健机构、指定医院咨询免费婚检政策","带身份证与登记材料，按预约时间做检查","检查项目通常包括传染病、遗传病、生殖系统等筛查","拿到结果后如涉及生育风险，向医生咨询具体建议"],"pitfalls":["把婚检当成「不信任」，其实是对双方的信息对称","只做体检不做婚检项目，生育相关筛查可能漏项"]},"sources":[{"name":"《中华人民共和国母婴保健法》（婚前保健等规定）","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647619.htm","note":"婚前保健服务的规定，具体免费政策与项目以当地妇幼保健机构为准"}],"addition":true,"why":"《母婴保健法》设有婚前保健一章，很多地方免费，原大纲完全没提"},{"id":"love-a2","title":"第一次面对催婚催生","merged_from":[],"tags":["婚姻","家庭"],"cost":{"money":"0","time":"长期","willpower":"中"},"evidence":"C","body":{"plain":"催婚催生的压力几乎每个年轻人都会遇到。有效做法是把「不回应」换成「给出自己的节奏与理由」，并和伴侣统一口径。","steps":["先和伴侣确认彼此的节奏与底线，对外用同一套说法","对父母用「计划 + 时间点」的方式回应，比单纯拒绝更容易被接受","把关心转成具体行动：定期沟通、介绍彼此的生活状态","持续被施压时，明确说明这是两个人的决定，请尊重边界"],"pitfalls":["为了平息争吵随口承诺，之后压力更大","把所有压力都推给对方去扛"]},"sources":[{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"民政部门推进婚俗改革、倡导文明婚俗的政策背景"}],"addition":true,"why":"年轻人普遍会遇到，需要一套既能维持关系又能守住节奏的应对方式"},{"id":"love-a3","title":"第一次处理婚后的婆媳、翁婿关系","merged_from":[],"tags":["家庭","沟通"],"cost":{"money":"0","time":"长期","willpower":"高"},"evidence":"C","body":{"plain":"婚后与长辈相处，矛盾多集中在同住、带娃、过年安排。核心原则是：小家庭的事由夫妻先达成一致，再对外沟通。","steps":["夫妻先私下统一意见，再由各自的子女去和自己父母沟通","同住前约定家务分工、作息与育儿分工，尽量写清","涉及金钱往来（补贴、买房出资）保留转账记录与说明","矛盾升级时先分居冷静，必要时寻求家庭咨询或调解"],"pitfalls":["当着长辈面指责伴侣，矛盾会立刻升级","把父母出资当作「话语权」，事后容易翻旧账"]},"sources":[{"name":"《中华人民共和国民法典》（婚姻家庭编相关规则，最高人民检察院网站全文）","url":"https://www.spp.gov.cn/ssmfdyflvdtpgz/202008/t20200831_478418.shtml","note":"婚姻家庭关系中的权利义务以民法典相关规定为准；相处方式属经验性内容"},{"name":"中国法律服务网（12348）","url":"https://www.12348.gov.cn/","note":"家庭纠纷可向公共法律服务平台或人民调解组织求助"}],"addition":true,"why":"共同面对家庭问题只写了大原则，日常相处（同住、带娃、过年）还需要单独一条"}],"additions":[],"_file":"13-恋爱与婚姻篇.json","label":"恋爱与婚姻篇"},{"section":"14 家庭篇","source_count":14,"merged_count":15,"raw_count":40,"entries":[{"id":"home-01","title":"第一次给父母买礼物、转钱与谈钱","merged_from":["第一次自己给父母买礼物","第一次给父母转钱","第一次和父母谈钱"],"tags":["家庭","金钱"],"cost":{"money":"礼物几十到几百元，给家用因人而异","time":"1 小时","willpower":"低"},"evidence":"B","body":{"plain":"给父母花钱，难的从来不是钱，是他们不肯要。先分清你要给的是心意还是家用——这两件事的说法完全不同，混在一起谈最容易吵起来。","steps":["买礼物先问需求：家里的电饭锅坏没坏、常用药还有没有、手机电池还撑不撑。用得上的东西，比贵的东西更不容易被退回来。","转钱用手机银行直接转，备注写清用途（家用、体检、还房贷）。转大额之前先确认那张卡有没有单日限额，分几次转比一次被拦下来省事。","提家用要挑时间，别在饭桌上顺口说。说清三件事：每月给多少、从哪个月开始、什么情况下会变。","如果父母有退休金、不肯收钱，可以把现金换成替他们交的合作医疗、体检套餐、物业费，他们更容易接受。"],"pitfalls":["转账不写备注，家里以后对账说不清。","把给钱当成解决所有矛盾的方案：钱到位了、话没说开，关系反而更僵。"]},"sources":[{"name":"国务院关于提高个人所得税有关专项附加扣除标准的通知（2023年）","url":"https://www.gov.cn/zhengce/zhengceku/202308/content_6901207.htm","note":"赡养老人专项附加扣除标准提高到每月3000元，非独生子女与兄弟姐妹分摊。 已用 curl 抓取本页并核对到关键词：「赡养老人」、「3000」。"},{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"}]},{"id":"home-02","title":"第一次带父母出门：旅行、体检与看病","merged_from":["第一次带父母旅行","第一次陪父母看病","第一次陪父母体检"],"tags":["家庭","就医","旅行"],"cost":{"money":"因人而异","time":"半天到几天","willpower":"中"},"evidence":"A","body":{"plain":"带父母看病和带父母旅行是同一件事：你是那个负责排队、找路、拿主意的人。功课提前一天做掉，现场能少走一半冤枉路。","steps":["挂号优先用医院官方App、公众号或当地统一预约平台，选上午的号；把既往病历和正在吃的药拍照存手机。","异地看病先去国家医保服务平台App或参保地医保经办机构办跨省异地就医备案，备案成功后住院费用可以直接结算。","旅行把行程砍到每天一个主景点，酒店选带电梯的，高铁飞机订靠过道的座位；出门前把医保卡、身份证、常用药和紧急联系人纸条装进同一个包。"],"pitfalls":["没备案就去异地住院，通常要自己先全额垫付，再回参保地手工报销，材料多、周期长。","报了明显低于成本的低价团，行程单里往往塞满购物店，签合同前一定要看购物安排。"]},"sources":[{"name":"国家医保局 财政部关于进一步做好基本医疗保险跨省异地就医直接结算工作的通知","url":"https://www.gov.cn/zhengce/zhengceku/2022-07/26/content_5702881.htm","note":"明确跨省异地就医备案人员范围、备案渠道（国家医保服务平台App、经办机构窗口等）和直接结算要求。 已用 curl 抓取本页并核对到关键词：「备案」、「直接结算」。"},{"name":"旅行社条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2009-02/26/content_3989.htm","note":"规定旅行社应当与旅游者签订旅游合同，行程中安排购物需协商一致并载明。 已用 curl 抓取本页并核对到关键词：「旅游合同」、「购物」。"}]},{"id":"home-03","title":"第一次照顾生病的父母，第一次成为家里的主事人","merged_from":["第一次照顾生病的父母","第一次承担家庭责任","第一次给家里解决大问题","第一次参加家庭重大决定"],"tags":["家庭","就医","责任"],"cost":{"money":"因人而异","time":"数天到数月","willpower":"高"},"evidence":"A","body":{"plain":"父母住院那一刻，你会从被安排的人变成要拍板的人。这时候最值钱的不是钱，是信息：谁在治、要花多少、谁签字。","steps":["先当一次提问的人：把诊断、治疗方案、预计费用、医保报销比例、需要谁签字问清楚，记在手机备忘录里。","家里定一个主事人，其余人分工（陪护、跑腿、缴费、对外沟通），避免一屋子人却没一个拍板的。","出院前把发票、费用明细清单、出院小结、诊断证明全部收好并拍照备份，商业保险和单位互助大多认这些。","开家庭会议讨论卖房、借款、长期照护这类大事时，把结论写下来发到家庭群里。"],"pitfalls":["只顾垫钱忘了留票据，事后报销和分摊都没依据。","一个人硬扛陪护，最先垮的是照顾者自己，该请护工就请。"]},"sources":[{"name":"中华人民共和国老年人权益保障法（中国人大网）","url":"http://www.npc.gov.cn/npc//c2/c30834/201905/t20190521_296650.html","note":"第二章家庭赡养与扶养：赡养人应当履行对老年人经济上供养、生活上照料和精神上慰藉的义务；第十八条规定与老年人分开居住的家庭成员应当经常看望或者问候老年人。 已用 curl 抓取本页并核对到关键词：「第十八条」、「经常看望」、「赡养」。"},{"name":"国家医保局 财政部关于进一步做好基本医疗保险跨省异地就医直接结算工作的通知","url":"https://www.gov.cn/zhengce/zhengceku/2022-07/26/content_5702881.htm","note":"明确跨省异地就医备案人员范围、备案渠道（国家医保服务平台App、经办机构窗口等）和直接结算要求。 已用 curl 抓取本页并核对到关键词：「备案」、「直接结算」。"}]},{"id":"home-04","title":"第一次和父母认真谈未来、第一次告诉父母自己的重大决定","merged_from":["第一次自己处理家庭问题","第一次和父母认真谈未来","第一次告诉父母自己的重大决定"],"tags":["家庭","沟通"],"cost":{"money":"0 元","time":"1–2 小时","willpower":"中"},"evidence":"B","body":{"plain":"父母反对的往往不是你的选择，是这个选择没有退路。谈之前先把退路想好，谈话会顺很多。","steps":["挑一个大家都不累的时间，先讲结论（我决定做什么），再讲理由，最后讲计划和时间表。","主动说出最坏的结果和你的应对方案——这是父母最想听的部分。","如果他们当场反对，别辩论，把顾虑逐条记下来，约定下次带着答复再谈。","涉及钱的部分（要不要家里出首付、能不能先住家里）单独谈，写明金额、期限和归还方式。"],"pitfalls":["用你们不懂开头，谈话当场就结束了。","先斩后奏：事情办完才通知，父母的第一反应永远是你不信任我。"]},"sources":[{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"},{"name":"中华人民共和国家庭教育促进法（北京市人民政府网站全文）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202305/t20230505_3087270.html","note":"确立家庭教育应尊重未成年人身心发展规律、相互尊重、平等交流的原则。 已用 curl 抓取本页并核对到关键词：「家庭教育促进法」、「尊重」、「平等」。"}]},{"id":"home-05","title":"第一次和父母发生严重争执、第一次拒绝父母的安排","merged_from":["第一次和父母发生严重争执","第一次拒绝父母的安排"],"tags":["家庭","沟通","边界"],"cost":{"money":"0 元","time":"因人而异","willpower":"高"},"evidence":"C","body":{"plain":"成年后和父母吵得最凶的几次，多半不是因为谁对谁错，而是因为这件事到底谁说了算。","steps":["情绪上头时先离场，下楼走二十分钟，比继续讲道理有用。","事后用文字把底线写清楚（微信比当面好）：哪些事我自己定，哪些事我愿意听你们的。","拒绝安排时给出替代方案：这次相亲我不去，但下个月我可以自己约朋友吃饭。只拒绝不给替代，等于把冲突留给下一次。","涉及婚姻、工作这类大事，可以请家里信得过的长辈居中调停，别把战线拉长到亲戚群。"],"pitfalls":["冷战拖太久，最后往往以你妥协收场，边界一次都没立起来。","在亲戚群里吵，事后最难收场的是父母的面子。"]},"sources":[{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"},{"name":"中华人民共和国家庭教育促进法（北京市人民政府网站全文）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202305/t20230505_3087270.html","note":"确立家庭教育应尊重未成年人身心发展规律、相互尊重、平等交流的原则。 已用 curl 抓取本页并核对到关键词：「家庭教育促进法」、「尊重」、「平等」。"}]},{"id":"home-06","title":"第一次意识到父母在变老","merged_from":["第一次真正理解父母","第一次意识到父母会变老","第一次看到父母头发变白","第一次真正理解“家”"],"tags":["家庭","情感"],"cost":{"money":"0 元","time":"因人而异","willpower":"低"},"evidence":"A","body":{"plain":"意识到父母变老，通常不是某个瞬间，而是几件小事叠在一起：他们开始让你帮忙操作手机、体检报告不再主动给你看、走楼梯要扶一下扶手。","steps":["每年给父母安排一次体检，报告的电子版自己留一份，复诊和对比都用得上。","把常回家看看落到时间表上：法律也把经常看望或者问候分开居住的老年人，写成了家庭成员应当做的事。","趁他们还说得清楚，把家里的大事问明白：社保卡、医保、房产证、存单放在哪，有没有借出去的钱。","多拍点他们的日常（说话、做饭、走路），以后这些比任何合影都珍贵。"],"pitfalls":["总觉得以后有的是时间，父母的老去不等人。","只在过年回一次家，平时电话也少，等出事才发现什么都来不及问。"]},"sources":[{"name":"中华人民共和国老年人权益保障法（中国人大网）","url":"http://www.npc.gov.cn/npc//c2/c30834/201905/t20190521_296650.html","note":"第二章家庭赡养与扶养：赡养人应当履行对老年人经济上供养、生活上照料和精神上慰藉的义务；第十八条规定与老年人分开居住的家庭成员应当经常看望或者问候老年人。 已用 curl 抓取本页并核对到关键词：「第十八条」、「经常看望」、「赡养」。"}]},{"id":"home-07","title":"第一次主动回家，第一次发现自己成了家里的大人","merged_from":["第一次主动回家","第一次发现自己已经成为家里的大人","第一次成为别人眼里的依靠"],"tags":["家庭","成长"],"cost":{"money":"路费","time":"1–3 天","willpower":"低"},"evidence":"B","body":{"plain":"第一次主动回家，往往是你已经在外地站稳了，突然发现回去这件事不再是被安排的，而是你自己选的。","steps":["别等到过年，挑一个普通的周末回去，主动下厨做一顿饭，比带礼物更能改变家里的气氛。","回去时接一两件具体的事：陪跑一次银行、修一次水管、带他们去续一次医保——大人这个身份是靠办事挣来的。","把家里的紧急联系人、常去的医院、亲戚电话存进手机，也把自己设成父母的紧急联系人。","把你所在城市的住址、工作单位、两个随时能联系到你的朋友告诉父母，他们的安全感来自知道找得到你。"],"pitfalls":["回家只当客人，三天里被伺候着，身份不会变。","把成为依靠理解成报喜不报忧，等自己撑不住时，没人知道。"]},"sources":[{"name":"中华人民共和国老年人权益保障法（中国人大网）","url":"http://www.npc.gov.cn/npc//c2/c30834/201905/t20190521_296650.html","note":"第二章家庭赡养与扶养：赡养人应当履行对老年人经济上供养、生活上照料和精神上慰藉的义务；第十八条规定与老年人分开居住的家庭成员应当经常看望或者问候老年人。 已用 curl 抓取本页并核对到关键词：「第十八条」、「经常看望」、「赡养」。"}]},{"id":"home-08","title":"第一次买房、第一次装修、第一次成为房主","merged_from":["第一次买房","第一次装修","第一次成为房主"],"tags":["家庭","住房","大额支出"],"cost":{"money":"因人而异","time":"3–12 个月","willpower":"高"},"evidence":"A","body":{"plain":"买房是流程最长的一件事：选房、签约、贷款、缴税、过户、拿证，一步不能少，任何一份材料缺失都会让整件事往后拖。","steps":["签约前查两件事：房子有没有抵押或查封、卖方是不是产权人；合同里把总价、付款节点、贷款办不下来怎么办、违约责任写清楚。","过户后向不动产登记机构申请登记，登记完成、领到不动产权证书才算真正到手——法律上不动产以登记为准，不是拿到钥匙就算你的。","装修开工前把方案和施工方信息告知物业并办手续，和施工方签书面合同，写明工期、付款节点和材料品牌。","装修中不得擅自变动建筑主体和承重结构，也不要私改燃气、供暖管线。"],"pitfalls":["装修款一次付太多，工长跑路的例子不少，按节点验收付款。","只拿到一张定金收据、没签正式合同，最后定金退不退全看条款。"]},"sources":[{"name":"不动产登记暂行条例实施细则（自然资源部）","url":"https://www.gov.cn/zhengce/2019-08/13/content_5711397.htm","note":"第二条规定不动产登记应当依申请进行，第二章列明申请登记应提交的材料与受理程序。 已用 curl 抓取本页并核对到关键词：「不动产登记」、「申请」。"},{"name":"住宅室内装饰装修管理办法（建设部令第110号）","url":"https://www.gov.cn/zhengce/2002-03/05/content_5712023.htm","note":"第二章'一般规定'要求装修人在开工前告知物业管理单位，第八条列明未经原设计单位或具有相应资质等级的设计单位提出设计方案、不得变动建筑主体和承重结构等禁止行为。 已用 curl 抓取本页并核对到关键词：「物业管理单位」、「承重结构」。"}]},{"id":"home-09","title":"第一次处理家庭财产：遗产、遗嘱与公证","merged_from":["第一次处理家庭财产","第一次面对遗产","第一次面对遗嘱"],"tags":["家庭","继承","政务流程"],"cost":{"money":"公证费按标的比例，因人而异","time":"1–6 个月","willpower":"中"},"evidence":"A","body":{"plain":"家里有人去世后要处理的第一件事不是分东西，而是弄清楚有没有遗嘱。有遗嘱按遗嘱办，没有遗嘱按法定继承顺序办。","steps":["先找出所有可能的遗嘱（自书、代书、打印、录音录像、公证），以及房产证、存单、股权凭证、保险合同。","没有争议的，去公证处办继承公证：所有继承人带身份证、户口本、死亡证明、亲属关系证明和财产凭证到场。","谈不拢的走法院诉讼，别在家里耗着，时间越久证据越难找。","涉及老人的财产安排，趁父母意识清醒时办遗嘱公证，公证文书的证据效力最稳。"],"pitfalls":["以为独生子女就能直接继承：配偶、子女、父母同属第一顺序继承人，祖父母外祖父母也可能牵涉其中。","只在微信里达成一致、没有书面签字，后面翻脸的很多。"]},"sources":[{"name":"《中华人民共和国民法典》第六编 继承（最高人民检察院网站全文）","url":"https://www.spp.gov.cn/ssmfdyflvdtpgz/202008/t20200831_478418.shtml","note":"第一千一百二十三条：继承开始后按法定继承办理，有遗嘱的按遗嘱继承或遗赠办理；第一千一百三十三条：自然人可以立遗嘱处分个人财产。 已用 curl 抓取本页并核对到关键词：「第一千一百二十三条」、「第一千一百三十三条」、「遗嘱」。"},{"name":"中华人民共和国公证法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2005/content_77745.htm","note":"第十一条列明公证机构办理的事项，包括继承、遗嘱、财产分割、亲属关系等。 已用 curl 抓取本页并核对到关键词：「继承」、「遗嘱」、「公证机构」。"}]},{"id":"home-10","title":"第一次处理亲人去世：死亡证明、注销户口与丧事","merged_from":["第一次处理亲人去世","第一次参加葬礼","第一次办理死亡证明","第一次处理丧葬","第一次面对亲人离开"],"tags":["家庭","政务流程","丧事"],"cost":{"money":"因人而异","time":"3–15 天","willpower":"高"},"evidence":"A","body":{"plain":"亲人去世后有一串必须按顺序办的证件：死亡证明、注销户口、火化，顺序错了要来回跑。","steps":["在医院去世的，由医院签发《居民死亡医学证明（推断）书》；在家中去世的，联系社区卫生服务机构或派出所按当地流程办理。","拿着死亡证明到户籍所在地派出所申报死亡登记、注销户口，具体顺序各地有差异，先打电话问清楚。","联系正规殡仪馆接运遗体、预约火化，签服务单前逐项看清项目和价格。","火化后凭火化证明办理丧葬补助金、抚恤金，以及社保、公积金个人账户余额的继承提取。"],"pitfalls":["死亡证明开少了份数，后面每项手续都要原件，建议一次多开几份并全部拍照。","遗体必须按规定处理，不要自行联系非正规车辆接运。"]},"sources":[{"name":"国家卫生健康委《关于加强居民死亡医学证明信息登记和电子证照管理工作的通知》（天津市卫生健康委员会转载）","url":"https://wsjk.tj.gov.cn/tjsjbyf/xwdt/mtbd/202602/t20260227_7252010.html","note":"规范《居民死亡医学证明（推断）书》的签发、信息登记与电子证照管理。原始通知在 nhc.gov.cn，本机 curl 返回 412 无法直取，改用省级卫健委转载页。 已用 curl 抓取本页并核对到关键词：「死亡医学证明」、「签发」。"},{"name":"殡葬管理条例（司法部 国家行政法规库）","url":"https://xzfg.moj.gov.cn/mobile/law/detail?LawID=1788","note":"规定遗体处理和火化的管理要求，丧事活动不得妨害公共秩序、危害公共安全。 已用 curl 抓取本页并核对到关键词：「火化」、「遗体」。"}]},{"id":"home-11","title":"第一次成为哥哥姐姐、第一次成为叔叔阿姨","merged_from":["第一次成为哥哥/姐姐","第一次成为叔叔/阿姨"],"tags":["家庭","关系","小孩"],"cost":{"money":"红包礼物因人而异","time":"因人而异","willpower":"低"},"evidence":"B","body":{"plain":"多了个弟弟妹妹，或者被叫叔叔阿姨，意味着你在家庭里的位置变了：从被照顾的一方，变成要给红包、要搭把手的那一方。","steps":["先弄清楚称呼背后的法律范围：近亲属指配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女，很多正式场合只认这个范围。","家里添了小孩，帮忙要帮成一件事：接送、买菜、看两个小时孩子，比一句有事随时找我管用。","给红包和礼物前先和父母、兄姐通个气，避免在亲戚之间形成比较。"],"pitfalls":["在育儿方式上指手画脚，嫂子姐姐最容易记仇。","答应帮忙带孩子却临时放鸽子，比一开始就拒绝更伤人。"]},"sources":[{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"},{"name":"中华人民共和国未成年人保护法（12309中国检察网）","url":"https://www.12309.gov.cn/12309/flfg/1979629425639190529.html","note":"规定父母或其他监护人的监护职责，以及学校、社会对未成年人的保护义务。 已用 curl 抓取本页并核对到关键词：「监护人」、「监护职责」。"}]},{"id":"home-12","title":"第一次照顾小孩：看病、办证件与过生日","merged_from":["第一次照顾小孩","第一次带小孩去医院","第一次给小孩办证件","第一次给小孩过生日","第一次承担另一个人的人生责任"],"tags":["家庭","育儿","政务流程"],"cost":{"money":"因人而异","time":"数小时到长期","willpower":"高"},"evidence":"A","body":{"plain":"照顾小孩的核心是两件事：证要办齐、病要看对，其他都是加分项。","steps":["出生后先办《出生医学证明》，再凭它到派出所办理出生登记；出生医学证明已有电子证照，先查当地是否支持调用。","带小孩看病优先去儿童专科或综合医院儿科，挂号时带上出生证明或户口本、医保卡，把症状、体温、用药时间记在备忘录里给医生看。","夜里发烧是常态：家里常备体温计、退热贴和医保卡，提前查好最近的 24 小时儿科在哪。","生日按孩子的年龄和性格安排，三岁以下的孩子对场面没有记忆，安全、小规模更划算。"],"pitfalls":["出生医学证明上的姓名、父母信息有错，后面改起来非常麻烦，领证时当场逐字核对。","忘了给孩子办居民医保参保，门诊住院都得自费。"]},"sources":[{"name":"关于依托全国一体化在线政务服务平台做好出生医学证明电子证照应用推广工作的通知（国务院部门文件）","url":"https://www.gov.cn/zhengce/zhengceku/2020-12/10/content_5568652.htm","note":"推动出生医学证明电子证照在政务服务平台的应用，办事时可调用电子证照核验。 已用 curl 抓取本页并核对到关键词：「出生医学证明」、「电子证照」。"},{"name":"中华人民共和国未成年人保护法（12309中国检察网）","url":"https://www.12309.gov.cn/12309/flfg/1979629425639190529.html","note":"规定父母或其他监护人的监护职责，以及学校、社会对未成年人的保护义务。 已用 curl 抓取本页并核对到关键词：「监护人」、「监护职责」。"}]},{"id":"home-a1","title":"第一次处理父母的手机和网络账号（帮长辈防诈骗）","merged_from":[],"tags":["家庭","反诈"],"cost":{"money":"0","time":"1–2 小时","willpower":"中"},"evidence":"B","body":{"plain":"老年人是电信网络诈骗的高发人群。花一小时做四件事，能挡掉大部分风险：装反诈 App、设支付限额、关免密支付、留紧急联系人。","steps":["给父母的手机装国家反诈中心 App，打开来电预警","在支付软件里设置单日转账限额，关闭免密支付和小额免密","把大额银行卡与日常支付分开，日常卡只留少量余额","和父母约定：任何转账前先给子女打个电话核对","把可疑短信、电话举报到 12321"],"pitfalls":["只口头提醒「别被骗」，没有设置层面的拦截","父母怕挨骂，被骗后瞒着不说，错过止付时间"]},"sources":[{"name":"12321 网络不良与垃圾信息举报受理中心","url":"https://www.12321.cn","note":"受理诈骗电话、垃圾短信与不良信息的举报"},{"name":"国务院办公厅《关于切实解决老年人运用智能技术困难的实施方案》","url":"https://www.gov.cn/gongbao/content/2020/content_5567747.htm","note":"帮助老年人跨越数字鸿沟、防范网络风险的政策要求"}],"addition":true,"why":"老年人是电诈高发人群，成年子女迟早要接管父母的手机设置与支付限额"},{"id":"home-a2","title":"第一次和兄弟姐妹谈赡养分摊","merged_from":[],"tags":["家庭","赡养"],"cost":{"money":"视家庭","time":"长期","willpower":"高"},"evidence":"A","body":{"plain":"多子女家庭的赡养分工，出钱出力怎么算，是家庭矛盾的常见引爆点。法律上赡养义务是法定的，但分担方式可以协商。","steps":["先盘清父母的收入、医保报销比例、护理需求与实际缺口","把「出钱」和「出力」折算成可比较的方案，比如照料折抵部分费用","形成书面约定：每月金额、住院分摊比例、重大支出如何决议","保留转账记录与支出凭证，避免日后争议"],"pitfalls":["只凭「谁离得近谁多出力」，时间久了必然失衡","父母财产分配与赡养义务挂钩的误解，容易埋雷"]},"sources":[{"name":"《中华人民共和国老年人权益保障法》","url":"http://www.npc.gov.cn/npc//c2/c30834/201905/t20190521_296650.html","note":"赡养人应当履行对老年人经济上供养、生活上照料和精神上慰藉的义务"},{"name":"《中华人民共和国民法典》继承编（最高人民检察院网站全文）","url":"https://www.spp.gov.cn/ssmfdyflvdtpgz/202008/t20200831_478418.shtml","note":"继承与赡养相关的权利义务规则"}],"addition":true,"why":"多子女家庭的赡养分工是家庭矛盾常见引爆点，大纲只有和父母谈钱"},{"id":"home-a3","title":"第一次给家里做应急信息卡（病历、用药、紧急联系人）","merged_from":[],"tags":["家庭","应急"],"cost":{"money":"0","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"父母突发疾病时，抢救室里最需要的是既往病史、过敏史和常用药清单。提前写下来放在钱包里，比事后翻手机快得多。","steps":["列出父母的基础病、手术史、过敏史、常用药与剂量","写上主治医院、科室、医生电话与医保类型","填两个紧急联系人，注明关系与电话","打印两份：一份放老人钱包，一份拍照存家庭群"],"pitfalls":["信息过期比没有更危险，每半年更新一次","只存在手机里，老人外出手机没电就查不到"]},"sources":[{"name":"中国红十字会总会（救护与家庭应急准备）","url":"https://www.redcross.org.cn","note":"家庭应急准备与急救信息登记的建议做法"}],"addition":true,"why":"父母突发疾病时，抢救室最需要既往病史与常用药清单"}],"additions":[],"cross_ref":[{"title":"第一次给父母转钱","owner":"本篇（05 金钱篇同名，建议由家庭篇成条）"},{"title":"第一次参加葬礼","owner":"本篇（12 社交与沟通篇同名，建议由家庭篇成条）"}],"_file":"14-家庭篇.json","label":"家庭篇"},{"section":"15 旅行与出国篇","source_count":60,"merged_count":26,"raw_count":60,"entries":[{"id":"travel-01","title":"第一次做旅行攻略、第一次自由行与跨省旅行","merged_from":["第一次做旅行攻略","第一次自由行","第一次跨省旅行","第一次去完全陌生的城市"],"tags":["旅行","行程"],"cost":{"money":"因人而异","time":"规划 2–5 小时","willpower":"中"},"evidence":"B","body":{"plain":"攻略不是把想去的地方全列上，而是先定三件事：几天、每天住哪、每天怎么移动。这三件事定了，票和酒店自然订得下去。","steps":["先定总天数和落脚点：跨省旅行一般按一天一个城市排，中途转场别超过两次。","先订往返大交通，再订中间段；把每段的到达时间写进日历，中转至少留一小时余量。","住宿优先选地铁站或火车站附近的连锁酒店，第一次去陌生城市，位置比房间大小重要。","把行程、酒店地址、订单号整理成一张截图存本地相册，信号不好时也能看。"],"pitfalls":["行程排得太满，第一天就透支，后面全是硬撑。","热门景区很多要提前预约，到了门口才发现约不上。"]},"sources":[{"name":"文化和旅游部 国家卫生健康委关于做好旅游景区疫情防控和安全有序开放工作的通知","url":"https://www.gov.cn/zhengce/zhengceku/2020-04/14/content_5502188.htm","note":"要求景区核定并公示最大承载量、推行分时段预约、控制瞬时流量。 已用 curl 抓取本页并核对到关键词：「承载量」、「预约」。"},{"name":"旅行社条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2009-02/26/content_3989.htm","note":"规定旅行社应当与旅游者签订旅游合同，行程中安排购物需协商一致并载明。 已用 curl 抓取本页并核对到关键词：「旅游合同」、「购物」。"}]},{"id":"travel-02","title":"第一次一个人旅行：一个人在陌生城市过夜、第一次一个人出国","merged_from":["第一次一个人旅行","第一次一个人在陌生城市过夜","第一次一个人出国"],"tags":["旅行","独行","出国"],"cost":{"money":"因人而异","time":"2 天起","willpower":"中"},"evidence":"B","body":{"plain":"一个人旅行最大的变化是：没有人和你分担决定，也没有人替你看着包。","steps":["第一次一个人出门，先选国内交通方便的城市，住有 24 小时前台的连锁酒店，不要贪便宜住偏僻的民宿单间。","住宿必须实名登记，入住时出示本人身份证件，房卡不要和身份证放一起。","每天出门前把当天路线、酒店地址和房号发给一个家人或朋友，晚上回到房间再报一次平安。","一个人出国时把护照首页、签证页、机票订单各拍一张存手机，再复印一份放进行李箱。"],"pitfalls":["深夜独自打车、走没有灯的小巷，是一个人在外最容易出事的两个场景。","在青旅或酒吧认识的人第二天就带你换住处，务必留心，别跟着去非公开场所。"]},"sources":[{"name":"旅馆业治安管理办法（司法部 国家行政法规库）","url":"http://xzfg.moj.gov.cn/mobile/law/detail?LawID=1292","note":"第六条规定旅馆接待旅客住宿必须登记，查验旅客身份证件。 已用 curl 抓取本页并核对到关键词：「住宿登记」、「身份证」。"},{"name":"12308领保热线（中国领事服务网）","url":"https://cs.mfa.gov.cn/zggmcgx/lsbhyxz/12308lbrx/202607/t20260713_11981004.html","note":"外交部全球领事保护与服务应急热线，中国公民在海外可拨打求助。 已用 curl 抓取本页并核对到关键词：「12308」、「领事保护」。"}]},{"id":"travel-03","title":"第一次和朋友旅行、第一次和情侣旅行","merged_from":["第一次和朋友旅行","第一次情侣旅行"],"tags":["旅行","关系"],"cost":{"money":"因人而异","time":"因人而异","willpower":"中"},"evidence":"C","body":{"plain":"一起旅行最容易翻车的不是路线，是钱和节奏。出发前把这两件事说清楚，回来还能做朋友。","steps":["出发前开一次短会：预算上限、每天几点起、必去和可去的地方各列三个。","钱走一笔公共账：一个人先垫，每晚对一次账，比每顿饭 AA 到分省事。","房间和床位提前分配好，情侣旅行也留出半天各自活动的时间。","行程里安排一个分头行动的下午，谁都不必迁就谁。"],"pitfalls":["谁都不好意思提意见，第三天集体情绪爆炸。","全部订单由一个人订，出问题时所有怨气都冲他来，重要订单各自订自己的。"]},"sources":[{"name":"旅行社条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2009-02/26/content_3989.htm","note":"规定旅行社应当与旅游者签订旅游合同，行程中安排购物需协商一致并载明。 已用 curl 抓取本页并核对到关键词：「旅游合同」、「购物」。"}]},{"id":"travel-04","title":"第一次跟团游：合同、购物店与自费项目","merged_from":["第一次跟团游"],"tags":["旅行","跟团"],"cost":{"money":"团费因人而异","time":"按行程","willpower":"低"},"evidence":"A","body":{"plain":"跟团游买的是省心，但合同里写的和你以为的经常不是一回事。","steps":["签合同前逐条看：行程单里的景点与停留时间、住宿标准、用餐次数、购物店数量和名称、自费项目。","团费明显低于机票加酒店成本的，差价基本靠购物和自费项目补回来。","交钱后索取发票和合同，行程中被强制购物或擅自减少景点时保留证据。","发生纠纷先向组团社投诉，再向文旅部门、12345 或全国旅游服务热线投诉。"],"pitfalls":["只有微信转账记录、没签合同，维权时连对方主体都说不清。","导游在车上临时加价的项目，不去也要交钱的说法没有依据。"]},"sources":[{"name":"旅行社条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2009-02/26/content_3989.htm","note":"规定旅行社应当与旅游者签订旅游合同，行程中安排购物需协商一致并载明。 已用 curl 抓取本页并核对到关键词：「旅游合同」、「购物」。"}]},{"id":"travel-05","title":"第一次自驾游、第一次露营","merged_from":["第一次自驾游","第一次露营"],"tags":["旅行","自驾","露营"],"cost":{"money":"油费过路费因人而异","time":"1–3 天","willpower":"中"},"evidence":"A","body":{"plain":"自驾和露营的坑不在路上，在以为带了和以为是合法的那两件事上。","steps":["出发前检查轮胎、刹车、备胎和保险单；长途每两小时或每 200 公里休息一次。","春节、清明节、劳动节、国庆节四个节假日，7 座及以下小型客车免收通行费，但错峰比省钱重要。","露营选正规营地或有管理的景区，不在河道、干涸河床、山洪沟口扎营。","野外用火严格遵守当地防火规定，很多林区和草原全年禁火，离开时不留火种、不留垃圾。"],"pitfalls":["把帐篷扎在河滩上，上游下雨半夜涨水，是露营最要命的错误。","在禁火区生火被处罚只是轻的，引发山火要负刑事责任。"]},"sources":[{"name":"国务院关于批转交通运输部等部门重大节假日免收小型客车通行费实施方案的通知","url":"https://www.gov.cn/gongbao/content/2012/content_2201876.htm","note":"春节、清明节、劳动节、国庆节四个重大节假日免收7座及以下小型客车通行费。 已用 curl 抓取本页并核对到关键词：「重大节假日」、「小型客车」、「通行费」。"},{"name":"森林草原防灭火 这些知识要记牢（中国政府网 部门动态）","url":"https://www.gov.cn/lianbo/bumen/202503/content_7015041.htm","note":"野外用火的规定与防火要求，露营、野炊前必看。 已用 curl 抓取本页并核对到关键词：「野外」、「火」。"}]},{"id":"travel-06","title":"第一次爬山、第一次看日出与日落","merged_from":["第一次爬山","第一次看日出","第一次看日落"],"tags":["旅行","户外"],"cost":{"money":"门票与装备因人而异","time":"半天到两天","willpower":"高"},"evidence":"B","body":{"plain":"看日出是用睡眠换风景的交易，值不值先放一边，安全和时间必须算清楚。","steps":["提前查日出时间，倒推出发时间，上山留出比平时多一半的时间。","头灯、备用电源、冲锋衣、保温水必备，山顶的温度和山下不是一个季节。","走景区修好的步道，不抄野路；设定下撤死线，天黑还没走完一半就放弃。","看完日出别急着下山，人最挤的那段时间最危险，等第一波人流过去再走。"],"pitfalls":["穿普通运动鞋爬碎石坡，下山时最容易崴脚。","一个人夜爬又没告诉任何人路线，是救援最头疼的情况。"]},"sources":[{"name":"森林草原防灭火 这些知识要记牢（中国政府网 部门动态）","url":"https://www.gov.cn/lianbo/bumen/202503/content_7015041.htm","note":"野外用火的规定与防火要求，露营、野炊前必看。 已用 curl 抓取本页并核对到关键词：「野外」、「火」。"},{"name":"文化和旅游部 国家卫生健康委关于做好旅游景区疫情防控和安全有序开放工作的通知","url":"https://www.gov.cn/zhengce/zhengceku/2020-04/14/content_5502188.htm","note":"要求景区核定并公示最大承载量、推行分时段预约、控制瞬时流量。 已用 curl 抓取本页并核对到关键词：「承载量」、「预约」。"}]},{"id":"travel-07","title":"第一次去海边、第一次下海","merged_from":["第一次去海边","第一次下海"],"tags":["旅行","水上安全"],"cost":{"money":"因人而异","time":"半天","willpower":"低"},"evidence":"A","body":{"plain":"海和泳池完全不是一回事：有浪、有流、有暗坑，会游泳的人也可能出事。","steps":["只在有救生员值守、有明确泳区的沙滩下水，先看清旗帜和警示牌。","不要在礁石区、防波堤附近下水，退潮时也别往深处走，涨潮速度比你想的快。","不会游泳就穿好救生衣，在齐腰深的水里玩；带孩子时手不离人。","游泳属于高危险性体育项目，正规海水浴场和游泳馆应取得经营许可，优先选有资质的场所。"],"pitfalls":["被离岸流带走时拼命往回游，正确做法是沿岸平行游出流区再回岸。","酒后、饭后立刻下海，是溺水的高发组合。"]},"sources":[{"name":"经营高危险性体育项目许可管理办法（国家体育总局令第17号）","url":"https://www.sport.gov.cn/n315/n9041/n25319615/n25319619/c25523179/content.html","note":"规定经营高危险性体育项目应当取得许可，并明确许可条件、监督检查与法律责任。具体项目清单见体育总局公告第16号。 已用 curl 抓取本页并核对到关键词：「高危险性体育项目」、「游泳」、「滑雪」、「潜水」。"},{"name":"第一批高危险性体育项目目录公告（国家体育总局公告第16号，中国政府网）","url":"https://www.gov.cn/zwgk/2013-05/02/content_2394383.htm","note":"公告第一批高危险性体育项目为游泳，高山滑雪、自由式滑雪、单板滑雪，潜水，攀岩；经营这些项目须依《全民健身条例》取得许可。"}]},{"id":"travel-08","title":"第一次坐船、第一次坐游轮、第一次潜水","merged_from":["第一次坐船","第一次坐游轮","第一次潜水"],"tags":["旅行","水上安全"],"cost":{"money":"因人而异","time":"半天到数天","willpower":"中"},"evidence":"A","body":{"plain":"水上项目看着温柔，真出事时留给你的反应时间很短，所以规则都在上船前讲完。","steps":["上船先找救生衣和逃生路线，全程按要求穿好救生衣。","坐游轮多是出境行程，提前办好护照签证；船上是记账消费，离船前统一结算，看清账单再下船。","潜水必须找有资质的经营者（潜水属于高危险性体育项目，须取得许可），下水前如实告知病史，全程不单独行动。","浮潜要有教练带着，别脱离队伍去追鱼。"],"pitfalls":["潜水后短时间内坐飞机是常见禁忌，行程别排太紧。","晕船最有效的是提前吃药，上船后再吃往往来不及。"]},"sources":[{"name":"第一批高危险性体育项目目录公告（国家体育总局公告第16号，中国政府网）","url":"https://www.gov.cn/zwgk/2013-05/02/content_2394383.htm","note":"公告第一批高危险性体育项目为游泳，高山滑雪、自由式滑雪、单板滑雪，潜水，攀岩；经营这些项目须依《全民健身条例》取得许可。"},{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"}]},{"id":"travel-09","title":"第一次滑雪","merged_from":["第一次滑雪"],"tags":["旅行","户外","运动"],"cost":{"money":"雪票与装备数百元起","time":"1 天","willpower":"中"},"evidence":"A","body":{"plain":"滑雪是典型的看起来简单、摔起来很贵的运动。第一天的目标是学会刹车和摔倒，不是上高级道。","steps":["选有经营许可的正规雪场（滑雪属于高危险性体育项目），别去野雪和未开放雪道。","护具比雪板重要：头盔、雪镜、护臀护膝手套该租就租。","第一次请一小时教练，学会犁式刹车和正确摔倒姿势，比自己在坡上滚一下午划算。","上缆车前确认下撤路线，累了就坐缆车下，不要硬撑。"],"pitfalls":["直接上中级道，摔伤和被撞的概率成倍上升。","雪场外的黑车黑教练没有保障，出了问题找不到人负责。"]},"sources":[{"name":"经营高危险性体育项目许可管理办法（国家体育总局令第17号）","url":"https://www.sport.gov.cn/n315/n9041/n25319615/n25319619/c25523179/content.html","note":"规定经营高危险性体育项目应当取得许可，并明确许可条件、监督检查与法律责任。具体项目清单见体育总局公告第16号。 已用 curl 抓取本页并核对到关键词：「高危险性体育项目」、「游泳」、「滑雪」、「潜水」。"},{"name":"第一批高危险性体育项目目录公告（国家体育总局公告第16号，中国政府网）","url":"https://www.gov.cn/zwgk/2013-05/02/content_2394383.htm","note":"公告第一批高危险性体育项目为游泳，高山滑雪、自由式滑雪、单板滑雪，潜水，攀岩；经营这些项目须依《全民健身条例》取得许可。"}]},{"id":"travel-10","title":"第一次去高原、第一次高原反应","merged_from":["第一次去高原","第一次高原反应"],"tags":["旅行","健康","高原"],"cost":{"money":"因人而异","time":"3 天以上","willpower":"高"},"evidence":"B","body":{"plain":"高原反应不是体质差，是身体还没适应缺氧。多数人一两天会缓解，但拖成肺水肿、脑水肿就危险了。","steps":["先在中等海拔住一晚适应，再往高处走；到高原第一天不洗澡、不剧烈运动、不喝酒。","出发前了解自己的身体状况，有严重心肺疾病的人上山前先咨询医生。","出现头痛、恶心、睡不着是常见反应，吸氧、休息、别硬撑；症状持续加重就往低海拔撤。","提前查好沿途医院和最近的下撤路线。"],"pitfalls":["上到高原就兴奋地跑跳拍照，当晚反应最重。","硬扛着不休息，等到走不动时往往已经晚了。"]},"sources":[{"name":"《甘孜藏族自治州高原旅游健康管理手册》（甘孜州卫生健康委员会）","url":"http://wjw.gzz.gov.cn/wjwyw/article/707271","note":"地方卫健部门发布的高原旅游健康管理科普材料，讲高原反应的分级与应对。 已用 curl 抓取本页并核对到关键词：「高原」。"}]},{"id":"travel-11","title":"第一次景区预约、第一次网上买门票、第一次排长队","merged_from":["第一次景区预约","第一次网上买景区门票","第一次排长队"],"tags":["旅行","景区"],"cost":{"money":"门票因人而异","time":"1–3 小时","willpower":"低"},"evidence":"A","body":{"plain":"现在去大部分热门景区，第一步不是买票，是预约。到了门口才发现没约上，是最常见的白跑一趟。","steps":["提前在景区官方公众号、小程序或官方合作平台预约，注意分时段入园的时间窗。","景区核定了最大承载量，节假日会限流，尽量选上午第一批或下午最后一批。","网上买票看清是否可退可改、要不要换纸质票、是否含索道和园中园。","热门项目先玩排队最长的，或用官方快速通行预约，不要买黄牛的插队名额。"],"pitfalls":["在非官方渠道买低价票，到门口核验不了，钱票两空。","约了不去又不取消，不少景区会记录违约，影响下次预约。"]},"sources":[{"name":"文化和旅游部 国家卫生健康委关于做好旅游景区疫情防控和安全有序开放工作的通知","url":"https://www.gov.cn/zhengce/zhengceku/2020-04/14/content_5502188.htm","note":"要求景区核定并公示最大承载量、推行分时段预约、控制瞬时流量。 已用 curl 抓取本页并核对到关键词：「承载量」、「预约」。"},{"name":"旅行社条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2009-02/26/content_3989.htm","note":"规定旅行社应当与旅游者签订旅游合同，行程中安排购物需协商一致并载明。 已用 curl 抓取本页并核对到关键词：「旅游合同」、「购物」。"}]},{"id":"travel-12","title":"第一次迷路、第一次旅游丢东西、第一次旅游生病","merged_from":["第一次迷路","第一次旅游丢东西","第一次旅游生病","第一次国外迷路"],"tags":["旅行","应急"],"cost":{"money":"因人而异","time":"因人而异","willpower":"中"},"evidence":"B","body":{"plain":"旅行中的意外基本只有三类：找不到路、丢了东西、身体出状况。三类都有共同的第一动作——先停下来。","steps":["迷路时先看两样东西：手机地图上的定位点，和你身边最显眼的路牌或店铺名，别一边走一边乱问。","丢东西分两步：证件和银行卡先挂失（打银行客服、联系运营商），物品回到上一个停留点并在失物招领处登记。","生病先找最近的医院或药店，带上证件；在国外可以拨打 12308 或联系中国使领馆求助。","所有求助都留痕：报警回执、报案编号、客服工单号，理赔和补办都要用。"],"pitfalls":["证件丢失后自己找一整天，正确顺序是先在当地报警并索取证明，再办补办手续。","只买机票不买旅行意外险，生病和丢东西都得自己扛。"]},"sources":[{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"},{"name":"12308领保热线（中国领事服务网）","url":"https://cs.mfa.gov.cn/zggmcgx/lsbhyxz/12308lbrx/202607/t20260713_11981004.html","note":"外交部全球领事保护与服务应急热线，中国公民在海外可拨打求助。 已用 curl 抓取本页并核对到关键词：「12308」、「领事保护」。"}]},{"id":"travel-13","title":"第一次出国、第一次坐国际航班、第一次出境与过中国海关","merged_from":["第一次出国","第一次国际航班","第一次出境","第一次过中国海关"],"tags":["出国","交通","海关"],"cost":{"money":"因人而异","time":"比国内航班多留 2 小时","willpower":"中"},"evidence":"A","body":{"plain":"出国的顺序是值机、托运、边检出境、安检、登机。第一次走，比国内航班多留两个小时比较稳妥。","steps":["国际航班一般提前 3 小时到机场，先在航司柜台或线上值机，托运前确认免费行李额和超重费。","出境走中国边检通道，出示护照和登机牌；自助通道需要护照有芯片。","过海关如实申报：携带人民币现钞超过 2 万元、外币现钞超过等值 5000 美元的，要向海关申报。","登机前把护照、登机牌、签证页拍照存手机，纸质件不要全放托运行李里。"],"pitfalls":["联程票的中转时间少于两小时，风险很高，行李直挂要提前确认。","帮陌生人带东西，是最容易被卷入走私的行为。"]},"sources":[{"name":"公共航空运输旅客服务管理规定（中国民用航空局）","url":"https://www.gov.cn/zhengce/zhengceku/2021-03/15/content_5593193.htm","note":"规定承运人应当公示行李运输规定、航班延误后的服务与信息告知义务。 已用 curl 抓取本页并核对到关键词：「行李」、「航班」。"},{"name":"偏爱用现金？再爱也得符合要求（深圳市人民政府口岸办公室）","url":"https://ka.sz.gov.cn/gkmlpt/content/12/12283/post_12283223.html","note":"政府口岸部门对进出境携带现金规定的解读：携带人民币现钞超过2万元、外币现钞超过等值5000美元须向海关申报。 已用 curl 抓取本页并核对到关键词：「20000」、「申报」。"}]},{"id":"travel-14","title":"第一次办护照","merged_from":["第一次办护照"],"tags":["出国","证件"],"cost":{"money":"工本费以官方公布为准","time":"数个工作日","willpower":"低"},"evidence":"A","body":{"plain":"护照是中国公民出入国境和在国外证明身份的证件，第一次办要去公安出入境管理部门，不能找人代办。","steps":["带居民身份证到户籍地或居住地的公安出入境管理部门申请，现场填表、拍照、采集指纹。","未满 16 周岁的由监护人陪同，带户口本和监护人身份证。","受理后拿回执，按回执上的日期领证，也可以选择邮寄。","拿到护照先核对三处：姓名拼音、出生日期、有效期。"],"pitfalls":["临时决定出国才发现护照没办，护照办理需要工作日，务必提前。","护照有效期不足 6 个月，很多国家不允许入境，出行前先看一眼有效期。"]},"sources":[{"name":"普通护照签发服务指南（商务部国家层面海外综合服务平台转载国家移民管理局指南）","url":"https://fec.mofcom.gov.cn/article/ggfw/crjfw/crjfwxx/202512/2496.html","note":"列明申请普通护照所需材料（居民身份证、申请表、照片等）与办理时限。 已用 curl 抓取本页并核对到关键词：「护照」、「材料」。"}]},{"id":"travel-15","title":"第一次办签证、准备签证材料、第一次面签","merged_from":["第一次办签证","第一次准备签证材料","第一次面签","第一次签证出问题"],"tags":["出国","签证"],"cost":{"money":"签证费因国家而异","time":"1 周到 1 个月","willpower":"中"},"evidence":"A","body":{"plain":"签证是对方国家给的入境许可，能不能过主要看两件事：你去干什么、你会不会回来。","steps":["先在中国领事服务网或目的国驻华使领馆官网确认签证类别、材料清单和送签方式，别照中介给的旧清单准备。","常见材料：护照、照片、申请表、机票酒店订单、行程单、在职或在读证明、银行流水和资产证明。","需要面签的按预约时间到场，回答与材料一致即可，不要提材料以外的行程。","被拒签先弄清理由再重申，前后说法不一致是最常见的拒签原因。"],"pitfalls":["找不靠谱的中介做假材料，一旦被查出可能被长期拒签。","行程单和酒店订单互相矛盾，签证官一眼就能看出来。"]},"sources":[{"name":"中国领事服务网·出国签证","url":"https://cs.mfa.gov.cn/zggmcg/cgqz/","note":"外交部领事司官方栏目，汇总各国签证信息与申办出国签证的说明。 已用 curl 抓取本页并核对到关键词：「签证」、「护照」。"},{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"}]},{"id":"travel-16","title":"第一次外国入境、第一次填写入境卡、第一次回答海关问题","merged_from":["第一次外国入境","第一次填写入境卡","第一次回答海关问题"],"tags":["出国","入境"],"cost":{"money":"0 元","time":"1–2 小时","willpower":"中"},"evidence":"A","body":{"plain":"落地后的流程是入境检查、取行李、海关查验。跟着指示牌和同机的人走，不要慌。","steps":["下飞机前填好入境卡或申报单，姓名、护照号、航班号、停留地址要写准。","排非本国公民通道，递上护照和入境卡，按指纹、拍照，回答简单问题。","常见问题就三类：来做什么、待几天、住哪里；答不上来就出示酒店订单和回程机票。","取完行李过海关，食品、药品、超额现金如实申报，不确定就走红色申报通道。"],"pitfalls":["帮别人带东西、替别人回答问题，是最容易被扣下的行为。","说不清停留地址容易被带去二次询问，提前把酒店地址存成截图。"]},"sources":[{"name":"出境旅游有哪些注意事项（《中国海关》杂志）","url":"http://chinacustoms.gmcmonline.com/202601/c/21992.shtml","note":"海关总署主管刊物对进出境申报、携带物品限额的说明。 已用 curl 抓取本页并核对到关键词：「申报」、「海关」。"},{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"}]},{"id":"travel-17","title":"第一次换外币、第一次境外刷卡、第一次境外取现金","merged_from":["第一次换外币","第一次境外刷卡","第一次境外取现金"],"tags":["出国","金钱"],"cost":{"money":"手续费因银行而异","time":"半小时","willpower":"低"},"evidence":"A","body":{"plain":"出国用钱有三条路：换现金、刷卡、ATM 取现。建议三条都准备一点，但别带太多现金。","steps":["换汇走银行正规渠道，个人结汇和购汇在年度便利化额度内凭本人身份证办理。","出境携带外币现钞超过等值 5000 美元的，要向海关申报，带大量现金既不安全也不方便。","境外刷卡优先走银联通道，注意是否收货币转换费；出发前在银联国际的用卡锦囊里查目的地的受理情况。","ATM 取现前看清手续费和单日限额，尽量用银行网点或商场内的机器。"],"pitfalls":["在小店刷磁条卡容易被侧录，回国后莫名收到盗刷短信。","只带一张卡出门，丢了就没钱可用，至少分开放两张不同银行的卡。"]},"sources":[{"name":"外汇管理互联网信息——个人外汇（国家外汇管理局天津市分局）","url":"https://www.safe.gov.cn/tianjin/2026/0706/3085.html","note":"个人购汇、结汇的办理渠道与年度便利化额度的官方问答。 已用 curl 抓取本页并核对到关键词：「购汇」、「额度」。"},{"name":"银联卡境外用卡锦囊（银联国际）","url":"https://www.unionpayintl.com/cn/serviceCenter/cardUsingInstructions/811.shtml","note":"银联官方说明境外ATM取现、刷卡消费与相关手续费的用卡提示。 已用 curl 抓取本页并核对到关键词：「取现」、「手续费」。"}]},{"id":"travel-18","title":"第一次国外购物：退税、免税额度与带回国","merged_from":["第一次国外购物"],"tags":["出国","购物"],"cost":{"money":"因人而异","time":"1 小时","willpower":"低"},"evidence":"B","body":{"plain":"在国外买东西，便宜的部分一半来自退税、一半来自免税额度，两件事都有条件。","steps":["结账时问清能不能退税，索要退税单并核对护照号，离境时在机场办理盖章和退税。","保留购物小票和商品原包装，部分国家要求商品未使用、离境时出示。","回国入境时如实申报，超出免税限量的部分按规定缴税。","大额商品提前查清国内的保修和电压制式，别买回来用不了。"],"pitfalls":["忘了在机场盖章，退税单回国后就是一张废纸。","帮朋友代购，超量部分被海关查到要补税，责任在你。"]},"sources":[{"name":"出境旅游有哪些注意事项（《中国海关》杂志）","url":"http://chinacustoms.gmcmonline.com/202601/c/21992.shtml","note":"海关总署主管刊物对进出境申报、携带物品限额的说明。 已用 curl 抓取本页并核对到关键词：「申报」、「海关」。"},{"name":"银联卡境外用卡锦囊（银联国际）","url":"https://www.unionpayintl.com/cn/serviceCenter/cardUsingInstructions/811.shtml","note":"银联官方说明境外ATM取现、刷卡消费与相关手续费的用卡提示。 已用 curl 抓取本页并核对到关键词：「取现」、「手续费」。"}]},{"id":"travel-19","title":"第一次在国外坐地铁、打车与住酒店","merged_from":["第一次国外坐地铁","第一次国外打车","第一次国外住酒店"],"tags":["出国","交通","住宿"],"cost":{"money":"因人而异","time":"因人而异","willpower":"中"},"evidence":"B","body":{"plain":"国外的公共交通和酒店大多自助，第一次的难点是买票和看懂规则。","steps":["地铁先在自动售票机或官方 App 买票或交通卡，看清是分段计价还是按区计价，进站前确认方向。","打车用当地主流叫车软件或官方出租车候客点，上车前确认计价方式，不要上主动揽客的黑车。","酒店入住要出示护照登记，退房时核对账单，迷你吧和城市税经常单独收。","把酒店名片拍照存手机，迷路时给司机看比说地址可靠。"],"pitfalls":["逃票被查到，很多城市罚款很重，还可能留下记录。","酒店账单上的城市税、度假费不含在订房价格里，别以为被多收钱。"]},"sources":[{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"},{"name":"旅馆业治安管理办法（司法部 国家行政法规库）","url":"http://xzfg.moj.gov.cn/mobile/law/detail?LawID=1292","note":"第六条规定旅馆接待旅客住宿必须登记，查验旅客身份证件。 已用 curl 抓取本页并核对到关键词：「住宿登记」、「身份证」。"}]},{"id":"travel-20","title":"第一次在国外点餐、第一次语言完全不通","merged_from":["第一次国外点餐","第一次语言完全不通"],"tags":["出国","吃饭","语言"],"cost":{"money":"因人而异","time":"1 小时","willpower":"中"},"evidence":"C","body":{"plain":"语言不通的时候，最有效的工具不是翻译软件，是图片和手指。","steps":["进店先看门口有没有菜单，坐下后要菜单，menu 这个词多数国家通用。","看不懂就指邻桌的菜或菜单上的图片，再说一句 this one。","提前把过敏原和忌口写成当地语言的卡片给服务员看，比现场翻译可靠。","结账时说 bill 或 check；小费国家提前查清楚给多少，很多账单已经含服务费。"],"pitfalls":["不看价格就点，海鲜按重量计价，结账时才发现贵得离谱。","直译中文菜名给服务员看，多半看不懂，指图最快。"]},"sources":[{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"}]},{"id":"travel-21","title":"第一次联系中国使领馆、第一次在国外生病","merged_from":["第一次联系中国使领馆","第一次在国外生病"],"tags":["出国","应急","健康"],"cost":{"money":"医疗费自理","time":"因人而异","willpower":"高"},"evidence":"A","body":{"plain":"在国外遇到麻烦，使领馆能帮的和你以为的不太一样：他们能指路、补证件、联系家人，但不替你付医药费。","steps":["记住两个号码：12308（外交部全球领事保护与服务应急热线）和当地的报警急救电话。","护照、钱包被偷，先报警拿报警证明，再联系使领馆补办旅行证件。","生病先去当地医院或诊所，保留全部单据，回国后按保险条款申请理赔。","出国前把行程、保单号、紧急联系人留给家人，并记住中国驻当地使领馆电话。"],"pitfalls":["以为使领馆会垫付医疗费或出面解决纠纷，实际上主要是协助，费用仍由本人承担。","没买旅行保险，境外医疗费用会高得吓人。"]},"sources":[{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"},{"name":"12308领保热线（中国领事服务网）","url":"https://cs.mfa.gov.cn/zggmcgx/lsbhyxz/12308lbrx/202607/t20260713_11981004.html","note":"外交部全球领事保护与服务应急热线，中国公民在海外可拨打求助。 已用 curl 抓取本页并核对到关键词：「12308」、「领事保护」。"}]},{"id":"travel-22","title":"第一次跨时区、第一次倒时差","merged_from":["第一次跨时区","第一次倒时差"],"tags":["出国","健康"],"cost":{"money":"0 元","time":"3–7 天","willpower":"中"},"evidence":"B","body":{"plain":"时差是身体的生物钟和当地时间对不上。一般来说往东飞比往西飞更难倒。","steps":["出发前几天开始按目的地时间调整睡觉和吃饭，每天挪一到两小时。","飞机上按目的地时间作息：该睡就睡，该醒就开灯做事。","落地后白天多晒太阳、多活动，晚上按时睡，不要白天补长觉。","只待两三天的话，可以干脆按原来的作息办事，不必硬倒。"],"pitfalls":["落地当天白天睡四五个小时，当晚彻底睡不着，时差拖一周。","靠酒精助眠，睡眠质量反而更差。"]},"sources":[{"name":"乘坐国际航班如何倒时差（中国民航网）","url":"http://caacnews.com.cn/1/6/201910/t20191025_1283957.html","note":"民航局主管媒体对跨时区飞行与时差调整的科普。 已用 curl 抓取本页并核对到关键词：「时差」。"},{"name":"公共航空运输旅客服务管理规定（中国民用航空局）","url":"https://www.gov.cn/zhengce/zhengceku/2021-03/15/content_5593193.htm","note":"规定承运人应当公示行李运输规定、航班延误后的服务与信息告知义务。 已用 curl 抓取本页并核对到关键词：「行李」、「航班」。"}]},{"id":"travel-23","title":"第一次长期旅行、第一次回国","merged_from":["第一次长期旅行","第一次回国","第一次发现世界比想象中大"],"tags":["旅行","出国","长期"],"cost":{"money":"因人而异","time":"1 个月以上","willpower":"高"},"evidence":"B","body":{"plain":"长期旅行和度假是两回事：度假是花钱买放松，长期旅行是换个地方过日子，考验的是体力、预算和情绪。","steps":["出发前算清每月固定支出（住宿、吃饭、交通、保险），留出至少三个月的备用金。","注意签证停留期，很多免签或旅游签有时间上限，超期会被罚款甚至限制入境。","回国前处理三件事：退税、注销当地的手机卡和银行账户、结清房租。","入境时如实申报携带物品，超过免税限量的按规定缴税。"],"pitfalls":["把旅行当成逃避，走到第三个月发现钱没了、问题还在。","在国外的订阅和会员忘了取消，回国后继续扣费。"]},"sources":[{"name":"出境旅游有哪些注意事项（《中国海关》杂志）","url":"http://chinacustoms.gmcmonline.com/202601/c/21992.shtml","note":"海关总署主管刊物对进出境申报、携带物品限额的说明。 已用 curl 抓取本页并核对到关键词：「申报」、「海关」。"},{"name":"《中国领事保护与协助指南》和《中华人民共和国领事保护与协助条例》（中国驻外使馆网站）","url":"https://sd.china-embassy.gov.cn/chn/lsfw/lsbhjxz/lbxzzn/202606/t20260616_11946935.htm","note":"领事保护与协助的范围、求助渠道与12308热线，出国前应当了解。 已用 curl 抓取本页并核对到关键词：「领事保护」、「12308」、「护照」。"}]},{"id":"travel-a1","title":"第一次办旅行意外险并看清免责条款","merged_from":[],"tags":["旅行","保险"],"cost":{"money":"几十到几百元","time":"20 分钟","willpower":"低"},"evidence":"A","body":{"plain":"境外医疗、航班延误、行李丢失都靠旅行险兜底，但潜水、滑雪、高原、极限运动常被列为免责，买之前先确认。","steps":["按行程选险种：境内/境外、医疗保额、是否含紧急救援","逐条看免责条款：高风险运动、既往症、酒驾、未按规定就医","确认理赔材料要求：病历、发票原件、警方或航司证明","把保单号与救援电话存到手机离线备忘录"],"pitfalls":["只比价格不看免责，出事才发现不赔","境外就医后没保留原件，回国无法理赔"]},"sources":[{"name":"《中华人民共和国保险法》","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=6951","note":"保险合同的免责条款应向投保人明确说明"},{"name":"《银行保险机构消费者权益保护管理办法》","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"银行保险机构应向消费者充分披露保障范围与免责事项"}],"addition":true,"why":"境外医疗、航班延误、行李丢失都靠它兜底，但高风险项目常被免责"},{"id":"travel-a2","title":"第一次在境外上网（当地卡、eSIM 与漫游）","merged_from":[],"tags":["旅行","出国","数码"],"cost":{"money":"几十到几百元","time":"出发前 1 天","willpower":"低"},"evidence":"B","body":{"plain":"落地能不能上网，直接决定你能不能叫车、导航和求助。三条路：买当地卡、开 eSIM、用国内号漫游，各有取舍。","steps":["出发前比较三种方案的价格与流量，确认手机是否支持 eSIM","优先在落地前装好 eSIM 或买好当地卡，避免机场临时高价买","关掉国内号数据漫游，避免天价流量费；保留短信接收能力","把离线地图、翻译离线包和酒店地址提前下载好"],"pitfalls":["没网就找不到接机人，落地即失联","国内号漫游开着自动更新，回国收到巨额账单"]},"sources":[{"name":"工业和信息化部（电信服务与用户权益）","url":"https://www.miit.gov.cn/","note":"国际漫游资费与电信服务由运营商提供，具体以运营商公告与套餐为准"}],"addition":true,"why":"落地后能不能上网，直接决定能不能叫车、导航和求助"},{"id":"travel-a3","title":"第一次看目的地的安全提醒与旅行提示","merged_from":[],"tags":["旅行","出国","安全"],"cost":{"money":"0","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"出发前查一次外交部的国别安全提醒，能避开不少麻烦：政局、治安、疫情、自然灾害和入境要求都会提前发布。","steps":["在中国领事服务网或中国领事 App 查目的地的安全提醒与旅行提示","记下当地报警电话与中国使领馆、12308 领保热线","出发前把行程与联系人告知家人，保持可联系","遇到紧急情况先报警，再联系使领馆"],"pitfalls":["只看攻略不看安全提醒，忽略地区风险","出事才第一次打开领事服务网，来不及登记信息"]},"sources":[{"name":"中国领事服务网（外交部）","url":"https://cs.mfa.gov.cn/","note":"国别安全提醒与领事保护信息"},{"name":"12308 领保热线（中国领事服务网）","url":"https://cs.mfa.gov.cn/zggmcgx/lsbhyxz/12308lbrx/202607/t20260713_11981004.html","note":"12308 领保热线使用方式"}],"addition":true,"why":"领事服务网和中国领事 App 会按国别发布安全提醒，出发前查一次能避坑"}],"additions":[],"cross_ref":[{"title":"第一次住青旅","owner":"03 酒店住宿篇（住宿类归住宿篇，本篇只在正文里提及，不在 merged_from 里，避免重复成条）"},{"title":"第一次护照丢失","owner":"18 安全与紧急情况篇（18 篇的丢失证件组更贴切；本篇在使领馆求助条目里只写补办思路，不重复成条）"}],"_file":"15-旅行与出国篇.json","label":"旅行与出国篇"},{"section":"16 数码与网络篇","source_count":50,"merged_count":22,"raw_count":50,"entries":[{"id":"digital-01","title":"第一次买手机、第一次买电脑、第一次自己装电脑","merged_from":["第一次买智能手机","第一次买电脑","第一次自己装电脑"],"tags":["数码","消费"],"cost":{"money":"数千元起","time":"1 天到 1 周","willpower":"中"},"evidence":"A","body":{"plain":"买数码产品的核心不是配置表，而是售后：坏了能不能换、修多久、谁来修。先把三包和退换规则看明白再下单。","steps":["先定预算和用途，再看参数；同一价位优先选售后网点多、口碑稳的品牌。","电脑等微型计算机商品适用三包规定：出现性能故障的，按规定可以修理、更换、退货，具体时限以规定条文和厂商条款为准。","网购保留订单、发票或电子发票、聊天记录；开箱时录一段视频，外观瑕疵和少件最容易说不清。","自己装机时先核对主板、CPU、内存、电源的兼容性和功耗，装好后先点亮再装进机箱，方便排查问题。"],"pitfalls":["只看跑分不看散热和做工，用一年就降频卡顿。","在非授权渠道买整机，出问题时厂商和卖家互相推。"]},"sources":[{"name":"微型计算机商品修理更换退货责任规定（国家市场监督管理总局，中国政府网）","url":"https://www.gov.cn/zhengce/2020-07/23/content_5723729.htm","note":"电脑等微型计算机商品的'三包'规定，明确退货、换货、修理的时限与条件。 已用 curl 抓取本页并核对到关键词：「三包」、「退货」。"},{"name":"中华人民共和国电子商务法（商务部全球法规网）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应当履行商品服务质量保障、信息公示等义务。 已用 curl 抓取本页并核对到关键词：「电子商务法」、「消费者」。"}]},{"id":"digital-02","title":"第一次安装系统、第一次重装系统","merged_from":["第一次安装系统","第一次重装系统"],"tags":["数码","系统"],"cost":{"money":"0 元（正版授权另计）","time":"1–3 小时","willpower":"中"},"evidence":"B","body":{"plain":"重装系统本身不难，难的是重装前后的两件事：备份，和确认保修还在不在。","steps":["重装前把桌面、文档、浏览器书签、微信和 QQ 的聊天记录导出到移动硬盘或云盘。","记录当前系统的激活状态和账号（微软账号、Office 授权），重装后要用同一账号激活。","安装镜像走官方渠道下载，装完先装网卡、显卡驱动，再联网更新系统。","如果是品牌整机在保修期内，先问清自行重装是否影响保修，需要送修就直接找售后。"],"pitfalls":["以为数据在 C 盘以外就安全，分区操作失误一样全没。","装来路不明的精简版镜像，里面可能预置了后门和推广软件。"]},"sources":[{"name":"微型计算机商品修理更换退货责任规定（国家市场监督管理总局，中国政府网）","url":"https://www.gov.cn/zhengce/2020-07/23/content_5723729.htm","note":"电脑等微型计算机商品的'三包'规定，明确退货、换货、修理的时限与条件。 已用 curl 抓取本页并核对到关键词：「三包」、「退货」。"},{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"}]},{"id":"digital-03","title":"第一次备份数据、第一次恢复数据、第一次使用云盘","merged_from":["第一次备份数据","第一次恢复数据","第一次使用云盘"],"tags":["数码","数据"],"cost":{"money":"硬盘或云盘会员几十到几百元","time":"首次 1 小时","willpower":"低"},"evidence":"B","body":{"plain":"备份的意义不是不丢，而是丢了还能回来。判断备份有没有用只有一个标准：你有没有真的恢复过一次。","steps":["按三份原则安排：原件一份、本地备份一份（移动硬盘）、异地一份（云盘）。","云盘选大厂、开二次验证，敏感资料先加密再上传。","给备份设一个固定节奏：每周一次增量、每月一次全量，写在日历里。","每半年做一次恢复演练：随便挑一个文件从备份里还原，确认文件能打开。"],"pitfalls":["只做了同步没做备份：本地删掉，云盘跟着删，这是最常见的翻车方式。","云盘账号只用一个邮箱加一个弱密码，被盗等于数据全泄露。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"}]},{"id":"digital-04","title":"第一次备份照片、第一次丢失全部数据","merged_from":["第一次备份照片","第一次丢失全部数据"],"tags":["数码","数据","照片"],"cost":{"money":"因人而异","time":"首次 1–2 小时","willpower":"低"},"evidence":"C","body":{"plain":"照片是大多数人唯一会心疼的数据，偏偏它最容易被一次误操作、一次进水全部带走。","steps":["手机相册开启云端同步（iCloud、各品牌云服务或网盘），确认同步真的完成再清理本地。","重要照片（家人、证件、票据）单独建一个相册，定期导出到电脑或移动硬盘。","数据已经丢了先做一件事：停止往那块硬盘或手机上写入新数据，越写越难恢复。","机械硬盘的物理故障不要自己拆开，找正规数据恢复机构，先问报价再决定。"],"pitfalls":["把照片只存在手机里，手机丢了、进水了，全部归零。","在丢失数据后继续拍照、继续下载，覆盖掉可恢复的扇区。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"},{"name":"微型计算机商品修理更换退货责任规定（国家市场监督管理总局，中国政府网）","url":"https://www.gov.cn/zhengce/2020-07/23/content_5723729.htm","note":"电脑等微型计算机商品的'三包'规定，明确退货、换货、修理的时限与条件。 已用 curl 抓取本页并核对到关键词：「三包」、「退货」。"}]},{"id":"digital-05","title":"第一次注册邮箱、第一次注册网站账号","merged_from":["第一次注册邮箱","第一次注册网站"],"tags":["数码","账号"],"cost":{"money":"0 元","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"邮箱是你所有账号的钥匙：找回密码、接收验证码、接收账单都靠它。第一个邮箱值得认真选。","steps":["主邮箱选长期稳定的大厂服务，用真名拼音加数字，别用会被当成垃圾的随意字符串。","主邮箱只用来注册重要服务（银行、政务、支付），论坛和购物网站另用一个邮箱。","注册网站时看清隐私政策和授权范围，能不授权的通讯录、位置、相册就别授权。","用一个密码管理器记录账号和密码，比在浏览器里到处保存安全。"],"pitfalls":["所有网站都用同一个密码，一个站被拖库，全部账号跟着完蛋。","用工作邮箱注册私人服务，离职后全部收不到验证码。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"},{"name":"中华人民共和国电子商务法（商务部全球法规网）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应当履行商品服务质量保障、信息公示等义务。 已用 curl 抓取本页并核对到关键词：「电子商务法」、「消费者」。"}]},{"id":"digital-06","title":"第一次拥有自己的域名、第一次做网站、第一次部署网站、第一次买服务器","merged_from":["第一次拥有自己的域名","第一次做网站","第一次部署网站","第一次买服务器"],"tags":["数码","网站","开发者"],"cost":{"money":"域名几十元/年，服务器几十到几百元/月","time":"1 天到 2 周","willpower":"中"},"evidence":"A","body":{"plain":"做个人网站的技术门槛已经很低，真正卡人的是合规：域名要实名，网站要备案。","steps":["注册域名时提交真实、准确、完整的身份信息，注册服务机构会核验，信息不实会被停止解析。","在国内服务器上放网站，需要先办非经营性互联网信息服务备案（ICP 备案），通过服务商提交材料。","备案通过后再解析域名、部署代码；网站底部一般要标注备案号并链接到工信部备案系统。","服务器先买最小配置按量付费，跑通再升级；上线前开好自动快照和备份。"],"pitfalls":["先买服务器再想备案，备案没下来网站一直打不开。","域名到期忘了续费，被人抢注后再想买回来要花大价钱。"]},"sources":[{"name":"互联网域名管理办法（工业和信息化部令第43号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2017/content_5241917.htm","note":"规定域名注册应当提供真实、准确、完整的身份信息，域名注册服务机构负责核验。 已用 curl 抓取本页并核对到关键词：「真实、准确、完整」。"},{"name":"非经营性互联网信息服务核准（工业和信息化部政务服务平台）","url":"https://ythzxfw.miit.gov.cn/bssx/alx/dxhhlw/art/2025/art_88c400fc83904008bcf5b11bc08ec18f.html","note":"工信部办事事项页，说明非经营性互联网信息服务（网站ICP备案）的办理依据与流程。 已用 curl 抓取本页并核对到关键词：「备案」、「非经营性互联网信息服务」。"}]},{"id":"digital-07","title":"第一次使用 GitHub、第一次提交代码、第一次发布自己的项目","merged_from":["第一次使用 GitHub","第一次提交代码","第一次发布自己的项目"],"tags":["数码","开发者","开源"],"cost":{"money":"0 元（公开仓库）","time":"1–3 天","willpower":"中"},"evidence":"B","body":{"plain":"GitHub 是把代码放到网上、并且记录每一次改动的地方。对新手来说，先跑通创建仓库、提交、发布这三个动作就够了。","steps":["注册账号后建一个仓库，勾选 README，先让仓库有内容。","在网页上直接改文件并提交，感受一次完整的提交记录，再学本地 Git。","给项目写一个说得清的 README：这是做什么的、怎么跑起来、依赖什么。","发布时打上版本标签并写 Release 说明；涉及密钥、手机号、身份证的文件绝不能提交上去。"],"pitfalls":["把 API Key 和密码提交到公开仓库，机器人几分钟内就会扫到并盗用。","提交历史里删掉文件不等于消失，敏感信息一旦推上去要立刻更换密钥。"]},"sources":[{"name":"仓库快速入门（GitHub 官方中文文档）","url":"https://docs.github.com/zh/repositories/creating-and-managing-repositories/quickstart-for-repositories","note":"GitHub 官方文档，讲创建仓库、提交更改与发布项目的基本流程。 已用 curl 抓取本页并核对到关键词：「仓库」。"}]},{"id":"digital-08","title":"第一次做 App、第一次做小程序","merged_from":["第一次做 App","第一次做小程序"],"tags":["数码","开发者","合规"],"cost":{"money":"备案与认证费用因人而异","time":"1 周到 1 个月","willpower":"中"},"evidence":"A","body":{"plain":"做 App 和小程序，写代码只是第一步，能不能上线取决于备案和平台审核。","steps":["先明确主体：个人还是企业。涉及支付、医疗、教育等类目，个人主体通常做不了。","按工信部要求完成移动互联网应用程序备案，小程序、小游戏也要完成平台侧的备案与内容标识。","按平台文档准备隐私政策、用户协议、类目资质，审核被打回多半是这些材料的问题。","上线前自查：是否收集了不必要的权限、是否给未成年人做了保护、是否有内容审核机制。"],"pitfalls":["先开发三个月再去看类目要求，结果发现个人主体做不了，白干。","隐私政策写成模板直接抄，收集范围和实际不一致，审核必挂。"]},"sources":[{"name":"工业和信息化部关于开展移动互联网应用程序备案工作的通知（国务院部门文件）","url":"https://www.gov.cn/zhengce/zhengceku/202308/content_6897341.htm","note":"要求从事App等互联网信息服务的，应当依法履行备案手续。 已用 curl 抓取本页并核对到关键词：「备案」、「移动互联网应用程序」。"},{"name":"小程序备案服务内容标识选择指引（微信开放文档）","url":"https://developers.weixin.qq.com/minigame/product/record/record_review.html","note":"平台官方文档，说明小程序/小游戏上线前须完成的备案与内容标识要求。 已用 curl 抓取本页并核对到关键词：「备案」。"}]},{"id":"digital-09","title":"第一次使用 AI、第一次让 AI 帮自己写代码、第一次使用 AI Agent","merged_from":["第一次使用 AI","第一次让 AI 帮自己写代码","第一次使用 AI Agent"],"tags":["数码","AI"],"cost":{"money":"免费额度到每月几十上百元","time":"1 小时上手","willpower":"低"},"evidence":"A","body":{"plain":"把 AI 当成一个很快但会一本正经胡说八道的实习生：能替你起草、解释、找思路，但结论必须自己核。","steps":["先想清楚要它做什么，把背景、目标、限制条件一次说清，比反复追问效率高。","让 AI 写代码时，要求它给出可运行的完整片段和依赖版本，跑通后再改。","涉及事实、数字、法条的回答必须回到官方来源核对，尤其是政策、价格、医疗信息。","不要把身份证号、银行卡号、公司内部资料、他人隐私粘进对话框。"],"pitfalls":["直接复制 AI 给的代码上线，没测过的边界条件会变成事故。","把 AI 生成的论文段落、代码原样交作业，可能构成学术不端或侵权。"]},"sources":[{"name":"生成式人工智能服务管理暂行办法（网信办等七部门令第15号，国务院公报）","url":"https://www.gov.cn/gongbao/2023/issue_10666/202308/content_6900864.html","note":"规定提供生成式人工智能服务应当履行备案、内容标识等义务，不得生成违法内容。 已用 curl 抓取本页并核对到关键词：「生成式人工智能」、「备案」。"},{"name":"中华人民共和国反电信网络诈骗法（宁夏回族自治区通信管理局）","url":"https://nxca.miit.gov.cn/ztzl/ffzldxwlzp/art/2022/art_6985069057e24505af500a44aec108a5.html","note":"规定任何单位和个人不得非法出租、出借电话卡、银行账户、支付账户；对涉诈异常账户可采取限制、暂停服务等措施。 已用 curl 抓取本页并核对到关键词：「电话卡」、「出租」、「出借」。"}]},{"id":"digital-10","title":"第一次发布自己的 AI 产品、第一次获得网站用户、第一次收到用户反馈","merged_from":["第一次发布自己的 AI 产品","第一次获得网站用户","第一次收到用户反馈"],"tags":["数码","产品","合规"],"cost":{"money":"API 按量计费，因人而异","time":"1–4 周","willpower":"中"},"evidence":"A","body":{"plain":"做出一个能跑的东西和把它放到网上给别人用，中间差着合规、成本和用户这三关。","steps":["上线前先确认义务：提供生成式人工智能服务要按规定履行备案等手续，做好内容标识和违法内容处置。","给 API 设置用量上限和余额告警，别让一个爬虫在一夜之间烧掉你一个月的预算。","找前十个用户的方式通常是熟人、相关社群和垂直论坛，不要一上线就投广告。","收到反馈先分类：不能用的 bug、不好用的体验、不想要的新功能，按这个顺序处理。"],"pitfalls":["没有内容审核就放开输入，很快会被用来生成违规内容，责任在运营者。","用户反馈当成差评情绪对抗，其实那是最便宜的免费测试。"]},"sources":[{"name":"生成式人工智能服务管理暂行办法（网信办等七部门令第15号，国务院公报）","url":"https://www.gov.cn/gongbao/2023/issue_10666/202308/content_6900864.html","note":"规定提供生成式人工智能服务应当履行备案、内容标识等义务，不得生成违法内容。 已用 curl 抓取本页并核对到关键词：「生成式人工智能」、「备案」。"},{"name":"中华人民共和国电子商务法（商务部全球法规网）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应当履行商品服务质量保障、信息公示等义务。 已用 curl 抓取本页并核对到关键词：「电子商务法」、「消费者」。"}]},{"id":"digital-11","title":"第一次网站宕机、第一次服务器出问题","merged_from":["第一次网站宕机","第一次服务器出问题"],"tags":["数码","运维"],"cost":{"money":"因人而异","time":"1 小时到 1 天","willpower":"高"},"evidence":"C","body":{"plain":"网站在半夜挂掉是常态。第一反应该是恢复服务，第二反应才是查原因，顺序反了会挨更久的骂。","steps":["先确认范围：只有自己打不开，还是所有人都打不开；用第三方监测或手机流量访问验证。","看监控和日志：CPU、内存、磁盘、带宽哪个先到顶，再看最近的变更记录。","恢复优先：重启服务、回滚上一次发布、切到备用节点，把服务救回来再慢慢分析。","事后写一份复盘：时间线、影响、直接原因、防止复发的动作，写下来才算真的处理完。"],"pitfalls":["出事时没有备份和快照，回滚不了只能干等。","不通知用户，等用户自己发现，信任损失比宕机本身更大。"]},"sources":[{"name":"中华人民共和国电子商务法（商务部全球法规网）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应当履行商品服务质量保障、信息公示等义务。 已用 curl 抓取本页并核对到关键词：「电子商务法」、「消费者」。"},{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"}]},{"id":"digital-12","title":"第一次账号被盗、第一次邮箱被盗、第一次恢复被盗账号、第一次发现个人信息泄露","merged_from":["第一次账号被盗","第一次邮箱被盗","第一次恢复被盗账号","第一次发现个人信息泄露"],"tags":["数码","安全"],"cost":{"money":"0 元","time":"1–7 天","willpower":"中"},"evidence":"A","body":{"plain":"账号被盗的第一反应不是改密码，而是先把登录入口抢回来：把对方踢下线，再补漏洞。","steps":["用还能登录的设备改密码，并在安全设置里退出所有设备，撤销第三方授权。","邮箱被盗先检查转发规则和自动回复，很多骗子靠转发规则长期偷验证码。","查看近期登录记录和绑定信息，把陌生手机号、备用邮箱、支付方式全部解绑。","发现个人信息泄露，可以向平台投诉要求删除，必要时向网信、公安部门举报。"],"pitfalls":["只改密码不踢设备，对方靠登录态照样用你的账号。","把验证码读给自称客服的人，这是账号被盗最典型的前置动作。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"},{"name":"中华人民共和国反电信网络诈骗法（宁夏回族自治区通信管理局）","url":"https://nxca.miit.gov.cn/ztzl/ffzldxwlzp/art/2022/art_6985069057e24505af500a44aec108a5.html","note":"规定任何单位和个人不得非法出租、出借电话卡、银行账户、支付账户；对涉诈异常账户可采取限制、暂停服务等措施。 已用 curl 抓取本页并核对到关键词：「电话卡」、「出租」、「出借」。"}]},{"id":"digital-13","title":"第一次电脑中毒、第一次遇到钓鱼网站","merged_from":["第一次电脑中毒","第一次遇到钓鱼网站"],"tags":["数码","安全"],"cost":{"money":"0 元起","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"中毒和钓鱼，九成是自己点的：破解软件、陌生附件、看着像官网的链接。","steps":["先断网，再用正规杀毒软件全盘查杀；重要文件先备份再处理，别急着格式化。","回想最近装了什么、点了什么，把来源不明的软件和浏览器插件全部卸载。","遇到钓鱼网站，立刻在正确域名下手动输入网址登录并改密码，不要在邮件或短信里的链接上操作。","检查是否被装了远控，看异常进程、开机启动项和陌生的远程连接记录。"],"pitfalls":["为了装破解软件关掉杀毒和系统防护，等于把门打开。","在钓鱼页面输入过一次密码，就算之后关闭页面，密码也已经泄露。"]},"sources":[{"name":"中华人民共和国反电信网络诈骗法（宁夏回族自治区通信管理局）","url":"https://nxca.miit.gov.cn/ztzl/ffzldxwlzp/art/2022/art_6985069057e24505af500a44aec108a5.html","note":"规定任何单位和个人不得非法出租、出借电话卡、银行账户、支付账户；对涉诈异常账户可采取限制、暂停服务等措施。 已用 curl 抓取本页并核对到关键词：「电话卡」、「出租」、「出借」。"},{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"}]},{"id":"digital-14","title":"第一次收到诈骗短信、第一次接到诈骗电话","merged_from":["第一次收到诈骗短信","第一次接到诈骗电话"],"tags":["数码","安全","反诈"],"cost":{"money":"0 元","time":"1 分钟","willpower":"低"},"evidence":"A","body":{"plain":"诈骗短信和电话的套路只有一个目标：让你在慌或者贪的状态下转账、报验证码、装软件。挂断和删除就是最好的处理。","steps":["凡是自称公检法、客服退款、领导借钱的电话，一律挂断，再从官方渠道自己打回去核实。","短信里的链接不点，快递、银行、社保类信息一律到官方 App 里查。","任何人索要短信验证码、支付密码、共享屏幕，都是诈骗，直接拒绝。","已经被骗立即拨打 110 或到最近的派出所报案，同时联系银行止付。"],"pitfalls":["按对方要求下载远控软件并共享屏幕，等于把手机交给骗子。","觉得没损失就不用管，实际上你的信息可能已经被登记为潜在目标。"]},"sources":[{"name":"中华人民共和国反电信网络诈骗法（宁夏回族自治区通信管理局）","url":"https://nxca.miit.gov.cn/ztzl/ffzldxwlzp/art/2022/art_6985069057e24505af500a44aec108a5.html","note":"规定任何单位和个人不得非法出租、出借电话卡、银行账户、支付账户；对涉诈异常账户可采取限制、暂停服务等措施。 已用 curl 抓取本页并核对到关键词：「电话卡」、「出租」、「出借」。"},{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"}]},{"id":"digital-15","title":"第一次开启双因素认证、第一次设置密码管理器","merged_from":["第一次开启双因素认证","第一次设置密码管理器"],"tags":["数码","安全"],"cost":{"money":"0 元起","time":"30 分钟","willpower":"低"},"evidence":"A","body":{"plain":"密码管理器解决记不住的问题，双因素认证解决被猜中的问题，这两件事一起做，账号安全会上一个台阶。","steps":["先给最重要的四个账号开双因素认证：主邮箱、银行、支付、常用社交账号。","优先用验证器 App 或硬件密钥，短信验证码是三者里最弱的。","选一个主流密码管理器，给主密码设一个长而好记的句子，并开启它的双因素认证。","把恢复码打印出来放在家里安全的地方，手机丢了才不至于被锁在门外。"],"pitfalls":["把恢复码截图存在同一个手机里，手机丢了就一起丢。","同一个密码到处用，一个不重要的论坛被拖库，邮箱和支付跟着沦陷。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"},{"name":"中华人民共和国反电信网络诈骗法（宁夏回族自治区通信管理局）","url":"https://nxca.miit.gov.cn/ztzl/ffzldxwlzp/art/2022/art_6985069057e24505af500a44aec108a5.html","note":"规定任何单位和个人不得非法出租、出借电话卡、银行账户、支付账户；对涉诈异常账户可采取限制、暂停服务等措施。 已用 curl 抓取本页并核对到关键词：「电话卡」、「出租」、「出借」。"}]},{"id":"digital-16","title":"第一次删除自己的网络痕迹、第一次管理自己的数字资产","merged_from":["第一次删除自己的网络痕迹","第一次管理自己的数字资产"],"tags":["数码","隐私","资产"],"cost":{"money":"0 元","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"你在网上的痕迹分两类：自己能删的（账号、帖子）和删不掉的（被转载、被存档的）。先处理第一类，再接受第二类的存在。","steps":["列出所有注册过的账号，能注销的注销，不能注销的清理个人信息、解除授权、退出登录。","法律规定在处理目的已实现、停止提供产品或服务、个人撤回同意等情形下，个人信息处理者应当主动删除个人信息，个人也有权请求删除。","数字资产要列清单：域名、服务器、云盘、付费软件、账号余额、虚拟道具，写清在哪个平台、用什么邮箱注册。","把清单和关键账号的处置方式留给一个信任的人，域名和服务器到期不续费，网站就会消失。"],"pitfalls":["以为注销账号就删干净了，实际上很多平台只是停用，数据仍在。","域名、服务器用临时邮箱注册，本人也找不回，续费和转移都做不了。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"},{"name":"《中华人民共和国民法典》全文（贵阳市人大网站转载新华社受权发布全文）","url":"https://www.gzrd.gov.cn/xwzx/rdyw/202006/t20200602_77652025.html","note":"第五百八十六条规定定金合同自实际交付定金时成立，定金数额不得超过主合同标的额的百分之二十；第一千零四十五条界定近亲属范围；第一千零四十三条倡导家庭成员敬老爱幼、互相帮助。 已用 curl 抓取本页并核对到关键词：「定金」、「近亲属」、「敬老爱幼」、「家风」。"}]},{"id":"digital-17","title":"第一次购买数字服务、第一次取消自动续费、第一次遇到会员自动扣费","merged_from":["第一次购买数字服务","第一次取消自动续费","第一次遇到会员自动扣费"],"tags":["数码","消费"],"cost":{"money":"每月几元到几十元","time":"10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"自动续费的坑不在扣钱，而在你根本想不起来取消。订阅的时候顺手做一件事：记下到期日。","steps":["开通会员时看清首月优惠后的正常价格、续费周期和取消方式，截一张图存下来。","按网络交易监督管理办法，采取自动展期、自动续费方式的，经营者应当在消费者接受服务前和自动续费日期前五日，以显著方式提请消费者注意。","取消续费要去开通的地方取消：苹果手机在订阅管理里关，安卓在应用商店或支付平台的免密支付里关。","已经被扣费且不符合提醒义务的，先找平台客服要求退款，协商不成可以投诉。"],"pitfalls":["在 App 内删掉应用不等于取消订阅，扣费照旧。","只关了一个渠道的免密支付，另一张卡的代扣还在。"]},"sources":[{"name":"网络交易监督管理办法（市场监管总局令第37号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2021/content_5602020.htm","note":"第十八条：采取自动展期、自动续费方式的，应当在消费者接受服务前和自动展期、自动续费等日期前五日，以显著方式提请消费者注意。 已用 curl 抓取本页并核对到关键词：「自动续费」、「五日」。"},{"name":"中华人民共和国消费者权益保护法实施条例（广东省司法厅网站全文）","url":"http://sft.gd.gov.cn/sfw/zwgk/zcwj/content/mpost_4398318.html","note":"2024年7月1日施行，对自动续费提醒、预付款、网络消费等作出细化规定。 已用 curl 抓取本页并核对到关键词：「自动续费」。"}]},{"id":"digital-18","title":"第一次申请数字服务退款、第一次购买软件、第一次购买 AI API","merged_from":["第一次申请数字服务退款","第一次购买软件","第一次购买 AI API"],"tags":["数码","消费"],"cost":{"money":"因人而异","time":"1–15 天","willpower":"中"},"evidence":"A","body":{"plain":"数字商品和实物商品不一样：一旦激活或下载，七天无理由退货往往不适用。买之前看清规则比事后维权有用。","steps":["买之前确认三件事：能不能退、退款条件是什么、发票怎么开。","买断制软件看清授权范围（几台设备、是否可升级大版本）；订阅制软件看清涨价和续费规则。","买 AI API 先充最小额度试跑，设置用量上限和余额告警，避免被刷爆。","需要退款时走平台官方工单，写清订单号、付款时间、退款理由，保留沟通记录。"],"pitfalls":["把 API Key 写进前端代码，被人扒走后一夜烧掉大量额度。","以为所有数字商品都支持七天无理由退货，虚拟商品通常有特别约定。"]},"sources":[{"name":"中华人民共和国消费者权益保护法实施条例（广东省司法厅网站全文）","url":"http://sft.gd.gov.cn/sfw/zwgk/zcwj/content/mpost_4398318.html","note":"2024年7月1日施行，对自动续费提醒、预付款、网络消费等作出细化规定。 已用 curl 抓取本页并核对到关键词：「自动续费」。"},{"name":"中华人民共和国电子商务法（商务部全球法规网）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应当履行商品服务质量保障、信息公示等义务。 已用 curl 抓取本页并核对到关键词：「电子商务法」、「消费者」。"}]},{"id":"digital-19","title":"第一次把自己的作品放到互联网上、第一次意识到网络上的东西可能永远存在","merged_from":["第一次把自己的作品放到互联网上","第一次意识到“网络上的东西可能永远存在”"],"tags":["数码","隐私","创作"],"cost":{"money":"0 元起","time":"因人而异","willpower":"低"},"evidence":"A","body":{"plain":"发出去的东西，删除只能删掉你这一份，删不掉别人的截图、转载和搜索引擎的缓存。发之前先按这个前提想一遍。","steps":["发布前过一遍三件事：有没有身份证号、住址、单位；有没有别人的脸和隐私；有没有公司的内部信息。","作品标明作者和授权方式，商用素材确认版权或使用可商用素材库。","真需要删除时，先删原帖，再联系转载方，同时向搜索引擎申请移除快照。","把长期有价值的内容放在自己能控制的域名上，别只发在别人的平台里。"],"pitfalls":["把工牌、快递单、车票的照片发出来，个人信息跟着一起曝光。","删除后以为万事大吉，其实早就被存档和转载了。"]},"sources":[{"name":"中华人民共和国个人信息保护法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","note":"第四十七条规定了个人信息处理者应当主动删除个人信息的情形；第五十一条要求采取加密、去标识化等安全技术措施、防止信息泄露篡改丢失。 已用 curl 抓取本页并核对到关键词：「第四十七条」、「第五十一条」、「加密」、「主动删除」。"},{"name":"中华人民共和国电子商务法（商务部全球法规网）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应当履行商品服务质量保障、信息公示等义务。 已用 curl 抓取本页并核对到关键词：「电子商务法」、「消费者」。"}]},{"id":"digital-a1","title":"第一次处理换手机号：要解绑的账号清单","merged_from":[],"tags":["数码","安全"],"cost":{"money":"0","time":"1–2 小时","willpower":"中"},"evidence":"B","body":{"plain":"手机号是大多数账号的找回入口。换号不换绑，旧号被运营商回收卖给下一个人后，你的账号和资金都可能被接管。","steps":["换号前列出绑定清单：银行、支付、社交、邮箱、政务（社保/公积金）、购物与出行","逐个改成新号，优先处理银行与支付类","解绑旧号后，把重要账号的登录密码也更新一次","换号后观察一段时间：是否还有旧号的验证码通知"],"pitfalls":["只改了微信和银行，忘了邮箱与政务账号","旧号直接被运营商回收，无法再接收验证码"]},"sources":[{"name":"工业和信息化部（电信服务与用户权益）","url":"https://www.miit.gov.cn/","note":"号码资源与用户权益由工业和信息化主管部门监管，具体解绑流程以各平台与运营商指引为准"}],"addition":true,"why":"手机号是大多数账号的找回入口，换号不换绑风险很高"},{"id":"digital-a2","title":"第一次设立数字遗产联系人","merged_from":[],"tags":["数码","家庭"],"cost":{"money":"0","time":"15 分钟","willpower":"低"},"evidence":"B","body":{"plain":"手机厂商和部分平台已提供「遗产联系人」功能：人不在了，指定的人可以依法取得账号内的数据。提前设置，避免数据永久锁死。","steps":["在手机系统账号设置里找到「遗产联系人」（多数主流系统已支持）","指定一位可信任的联系人，并把访问密钥保存给对方","整理一份关键账号清单（不含明文密码）交由家人保管","涉及财产的，按继承规定办理，必要时做公证"],"pitfalls":["只把密码写在纸条上，既不安全也不被平台认可","以为家人凭身份证就能解锁账号，实际多数平台不支持"]},"sources":[{"name":"《中华人民共和国民法典》继承编（最高人民检察院网站全文）","url":"https://www.spp.gov.cn/ssmfdyflvdtpgz/202008/t20200831_478418.shtml","note":"遗产继承的法律规则"},{"name":"《中华人民共和国公证法》","url":"https://www.gov.cn/gongbao/content/2005/content_77745.htm","note":"涉及遗产处理可办理公证以固定证据与效力"}],"addition":true,"why":"平台已提供遗产联系人功能，不设置的话账号数据会永久锁死"},{"id":"digital-a3","title":"第一次安全使用公共 Wi-Fi 与共享充电宝","merged_from":[],"tags":["数码","安全"],"cost":{"money":"0–几十元","time":"养成习惯","willpower":"低"},"evidence":"B","body":{"plain":"公共网络和陌生数据线是移动支付时代的新风险点：别在公共 Wi-Fi 上做大额支付，别把手机交给来源不明的充电设备。","steps":["公共 Wi-Fi 下不登录网银、不输入支付密码，优先用手机流量","连接前确认热点名称，警惕仿冒的「免费 Wi-Fi」","公共充电桩优先用自带充电头与数据线，避免直接插手机","手机开启「仅充电」提示或使用数据线隔离功能","遇到可疑链接、钓鱼页面举报到 12321 或 12377"],"pitfalls":["图省事连陌生热点并登录账号","用共享充电宝时点了「信任此电脑」，导致数据可被读取"]},"sources":[{"name":"12321 网络不良与垃圾信息举报受理中心","url":"https://www.12321.cn","note":"举报不良与垃圾信息、涉诈信息的官方渠道"},{"name":"中央网信办违法和不良信息举报中心（12377）","url":"https://www.12377.cn","note":"违法和不良信息举报入口"}],"addition":true,"why":"公共网络与陌生数据线是移动支付时代的新风险点"}],"additions":[],"cross_ref":[{"title":"第一次手机丢失","owner":"18 安全与紧急情况篇（18 篇的丢失证件组更贴切；本篇的账号安全条目只讲账号侧，不重复成条）"},{"title":"第一次收到诈骗短信 / 第一次接到诈骗电话","owner":"本篇（16 篇从识别与防范角度成条；建议 18 篇并入被骗转账后的止付与报警，不再单独写识别条目）"},{"title":"第一次买电脑","owner":"本篇（06 消费与网购篇同名，建议由数码篇成条）"}],"_file":"16-数码与网络篇.json","label":"数码与网络篇"},{"section":"17 餐饮娱乐篇","source_count":40,"merged_count":18,"raw_count":40,"entries":[{"id":"fun-01","title":"第一次一个人吃饭、一个人看电影、一个人逛商场","merged_from":["第一次一个人吃饭","第一次一个人看电影","第一次一个人逛商场"],"tags":["餐饮","娱乐","独处"],"cost":{"money":"人均几十到一百多元","time":"2–4 小时","willpower":"低"},"evidence":"C","body":{"plain":"一个人出门最难的其实是进门那一步，坐下之后就没什么了。第一次可以先挑人少的时间段。","steps":["一个人吃饭选吧台位、快餐或小吃店，点单快、翻台快，不用占着大桌。","点菜按人头来：一个人点一个主食加一个菜就够，吃不完就打包，餐饮服务经营者本就应引导适量点餐。","看电影工作日白天场最便宜、人也最少，取票后直接在影厅门口等，不用提前很久到。","逛商场把目的想清楚：是买什么、还是只是走走，不然很容易在负一层被消费掉半天。"],"pitfalls":["一个人吃饭不敢催菜、不敢换座位，其实这些都很正常。","看电影前买大桶饮料，中途跑厕所错过关键情节。"]},"sources":[{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"},{"name":"电影票全面支持「退改签」，APP付款前需弹出退改签协议（文汇报）","url":"https://www.whb.cn/zhuzhan/yingshi/20180918/213480.html","note":"报道中国电影发行放映协会2018年发布的电影票退改签规定；协会官网只有JS页面，curl 取不到原文，故本条降为权威媒体报道（B级）。 已用 curl 抓取本页并核对到关键词：「退改签」、「电影票」。"}]},{"id":"fun-02","title":"第一次独自享受一顿饭、第一次发现一个人也可以过得很好","merged_from":["第一次独自享受一顿饭","第一次发现“一个人也可以过得很好”"],"tags":["餐饮","独处","生活"],"cost":{"money":"人均几十到几百元","time":"1–2 小时","willpower":"低"},"evidence":"C","body":{"plain":"一个人吃饭和一个人好好吃一顿饭是两件事。前者是解决饥饿，后者是把注意力放回自己身上。","steps":["挑一家一直想去但没人陪的店，提前订个位子，告诉服务员是一位。","把手机调成静音放在包里，只做吃饭这一件事。","点自己想吃的，不用迁就别人的口味和预算；吃不完就打包。","吃完可以走一走再回家，把这段时间当作固定的自我照顾时间。"],"pitfalls":["把一个人吃饭当成可怜的证明，越这么想越吃不好。","为了不尴尬一直刷手机，反而没吃出味道。"]},"sources":[{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"}]},{"id":"fun-03","title":"第一次去咖啡厅、第一次喝咖啡","merged_from":["第一次去咖啡厅","第一次喝咖啡"],"tags":["餐饮","咖啡"],"cost":{"money":"20–50 元","time":"1 小时","willpower":"低"},"evidence":"B","body":{"plain":"咖啡厅的规矩就两条：先点单再落座，坐下后看管好自己的东西。剩下的都是个人口味问题。","steps":["进店先在吧台点单，不确定口味就选拿铁（奶多、不苦）或美式（不加奶、苦）。","想少摄入咖啡因可以选低因或换茶饮；下午三四点以后喝，晚上可能睡不着。","堂食拿好取餐牌找位置，很多店是自己取餐、自己送回餐盘。","久坐办公的话，按店里规矩续杯或再点一样东西，别一杯坐一下午。"],"pitfalls":["把包放在椅子上就走开，咖啡厅是丢东西的高发地。","跟风点最浓的豆子，第一次喝可能完全接受不了。"]},"sources":[{"name":"餐饮服务食品安全操作规范（2018年修订，重庆市市场监督管理局转载全文）","url":"https://scjgj.cq.gov.cn/zz/jjq/zwgk/fdzdgknr_146781/jdjc_146793/spyp/202104/t20210409_9112102.html","note":"对餐饮加工的原料采购、贮存、清洗消毒、从业人员健康管理等作出具体操作要求。 已用 curl 抓取本页并核对到关键词：「餐饮服务食品安全操作规范」、「消毒」。"},{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"}]},{"id":"fun-04","title":"第一次去西餐厅、第一次吃西餐与牛排、第一次面对一桌餐具","merged_from":["第一次去西餐厅","第一次吃西餐","第一次吃牛排","第一次不知道餐具怎么用"],"tags":["餐饮","西餐","礼仪"],"cost":{"money":"人均一百到数百元","time":"1.5 小时","willpower":"低"},"evidence":"B","body":{"plain":"餐具由外向内用、左手叉右手刀，这两条记住就够应付绝大多数场合，剩下的没人盯着你。","steps":["入座后把餐巾铺在腿上，餐具按上菜顺序从外往里用。","牛排熟度按个人喜好点，全熟并不丢人；不确定就点七分熟（medium well）。","切一块吃一块，不要一次性全部切完；放下刀叉时摆成八字，吃完并排放。","不确定怎么吃就问服务员，这是最省事也最不会出错的做法。"],"pitfalls":["把洗手盅里的水当饮用水喝掉。","点菜只点主菜漏了前菜和饮品，最后结账发现预算超了。"]},"sources":[{"name":"餐饮服务食品安全操作规范（2018年修订，重庆市市场监督管理局转载全文）","url":"https://scjgj.cq.gov.cn/zz/jjq/zwgk/fdzdgknr_146781/jdjc_146793/spyp/202104/t20210409_9112102.html","note":"对餐饮加工的原料采购、贮存、清洗消毒、从业人员健康管理等作出具体操作要求。 已用 curl 抓取本页并核对到关键词：「餐饮服务食品安全操作规范」、「消毒」。"},{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"}]},{"id":"fun-05","title":"第一次吃自助餐、第一次吃日料","merged_from":["第一次吃自助餐","第一次吃日料"],"tags":["餐饮","自助餐","日料"],"cost":{"money":"人均一百到几百元","time":"1.5–2 小时","willpower":"低"},"evidence":"A","body":{"plain":"自助餐的规则是不限量但不许浪费，日料的规则是尽量现做现吃。两件事的共同点是别一次拿太多。","steps":["自助餐分三轮：先看一圈确定有什么，再拿冷菜和海鲜，最后拿主食和甜品。","少拿多次，很多自助餐厅对明显浪费会加收费用。","吃日料先点刺身和寿司，再点烤物煮物；生食不要久放，上桌尽快吃。","对生食不放心就点熟的，寿司可以要求不加芥末。"],"pitfalls":["一上来就端满满两盘，吃不完又不敢剩，撑到难受。","生冷海鲜一次吃太多，肠胃受不了。"]},"sources":[{"name":"中华人民共和国反食品浪费法（中国人大网）","url":"http://www.npc.gov.cn/npc/c2/c30834/202104/t20210429_311300.html","note":"规定餐饮服务经营者应引导消费者按需适量点餐、提供打包服务，消费者应合理点餐。 已用 curl 抓取本页并核对到关键词：「反食品浪费」、「按需」、「打包」。"},{"name":"餐饮服务食品安全操作规范（2018年修订，重庆市市场监督管理局转载全文）","url":"https://scjgj.cq.gov.cn/zz/jjq/zwgk/fdzdgknr_146781/jdjc_146793/spyp/202104/t20210409_9112102.html","note":"对餐饮加工的原料采购、贮存、清洗消毒、从业人员健康管理等作出具体操作要求。 已用 curl 抓取本页并核对到关键词：「餐饮服务食品安全操作规范」、「消毒」。"}]},{"id":"fun-06","title":"第一次点酒、第一次去酒吧","merged_from":["第一次点酒","第一次去酒吧"],"tags":["餐饮","酒","娱乐场所"],"cost":{"money":"一杯几十到上百元","time":"2–3 小时","willpower":"中"},"evidence":"A","body":{"plain":"酒吧、KTV 这类地方属于娱乐场所，有明确的治安和消防要求，也有明确的年龄限制。","steps":["第一次点酒从低度数的开始：啤酒、果味鸡尾酒、加冰的调酒，别一上来点纯饮烈酒。","在酒吧把杯子看住、离开座位回来后换一杯，这是最基本的自我保护。","营业性歌舞娱乐场所、酒吧等不适宜未成年人活动的场所不得允许未成年人进入，也不要向未成年人售酒。","喝之前先吃东西，控制节奏，隔一杯水；脸红包袱
