power":"中"},"evidence":"A","body":{"plain":"信用卡是银行给你的一个「可以透支的额度」，不是白给的钱。实际只需要盯住三件事：账单日、还款日、最低还款额。账单日之后的消费下一个账单周期才还，全额还清不产生利息，只还最低还款额则要按日计息。","steps":["通过银行 App、网点或官网申请，看清年费规则和免年费条件。","收到卡先激活，设置查询密码和交易密码，绑定自动还款。","记住账单日和还款日，账单出来后逐笔核对。","能全额还款就全额还，实在紧张至少还够最低还款额。","刷卡小票和电子账单留到核销后再删。"],"pitfalls":["只还最低还款额不算逾期，但剩余部分一般按日计息，滚起来很快。","逾期记录会上征信，影响后面的房贷车贷，代价比利息大得多。","「办卡送礼品」的推销不用理，额度高低不代表这张卡适合你。"]},"sources":[{"name":"《商业银行信用卡业务监督管理办法》（银监会令2011年第2号）","url":"https://www.gov.cn/zhengce/2011-01/13/content_5725819.htm","note":"定义信用卡「具备银行授信额度和透支功能」；含营销、授信额度、还款等章节"},{"name":"《征信业管理条例》（国务院令第631号）","url":"https://www.gov.cn/zhengce/2013-01/29/content_2602614.htm","note":"全条例；规范征信机构采集、提供个人信用信息，查询须经本人授权"}]},{"id":"money-06","title":"第一次用花呗和分期付款","merged_from":["第一次使用花呗","第一次分期付款"],"tags":["金钱","消费信贷","分期"],"cost":{"money":"按平台公示的费率收取，提前还款是否减免以页面为准","time":"几分钟","willpower":"中"},"evidence":"B","body":{"plain":"花呗和信用卡分期的本质一样：把一笔钱拆成几个月还，多数情况要付手续费，而「免息」往往只是免了名义利息、手续费照收。下单前先把每期还多少、总共多还多少算出来，再决定分不分。","steps":["看清这笔分期是几期、每期金额、总手续费，别只看「每期只要 xx 元」。","确认还款日和扣款顺序，避免余额不足导致扣款失败。","提前还款前先看是否仍收全部手续费，很多平台提前还并不省钱。","每期还款后截图留存，结清后保存一张结清凭证。"],"pitfalls":["分期占用授信额度，额度用满就借不出来了，急用钱时很被动。","免息不等于免费，把总还款额和一次性付款对比一下再决定。","逾期同样会报送征信，也会影响平台给你的额度。"]},"sources":[{"name":"《中国人民银行金融消费者权益保护实施办法》（银发〔2020〕132号）","url":"https://www.gov.cn/zhengce/2020-09/15/content_5712684.htm","note":"规定金融机构应向金融消费者披露信息、保障知情权与自主选择权、不得强制搭售"},{"name":"《征信业管理条例》（国务院令第631号）","url":"https://www.gov.cn/zhengce/2013-01/29/content_2602614.htm","note":"全条例；规范征信机构采集、提供个人信用信息，查询须经本人授权"}]},{"id":"money-07","title":"第一次贷款与还贷：利率、还款方式与用途限制","merged_from":["第一次贷款","第一次还贷款"],"tags":["金钱","贷款","征信"],"cost":{"money":"利息按合同；可能有评估费、担保费等","time":"几天到几周","willpower":"高"},"evidence":"A","body":{"plain":"个人贷款分为消费贷和经营贷，规则不一样：消费贷期限一般不超过五年，而且必须有明确用途，贷款人不得发放无指定用途的个人贷款。签合同前要弄清的是利率是固定还是浮动、还款方式是等额本息还是等额本金、提前还款有没有违约金。","steps":["先算清每月要还多少，把月还款额压到月收入里能承受的比例以内。","看清合同上的年化利率、还款方式、期限和提前还款条款，再签字。","绑定还款账户，保证余额充足，并在还款日前几天设提醒。","每月核对扣款记录，留好还款凭证。","想提前还款，先问清违约金和预约流程。"],"pitfalls":["不要用消费贷的钱去还另一笔贷款或做别的用途，合同写明用途，挪用可能被要求提前还款。","「日息万分之几」「月费率」这类说法要换算成年化再比较。","逾期一天也可能上征信，还款日最好提前两三天把钱存进去。"]},"sources":[{"name":"《个人贷款管理办法》（金融监管总局令2024年第3号）第七条","url":"https://www.gov.cn/gongbao/2024/issue_11306/202404/content_6947720.html","note":"第七条：个人贷款用途应符合法律法规规定和国家有关政策，贷款人不得发放无指定用途的个人贷款；用于个人消费的贷款期限不得超过五年"},{"name":"《征信业管理条例》（国务院令第631号）","url":"https://www.gov.cn/zhengce/2013-01/29/content_2602614.htm","note":"全条例；规范征信机构采集、提供个人信用信息，查询须经本人授权"}]},{"id":"money-08","title":"第一次收到工资：工资条、个税与到手多少","merged_from":["第一次收到工资","第一次拿兼职工资","第一次自己赚钱"],"tags":["金钱","工资","个税"],"cost":{"money":"到手 = 约定工资 - 个人社保公积金 - 个税","time":"每月一次","willpower":"低"},"evidence":"A","body":{"plain":"谈好的月薪和到手的钱不是一回事，中间要扣个人承担的五险一金和个人所得税。兼职、劳务报酬的预扣方式和正式工资不同，但年度汇算时会并入综合所得重新算一遍，多退少补。","steps":["拿到工资条，核对基本工资、绩效、扣款项目和实发金额。","看社保、公积金的个人缴纳部分是否和当地标准对得上。","看个税代扣金额，年度终了在个人所得税 App 里做汇算。","把工资到账记录保存好，办贷款、签证时要用。","兼职收入同样申报，避免汇算时补税措手不及。"],"pitfalls":["「月薪八千」可能是税前，到手要少一截，入职前问清是税前还是税后。","有的单位把工资拆成基本工资加补贴，社保基数按最低标准缴，直接影响你以后的待遇。","试用期工资不得低于本单位相同岗位最低档工资或约定工资的八成，也不得低于当地最低工资标准，低于这个数可以问人事。"]},"sources":[{"name":"《工资支付暂行规定》","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"规定工资应以法定货币支付、不得克扣或无故拖欠；解除或终止劳动合同时应一次付清劳动者工资"},{"name":"《个人所得税综合所得汇算清缴管理办法》（国家税务总局令第57号）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100011/c5238560/content.html","note":"规定综合所得年度汇算的办理期限、办理方式（个人所得税App、网页端）与退补税流程"}]},{"id":"money-09","title":"第一次谈价格、报价与劳务报酬","merged_from":["第一次谈工资","第一次谈价格","第一次报价"],"tags":["金钱","谈判","自由职业"],"cost":{"money":"因人而异","time":"一次谈判 30 分钟到几天","willpower":"中"},"evidence":"C","body":{"plain":"谈钱的本质是把「做什么、什么时候给、给多少、给不了怎么办」四件事写清楚。凡是能落在文字上的都落下来，口头约定在要账的时候几乎没有用。","steps":["先查同类工作的市场价，给自己一个能接受的区间和一个底线价。","报价时报区间并说明包含哪些内容，交付范围之外的另算。","谈定后立刻用微信或邮件复述一遍要点，让对方回一句确认。","分期收款就写清每期比例和触发条件（定金、初稿、验收、尾款）。","把过往的报价和成交记录存下来，下次报价就有依据。"],"pitfalls":["只谈总价不谈范围，最后无限加需求还倒贴时间。","口头说好就开工，事后对方不认账你没有证据。","对方压价时先减范围而不是直接降价，白干比少赚更亏。"]},"sources":[{"name":"《中华人民共和国民法典》（河北省保定市中级人民法院公开全文）","url":"https://bdzy.hebeicourt.gov.cn/article/detail/2020/06/id/5840105.shtml","note":"合同编借款合同章（页面可检索到「借款」）。该页为法院分批发布的民法典文本，条文以国家法律法规数据库（flk.npc.gov.cn）为准"},{"name":"《工资支付暂行规定》","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"规定工资应以法定货币支付、不得克扣或无故拖欠；解除或终止劳动合同时应一次付清劳动者工资"}]},{"id":"money-10","title":"第一次给别人付钱：发工资、定金、催款与被拖欠","merged_from":["第一次给别人发工资","第一次收定金","第一次催别人付款","第一次被拖欠钱"],"tags":["金钱","合同","收款"],"cost":{"money":"因人而异","time":"因人而异","willpower":"中"},"evidence":"C","body":{"plain":"找人干活、找外包、雇兼职，最容易出事的地方不是价格，而是什么时候给钱、给多少、给不了怎么办。开工前把这几条写成一页纸，后面能省掉大部分扯皮。","steps":["开工前把工作内容、交付物、总价、付款节点写成一页纸，双方签字或在微信里确认。","写清是「定金」还是「订金」，两者的退还规则完全不同。","按节点付款，每笔都走转账并备注用途，不要给现金。","对方拖欠先书面催告并保留记录，再考虑仲裁或起诉。","金额明确、证据齐全的，可以向法院申请支付令。"],"pitfalls":["「定金」和「订金」一字之差，法律效果不同，写哪个就按哪个走。","只收口头承诺、只走现金，后面基本没法举证。","熟人之间更要写字据，闹僵的往往就是熟人。"]},"sources":[{"name":"《中华人民共和国民法典》（河北省保定市中级人民法院公开全文）","url":"https://bdzy.hebeicourt.gov.cn/article/detail/2020/06/id/5840105.shtml","note":"合同编借款合同章（页面可检索到「借款」）。该页为法院分批发布的民法典文本，条文以国家法律法规数据库（flk.npc.gov.cn）为准"},{"name":"《工资支付暂行规定》","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"规定工资应以法定货币支付、不得克扣或无故拖欠；解除或终止劳动合同时应一次付清劳动者工资"}]},{"id":"money-11","title":"第一次借钱给别人和向别人借钱","merged_from":["第一次借钱给别人","第一次向别人借钱","第一次借钱不还","第一次处理欠款"],"tags":["金钱","借贷","凭据"],"cost":{"money":"本金加约定利息","time":"因人而异","willpower":"中"},"evidence":"C","body":{"plain":"民间借贷本身受法律保护，前提是你能证明「借了多少、什么时候还、利息多少」。一张写清楚的借条加一笔走银行的转账，比十句口头承诺有用得多。","steps":["借条写清出借人、借款人姓名和身份证号、金额（大小写）、期限、利息、日期。","用银行转账而不是现金，备注「借款」；确实给现金就补一张收条。","约定利息要写进借条，没写利息的一般视为不支付利息。","到期不还，先书面催收留证，再考虑起诉。","向别人借钱同样写清楚，按时还并保留还款凭证。"],"pitfalls":["大额借款别用现金，也别把钱转给第三个不相干的人，否则很难证明是你借出的。","「借条」「欠条」「收条」性质不同，别随手写。","给别人做担保相当于替人还债，签字前想清楚。"]},"sources":[{"name":"《中华人民共和国民法典》（河北省保定市中级人民法院公开全文）","url":"https://bdzy.hebeicourt.gov.cn/article/detail/2020/06/id/5840105.shtml","note":"合同编借款合同章（页面可检索到「借款」）。该页为法院分批发布的民法典文本，条文以国家法律法规数据库（flk.npc.gov.cn）为准"}]},{"id":"money-12","title":"第一次记账、做预算与定月度开销","merged_from":["第一次做预算","第一次记账","第一次制定月度开销"],"tags":["金钱","记账","预算"],"cost":{"money":"免费，用手机自带或表格即可","time":"每天 2 分钟，每月复盘 20 分钟","willpower":"中"},"evidence":"C","body":{"plain":"记账没那么多讲究，能坚持一个月你就知道钱去哪了。有效的做法是只分几大类，先记支出，月末再回头砍一项。别一上来就设计一套复杂系统，第二天就放弃了。","steps":["选一个记账工具（手机自带、表格、App 都行），只分 5 到 8 个大类。","每笔消费当场记，别攒到晚上回忆。","月初定一个总预算，拆成固定支出、吃饭、交通、其他几块。","月末对照一遍，找出金额最大且可以砍的那一项。","连续记满三个月再调预算，别第一周就下结论。"],"pitfalls":["类目分成几十个，第二天就记不动了。","只记支出不记收入，看不到全貌。","把预算当成不许花钱的紧箍咒，最后变成报复性消费。"]},"sources":[{"name":"《中国人民银行金融消费者权益保护实施办法》（银发〔2020〕132号）","url":"https://www.gov.cn/zhengce/2020-09/15/content_5712684.htm","note":"规定金融机构应向金融消费者披露信息、保障知情权与自主选择权、不得强制搭售"}]},{"id":"money-13","title":"第一次攒钱：应急金与第一笔存款","merged_from":["第一次存下第一万元","第一次存应急资金","第一次月光","第一次开始攒钱","第一次建立应急金"],"tags":["金钱","储蓄","应急金"],"cost":{"money":"目标为 3 到 6 个月的必需开销","time":"视收入，通常 6 个月到 2 年","willpower":"高"},"evidence":"B","body":{"plain":"攒钱的顺序是先有一笔应急金，再谈其他。它的意义是在失业、生病、家里出事时，你不必去借高息的钱。放在受存款保险保护的银行账户里，比放在随手就能花掉的地方靠谱。","steps":["先算出每月必需开销（房租、吃饭、交通、必须还的款），这是你的底线数字。","目标是攒够 3 到 6 个月的必需开销，先从一个月开始。","工资到账当天先转出固定一笔到单独的储蓄账户，剩下的再花。","这张储蓄卡不要绑快捷支付，也别随身带。","每攒到一个小目标就记一笔，看得见的进度才撑得下去。"],"pitfalls":["同一家银行的存款本息合计 50 万元以内受存款保险全额保护，超过的部分要分散到不同银行。","应急金不要拿去买基金股票，急用钱时可能正好是亏的。","靠信用卡分期或花呗撑「月光」，等于把窟窿滚大。"]},"sources":[{"name":"《存款保险条例》（国务院令第660号）第五条","url":"https://www.gov.cn/zhengce/zhengceku/2015-03/31/content_9562.htm","note":"第五条原文：存款保险实行限额偿付，最高偿付限额为人民币50万元"},{"name":"《银行保险机构消费者权益保护管理办法》（银保监会令2022年第9号）","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"规定银行保险机构在营销宣传、收费、理赔、投诉处理等环节的消费者保护义务"}]},{"id":"money-14","title":"第一次算清自己的现金流和净资产","merged_from":["第一次制定五年财务计划","第一次知道自己的净资产","第一次真正理解“现金流”","第一次意识到赚钱和存钱是两件事"],"tags":["金钱","财务规划","征信"],"cost":{"money":"免费","time":"第一次约 1 小时，之后每季度 20 分钟","willpower":"低"},"evidence":"C","body":{"plain":"现金流是「这个月进多少、出多少」，净资产是「能卖的都卖了、该还的都还了，还剩多少」。这两个数字比工资高低更能说明你现在的处境。算一次不费多少时间，但很多人从来没算过。","steps":["列出资产：存款、货币基金、公积金、基金股票市值、能变现的东西。","列出负债：房贷、车贷、信用卡未还、花呗、欠亲友的钱。","净资产 = 资产 - 负债，每季度算一次，看趋势不看单次。","用过去三个月的收入减去支出，看现金流是正是负。","五年计划只写三件事：想攒到多少、想学的技能、想还清的债。"],"pitfalls":["把公积金和养老金当成可支配的钱，会高估自己的状况，它们现在取不出来。","只看月收入不看支出，收入涨了存款没涨是常态。","五年计划写成愿望清单，没有每月具体动作就落不了地。"]},"sources":[{"name":"《中国人民银行金融消费者权益保护实施办法》（银发〔2020〕132号）","url":"https://www.gov.cn/zhengce/2020-09/15/content_5712684.htm","note":"规定金融机构应向金融消费者披露信息、保障知情权与自主选择权、不得强制搭售"},{"name":"中国人民银行征信中心·个人信用报告查询","url":"https://www.pbccrc.org.cn/zxfw/gr/cx/20241029/6bb3ada5b92641779ee33e06c30f1e4c.html","note":"官网公布的本人信用报告查询渠道；信用报告内含贷款与信用卡负债明细"}]},{"id":"money-15","title":"第一次用自己赚的钱给父母买东西","merged_from":["第一次给父母买东西","第一次用自己赚的钱买贵重物品"],"tags":["金钱","消费","家庭"],"cost":{"money":"因人而异","time":"因人而异","willpower":"低"},"evidence":"C","body":{"plain":"第一笔自己赚的钱怎么花，没有标准答案。比较稳的分法是三份：一份给家里，一份留给自己真正想要的东西，一份存起来。别一次花完，也别为了「第一次」的仪式感买超出能力的东西。","steps":["先留出本月生活费和的应急储蓄，剩下的再考虑花。","买贵重物品前先放 72 小时，还想要再买。","给父母买东西先问清缺什么、忌什么，别买回去闲置。","大件保留发票和保修卡，售后要用。","花完记一笔，回头看看这笔钱的实际使用频率。"],"pitfalls":["分期买贵价商品，还款期比新鲜感长得多。","被「第一次」「仪式感」推着买超出能力的东西。","给长辈买健康类产品要谨慎，别信上门推销的话术。"]},"sources":[{"name":"《中国人民银行金融消费者权益保护实施办法》（银发〔2020〕132号）","url":"https://www.gov.cn/zhengce/2020-09/15/content_5712684.htm","note":"规定金融机构应向金融消费者披露信息、保障知情权与自主选择权、不得强制搭售"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"money-16","title":"第一次买保险：先看清保什么、不保什么","merged_from":["第一次购买保险","第一次看保险合同","第一次买保险"],"tags":["金钱","保险","合同"],"cost":{"money":"按产品费率，注意交费年限","time":"1 小时到几天","willpower":"中"},"evidence":"A","body":{"plain":"保险是花钱买一个「万一出事有人赔」的承诺，赔不赔全看条款。买之前要看清的是四件事：保什么、不保什么、多久生效、出事要交什么材料。业务员怎么说都不算数，合同上写的才算。","steps":["先想清楚要转移哪种风险，再挑产品，别反过来。","逐条看保险责任、责任免除、等待期、免赔额和理赔材料清单。","健康告知如实填写，问什么答什么，不要隐瞒。","在保险公司官网或官方 App 核对保单信息，确认保费和保障期。","收到保单后把合同、条款、缴费凭证归档保存。"],"pitfalls":["「什么都赔」不作数，只认保险责任和责任免除两章。","犹豫期内退保一般只扣很少的费用，过了犹豫期退保损失会很大。","别把保险当理财买，先看清现金价值和退保能拿回多少。"]},"sources":[{"name":"《中华人民共和国保险法》（商务部政策法规库收录）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=6951","note":"第二十二条至第二十五条：索赔时应提供其所能提供的与确认保险事故性质、原因、损失程度等有关的证明和资料；保险人应及时核定"},{"name":"《银行保险机构消费者权益保护管理办法》（银保监会令2022年第9号）","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"规定银行保险机构在营销宣传、收费、理赔、投诉处理等环节的消费者保护义务"}]},{"id":"money-17","title":"第一次理赔","merged_from":["第一次理赔"],"tags":["金钱","保险","理赔"],"cost":{"money":"理赔本身不收费","time":"材料齐的话几天到一个月","willpower":"中"},"evidence":"A","body":{"plain":"理赔就是按合同证明「事故真的发生了、损失有多大」。材料齐不齐直接决定快慢。出险后的第一件事是报案，而不是自己先垫钱处理完再找保险公司。","steps":["出险后尽快打保险公司客服电话或在 App 报案，记下报案号。","按客服给的清单准备材料：身份证明、保单、事故证明、费用票据。","涉及第三方的，保留事故认定书、调解或判决文书。","提交后记下受理时间，超过约定时间没结果就催办并留痕。","对结果有异议，先走公司投诉，再向监管部门投诉。"],"pitfalls":["材料原件交出去前先复印或拍照留底。","别在报案前就和对方「私了」，可能影响后续定责和理赔。","拖太久可能超过索赔时效，出险当天报案最稳。"]},"sources":[{"name":"《中华人民共和国保险法》（商务部政策法规库收录）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=6951","note":"第二十二条至第二十五条：索赔时应提供其所能提供的与确认保险事故性质、原因、损失程度等有关的证明和资料；保险人应及时核定"},{"name":"《银行保险机构消费者权益保护管理办法》（银保监会令2022年第9号）","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"规定银行保险机构在营销宣传、收费、理赔、投诉处理等环节的消费者保护义务"}]},{"id":"money-18","title":"第一次投资：开户、风险测评与查信息披露","merged_from":["第一次投资","第一次买基金","第一次买股票"],"tags":["金钱","投资","开户"],"cost":{"money":"开户免费，交易按费率收费","time":"开户 1 小时，了解产品要更久","willpower":"中"},"evidence":"A","body":{"plain":"第一次投资真正要办的不是「买什么」，而是「在哪里买、能承受多少风险」。正规渠道都要先做风险承受能力评估，评估结果会限制你能买的产品等级。公开募集的基金有强制信息披露，招募说明书和定期报告都能在公开渠道查到。","steps":["通过持牌机构（证券公司、基金公司、银行）开户，别用来路不明的 App。","如实填写风险承受能力测评问卷，别为了买高风险产品硬填。","买基金前看招募说明书：投资范围、费率、管理人和历史净值。","核对产品和机构是否在证监会、基金业协会的公开名录里。","只用闲钱，先小额走一遍完整流程。"],"pitfalls":["承诺「保本高收益」的一律当骗局处理，正规产品不会这么讲。","测评问卷乱填，会买到超出自己承受能力的产品。","收益截图和「老师带单」是常见引流套路，别加群、别转账。"]},"sources":[{"name":"《证券期货投资者适当性管理办法》（证监会令第130号）","url":"https://www.gov.cn/zhengce/2021-12/16/content_5724600.htm","note":"规定经营机构须了解投资者、进行风险承受能力评估、划分投资者类别并做产品或服务匹配"},{"name":"《中华人民共和国证券投资基金法》（主席令第七十一号）","url":"https://www.gov.cn/flfg/2012-12/28/content_2305569.htm","note":"规定基金份额持有人权利、公开募集基金的注册与信息披露要求"}]},{"id":"money-19","title":"第一次面对亏损和收益","merged_from":["第一次亏钱","第一次赚到投资收益","第一次面对大额亏损"],"tags":["金钱","投资","风险"],"cost":{"money":"因人而异","time":"因人而异","willpower":"高"},"evidence":"C","body":{"plain":"第一次看到账户浮亏，多数人的反应是加仓或者割肉，这两样往往都不对。先分清这笔钱是不是急用钱、当初买它的理由还在不在，再决定动不动手。","steps":["先看亏的是不是急用的钱，如果是，先撤出来。","回顾当初买它的理由有没有变化，没变就按原计划执行。","记下这次的心理账户：亏多少会让你睡不着，这个数字就是你的真实风险承受力。","不要加杠杆，不要借钱补仓。","把结论写下来，下次决策前翻一翻。"],"pitfalls":["亏钱后马上找「翻本」的机会，是最容易连环亏的路径。","听群里、直播间的建议操作，赚了是运气，亏了没人负责。","把浮盈当收入提前花掉，跌回去时只能割肉。"]},"sources":[{"name":"《证券期货投资者适当性管理办法》（证监会令第130号）","url":"https://www.gov.cn/zhengce/2021-12/16/content_5724600.htm","note":"规定经营机构须了解投资者、进行风险承受能力评估、划分投资者类别并做产品或服务匹配"},{"name":"《中华人民共和国证券投资基金法》（主席令第七十一号）","url":"https://www.gov.cn/flfg/2012-12/28/content_2305569.htm","note":"规定基金份额持有人权利、公开募集基金的注册与信息披露要求"}]},{"id":"money-20","title":"第一次被骗钱：报案、止付与追回","merged_from":["第一次被骗钱","第一次发现转账被骗","第一次报警追回钱"],"tags":["金钱","反诈","报警"],"cost":{"money":"可能损失全部转账金额","time":"黄金时间只有几小时","willpower":"高"},"evidence":"A","body":{"plain":"发现被骗，钱能不能回来主要看前几个小时。正确顺序是：立刻打 110 或 96110 报警，同时联系银行和支付平台申请紧急止付。千万不要先在网上找「追款公司」，那是二次诈骗。","steps":["第一时间拨打 110 或 96110，说清转账时间、金额、对方账号和平台。","同时打银行客服或用 App 申请紧急止付、冻结涉案账户。","保存所有证据：聊天记录、转账凭证、对方账号、通话记录、链接。","带身份证和证据去派出所做笔录，拿到受案回执。","按办案单位要求补充材料，定期询问进展。"],"pitfalls":["网上所谓「黑客追款」「专业追回」几乎都是二次诈骗。","越早止付成功率越高，犹豫几个小时钱就被转走了。","不要因为怕丢脸不报警，不报案就没有任何追回的可能。"]},"sources":[{"name":"《中华人民共和国反电信网络诈骗法》","url":"https://nxca.miit.gov.cn/ztzl/ffzldxwlzp/art/2022/art_6985069057e24505af500a44aec108a5.html","note":"全文（工业和信息化部系统公开）；含金融治理、互联网治理与涉案资金紧急止付、冻结等处置措施"},{"name":"中国人民银行天津分行·12363 金融消费权益保护咨询投诉热线服务指南","url":"https://tianjin.pbc.gov.cn/fzhtianjin/113733/zhyw/2026051114135917908/index.html","note":"12363 热线受理范围与拨打方式"}]},{"id":"money-21","title":"第一次交税、报税与个人代开发票","merged_from":["第一次交税","第一次开个人发票","第一次报税"],"tags":["金钱","税务","发票"],"cost":{"money":"按税法计算，代开发票可能涉及增值税及附加","time":"汇算约 30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"普通上班族的个税基本由单位代扣代缴，你自己要做的是每年在个人所得税 App 上做一次年度汇算，多退少补。如果自己接活、对方公司需要发票，可以去办税服务厅或电子税务局申请代开。","steps":["年度汇算期内登录个人所得税 App，核对收入和已缴税额后提交申报。","有专项附加扣除（子女教育、住房租金、赡养老人等）的，在 App 里如实填写。","需要退税就绑定本人银行卡；需要补税按期缴清。","个人对外发生经营业务收款、对方要发票的，到办税服务厅或电子税务局申请代开。","代开一般要带本人身份证和业务合同、付款方信息。"],"pitfalls":["单位没代扣代缴不等于不用交，漏报可能被追缴并加收滞纳金。","虚开发票是违法行为，不要帮别人「走一下票」。","专项附加扣除信息要真实，税务部门会核验。"]},"sources":[{"name":"《个人所得税综合所得汇算清缴管理办法》（国家税务总局令第57号）","url":"https://fgk.chinatax.gov.cn/zcfgk/c100011/c5238560/content.html","note":"规定综合所得年度汇算的办理期限、办理方式（个人所得税App、网页端）与退补税流程"},{"name":"《中华人民共和国发票管理办法》（山西省税务局法定主动公开页）","url":"http://shanxi.chinatax.gov.cn/zdgk/detail/sx-11400-545-1781492","note":"规定销售商品、提供服务以及从事其他经营活动的单位和个人，对外发生经营业务收取款项，收款方应当向付款方开具发票"}]},{"id":"money-a1","title":"第一次查询自己的个人信用报告","merged_from":[],"tags":["金钱","信用"],"cost":{"money":"每年有免费次数","time":"10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"办房贷车贷前先自己查一次征信：能提前发现被冒名开户、逾期记录和错误信息，留出异议处理的时间。","steps":["通过中国人民银行征信中心官网或银行 App 申请本人信用报告","重点看三块：信贷记录、逾期记录、查询记录","发现错误或非本人业务，向征信机构或放贷机构提异议申请","每年查一到两次，别频繁查询影响机构判断"],"pitfalls":["被别人冒名办的贷款或信用卡，越晚发现越难处理","别在非官方 App 上「查征信」，容易泄露身份信息"]},"sources":[{"name":"《征信业管理条例》（国务院令第 631 号）","url":"https://www.gov.cn/zhengce/2013-01/29/content_2602614.htm","note":"个人有权查询本人信用报告，对错误信息可提出异议"},{"name":"中国人民银行征信中心（个人信用报告查询）","url":"https://www.pbccrc.org.cn/","note":"官方查询入口与流程"}],"addition":true,"why":"办贷款前先自查征信，能提前发现问题、留出处理时间"},{"id":"money-a2","title":"第一次分清存款、理财和保险","merged_from":[],"tags":["金钱","理财"],"cost":{"money":"视产品","time":"20 分钟","willpower":"中"},"evidence":"A","body":{"plain":"柜台常把理财和保险讲得像存款，三者差别很大：存款受存款保险保障，理财不保本，保险提前退保通常亏本金。","steps":["先问一句：这是存款、理财还是保险？合同名称和发行方是谁","存款：看是否受《存款保险条例》保障（同一银行 50 万元以内）","理财：看风险等级与是否保本（现在不允许承诺保本保收益）","保险：看犹豫期、退保现金价值，前几年退保往往低于已交保费"],"pitfalls":["把保险当存款买，五年内退保可能亏掉大半本金","只听口头承诺不看合同，事后举证困难"]},"sources":[{"name":"《存款保险条例》（国务院令第 660 号）","url":"https://www.gov.cn/zhengce/zhengceku/2015-03/31/content_9562.htm","note":"存款保险的保障范围与限额"},{"name":"《银行保险机构消费者权益保护管理办法》","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"银行保险机构应向消费者充分披露产品性质与风险"}],"addition":true,"why":"银行柜面最容易被混淆的地方，三者在本金安全、流动性、退保损失上完全不同"},{"id":"money-a3","title":"第一次看懂合同里的利息和年化","merged_from":[],"tags":["金钱","贷款"],"cost":{"money":"可能差出数倍利息","time":"20 分钟","willpower":"中"},"evidence":"A","body":{"plain":"「日息万分之五」「月费率 0.6%」听起来很低，换算成年化差别很大。看懂年化利率是贷款和分期最常见的认知陷阱。","steps":["把各种说法统一换算成年化利率（APR）：日息×365，月费率×12 只是粗略近似","注意「费率」和「利率」不同：等额本息还款下，费率算出来的实际年化约为标称值的 1.8 倍左右","问清提前还款是否有违约金、是否仍收剩余期数的手续费","把合同里的费用条款拍照留存"],"pitfalls":["只看「每期还多少」，不算总还款额","忽略服务费、担保费、会员费，这些也要计入真实成本"]},"sources":[{"name":"《银行保险机构消费者权益保护管理办法》","url":"https://www.gov.cn/gongbao/content/2023/content_5753317.htm","note":"金融机构应明示年化利率，不得仅以日利率、月费率等方式误导消费者"},{"name":"《商业银行信用卡业务监督管理办法》","url":"https://www.gov.cn/zhengce/2011-01/13/content_5725819.htm","note":"信用卡分期业务应披露年化利率与收费方式"}],"addition":true,"why":"「日息万五」「月费率 0.6%」换算成年化差别很大，是贷款分期最常见的陷阱"}],"additions":[],"_file":"05-金钱篇.json","label":"金钱篇"},{"section":"06 消费与网购篇","source_count":50,"merged_count":19,"entries":[{"id":"shop-01","title":"第一次在淘宝、京东、拼多多下单","merged_from":["第一次淘宝购物","第一次京东购物","第一次拼多多购物"],"tags":["消费","网购","平台"],"cost":{"money":"商品价格 + 可能运费","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"三个平台的下单流程差不多，差别在商家类型和售后规则。下单前花两分钟确认三件事就够了：卖家是谁、什么时候发货、退换货的运费谁来出。","steps":["注册并实名，绑定支付方式，顺手关掉不用的免密支付和默认勾选。","看商品页的店铺类型（自营、官方旗舰店、普通店）和发货时效。","下单前把商品详情页截图，尤其是规格、赠品和承诺。","关键信息用平台内聊天工具和客服确认，平台内的记录才能当证据。","收货先验货，再点确认收货。"],"pitfalls":["别被「限时秒杀」「最后一件」催着下单，先加购物车放一晚。","只在平台内付款，任何要求加微信、私下转账的都是坑。","价差过大的第三方店铺先查有没有品牌授权，同款超低价大概率是假货。"]},"sources":[{"name":"《中华人民共和国电子商务法》（商务部政策法规库收录）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"规定电子商务经营者应全面、真实、准确、及时披露商品或服务信息，保障消费者的知情权和选择权"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"shop-02","title":"第一次在闲鱼买卖二手","merged_from":["第一次闲鱼购物","第一次闲鱼卖东西"],"tags":["消费","二手","平台"],"cost":{"money":"商品价格 + 运费","time":"30 分钟到几天","willpower":"中"},"evidence":"C","body":{"plain":"二手平台的核心是「描述一致」和「留痕」。买东西看实物图和细节图，卖东西把瑕疵拍清楚写明白，两边都少扯皮。","steps":["买之前让卖家拍实物视频，重点拍序列号、屏幕、接口和划痕。","只在平台内下单付款，别走微信、别点对方发的链接。","收货当面或当天验货，有问题立刻在平台内申请退款并上传证据。","卖东西时标明成色、配件、有无维修、是否包邮。","贵重物品寄出前拍打包视频，用可保价的快递。"],"pitfalls":["「先款后货」「先货后款」都有风险，走平台担保交易才安全。","二手手机要查序列号是否激活、是否被锁、是否还在保。","面交选人多的地方，别单独去对方指定的地点。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"},{"name":"《网络交易监督管理办法》（市场监管总局令第37号）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2025/art_4b47c79b8d994a42bba4835997688faa.html","note":"规定网络交易经营者采取自动展期、自动续费等方式提供服务的，应在接受服务前和续费日期前以显著方式提请消费者注意，并提供显著、简便的随时取消或变更选项，不得收取不合理费用"}]},{"id":"shop-03","title":"第一次寄快递和收快递","merged_from":["第一次自己寄快递","第一次收到快递"],"tags":["消费","快递","物流"],"cost":{"money":"按重量和距离计费，保价另收","time":"寄件 15 分钟，市内次日到","willpower":"低"},"evidence":"A","body":{"plain":"寄快递要实名并配合验视，这是条例要求，不是快递员为难你。贵重物品要保价，否则丢失时按快递服务合同约定赔偿，可能远低于物品实际价值。","steps":["手机下单或去网点，填清寄件人和收件人的电话、地址。","交寄时出示身份信息，配合开箱验视。","贵重、易碎物品主动保价，并在运单上写明内件名称。","寄出后保留运单号和寄件凭证，拍下打包过程。","收件先验外包装，破损当场拒收或拍照，再拆箱验内件。"],"pitfalls":["不保价的快件丢失，赔偿通常按运单约定而不是物品实际价值。","违禁品、易燃易爆品、现金和重要证件不要寄，会被扣件甚至担责。","快递放驿站或柜子导致丢件可以投诉，但先确认自己有没有勾选同意代收。"]},"sources":[{"name":"《快递暂行条例》（国务院令第697号）","url":"https://www.gov.cn/zhengce/content/2018-03/27/content_5277801.htm","note":"规定寄件人应提供身份信息并配合验视；企业应告知保价规则；用户合法权益因快件延误、丢失、损毁或内件短少受损害的，可要求运单所属企业赔偿"},{"name":"国家邮政局系统·快递业务旺季服务消费提示（云南省邮政管理局）","url":"https://yn.spb.gov.cn/ynsyzglj/c104826/c104832/202410/b133fd8e05a84b5c848642801537fb72.shtml","note":"官方提示用户保留运单、及时验视、通过正规申诉渠道维权"}]},{"id":"shop-04","title":"第一次退货、换货与退款","merged_from":["第一次退货","第一次换货","第一次退款","第一次申请仅退款"],"tags":["消费","售后","退货"],"cost":{"money":"无理由退货的运费一般由买家承担","time":"3 到 15 天","willpower":"中"},"evidence":"A","body":{"plain":"网购有七日无理由退货的权利，但有前提：商品属于可退范围、保持完好、在收到货之日起七日内提出。生鲜、定制、拆封的数字化商品等不在其中。","steps":["收到货先别剪吊牌、别破坏包装，确认不合适再决定退。","在订单页点「申请售后／退货退款」，选原因并上传照片。","按平台给的地址寄回，用运费险或自己寄并留好运单号。","把运单号填回订单页，等商家确认收货后退款。","商家拒绝就申请平台介入，附上聊天记录和照片。"],"pitfalls":["「仅退款」是平台给特定场景的工具，货没退就别选它，滥用会影响账号信用。","退货运费谁承担按责任划分，无理由退货一般由买家承担。","七日从签收次日起算，拖到最后一天才申请容易被拒。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"},{"name":"《网络购买商品七日无理由退货暂行办法》（工商总局令第90号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-11/03/content_5557118.htm","note":"第二章规定「不适用退货的商品范围」与「商品完好」标准；第六条列举不适用七日无理由退货的商品"}]},{"id":"shop-05","title":"第一次收到假货或破损商品","merged_from":["第一次收到假货","第一次收到破损商品","第一次消费维权"],"tags":["消费","维权","假货"],"cost":{"money":"可能主张退一赔三","time":"1 周到 1 个月","willpower":"高"},"evidence":"A","body":{"plain":"假货和破损的处理重点不一样：破损要立刻固定快递和验货证据，假货要证明「这不是正品」。两条路都得先在平台内留证据，再谈赔偿。","steps":["破损：签收前拍照录视频，直接拒收或让快递员出证明。","假货：拍下商品细节、防伪标识、包装，和正品做比对。","需要时找品牌方或官方渠道鉴定，拿到书面结论。","在平台内发起投诉或举报，选「假冒品牌」这类对应选项。","商家不处理就要求平台介入，同时可以拨打 12315 投诉。"],"pitfalls":["先和商家私下谈赔偿再撤诉，可能拿不到平台记录，后面没证据。","假货可以主张惩罚性赔偿，但前提是你能证明它是假货。","破损件别急着扔包装，那是唯一的物证。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"},{"name":"《网络购买商品七日无理由退货暂行办法》（工商总局令第90号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-11/03/content_5557118.htm","note":"第二章规定「不适用退货的商品范围」与「商品完好」标准；第六条列举不适用七日无理由退货的商品"}]},{"id":"shop-06","title":"第一次找平台客服、投诉商家与平台介入","merged_from":["第一次联系平台客服","第一次投诉商家","第一次平台介入"],"tags":["消费","维权","客服"],"cost":{"money":"免费","time":"几天到两周","willpower":"中"},"evidence":"A","body":{"plain":"平台客服是分级的：先在线客服，再电话客服，然后是平台介入，最后是外部投诉。每一步都要留下工单号和时间，事情才推得动。","steps":["先在订单页发起售后或在线客服，说清诉求是退款、换货还是赔偿。","记下工单号、客服工号和处理时限。","超时没结果就打平台官方电话客服，复述诉求并要求升级处理。","申请平台介入，上传全部聊天记录、照片、运单号。","平台处理不满意，拨打 12315 或在全国 12315 平台投诉商家。"],"pitfalls":["只在电话里说、不留文字记录，后面很难举证。","情绪化表达会拖慢处理，说事实、提诉求、给期限最有效。","别同时在多个渠道开一堆工单，反而互相推诿。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"},{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"规定经营者采取自动展期、自动续费方式提供服务应在接受服务前和续费日期前以显著方式提示消费者；对预付款消费、经营者义务作出细化"}]},{"id":"shop-07","title":"第一次买二手手机、电脑和车","merged_from":["第一次买二手手机","第一次买二手电脑","第一次买二手车"],"tags":["消费","二手","大件"],"cost":{"money":"新车价的几成，车还要加过户费","time":"1 天到几周","willpower":"高"},"evidence":"B","body":{"plain":"二手大件的共同点是：看得见的问题不是问题，看不见的才是。手机看序列号和电池，电脑看硬盘使用时间和维修记录，车看登记证书和事故记录。","steps":["手机：查序列号激活状态、是否被锁、电池健康、有无拆修。","电脑：看硬盘通电时间、屏幕坏点、接口，重装系统后再验一次。","车：核验机动车登记证书、行驶证、车主身份，查违章和事故记录。","见面验货选白天、人多的地方，当面测完全部功能。","车必须去车管所办转让登记，交验机动车并提交现所有人身份证明等材料。"],"pitfalls":["二手车不过户，之后的违章和事故可能还算在你头上。","「一手车、无事故」的口头承诺不作数，要看维修保养和检测报告。","二手电子产品多半没有发票和保修，价格要相应打折。"]},"sources":[{"name":"《机动车登记规定》（公安部令第164号，深圳市公安局公开页）","url":"http://ga.sz.gov.cn/gkmlpt/content/11/11637/mpost_11637953.html","note":"申请转让登记的，现机动车所有人应当交验机动车，并提交现机动车所有人身份证明等证明、凭证"},{"name":"《家用汽车产品修理更换退货责任规定》（市场监管总局令第43号）","url":"https://www.gov.cn/zhengce/zhengceku/2021-07/27/content_5627788.htm","note":"第二十条、第二十三条：家用汽车产品自三包有效期起算之日起60日内或者行驶里程3000公里之内（以先到者为准），符合条件的可更换或退货"}]},{"id":"shop-08","title":"第一次买手机、相机、耳机这些数码产品","merged_from":["第一次买手机","第一次买相机","第一次买耳机"],"tags":["消费","数码","保修"],"cost":{"money":"几千元不等","time":"挑选几天，下单 10 分钟","willpower":"中"},"evidence":"B","body":{"plain":"数码产品价格水分大，买之前先定预算和用途，再看参数。手机看处理器、内存、电池和是不是国行；相机看画幅、镜头卡口和后续镜头成本；耳机看你实际要用的降噪和编解码。","steps":["先定预算和用途，再挑型号，别先看参数被种草。","只从官方渠道或授权店买，确认是全国联保的国行版本。","开箱全程录像，当场验证序列号、激活状态、配件是否齐全。","索要发票，发票是保修和维权的凭证。","包装盒和保修卡留到保修期结束。"],"pitfalls":["「港版」「美版」「水货」便宜，但国内不保修。","相机真正的成本在镜头和配件，机身便宜不代表总价便宜。","低价「官换机」「展示机」要问清剩余保修时间。"]},"sources":[{"name":"《移动电话机商品修理更换退货责任规定》（质检总局等第4号令）","url":"https://www.gov.cn/zhengce/2020-07/23/content_5723727.htm","note":"原文：自售出之日起７日内，移动电话机主机出现附录３《移动电话机商品性能故障表》所列性能故障的，消费者可以选择退货、换货或者修理；另有15日与三包有效期内的规定"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"shop-09","title":"第一次买贵重物品、付大额定金","merged_from":["第一次买贵重物品","第一次付大额定金"],"tags":["消费","大额","定金"],"cost":{"money":"数额大，退起来难","time":"决策几天到几周","willpower":"高"},"evidence":"C","body":{"plain":"大额消费最容易后悔，也最难退。付定金之前一定要看清合同写的是「定金」还是「订金」，这两者的退还规则完全不同：定金是你不买就不退、他不卖就双倍返还。","steps":["先查清商品的官方指导价和渠道价，再看优惠是不是真便宜。","付款前把合同、订单、聊天记录里的退款条件看清楚。","确认写的是「定金」还是「订金」，别只听口头说法。","大额付款优先走平台担保或银行转账，别直接转私人账户。","拿到发票、合同、付款凭证并归档。"],"pitfalls":["定金一旦交了，你反悔通常拿不回来。","口头承诺的赠品、延保、免费安装要写进合同。","家装、教培、健身这类预付式消费风险最高，尽量小额短周期。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"规定经营者采取自动展期、自动续费方式提供服务应在接受服务前和续费日期前以显著方式提示消费者；对预付款消费、经营者义务作出细化"},{"name":"《单用途商业预付卡管理办法（试行）》（商务部令2012年第9号）","url":"https://www.gov.cn/zhengce/2012-09/21/content_5712346.htm","note":"规定发卡企业备案、单用途卡购买/充值/使用/退卡方式应载明；区分集团发卡企业、品牌发卡企业与规模发卡企业"}]},{"id":"shop-10","title":"第一次线下砍价和跟商家谈价格","merged_from":["第一次线下砍价","第一次和商家谈价格"],"tags":["消费","谈判","线下"],"cost":{"money":"看谈的结果","time":"20 到 60 分钟","willpower":"中"},"evidence":"C","body":{"plain":"砍价不是吵架，是让对方知道你还有别的选择。最有效的顺序是：先问清配置和总价，再问能不能减，最后才谈赠品和售后。","steps":["先在线上查同款或同类的最低成交价，心里有个锚。","问价时问「这个配置一共多少钱」，不要一项项问。","表示今天可以定，但要一个更好的价格或更多赠品。","把赠品、安装、延保、发票写进单据。","谈不拢就走，不少商家会在一两天内给你打电话。"],"pitfalls":["一进门就报出自己的预算上限，等于把底牌亮了。","只谈总价不看配置，容易被换成低配。","被「今天最后一天优惠」催着交定金，事后基本退不了。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"},{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"规定经营者采取自动展期、自动续费方式提供服务应在接受服务前和续费日期前以显著方式提示消费者；对预付款消费、经营者义务作出细化"}]},{"id":"shop-11","title":"第一次要发票和用电子发票","merged_from":["第一次开发票"],"tags":["消费","发票","凭证"],"cost":{"money":"免费","time":"1 到 3 分钟","willpower":"低"},"evidence":"A","body":{"plain":"要发票是你的权利，商家不能因为「要发票就加钱」或者「不开发票便宜点」拒绝。发票是保修、报销、维权和退换货的重要凭证，网购订单事后也能补开。","steps":["付款时直接在订单里选「开具发票」，填抬头和税号。","电子发票会发到邮箱或平台账户，下载 PDF 保存好。","线上订单事后补开，一般在订单页的「申请开票」里操作。","拿到发票核对金额、名称、税号是否正确。","报销用的发票按单位要求整理，注意有效期。"],"pitfalls":["「不开发票便宜 5%」看似省钱，出问题时你连购买凭证都没有。","发票金额要和实付一致，虚开是违法的。","电子发票能重复下载，注意别重复报销。"]},"sources":[{"name":"《中华人民共和国发票管理办法》（山西省税务局法定主动公开页）","url":"http://shanxi.chinatax.gov.cn/zdgk/detail/sx-11400-545-1781492","note":"规定销售商品、提供服务以及从事其他经营活动的单位和个人，对外发生经营业务收取款项，收款方应当向付款方开具发票"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"shop-12","title":"第一次保修、买延保和修电子产品","merged_from":["第一次保修","第一次维修电子产品","第一次换屏","第一次修电脑","第一次购买延保"],"tags":["消费","售后","维修"],"cost":{"money":"保修期内免费；换屏按屏幕类型几百到上千元","time":"1 天到两周","willpower":"中"},"evidence":"A","body":{"plain":"手机有三包规定：自售出之日起七日内，主机出现性能故障表所列故障的，可以选择退货、换货或者修理；之后还有三包有效期内的免费修理。保修期内一定要走官方售后，别自己找路边店拆机，一拆就失去保修。","steps":["先看发票日期，确认还在不在三包有效期或保修期内。","打官方客服电话或在官方 App 报修，记下工单号。","送修前备份数据、退出账号、取出存储卡和 SIM 卡。","维修后当面验机，索要维修记录和更换零件的说明。","买延保前看清保什么、由谁提供、和原厂保修是否重叠。"],"pitfalls":["第三方拆机后原厂保修基本作废。","换屏分原厂屏和组装屏，价格差很多，先问清用哪种。","延保大多是第三方提供的，出问题要找的是延保公司而不是品牌。"]},"sources":[{"name":"《移动电话机商品修理更换退货责任规定》（质检总局等第4号令）","url":"https://www.gov.cn/zhengce/2020-07/23/content_5723727.htm","note":"原文：自售出之日起７日内，移动电话机主机出现附录３《移动电话机商品性能故障表》所列性能故障的，消费者可以选择退货、换货或者修理；另有15日与三包有效期内的规定"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"shop-13","title":"第一次退卡、退订会员与处理自动扣费","merged_from":["第一次办理退卡","第一次会员自动续费","第一次发现被自动扣费","第一次申请自动扣费退款"],"tags":["消费","订阅","预付卡"],"cost":{"money":"已扣费用能否退，看平台和合同","time":"10 分钟到几周","willpower":"中"},"evidence":"A","body":{"plain":"自动续费的规则很明确：开通前要显著提醒，扣费日期前也要提醒，而且必须给你「显著、简便的随时取消」入口，并且不得收取不合理费用。会员、健身房年卡、理发店储值卡都属于这一类。","steps":["在 App 的「订阅／自动续费管理」里直接关闭，别只卸载 App。","通过应用商店订阅的，要在应用商店的订阅管理里取消。","已经被扣费，先在平台内申请退款并说明未收到显著提醒。","商家拒绝就打 12315 投诉，附上扣费记录和取消入口截图。","预付卡退卡按合同和当地规定办，保留办卡凭证和消费记录。"],"pitfalls":["卸载 App 不等于取消订阅，钱照扣。","很多 App 把取消入口藏得很深，开通时先截图存证。","预付卡商家跑路最难追，尽量不办大额长期卡。"]},"sources":[{"name":"《网络交易监督管理办法》（市场监管总局令第37号）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2025/art_4b47c79b8d994a42bba4835997688faa.html","note":"规定网络交易经营者采取自动展期、自动续费等方式提供服务的，应在接受服务前和续费日期前以显著方式提请消费者注意，并提供显著、简便的随时取消或变更选项，不得收取不合理费用"},{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"规定经营者采取自动展期、自动续费方式提供服务应在接受服务前和续费日期前以显著方式提示消费者；对预付款消费、经营者义务作出细化"}]},{"id":"shop-14","title":"第一次团购、订座和网上预约服务","merged_from":["第一次团购","第一次取消餐厅预约","第一次网上预约服务"],"tags":["消费","团购","预约"],"cost":{"money":"券面价格，通常比门市价低","time":"几分钟","willpower":"低"},"evidence":"A","body":{"plain":"团购券、预约和订座都是「先付钱或先占位，再去消费」。规则的关键在有效期、是否可退、要不要提前预约、几点前到店这几条，买之前看一眼就能省掉大部分纠纷。","steps":["买券前看清有效期、可用时段、节假日是否可用、能否退款。","用之前先打电话或在 App 里预约，确认团购券可用。","到店前把券码和预约记录准备好，结账时主动出示。","临时去不了，尽量在规定的取消时限前取消。","商家不认券或服务缩水，先在平台投诉，再打 12315。"],"pitfalls":["「过期自动退」和「过期作废」差别很大，买前确认是哪一种。","部分商家对团购用户限制菜品或加收费用，进店先问清。","预约不到店又不取消，有的平台会扣信用分或收违约金。"]},"sources":[{"name":"《网络交易监督管理办法》（市场监管总局令第37号）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2025/art_4b47c79b8d994a42bba4835997688faa.html","note":"规定网络交易经营者采取自动展期、自动续费等方式提供服务的，应在接受服务前和续费日期前以显著方式提请消费者注意，并提供显著、简便的随时取消或变更选项，不得收取不合理费用"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"shop-15","title":"第一次点外卖与处理外卖纠纷","merged_from":["第一次点外卖","第一次外卖送错","第一次外卖投诉","第一次餐厅退款"],"tags":["消费","外卖","餐饮"],"cost":{"money":"餐费 + 配送费 + 打包费","time":"30 到 60 分钟","willpower":"低"},"evidence":"A","body":{"plain":"外卖涉及平台、商家、骑手三方。出了问题先分清是送错了、送晚了还是食品本身有问题，处理路径不一样，食品问题最严重，要走平台举报甚至 12315。","steps":["下单前看商家资质和评价，注意起送价、配送费和预计送达时间。","收到餐先看外包装和封签是否完好，有问题先拍照。","送错或漏送：在订单页申请退款并说明情况，附上照片。","食品变质或有异物：申请退款并向平台举报，必要时打 12315。","配送超时可以申请超时赔付，保留订单截图。"],"pitfalls":["食品问题不要先把餐扔掉，照片和实物是证据。","直接和骑手私下解决容易扯不清，走平台流程更稳。","「好评返现」换掉你的真实评价，出问题时会很被动。"]},"sources":[{"name":"《网络餐饮服务食品安全监督管理办法》（食药监总局令第36号）","url":"https://www.gov.cn/zhengce/2020-11/03/content_5723693.htm","note":"规定入网餐饮服务提供者、网络餐饮服务第三方平台及送餐环节的食品安全责任"},{"name":"《中华人民共和国消费者权益保护法》（2013年修正）","url":"http://www.npc.gov.cn/npc/c2/c12435/c12488/201905/t20190521_184603.html","note":"第二十五条：经营者采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货且无需说明理由；并列出不适用该规则的商品"}]},{"id":"shop-16","title":"第一次识别消费陷阱和营销套路","merged_from":["第一次遇到消费陷阱","第一次识别营销套路","第一次学会“不买也没关系”"],"tags":["消费","避坑","心理"],"cost":{"money":"省下的就是赚到的","time":"长期","willpower":"中"},"evidence":"B","body":{"plain":"大部分套路都靠三件事：制造紧迫感、让你觉得占了便宜、让你不好意思拒绝。认得这三样，就躲过了一大半。","steps":["看到「限时」「最后一天」「仅剩几件」先退出页面，放一天再看。","算清真实单价（每克、每次、每年），别只看总价或赠品数量。","对「免费体验」「0 元领」保持警惕，后面通常跟着办卡和签约。","拒绝时只用一句「我再考虑一下」，不用解释理由。","已经办了卡或签了合同，及时看退出条款，越早处理损失越小。"],"pitfalls":["分期、预付、自动续费是三大高发区，签字前一定看小字。","门店里被多人轮番劝说时不要当场付款，出去走一圈。","长辈被推销健康类产品时，先查有没有批准文号。"]},"sources":[{"name":"《中华人民共和国消费者权益保护法实施条例》（国务院令第778号）","url":"https://www.gov.cn/zhengce/content/202403/content_6940158.htm","note":"规定经营者采取自动展期、自动续费方式提供服务应在接受服务前和续费日期前以显著方式提示消费者；对预付款消费、经营者义务作出细化"},{"name":"《网络交易监督管理办法》（市场监管总局令第37号）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2025/art_4b47c79b8d994a42bba4835997688faa.html","note":"规定网络交易经营者采取自动展期、自动续费等方式提供服务的，应在接受服务前和续费日期前以显著方式提请消费者注意，并提供显著、简便的随时取消或变更选项，不得收取不合理费用"}]},{"id":"shop-a1","title":"第一次用全国 12315 平台在线投诉","merged_from":[],"tags":["消费","维权"],"cost":{"money":"0","time":"30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"平台内投诉解决不了时，走全国 12315 平台（网站/App/小程序）。投诉要写清商家完整名称与统一社会信用代码，很多人到这一步才发现信息不全。","steps":["先向商家和平台投诉，保存工单号与聊天记录","在 12315 平台提交投诉：商家名称、信用代码、事实、诉求、证据","按平台时限补充材料，保持电话畅通","对处理结果不满意，可申请调解或向法院起诉"],"pitfalls":["拿不出商家完整名称和地址，投诉会被退回补正","把「退款」写成「赔偿」，诉求不明确也会影响处理"]},"sources":[{"name":"《市场监督管理投诉举报处理办法》（市场监管总局令第 121 号）","url":"https://www.gov.cn/gongbao/2026/issue_12686/202604/content_7066102.html","note":"投诉举报的受理范围、材料要求与处理时限"}],"addition":true,"why":"平台内投诉解决不了时的官方渠道，很多人卡在不知道商家全称"},{"id":"shop-a2","title":"第一次处理快递丢失和保价索赔","merged_from":[],"tags":["消费","快递","维权"],"cost":{"money":"视保价","time":"数天","willpower":"中"},"evidence":"A","body":{"plain":"快件丢失或损毁，没保价的按运单约定赔偿（往往远低于物品价值），保价的按保价金额赔；关键动作是及时报失并留证。","steps":["发现异常立刻联系快递公司报失，索要工单号","保留寄件凭证、物品价值证明（发票、订单截图）、沟通记录","保价件按保价金额索赔；未保价件按运单约定或法定规则赔","协商不成向邮政管理部门申诉（12305）或走 12315"],"pitfalls":["贵重物品不保价，丢了大件只能按运费倍数赔","拖太久才报失，责任难以认定"]},"sources":[{"name":"《快递暂行条例》（国务院令第 697 号）","url":"https://www.gov.cn/zhengce/content/2018-03/27/content_5277801.htm","note":"快件延误、丢失、损毁的赔偿规则与用户申诉渠道"}],"addition":true,"why":"不保价的赔偿按运单约定而不是物品价值，流程和退货完全不同"},{"id":"shop-a3","title":"第一次分清直播带货、预售和定金膨胀","merged_from":[],"tags":["消费","网购"],"cost":{"money":"视订单","time":"20 分钟","willpower":"中"},"evidence":"A","body":{"plain":"直播间的专属链接、预售的长发货期、「定金膨胀」的退改规则，都和普通下单不一样。核心是分清「定金」和「订金」。","steps":["下单前确认发货时限、是否支持七天无理由、退货地址","看清「定金」字样：定金不退（除商家违约），订金可退","保存直播页面截图、商品详情页存档","超期不发货可投诉并要求承担违约责任"],"pitfalls":["把定金当订金，反悔时钱拿不回来","直播间口头承诺不写进订单详情，事后无法主张"]},"sources":[{"name":"《中华人民共和国电子商务法》","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"电子商务经营者应明示商品信息、发货期限与退换规则"},{"name":"《互联网直播服务管理规定》","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/201905/t20190522_59665.html","note":"互联网直播服务中商品信息的责任要求"}],"addition":true,"why":"预售发货期、直播间专属链接、定金膨胀的退改规则都和普通下单不同"}],"additions":[],"_file":"06-消费与网购篇.json","label":"消费与网购篇"},{"section":"07 学校与大学篇","source_count":60,"merged_count":25,"entries":[{"id":"uni-01","title":"第一次报到：从录取通知书到宿舍","merged_from":["第一次上大学","第一次报到","第一次找宿舍"],"tags":["学校","入学","报到"],"cost":{"money":"学费住宿费按学校标准，另有被褥等杂费","time":"半天到一天","willpower":"中"},"evidence":"A","body":{"plain":"报到就是按录取通知书上的时间和地点，把身份核验、缴费、领材料、分宿舍几件事按顺序办完。流程看着杂，其实是固定的，跟着指示牌和志愿者走就行。","steps":["按录取通知书上的时间来校，带齐身份证、录取通知书、照片和缴费凭证。","到学院报到点核验身份，领学生证和校园卡，办缴费或助学贷款手续。","按分配结果去宿舍楼领钥匙，登记住宿信息。","需要迁户口的按学校要求交材料，不迁的不用管。","把辅导员电话和班级群存好，这是后面所有事的入口。"],"pitfalls":["因故不能按期入学要向学校请假；未请假或者请假逾期，除不可抗力等正当事由外，会被视为放弃入学资格。","报到期间是电信诈骗高发期，凡是让你转账的「老师」「学长」都先当面核实。","别把身份证等证件原件交给别人代办，交复印件时写上用途。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"中国高等教育学生信息网（学信网）","url":"https://www.chsi.com.cn/","note":"学籍学历查询与在线验证报告的官方入口"}]},{"id":"uni-02","title":"第一次住大学宿舍和参加军训","merged_from":["第一次住大学宿舍","第一次参加军训"],"tags":["学校","宿舍","军训"],"cost":{"money":"住宿费按学校标准；军训服装费几十到几百元","time":"宿舍四年，军训 1 到 3 周","willpower":"中"},"evidence":"B","body":{"plain":"宿舍是几个人共用的房间，学校有住宿管理制度，具体细则（电器、门禁、查寝）由学校自己定。军训是入学后的集中训练，通常由学校统一组织，强度看学校安排。","steps":["入住先和室友对一遍作息、卫生、电器使用的底线规则。","记清门禁时间、消防通道和宿管电话。","贵重物品锁进柜子，别放在桌上。","军训前备好防晒、水杯、常用药和合脚的运动鞋，有慢性病提前跟辅导员报备。","身体不适立刻报告教官或辅导员，别硬撑。"],"pitfalls":["大功率电器和明火是宿舍最常见的安全隐患，被查到会处分。","军训中暑、扭伤要及时处理，别怕丢脸。","和室友的矛盾拖着不说过夜，越拖越难收场。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-03","title":"第一次选课、上专业课与认识大学老师","merged_from":["第一次选课","第一次抢课","第一次上专业课","第一次认识大学老师"],"tags":["学校","选课","学分"],"cost":{"money":"正常选课免费，重修可能按学分收费","time":"选课窗口通常只有几小时","willpower":"中"},"evidence":"A","body":{"plain":"大学没有固定课表，学分要自己攒。选课系统开放的时间很短，热门课靠抢；培养方案里哪些是必修、哪些是选修，直接决定你能不能按时毕业。","steps":["在教务系统里打开本专业培养方案，标出必修课和学分要求。","选课前把课程号、时间、教师、考核方式列成一张表，排好优先级。","开放选课的第一时间就提交，抢不到的进候补或换备选课。","第一节课记下考核方式（平时分、论文、考试）和老师联系方式。","每学期末对一次学分进度，别到大四才发现缺课。"],"pitfalls":["只挑「水课」凑学分，专业课跟不上会影响保研和就业。","选课时间和必修课冲突，改起来很麻烦，先排必修。","有些课有先修要求，选不上要先补先修课。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-04","title":"第一次联系老师：加微信、发消息和发邮件","merged_from":["第一次加老师微信","第一次给老师发消息","第一次给老师发邮件"],"tags":["学校","沟通","邮件"],"cost":{"money":"免费","time":"写一条 5 分钟","willpower":"低"},"evidence":"C","body":{"plain":"大学老师一天要回几十条消息，能不能被认真回复，取决于你第一条消息写得清不清楚。基本格式是：自报家门、什么事、你需要什么、什么时候要。","steps":["加微信时验证信息写「XX 级 XX 专业 姓名，关于 XX 课／论文」。","发消息一次说清：你是谁、哪个班、什么问题、希望老师做什么。","邮件主题写「【XX课／论文】姓名-事由」，正文同样先自报家门。","附文件时把文件名写规范，别用「新建文档」。","老师没回，隔一两个工作日再礼貌追问一次，别连发。"],"pitfalls":["只发「在吗」不说事，老师一般不会回。","深夜和节假日催回复容易适得其反。","请假、加分、改成绩这类事先看学校规定，再找老师，别直接求人情。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-05","title":"第一次请假与旷课","merged_from":["第一次请假","第一次逃课"],"tags":["学校","考勤","请假"],"cost":{"money":"免费","time":"10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"请假要走学校规定的流程，一般是辅导员审批或在教务系统提交；没批就不去上课算旷课，累计到一定学时可能影响考试资格甚至被处分。","steps":["先查学生手册或教务系统里的请假规定，看清谁能批、几天内有效。","提前提交申请，写清时间、事由，病假附上病历或诊断证明。","把请假结果同步给任课老师，别只走系统。","回校后按学校要求办销假手续。","缺的课自己补上，笔记找同学借。"],"pitfalls":["先不上课再补请假，很多学校不认。","旷课累计到学校规定的学时会被取消考试资格，具体标准写在学生管理规定和学校细则里。","找人代课、代签到属于违纪，代价远大于一节课。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-06","title":"第一次大学考试、挂科、补考与重修","merged_from":["第一次大学考试","第一次挂科","第一次补考","第一次重修"],"tags":["学校","考试","学分"],"cost":{"money":"补考可能免费，重修按学分收费","time":"一学期一轮","willpower":"高"},"evidence":"A","body":{"plain":"大学成绩一般由平时分和期末考组成。考核不合格的课程是否重修或者补考，由学校自己规定。挂科直接影响学分、奖学金、保研和毕业，别拖到大四才处理。","steps":["开学第一节课记清考核方式和成绩构成，别只盯期末。","考完查成绩，不及格立刻去教务系统看补考或重修安排。","按学校通知报名，注意时间和是否收费。","补考通过一般按及格记分，重修要把课重新上一遍。","算清学分缺口，排进接下来的学期。"],"pitfalls":["作弊后果很重：该课程考核成绩记为无效，并可视情节给予警告、严重警告、记过、留校察看等处分，还会影响学历学位。","补考和重修都有时间窗，错过就要再等一学期。","挂科太多会触发学业预警甚至退学处理，早点找辅导员。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-07","title":"第一次参加社团、学生会与竞选学生干部","merged_from":["第一次参加社团","第一次参加学生会","第一次竞选学生干部"],"tags":["学校","社团","学生工作"],"cost":{"money":"社团会费几十到几百元","time":"每周几小时","willpower":"中"},"evidence":"C","body":{"plain":"社团和学生会是两回事：社团靠兴趣，学生会偏事务和服务。参加之前先想清楚你想获得什么，别一口气报五个，最后哪个都没去。","steps":["招新周去逛逛，问清会费、活动频率和主要的时间投入。","选一到两个真正喜欢的，别贪多。","想竞选学生干部就提前了解岗位职责，准备一段一分钟的自我介绍。","竞选时讲清「你想做什么、怎么做」，比讲情怀有用。","上任后先做一件小事做出结果，再谈更大的计划。"],"pitfalls":["收高额会费、承诺「包过」「包证书」的组织要警惕。","学生工作占用大量时间，成绩掉了得不偿失。","为了头衔参加，简历上写不出成果的头衔没有用。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"}]},{"id":"uni-08","title":"第一次组织活动和上台主持","merged_from":["第一次组织活动","第一次上台主持"],"tags":["学校","活动","主持"],"cost":{"money":"经费一般由学院或社团报销","time":"筹备 1 到 3 周","willpower":"高"},"evidence":"C","body":{"plain":"办活动的成败在前一天就定了：场地批了没、设备能不能用、谁负责哪个环节、出问题谁顶上。上台主持也一样，稿子背不背得下来是次要的，流程清不清楚才是关键。","steps":["先立项：找指导老师或学院报备，拿到场地和经费。","写一份流程表，每项写时间、负责人和备用方案。","提前一天走场，试话筒、投影、签到和引导路线。","主持稿按开场、介绍、串场、收尾分段写，关键信息写在大字卡上。","活动结束当天把照片、签到表和总结交给老师。"],"pitfalls":["没有备用方案，设备一坏就冷场。","分工只写在群里不写名字，最后没人负责。","预算超支自己贴钱，事前先确认报销规则。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"}]},{"id":"uni-09","title":"第一次参加比赛和拿奖","merged_from":["第一次参加比赛","第一次拿奖"],"tags":["学校","竞赛","证书"],"cost":{"money":"正规比赛一般免费，少数收报名费","time":"几周到几个月","willpower":"高"},"evidence":"C","body":{"plain":"大学里的比赛分学科竞赛、创新创业、文体几类，含金量差别很大。参赛的价值一半在结果，一半在过程里做出的作品和认识的人。","steps":["先看主办方和往届获奖名单，判断这个比赛值不值得投入。","组队时技能互补，明确谁写材料、谁做演示、谁管时间。","按评审标准倒推材料，别只写自己觉得厉害的部分。","提交前找指导老师看一遍，重点是格式和佐证材料。","拿奖后保存证书原件，评奖学金、保研都要用。"],"pitfalls":["收报名费、承诺「交钱就有奖」的比赛基本没有含金量。","挂名不干活，答辩时一问就露馅。","证书丢了补办很麻烦，扫描存档。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"}]},{"id":"uni-10","title":"第一次申请奖学金和助学金","merged_from":["第一次申请奖学金","第一次申请助学金"],"tags":["学校","资助","奖学金"],"cost":{"money":"奖学金按等级发放，助学金按月或按学期发放","time":"每学年一次，材料准备几天","willpower":"中"},"evidence":"A","body":{"plain":"奖学金看成绩和综合表现，助学金看家庭经济困难认定，这是两套流程。共同点是都要在开学初按通知提交材料，错过时间就只能等下一年。","steps":["开学初盯紧学院通知，记下截止日期和所需材料。","奖学金：准备成绩单、获奖证书、科研成果和社会活动证明。","助学金：先做家庭经济困难学生认定，提交认定申请表和佐证材料。","按班级或学院评议、公示，公示期内有异议可以反映。","获批后核对发放账户，保存评定文件。"],"pitfalls":["材料造假一旦查实会被取消资格并处分。","家庭经济困难认定需要相应证明材料，提前问清要哪些。","国家助学贷款和助学金是两回事，可以同时申请，别搞混。"]},"sources":[{"name":"《本专科生国家奖学金评审办法》（教财函〔2019〕105号）","url":"http://www.moe.gov.cn/srcsite/A05/s7505/201909/t20190930_401817.html","note":"规定国家奖学金的申请条件、评审程序、公示与发放要求"},{"name":"全国学生资助管理中心（教育部）","url":"https://www.xszz.edu.cn/","note":"官网发布国家奖助学金、国家助学贷款、勤工助学等政策与办理入口"}]},{"id":"uni-11","title":"第一次参加志愿服务和社会实践","merged_from":["第一次参加志愿活动","第一次参加社会实践"],"tags":["学校","志愿服务","实践"],"cost":{"money":"一般不付费，异地实践可能自付路费","time":"一次几小时到几周","willpower":"中"},"evidence":"A","body":{"plain":"志愿服务是有记录的：谁组织、做了多久、做了什么，都需要志愿服务组织登记。你需要证明时，可以要求组织依据记录无偿、如实出具。","steps":["通过学校团委、志愿服务中心或正规公益组织报名。","报名前问清活动内容、时长、集合地点和有没有保险。","服务期间按时签到，让组织方记入志愿服务记录。","结束时索取志愿服务记录证明，并保存电子版。","社会实践（三下乡、社会调查）要提前立项、写方案、交报告。"],"pitfalls":["收费的「志愿服务」多数是商业项目，记录不一定被认定。","只签到不做事，评优时审核会露馅。","记录证明要趁组织还在的时候开，事后补开很难。"]},"sources":[{"name":"《志愿服务条例》（国务院令第685号）","url":"https://www.gov.cn/zhengce/content/2017-09/06/content_5223028.htm","note":"志愿者需要志愿服务记录证明的，志愿服务组织应当依据志愿服务记录无偿、如实出具"},{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"}]},{"id":"uni-12","title":"第一次参加招聘会、找实习与校招","merged_from":["第一次参加招聘会","第一次找实习","第一次实习","第一次写实习简历","第一次参加校招"],"tags":["学校","实习","就业"],"cost":{"money":"实习有报酬；投简历免费","time":"校招季 2 到 4 个月","willpower":"高"},"evidence":"A","body":{"plain":"校招是应届生最重要的入口，实习是它的前置。实习要签学校、实习单位、学生三方协议，工作时间和报酬都有明确规定，不是单位说了算。","steps":["提前准备一页纸的简历，写清专业、技能和项目经历。","从学校就业网、校园招聘会和企业官网投递，警惕收费中介。","拿到实习机会先确认是否签三方实习协议，写清岗位、时间、报酬和责任。","实习期间记录你做了什么，离职时索要实习证明。","校招按「宣讲会—网申—笔试—面试—offer」的节奏排时间。"],"pitfalls":["除临床医学等相关专业及岗位特殊要求外，实习每天工作不得超过 8 小时、每周不得超过 44 小时，不得安排加班和夜班。","顶岗实习的劳动报酬原则上不低于相同岗位试用期工资标准的 80%，被压价可以问学校。","要交钱才能入职、要押身份证的「实习」是骗局。"]},"sources":[{"name":"《教育部关于加强和规范普通本科高校实习管理工作的意见》（教高函〔2019〕12号）","url":"http://www.moe.gov.cn/srcsite/A08/s7056/201907/t20190724_392130.html","note":"要求严格学校、实习单位、学生三方实习协议的签订；除临床医学等相关专业及岗位特殊要求外，每天工作时间不得超过8小时、每周不得超过44小时，不得安排加班和夜班；顶岗实习劳动报酬原则上不低于相同岗位试用期工资标准的80%"},{"name":"中国高等教育学生信息网（学信网）","url":"https://www.chsi.com.cn/","note":"学籍学历查询与在线验证报告的官方入口"}]},{"id":"uni-13","title":"第一次准备和报名考研","merged_from":["第一次准备考研","第一次报名考研"],"tags":["学校","考研","报名"],"cost":{"money":"报名费一百多元，加上资料和辅导费用","time":"准备 6 到 12 个月","willpower":"高"},"evidence":"A","body":{"plain":"考研是「先定专业和学校，再报名，再考试」。报名包括网上报名和网上确认两个阶段，两个都完成才算报上，缺一个就得等下一年。","steps":["先确定报考专业和院校，查招生简章、考试科目和参考书目。","按考试科目安排复习计划，重点放在专业课和英语。","在规定时间内登录研招网网上报名，如实填写信息。","完成网上确认（上传照片、证件），未确认的报名无效。","考前下载准考证，按考点要求准备证件和文具。"],"pitfalls":["只网上报名没做网上确认，等于没报上。","报考点有户籍或工作地要求，选错要重新报名。","复试和调剂也在研招网上进行，别把账号密码忘了。"]},"sources":[{"name":"《2026年全国硕士研究生招生工作管理规定》（教育部）","url":"http://www.moe.gov.cn/srcsite/A15/moe_778/s3261/202509/t20250918_1413836.html","note":"第十九条原文：报名包括网上报名和网上确认两个阶段"},{"name":"中国研究生招生信息网（研招网）","url":"https://yz.chsi.com.cn/","note":"研究生招生网上报名、调剂、准考证下载的官方入口"}]},{"id":"uni-14","title":"第一次考四六级","merged_from":["第一次参加四六级","第一次过四六级"],"tags":["学校","英语","考试"],"cost":{"money":"报名费各省不同，一般几十元","time":"备考 1 到 3 个月","willpower":"中"},"evidence":"A","body":{"plain":"四六级是全国统一考试，报名一般通过学校组织的报名系统，成绩单分纸质和电子两种。现在不少学校已经把四级和毕业脱钩，但招聘时它仍然是常见的门槛。","steps":["关注学校教务或考试中心的通知，在规定时间内报名缴费。","考前打印准考证，带身份证和准考证入场。","考试分听力、阅读、写作和翻译，按题型分配时间。","考后在中国教育考试网查询成绩，下载电子成绩报告单。","没过可以下次再报，多数学校允许重复报考。"],"pitfalls":["报名有截止时间，错过就要等下一次。","成绩报告单丢了可以申请补办成绩证明，但要走官方渠道。","替考、作弊会被取消成绩并通报学校。"]},"sources":[{"name":"全国大学英语四、六级考试报名网（中国教育考试网）","url":"https://cet.neea.edu.cn/","note":"四六级报名、准考证打印、成绩查询的官方入口"},{"name":"中国教育考试网·CET 考试动态","url":"https://cet.neea.edu.cn/html1/category/16093/1124-1.htm","note":"发布四六级报名时间、成绩发布等官方通知"}]},{"id":"uni-15","title":"第一次写毕业论文、查重与答辩","merged_from":["第一次准备毕业论文","第一次写论文","第一次论文查重","第一次论文答辩"],"tags":["学校","论文","学术规范"],"cost":{"money":"打印装订几十到几百元；查重按学校安排","time":"3 到 6 个月","willpower":"高"},"evidence":"A","body":{"plain":"毕业论文的流程是选题、开题、写作、查重、评审、答辩。查重不只是学校卡你，学位论文作假有明确的处理办法：代写、抄袭、伪造数据都可能被撤销已授予的学位。","steps":["早点和导师确定选题，写开题报告，定下大纲和时间表。","按学校模板写，引用要标注来源，别整段复制。","提交前用学校指定的系统查重，重复率不达标就改写并补标注引用。","按评审意见修改，准备答辩 PPT 和讲稿。","答辩时先讲清研究问题、方法、结论，再回答提问。"],"pitfalls":["找代写、买论文的风险极高：已被授予学位的可依法撤销学位并注销学位证书，处理决定向社会公布，从做出处理决定之日起至少 3 年内各学位授予单位不得再接受其学位申请。","用非官方渠道查重，论文可能被泄露或转卖。","答辩答不上来别硬编，承认局限并说明后续改进更稳妥。"]},"sources":[{"name":"《学位论文作假行为处理办法》（教育部令第34号）","url":"https://www.gov.cn/zhengce/2012-11/13/content_5713384.htm","note":"学位论文购买、他人代写、剽窃抄袭、伪造数据等作假情形的，可取消学位申请资格；已获学位的可依法撤销其学位并注销学位证书，处理决定向社会公布，从做出处理决定之日起至少3年内各学位授予单位不得再接受其学位申请"},{"name":"《学位论文作假行为处理办法》（教育部官网版本）","url":"http://www.moe.gov.cn/srcsite/A02/s5911/moe_621/201211/t20121113_170437.html","note":"教育部官网文本，便于核对条文原文"}]},{"id":"uni-16","title":"第一次被老师批评、和同学闹矛盾","merged_from":["第一次被老师批评","第一次和同学发生矛盾"],"tags":["学校","人际","申诉"],"cost":{"money":"免费","time":"因人而异","willpower":"中"},"evidence":"B","body":{"plain":"被批评和同学摩擦几乎是必修课。校内对处理或处分是有正式异议渠道的：可以向学校、教育行政部门提出申诉，也可以依法提起诉讼。","steps":["当场先听完、别急着辩解，把批评里属于事实的部分记下来。","分清是「对事的指正」还是「处分」，前者改就行，后者要看书面依据。","同学矛盾先私下沟通一次，说事实和感受，不翻旧账。","谈不拢找辅导员或班主任做中间人。","收到处分决定，看清事实、依据、申诉途径和期限。"],"pitfalls":["在群里公开撕破脸，后面很难修复。","收到处分不申诉又不去了解流程，会错过期限。","把矛盾发到网上，可能反过来给自己带来麻烦。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-17","title":"第一次搬出宿舍","merged_from":["第一次搬出宿舍"],"tags":["学校","住宿","租房"],"cost":{"money":"校外房租通常远高于住宿费，另有押金","time":"找房 1 到 4 周","willpower":"高"},"evidence":"A","body":{"plain":"搬出宿舍有两条路：学校允许的校外住宿（要办审批），和私下搬走。后者在安全责任、退宿手续和退费上都会出问题，尽量走正规流程。","steps":["先查学生手册和住宿管理规定，看学校是否允许走读或校外住宿。","需要审批的按流程提交申请和监护人知情材料。","签租房合同前看房产证或委托书，把押金和付款方式写进合同。","搬之前办退宿手续，交还钥匙、结清水电、拿退宿证明。","把新地址和紧急联系人告诉辅导员和家人。"],"pitfalls":["不办退宿直接走人，住宿费退不回来，还可能被记违纪。","校外租房的安全责任基本在自己身上，独居更要留意门窗和消防。","押金纠纷很常见，入住时把房屋现状拍照录视频存证。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部官网现行文本，含学籍、转专业、考核等条款，便于逐条核对"}]},{"id":"uni-18","title":"第一次做兼职和家教","merged_from":["第一次大学兼职","第一次做家教","第一次在大学赚钱"],"tags":["学校","兼职","劳动"],"cost":{"money":"时薪几十元不等","time":"每周几小时到十几小时","willpower":"中"},"evidence":"A","body":{"plain":"大学生兼职属于非全日制用工，法律上可以订立口头协议，但为了拿得到钱，最好还是留个书面记录。学校一般有勤工助学岗位，比外面的兼职稳。","steps":["优先看学校勤工助学中心、就业网发布的岗位。","面试时问清工作内容、时薪、结算周期、要不要交押金。","非全日制用工的报酬结算支付周期最长不得超过十五日，口头约定也一样。","上班打卡或留下工作记录，每次结算保留转账记录。","做家教先确认中介是否正规，尽量走平台或熟人介绍。"],"pitfalls":["任何要先交押金、培训费、服装费的兼职都要警惕。","押身份证、签空白合同的一律拒绝。","影响上课的兼职要停：挂科的代价比兼职工资高。"]},"sources":[{"name":"《中华人民共和国劳动合同法》（国务院公报版）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"第三节非全日制用工：非全日制用工双方当事人可以订立口头协议；不得约定试用期；劳动报酬结算支付周期最长不得超过十五日"},{"name":"全国学生资助管理中心（教育部）","url":"https://www.xszz.edu.cn/","note":"官网发布国家奖助学金、国家助学贷款、勤工助学等政策与办理入口"}]},{"id":"uni-19","title":"第一次参加职业培训和考专业证书","merged_from":["第一次参加职业培训","第一次获得专业证书"],"tags":["学校","证书","培训"],"cost":{"money":"几百到上万元不等","time":"几周到几个月","willpower":"中"},"evidence":"A","body":{"plain":"证书分两类：国家职业资格证书（有明确目录）和职业技能等级证书（由评价机构认定）。不在目录里的「证书」多数是机构自己印的，求职时没人认。","steps":["先在人社部门或技能人才评价工作网查这个证书在不在国家目录里。","选培训机构时核实它有没有培训或评价资质。","看清费用构成：培训费、考试费、教材费、补考费。","考完在官方渠道查询证书真伪，保存电子版。","把证书和对应的技能案例一起写进简历。"],"pitfalls":["「包过」「免考拿证」「全国通用」基本都是套路。","分期付费的培训贷要特别小心，退课时贷款还得还。","同一类证书花几千块，用人单位可能根本不看。"]},"sources":[{"name":"《人力资源社会保障部关于健全完善新时代技能人才职业技能等级制度的意见（试行）》","url":"http://hrss.yanbian.gov.cn/xxgk/tzgg/202503/t20250326_526649.html","note":"规定职业技能等级认定的组织实施、证书管理与查询渠道（技能人才评价工作网）"},{"name":"全国学生资助管理中心（教育部）","url":"https://www.xszz.edu.cn/","note":"官网发布国家奖助学金、国家助学贷款、勤工助学等政策与办理入口"}]},{"id":"uni-20","title":"第一次准备和参加公务员考试","merged_from":["第一次准备公务员考试","第一次参加公务员考试"],"tags":["学校","公考","就业"],"cost":{"money":"报名费几十到一百多元，加上资料费","time":"备考 3 到 12 个月","willpower":"高"},"evidence":"A","body":{"plain":"国考是中央机关及其直属机构统一招录，省考由各省组织，流程都是「公告—报名—资格审查—笔试—面试—体检—政审—公示」。报名只能报一个职位，选岗比刷题更影响结果。","steps":["出公告后先看职位表，按专业、学历、基层经历等条件筛出可报职位。","在官方专题网站注册报名，如实填写信息，等资格审查结果。","报名确认并缴费，考前打印准考证。","笔试后按面试比例确定人选，准备面试和体能测评（部分岗位）。","通过后按通知体检、政审、公示。"],"pitfalls":["报名信息不实会在政审阶段被查出来，直接取消资格。","「三不限」职位竞争最激烈，选岗要结合自身条件。","笔试通过只是入场，面试和政审同样会淘汰人。"]},"sources":[{"name":"中央机关及其直属机构考试录用公务员公告（海南省人民政府转载，来源国家公务员局官网）","url":"https://www.hainan.gov.cn/hainan/gwyzk/202412/0b752ef409c742bcbfc24bcbb1fe768c.shtml","note":"发布国考报名时间、报名网站（国家公务员局专题网站）、职位查询与网上报名、资格审查、缴费确认流程"},{"name":"中央机关及其直属机构考试录用公务员公告（重庆市人民政府转载）","url":"http://cq.gov.cn/ywdt/bmts/202410/t20241014_13705676.html","note":"同一公告的政府网站版本，含网上报名、资格审查、缴费确认等流程"}]},{"id":"uni-21","title":"第一次毕业：学士服、毕业典礼与告别","merged_from":["第一次毕业","第一次穿学士服","第一次参加毕业典礼","第一次和同学真正分别"],"tags":["学校","毕业","典礼"],"cost":{"money":"租学士服几十到几百元","time":"典礼一天，离校手续几天","willpower":"低"},"evidence":"A","body":{"plain":"毕业不是典礼那天才发生的，它由一串手续组成：结清学费住宿费、还清图书、办离校手续、领毕业证和学位证。典礼只是最后一场仪式。","steps":["提前查清毕业学分和论文要求，确认能按期毕业。","按学校通知办离校手续：图书馆还书、宿舍退宿、财务结清、党团组织关系转接。","领取毕业证书和学位证书，核对姓名、专业、证书编号。","上学信网查学历信息，确认已经注册。","证书原件保管好，扫描存档，别只带复印件去外地。"],"pitfalls":["离校手续没办完，证书可能被暂缓发放。","毕业证、学位证丢失只能补办毕业证明书或学位证明，不能补发原件。","档案和户口要按学校要求转出，长期挂在学校会影响后续入职。"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第41号）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"含入学与注册（未请假或请假逾期视为放弃入学资格）、考核与成绩记载（考核不合格课程是否重修或补考由学校规定；作弊成绩记无效并可给处分）、转专业、休学、退学、住宿管理、学业证书管理、申诉等章节"},{"name":"中国高等教育学生信息网（学信网）","url":"https://www.chsi.com.cn/","note":"学籍学历查询与在线验证报告的官方入口"}]},{"id":"uni-22","title":"第一次离开校园、成为社会人","merged_from":["第一次离开校园","第一次发现大学真的结束了","第一次成为真正意义上的社会人"],"tags":["学校","毕业","过渡"],"cost":{"money":"第一个月开销通常高于预期","time":"毕业后 1 到 3 个月","willpower":"高"},"evidence":"C","body":{"plain":"毕业后的第一个月最容易慌：没有课表、没有集体、没有统一的下一步。比较实际的做法是先把住处、收入、社保、档案这四件事落定。","steps":["确认住处和租期，把押金、水电、网费的缴费方式记下来。","确认收入来源和发薪日，做出第一版月度预算。","入职后确认单位是否缴社保公积金、从哪个月开始缴。","确认档案和户口的去向：单位、人才服务机构还是原籍。","保留学校就业部门的联系方式，改派、开证明还需要用。"],"pitfalls":["试用期属于劳动关系存续期间，社保应当依法缴纳，「转正后再缴」不是正规做法。","档案不能自己拿着，更不能拆封，拆了可能不被接收。","应届生身份有时间限制，考公考编、落户会用到，别不当回事。"]},"sources":[{"name":"《中华人民共和国劳动合同法》（国务院公报版）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"第三节非全日制用工：非全日制用工双方当事人可以订立口头协议；不得约定试用期；劳动报酬结算支付周期最长不得超过十五日"},{"name":"中国高等教育学生信息网（学信网）","url":"https://www.chsi.com.cn/","note":"学籍学历查询与在线验证报告的官方入口"}]},{"id":"uni-a1","title":"第一次办学生证和校园卡的挂失补办","merged_from":[],"tags":["学校","证件"],"cost":{"money":"工本费几十元","time":"1–3 天","willpower":"低"},"evidence":"B","body":{"plain":"校园卡丢了当天就吃不上饭、进不了图书馆，流程其实固定：先挂失冻结余额，再去对应窗口补办。","steps":["立即在校园卡系统或 App 上挂失，冻结余额","到校园卡服务中心/后勤窗口补办，带学生证或身份证","补办期间可申请临时卡或使用手机虚拟卡","学生证丢失向学院教务或学生工作部门申请补办"],"pitfalls":["不及时挂失，卡内余额可能被刷走","补办窗口有固定办公时间，别赶在周末去"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第 41 号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"学生证、校园卡等在校管理事项由学校依规制定具体办法"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"学校应公布学生管理与服务的具体流程"}],"addition":true,"why":"校园卡丢了当天就影响吃饭与进馆，流程固定但各校窗口不同"},{"id":"uni-a2","title":"第一次转专业、辅修和修双学位","merged_from":[],"tags":["学校","学业"],"cost":{"money":"辅修学费","time":"一学期到两年","willpower":"高"},"evidence":"A","body":{"plain":"学生管理规定明确学生可以申请转专业，辅修与双学位另有学分和成绩要求。很多人到毕业才知道有这条路。","steps":["先看本校《学籍管理办法》和转专业实施细则：申请时间、成绩门槛、名额","转专业通常在大一末或大二初，逾期不再受理","辅修/双学位要修满规定学分，注意与主修课程的时间冲突","把已修课程能否学分互认问清楚，避免白修"],"pitfalls":["错过申请窗口就只能等下一学年甚至没机会","双学位修不完会影响毕业审核，先评估自己的时间"]},"sources":[{"name":"《普通高等学校学生管理规定》（教育部令第 41 号，国务院公报）","url":"https://www.gov.cn/gongbao/content/2017/content_5220900.htm","note":"学生可以按学校规定申请转专业、辅修与双学位等相关事项"},{"name":"《普通高等学校学生管理规定》（教育部官网版本）","url":"http://www.moe.gov.cn/jyb_xxgk/xxgk/zhengce/guizhang/202112/t20211206_585064.html","note":"教育部规章全文"}],"addition":true,"why":"学生管理规定明确可以申请转专业，很多人到毕业才知道"},{"id":"uni-a3","title":"第一次开学历在线验证报告和学籍证明","merged_from":[],"tags":["学校","证件"],"cost":{"money":"免费或几元","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"实习、落户、考编、办签证常被要求学历或学籍证明。在学信网上几分钟就能生成带二维码的在线验证报告，不用回学校盖章。","steps":["在学信网注册并完成学籍/学历绑定","申请《教育部学历证书电子注册备案表》或《学籍在线验证报告》","设置有效期并下载 PDF，把验证码或二维码给对方核验","过期后可重新申请，注意别把报告发到不明网站"],"pitfalls":["把验证报告的验证码公开晒出去，可能被冒用","毕业多年后学信网信息有误，要提前走学历认证流程"]},"sources":[{"name":"中国高等教育学生信息网（学信网）","url":"https://www.chsi.com.cn/","note":"学籍学历在线验证报告的申请与核验入口"}],"addition":true,"why":"实习、落户、考编、办签证都要用，临时被要材料时不用回学校"}],"additions":[],"_file":"07-学校与大学篇.json","label":"学校与大学篇"},{"section":"08 求职与工作篇","source_count":70,"merged_count":30,"note":"合并后每条是一个能独立成文的场景；merged_from 保留原始大纲条目。excluded 列出按分工移到别篇、本篇不重复写的条目。","entries":[{"id":"job-01","title":"第一次写简历和投简历：让筛选的人几十秒看懂你","merged_from":["第一次写简历","第一次投简历"],"tags":["求职","简历"],"cost":{"money":"0 元（正规招聘不收费）","time":"2–4 小时","willpower":"中"},"evidence":"B","body":{"plain":"简历不是把经历讲完，而是让对方在几十秒里判断你和这个岗位对不对得上；投递就是把这份判断送到筛选流程里。任何环节向你收钱的招聘，都要先停下来查一查。","steps":["把岗位描述里的关键词（技能、工具、年限）抄出来，简历里出现这些词，才更容易被搜到。","控制在一页：基本信息—学历—与岗位相关的经历/项目—技能证书，顺序按对方最关心的排。","每段经历写成三句：做了什么、怎么做、结果是什么，能写数字就写数字。","走公司官网/官方招聘渠道或正规招聘平台投递，并记下投了哪家、哪个岗位、什么时候投的。"],"pitfalls":["以押金、培训费、服装费、内推费名义收钱的招聘是红线，人社部门专门提示过“招转培”“培训贷”。","学历、时间、职位造假会在入职核验时直接出问题，得不偿失。","同一家公司海投所有岗位，会让对方看不懂你到底想做什么。"]},"sources":[{"name":"人力资源社会保障部等五部门：警惕“招转培”“培训贷”风险提示","url":"https://chinajob.mohrss.gov.cn/h5/c/2026-05-18/543038.shtml","note":"中国公共招聘网（人社部）发布，页面含“招转培”“培训贷”“风险提示”等内容，讲求职收费陷阱。"},{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"页面含“简历”“面试”“职业”，是官方招聘网站的求职准备类文章。"}]},{"id":"job-02","title":"第一次收到面试邀请：电话、视频、线下三种面试怎么准备","merged_from":["第一次收到面试邀请","第一次电话面试","第一次视频面试","第一次线下面试"],"tags":["求职","面试"],"cost":{"money":"线下可能产生交通费","time":"每次 30–90 分钟","willpower":"中"},"evidence":"B","body":{"plain":"面试邀请通常先由 HR 电话或消息确认，再约具体形式：电话、视频、线下。三种形式的准备内容差不多，差别在环境和设备：电话靠声音，视频靠画面和网络，线下靠时间和路线。","steps":["接到邀请先确认四件事：公司全称、岗位、面试形式、时间地点（线上要问清用什么软件、会议号）。","电话面试找一个安静、信号好的地方，手边放简历和岗位描述，语速放慢。","视频面试提前 10 分钟进会议室，测麦克风摄像头，背景干净、光线照脸，昵称改成真名。","线下面试提前查路线、预留堵车时间，带 1–2 份纸质简历和身份证件，提前 10–15 分钟到前台登记。"],"pitfalls":["把电话面试当成“随便聊聊”，在地铁、商场里接听，第一印象就没了。","线下面试迟到或走错楼，比答错一个问题更伤；宁可早到在楼下等。","对方要求先交钱、先买设备、先做“带资项目”的，先停一停。"]},"sources":[{"name":"第一次面试 你准备好了吗（中国公共招聘网）","url":"http://chinajob.mohrss.gov.cn/h5/c/2021-11-03/329080.shtml","note":"人社部中国公共招聘网求职指导文章，页面含“面试”“简历”内容，讲面试前准备。"},{"name":"人力资源社会保障部等五部门：警惕“招转培”“培训贷”风险提示","url":"https://chinajob.mohrss.gov.cn/h5/c/2026-05-18/543038.shtml","note":"用于核对“面试/入职环节收费”的风险提示，页面含“培训贷”“招转培”。"}]},{"id":"job-03","title":"第一次面试答题：自我介绍、你的缺点、为什么选我们","merged_from":["第一次自我介绍","第一次回答“你的缺点是什么”","第一次回答“为什么选择我们”"],"tags":["求职","面试"],"cost":{"money":"0 元","time":"准备 1–2 小时","willpower":"中"},"evidence":"C","body":{"plain":"这三道题几乎每场面试都会问，它们考的不是口才，而是你有没有提前把“我是谁、我和这个岗位什么关系”想清楚。答案不需要漂亮，需要具体、和岗位有关。","steps":["自我介绍按 1 分钟准备：现在做什么/学什么—和岗位最相关的 1–2 段经历—为什么想来这里。","准备 2 个真实缺点，选那种“已经在改”的，并说清你在用什么办法改。","“为什么选我们”不要说“平台大、离家近”，说一件你了解到的具体事：产品、业务、岗位要求里打动你的点。","把答案写下来念两遍掐时间，然后只记要点，不要背稿。"],"pitfalls":["自我介绍从出生地讲到爱好，超过两分钟还没说到岗位。","缺点说“我太追求完美”“我太拼”这类假缺点，比不说还减分。","完全不了解对方公司就去面试，被问一句业务就露馅。"]},"sources":[{"name":"第一次面试 你准备好了吗（中国公共招聘网）","url":"http://chinajob.mohrss.gov.cn/h5/c/2021-11-03/329080.shtml","note":"页面含“面试”相关内容，用于面试准备流程；具体答法属经验性总结，本条为 C 级。"}]},{"id":"job-04","title":"第一次群面与无领导小组讨论：怎么不当透明人","merged_from":["第一次群面","第一次做无领导小组讨论"],"tags":["求职","面试"],"cost":{"money":"0 元","time":"40–90 分钟","willpower":"中"},"evidence":"C","body":{"plain":"群面是把 5–10 个候选人放一起给一个题目，面试官在边上观察谁在推进事情。它不选“话最多的人”，选的是能让讨论往前走的人。","steps":["开场几分钟先看清题目要求、时间和产出物（要讨论出结论还是方案）。","挑一个角色并做实：记时间、做记录、做总结、或者帮跑偏的讨论拉回来。","发言先接着别人的话（“补充一下刚才的看法”），再说自己的观点，别自说自话。","最后留 2–3 分钟做小组结论，主动问一句“我来汇总可以吗”。"],"pitfalls":["全程抢话、打断别人，表现得像在辩论而不是合作。","一句话不说，面试官对你没有任何可写的东西。","把队友当对手，最后小组没有结论，全组一起减分。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站求职准备文章，页面含“面试”；群面技巧本身为经验性总结，本条为 C 级。"}]},{"id":"job-05","title":"第一次收到 offer 和谈薪资：先看清，再答应","merged_from":["第一次收到 offer","第一次谈薪资"],"tags":["求职","薪资"],"cost":{"money":"0 元","time":"1–3 天","willpower":"中"},"evidence":"B","body":{"plain":"offer 是可以谈的，但谈之前要把数字看清楚：月薪是基本工资还是含绩效、年终奖怎么写、试用期多久、五险一金按什么基数缴。口头承诺不算数，写进 offer 或合同才算。","steps":["把 offer 里的项目逐条列出来：基本工资、绩效/提成、年终奖、补贴、试用期工资和时长、社保公积金基数、上班地点和工时。","拿同城市同岗位的市场区间作参照，说出你希望的数和一个理由（经历、技能、手上有别的机会都可以）。","对方答应的条件，回一封邮件或用招聘平台消息确认一遍，留下文字记录。","确认接受后再答复，答复前不要停止其他面试。"],"pitfalls":["只问“到手多少”，不问社保公积金基数和试用期工资，实际收入可能差不少。","为了拿到 offer 全部答应，入职后才发现和预期不符。","同时答应多家又不去，行业内名声会受影响。"]},"sources":[{"name":"中华人民共和国劳动合同法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"页面含“试用期”“书面劳动合同”“经济补偿”，可核对试用期期限与试用期工资不得低于本单位相同岗位最低档工资或约定工资 80% 的规定。"},{"name":"工资支付暂行规定（中国政府网）","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"页面含“工资”“用人单位”，讲工资支付项目、周期与凭证，谈薪时用来对照工资构成。"}]},{"id":"job-06","title":"第一次签劳动合同和办理入职：签字前要看哪几行","merged_from":["第一次签劳动合同","第一次办理入职"],"tags":["求职","劳动合同","入职"],"cost":{"money":"0 元","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"入职当天通常要签劳动合同、交证件复印件、办社保和公积金增员。劳动合同是这段时间里最重要的一份纸：它决定工资、试用期、工作内容和解除规则。法律要求建立劳动关系应当订立书面劳动合同。","steps":["签字前看：用人单位全称（和你实际工作的公司是否一致）、岗位与工作地点、合同期限、试用期长短、工资数额与发放日、工时制度。","看试用期是否被写进合同、是否超过法定上限，试用期工资有没有低于约定工资的 80%。","入职材料一般包括身份证、学历证明、银行卡、照片；社保公积金由单位办理，你可以在社保 App 上核对是否真的增员。","签完要一份加盖公章的合同原件或电子合同，自己留存。"],"pitfalls":["只签一份、公司全部收走，后面发生争议时你手上没有证据。","被要求签空白合同，或者合同上工资写成最低工资、其余“另算”。","把“试用期不缴社保”当成行规，这不符合社会保险法的规定。"]},"sources":[{"name":"中华人民共和国劳动合同法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"页面含“书面劳动合同”（7 处）、“试用期”（19 处）、“经济补偿”（15 处），可核对订立书面合同、试用期期限与解除补偿的规定。"},{"name":"中华人民共和国社会保险法（中国政府网）","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647616.htm","note":"页面含“基本医疗保险”“失业保险”等章节，用于核对用人单位为职工参保缴费的义务。"}]},{"id":"job-07","title":"第一次上班：认识同事和直属领导","merged_from":["第一次认识同事","第一次认识直属领导"],"tags":["职场","人际关系"],"cost":{"money":"0 元","time":"第一天","willpower":"中"},"evidence":"B","body":{"plain":"入职第一天决定的事不多，但有两件必须弄清楚：你的直属领导是谁、你的活由谁派。从法律上讲，从你实际开始上班那天起，你和单位就已经建立劳动关系了。","steps":["让 HR 或同事带你认一遍人：直属领导、带你的人、日常要打交道的两三个岗位。","记名字和分工：谁审批你的假、谁看你交付的东西、卡住了先找谁。","加工作群和同事微信，把公司通讯录存一份。","见面时用一句话介绍自己：名字、岗位、之前做什么，别长篇大论。"],"pitfalls":["到处打听工资、八卦和领导的私事，第一天就把自己放进是非里。","谁都没认全就埋头干活，需要签字审批时找不到人。","把所有同事都当朋友，抱怨公司和领导的话不要在工作群里说。"]},"sources":[{"name":"中华人民共和国劳动合同法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"页面含“用工之日起”“职工名册”等内容，可核对“用工之日起建立劳动关系”的规定。"},{"name":"中华人民共和国就业促进法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_778166.htm","note":"页面含“公共就业服务”“职业介绍”，用于了解免费的公共就业服务渠道。"}]},{"id":"job-08","title":"第一次开会、做 PPT 和工作汇报","merged_from":["第一次参加公司会议","第一次做 PPT","第一次做工作汇报"],"tags":["职场","汇报"],"cost":{"money":"0 元","time":"1–4 小时","willpower":"中"},"evidence":"C","body":{"plain":"职场里的会议和汇报，本质是让别人知道进度、问题、需要什么支持。PPT 只是容器，讲清楚“结论—依据—下一步”就够了。","steps":["会前问清三件事：这个会要解决什么、你需要说什么、多长时间。","汇报结构固定：先给结论，再给 2–3 条依据，最后说需要谁做什么、什么时候要。","PPT 一页一个意思，字少图清；数字放表格，不要念稿。","会后当天发一条简短纪要：结论、分工、时间点，抄送参会的人。"],"pitfalls":["从头讲过程，讲了十分钟领导还不知道你要什么。","把 PPT 做得花哨但没有数据，被追问就答不上来。","会上答应的事会后不记录，下次对进度时扯不清。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"人社部中国公共招聘网的求职/职业类文章；会议与汇报的具体做法为经验性总结，本条为 C 级。"}]},{"id":"job-09","title":"第一次写工作邮件、周报和月报","merged_from":["第一次写工作邮件","第一次写周报","第一次写月报"],"tags":["职场","文书"],"cost":{"money":"0 元","time":"邮件 10 分钟 / 周报 20 分钟","willpower":"低"},"evidence":"C","body":{"plain":"邮件和周报都是留痕工具：一件事说清楚谁、什么时候、要什么，比文采重要。它们也是你日后证明“我干了什么”的材料。","steps":["邮件标题写清主题+时间+是否需要回复，例如“XX 项目报价确认（本周五前回复）”。","正文先结论后细节：一句话说事、列要点、写清截止时间，附件在正文里点名。","收件人分清楚：直接相关的人放“收件人”，只需要的知会的人放“抄送”。","周报按“本周完成—遇到的问题—下周计划”写；月报在此基础上加数字和成果。"],"pitfalls":["该抄送的人没抄送，出了问题没人知道你说过。","情绪化回复，邮件一旦发出就收不回来。","周报写成流水账，看不出进度和风险。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站的职业类文章；邮件与周报写法为经验性总结，本条为 C 级。"}]},{"id":"job-10","title":"第一次请假和第一次迟到：考勤是怎么回事","merged_from":["第一次请工作假","第一次迟到"],"tags":["职场","考勤"],"cost":{"money":"可能被扣当天工资","time":"10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"请假和迟到都走考勤制度，核心是提前说、留记录。假分几种：事假、病假、年休假、婚丧产假，各自的钱怎么算不一样。连续工作满一年的职工依法享有带薪年休假。","steps":["请假前查公司考勤制度：哪类假要谁审批、提前多久提、需要什么证明（病假通常要医院证明）。","在系统里提交申请，同时用消息告知直属领导，别只发一句“我明天不来了”。","迟到第一时间说明并补打卡，按制度该扣就扣，别想着瞒。","年休假、加班调休这些额度，自己记一份，离职时算得清。"],"pitfalls":["口头请假没有记录，事后按旷工处理很难说清。","把年休假当成“公司福利”不敢请，其实连续工作满 1 年就有法定年休假。","频繁迟到影响的不只是钱，还有试用期评价。"]},"sources":[{"name":"职工带薪年休假条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_6636.htm","note":"页面含“年休假”（34 处）、“工资”，规定累计工作年限对应的年休假天数与未休补偿。"},{"name":"中华人民共和国劳动法（商务部全球法规网收录）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=66953","note":"页面含“工作时间”“工资”，用于核对工时制度与休息休假的基本规定。"}]},{"id":"job-11","title":"第一次犯工作错误和被领导批评","merged_from":["第一次犯工作错误","第一次被领导批评"],"tags":["职场","挫折"],"cost":{"money":"可能产生赔偿或损失","time":"半天到数天","willpower":"高"},"evidence":"C","body":{"plain":"工作中出错的正常处理顺序是：先止损，再报告，最后复盘。被批评时先听完，别急着辩解——你解释的每一句，都应该是在说明事实和补救方案。","steps":["发现错了立刻做两件事：停止继续损失、把现状告诉直接相关的人。","向领导报告时带方案：发生了什么、影响多大、我打算怎么补、需要谁配合。","涉及钱和客户的错，当天留下书面记录（邮件/消息），别只口头说。","事后写一份自己的复盘：原因、改进动作、检查点，下一次怎么不再犯。"],"pitfalls":["瞒着不说，等别人发现时问题已经放大好几倍。","第一时间找理由甩锅，把技术问题变成人际问题。","被批评后情绪崩掉，当场辞职——损失最大的是你自己。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站职业类文章；具体沟通方式为经验性总结，本条为 C 级。"}]},{"id":"job-12","title":"第一次被同事帮助、被夸奖，和第一次帮新同事","merged_from":["第一次被同事帮助","第一次被夸奖","第一次帮助新同事"],"tags":["职场","人际关系"],"cost":{"money":"0 元","time":"日常","willpower":"低"},"evidence":"C","body":{"plain":"职场互助是长期博弈：别人帮了你，你要让人知道这份帮助起了作用；你帮了别人，也不要到处说。被夸奖时，接住并分给协作者，比谦虚推掉更好。","steps":["别人帮你解决了问题，事后用一句话反馈结果：“按你说的改了，已经通过。”","被领导或客户夸奖，回一句“这块是 XX 一起弄的”，顺手把功劳分出去。","帮新同事时给方法而不是替做：告诉他文件在哪、流程怎么走、找谁签字。","把常被问到的问题整理成一份小文档，下次直接发过去。"],"pitfalls":["把别人的帮助当成理所当然，以后再没人愿意搭把手。","帮同事背了他的责任，出了问题算在你头上。","在群里公开纠正新同事的小错，让人下不来台。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站职业类文章；职场互助的具体做法为经验性总结，本条为 C 级。"}]},{"id":"job-13","title":"第一次加班：加班费怎么算，什么算加班","merged_from":["第一次加班"],"tags":["职场","加班","工资"],"cost":{"money":"0 元（可能拿到加班费）","time":"按实际","willpower":"高"},"evidence":"A","body":{"plain":"标准工时制下，国家规定的是每日 8 小时、每周 40 小时工作制；超出部分属于加班，应当安排补休或支付加班工资。加班工资的计算基数和比例，各地执行细节不完全一样，以当地人社部门口径为准。","steps":["先确认自己属于哪种工时制：标准工时、综合计算工时还是不定时工时（后者需经审批）。","加班前留痕：谁安排的、什么时候、做什么，尽量走公司审批或留下消息记录。","月底核对自己的考勤和工资条，看加班时长有没有被记录、加班费有没有发。","如果长期不给加班费，先内部沟通，再向当地人社部门咨询举报渠道。"],"pitfalls":["“自愿加班”写进邮件就等于自己放弃了主张。","以为加班必须给钱就行，法定节假日加班通常应以加班工资而非单纯调休结算。","把加班当努力证明，长期超出身体承受范围，代价是自己的健康。"]},"sources":[{"name":"国务院关于职工工作时间的规定（北京市人民政府网站转载）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201710/t20171009_780941.html","note":"页面含“工作时间”（32 处），规定职工每日工作 8 小时、每周工作 40 小时。"},{"name":"中华人民共和国劳动法（商务部全球法规网收录）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=66953","note":"页面含“工作时间”“工资”，可核对延长工作时间的限制与加班工资支付的规定。"}]},{"id":"job-14","title":"第一次出差和第一次报销：票据、标准与流程","merged_from":["第一次出差","第一次报销"],"tags":["职场","出差","报销"],"cost":{"money":"先垫付，后报销","time":"出差 1–3 天 + 报销 30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"出差是自己先垫钱、回来按公司制度和发票报销。能不能报、报多少，看两件事：公司差旅标准，和发票是否合规。发票不合规，财务一分都报不了。","steps":["出发前问清：住宿标准、交通标准（能否坐高铁一等座/飞机）、餐补多少、是否需要事前审批。","每一笔都留凭证：发票、行程单、支付记录，发票抬头和税号要按公司要求开。","回来后按公司模板填报销单，把发票按时间顺序贴/上传，写清事由和对应项目。","提交后跟进审批，垫付金额大的话提前问清多久到账。"],"pitfalls":["发票抬头写错、税号漏填，只能作废重开。","把私人消费混进差旅发票，属于虚报，可能直接违纪。","不问标准就住贵的酒店，超标部分通常自己承担。"]},"sources":[{"name":"中央和国家机关差旅费管理办法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2014/content_2667621.htm","note":"页面含“差旅费”（34 处）、“报销”（21 处）、“住宿费”（14 处），是差旅开支与报销凭证要求的官方范本（企业制度通常参照）。"},{"name":"中华人民共和国发票管理办法实施细则（国务院公报）","url":"https://www.gov.cn/gongbao/2024/issue_11286/202404/content_6945583.html","note":"页面含“发票”（203 处）、“开具”（43 处），可核对发票开具与取得的基本要求。"}]},{"id":"job-15","title":"第一次见客户、给客户打电话到谈成签单","merged_from":["第一次见客户","第一次给客户打电话","第一次谈客户","第一次签单"],"tags":["职场","销售","客户"],"cost":{"money":"交通与请客费用","time":"数次沟通，数天到数月","willpower":"高"},"evidence":"C","body":{"plain":"从第一次联系到签单是一条线：先弄清对方要什么和谁拍板，再给方案和报价，最后落到合同条款上。全程都要留痕，口头谈成的东西不写下来就等于没有。","steps":["联系前做功课：对方的业务、你和谁对接、对方可能关心什么；打电话先约时间，不要一上来就推销。","见面带着问题去：现在怎么做的、哪里不满意、预算和决策人是谁。","给方案和报价时写清范围、周期、付款方式、超出范围怎么算。","谈定后发一份书面确认（邮件/合同），把价格、交付、验收、违约写清楚再签字。"],"pitfalls":["为了签单口头承诺做不到的事，交付时全变成纠纷。","报价只报总价，不写范围和假设条件，后面不断返工。","合同里只有你方义务，付款节点和验收标准空着。"]},"sources":[{"name":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释（全文，辽宁省阜新市中级人民法院）","url":"https://fx.lncourt.gov.cn/article/detail/2023/12/id/7676914.shtml","note":"用于核对合同成立、格式条款效力、履行与违约责任等一般规则；已 curl 核验页面含「合同编通则」4 处、「格式条款」7 处、「违约责任」11 处"},{"name":"合同行政监督管理办法（市场监管总局令第 77 号，国务院公报）","url":"https://www.gov.cn/gongbao/2023/issue_10606/202307/content_6894764.html","note":"页面含“合同行政监督”（10 处）、“格式条款”（10 处）、“消费者”（28 处），规范合同订立中的告知义务与不公平格式条款的纠正。"}]},{"id":"job-16","title":"第一次拿奖金、升职和涨薪（以及被拒绝升职）","merged_from":["第一次拿奖金","第一次升职","第一次涨薪","第一次被拒绝升职"],"tags":["职场","薪酬","晋升"],"cost":{"money":"0 元（可能增加收入）","time":"一年 1–2 次评估窗口","willpower":"中"},"evidence":"B","body":{"plain":"奖金、调薪和晋升通常跟着公司的绩效周期走：先有评估，再有结果。想要什么，最好在评估之前说出来，而不是结果出来之后抱怨。被拒绝时，问清楚差在哪一项，比争一时高低有用。","steps":["搞清楚公司的节奏：什么时候评绩效、谁提名人选、涨薪幅度由谁定。","平时攒材料：你负责的项目、带来的数字、别人对你的正面反馈。","评估前主动找领导谈一次：我想争取什么、依据是什么、还差什么。","如果被拒绝，问三个问题：差距在哪、下一个周期要达到什么、需要什么支持，并记下来。"],"pitfalls":["拿“我加班最多”当唯一理由，加班时长通常不是绩效标准。","用辞职威胁涨薪，除非你真的准备走。","只跟同事横向比较工资，容易忽略岗位和职责差异。"]},"sources":[{"name":"工资支付暂行规定（中国政府网）","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"页面含“工资”（62 处）、“用人单位”（30 处），可核对工资组成、支付周期与凭证要求。"},{"name":"中华人民共和国劳动合同法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"页面含“劳动报酬”“变更”等条款，用于核对变更劳动合同约定内容需协商一致的要求。"}]},{"id":"job-17","title":"第一次和领导意见不一致，第一次拒绝不合理的工作安排","merged_from":["第一次和领导意见不一致","第一次拒绝不合理工作"],"tags":["职场","沟通","边界"],"cost":{"money":"0 元","time":"一次谈话","willpower":"高"},"evidence":"C","body":{"plain":"和领导有分歧是常态，关键是把“人”和“事”分开：先确认目标一致，再讨论路径。拒绝也不是硬顶，而是把代价摆出来，让对方在信息完整的情况下决定。","steps":["先复述对方的要求：“我的理解是要在周五前上线，对吗？”确认没有误解。","给替代方案而不是只说不行：如果按 A 做会牺牲什么，按 B 做可以怎样。","涉及加班、超出岗位职责或明显违规的事，用书面方式确认（消息/邮件）。","谈完发一条简短总结，把结论和分工写清楚。"],"pitfalls":["当着别人的面顶撞，问题会从“事”变成“态度”。","嘴上答应、实际拖延，最后变成你的执行问题。","被要求做违规的事（伪造数据、签假合同）也照做，责任会落到你身上。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"人社部中国公共招聘网职业类文章；沟通与拒绝的具体话术为经验性总结，本条为 C 级。"}]},{"id":"job-18","title":"第一次和同事产生冲突，第一次职场背锅","merged_from":["第一次和同事产生冲突","第一次职场背锅"],"tags":["职场","冲突","留痕"],"cost":{"money":"0 元","time":"数天","willpower":"高"},"evidence":"C","body":{"plain":"同事冲突大多起于责任边界不清，而“背锅”往往是因为没有留痕。处理顺序是：私下沟通、留证据、必要时让上级介入，全程对事不对人。","steps":["冲突当下先停：不在群里吵，约 10 分钟当面或电话说清楚。","把事实摆出来：时间、任务、谁答应了什么，用聊天记录或邮件对齐。","如果被指为责任方，先确认事实再回应，把相关记录整理成一份时间线。","解决不了就请直属领导介入，让领导做分工裁定，而不是评理。"],"pitfalls":["在群里公开指责同事，等于把矛盾交给所有人围观。","口头交接不留记录，出问题时无法证明你交过。","为了“和气”把所有责任认下来，下一次还是你背。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站职业类文章；冲突处理为经验性总结，本条为 C 级。"}]},{"id":"job-19","title":"第一次带新人和第一次成为负责人","merged_from":["第一次带新人","第一次成为负责人"],"tags":["职场","管理"],"cost":{"money":"0 元","time":"每天多花 30–60 分钟","willpower":"中"},"evidence":"C","body":{"plain":"从自己干到带别人干，最大的变化是：你的产出不再是你做了多少，而是团队交付了什么。带新人的第一步是让他能独立完成最小的那件事。","steps":["给新人一张清单：要看的文档、要用的系统、第一个小任务和验收标准。","第一周每天花 15 分钟同步一次：卡在哪、明天做什么，别等他出错才发现。","把“我以为你知道”变成书面说明，减少反复解释。","当负责人后学会分派和检查节点，而不是把活都揽回自己身上。"],"pitfalls":["嫌新人慢就自己上手，结果你更累，他也没成长。","只交任务不交标准，交付物一改再改。","当负责人后还按个人贡献者的方式工作，忽略了排期和风险。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站职业类文章；带人与负责的具体做法为经验性总结，本条为 C 级。"}]},{"id":"job-20","title":"第一次独立做项目、项目失败和被客户投诉","merged_from":["第一次独立完成项目","第一次项目失败","第一次被客户投诉"],"tags":["职场","项目"],"cost":{"money":"0 元","time":"数周到数月","willpower":"高"},"evidence":"C","body":{"plain":"独立做项目意味着你要自己盯住三件事：范围、时间、谁配合。项目失败和被投诉，通常不是某一个瞬间出错，而是风险很早就出现了、没人说。","steps":["开工前写清三样：交付物是什么、什么时候交、谁验收。","把任务拆成节点，每个节点有负责人和日期，每周更新一次进度表。","出现风险立刻上报，越早说代价越小，同时带上你的补救方案。","被客户投诉时先听完并复述问题，给出处理时限，再内部定位原因。"],"pitfalls":["前期不敢承诺也不敢拒绝，范围一路膨胀，最后必然延期。","报喜不报忧，等爆掉时才让领导知道。","对客户情绪化回应，把一次投诉升级成一次解约。"]},"sources":[{"name":"深入浅出 清晰你的“职业画像”（中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/h5/c/2022-10-19/362618.shtml","note":"官方招聘网站职业类文章；项目与投诉处理为经验性总结，本条为 C 级。"}]},{"id":"job-21","title":"第一次辞职：辞职信、办离职和拿离职证明","merged_from":["第一次辞职","第一次写辞职信","第一次办理离职","第一次拿离职证明"],"tags":["职场","离职"],"cost":{"money":"0 元（可能有未结工资与补偿）","time":"30 天通知期（试用期 3 天）","willpower":"中"},"evidence":"A","body":{"plain":"劳动者辞职一般是提前 30 天书面通知用人单位（试用期内提前 3 天），不需要单位批准，但要走完交接。离职时有两样东西必须拿到：解除/终止劳动合同的证明，和办结的社保、档案转移手续。","steps":["写一份简单的辞职信：收件人、本人姓名、岗位、离职日期、签名和日期，用邮件或系统提交并留存。","和领导确认最后工作日、交接清单、未结工资和年休假折算。","办离职手续：交还电脑门禁、结清借款、确认社保公积金停缴月份。","离开时索要离职证明，核对上面写的岗位和在职时间是否准确。"],"pitfalls":["一气之下直接不来上班，可能被按旷工处理并影响工资结算。","不办交接就走，离职证明和背调都可能被卡。","离职证明原件只有一份，复印留存，别随手交给下家不还。"]},"sources":[{"name":"中华人民共和国劳动合同法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"页面含“解除”“经济补偿”“书面”，可核对劳动者提前通知解除的期限和用人单位出具解除证明、办理转移手续的义务。"},{"name":"中华人民共和国社会保险法（中国政府网）","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647616.htm","note":"页面含“失业保险”等章节，用于核对社保关系转移接续的规定。"}]},{"id":"job-22","title":"第一次失业、被裁员、跳槽和重新找工作","merged_from":["第一次失业","第一次重新找工作","第一次跳槽","第一次被裁员"],"tags":["职场","失业","求职"],"cost":{"money":"收入中断，可申领失业保险金","time":"1–6 个月","willpower":"高"},"evidence":"A","body":{"plain":"失业之后先办两件事：确认社保断缴的影响、看能不能领失业保险金。被裁员时，除了工资，还可能涉及经济补偿，签任何“自愿离职”文件前要看清楚。","steps":["离职后尽快做失业登记，查看是否符合失业保险金申领条件，很多地方可以线上申领。","核对工资、年休假折算、经济补偿是否结清，补偿标准和计算方式有法定规则。","社保尽量别断：短期内可以灵活就业人员身份自己缴，或尽快接上下家。","重新找工作时把上一段的成果整理成可量化的例子，别只写职责。"],"pitfalls":["被劝着签“个人原因离职”，可能影响经济补偿和失业保险金资格。","社保断缴影响买房、落户、医保报销等待遇，别不当回事。","急着接一个明显不合适的 offer，几个月后又得重来。"]},"sources":[{"name":"失业保险条例（广东省人民政府政策法规库）","url":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2521625.html","note":"页面含“失业保险金”（23 处）、“失业登记”（3 处），规定领取条件与期限。"},{"name":"失业保险金申领渠道有哪些？（江苏省人力资源和社会保障厅）","url":"http://jshrss.jiangsu.gov.cn/art/2025/2/20/art_91453_11496019.html","note":"页面含“失业保险金”“申领”，列举线上申领渠道（全国统一入口与地方 App）。"}]},{"id":"job-23","title":"第一次创业：注册公司和注册个体户","merged_from":["第一次创业","第一次注册公司","第一次注册个体户"],"tags":["创业","登记"],"cost":{"money":"注册本身多为免费，刻章/代账等有支出","time":"3–15 个工作日","willpower":"高"},"evidence":"A","body":{"plain":"想正经做生意，先选主体形式：个体工商户手续最简单、责任在个人；公司（有限责任公司）以出资额为限承担责任，但要记账报税、按时年报。两者都在市场监管部门登记。","steps":["定好名字、经营范围、注册地址（很多地方允许集群注册/一址多照，问当地窗口）。","准备材料：身份证、住所使用证明、公司章程（公司需要），通过当地政务服务平台的企业开办专区线上提交。","领取营业执照后办后续事项：刻章、银行开户、税务登记（现在多为一次办结或并联办理）。","记住两个持续性义务：按期记账报税、每年报送年度报告，不做会被列入经营异常名录。"],"pitfalls":["以为“注册完就没事了”，不报税不年报，几个月后进异常名录、影响征信和贷款。","用个人卡长期收公司款，账目混乱，税务和债务都说不清。","注册地址用虚假地址，被抽查到会被撤销登记。"]},"sources":[{"name":"中华人民共和国市场主体登记管理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2021-08/24/content_5632964.htm","note":"页面含“登记”（176 处）、“营业执照”（26 处），规定登记事项、登记程序和年度报告义务。"},{"name":"促进个体工商户发展条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2022-10/25/content_5721592.htm","note":"页面含“个体工商户”（92 处），规定个体工商户登记、变更与扶持措施。"}]},{"id":"job-24","title":"第一次找客户、收商业款和给客户开发票","merged_from":["第一次找客户","第一次收商业款","第一次给客户开发票"],"tags":["创业","经营","发票"],"cost":{"money":"发票按税率缴税","time":"每单 10–30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"做生意收到钱，必须留下凭证：合同、收款记录、发票。发票不是“给客户的一张纸”，它是税务凭证，开多少、开什么项目，都要和真实交易对得上。","steps":["接单前确认对方主体：公司全称、统一社会信用代码、开票信息，写进合同。","收款走对公账户，个人账户收款也要留转账记录和事由，别用现金。","按合同约定的时间开票，票面项目、金额要和实际业务一致，现在多为电子发票。","每单归档：合同、发票、收款记录放在一起，季度报税时不用到处找。"],"pitfalls":["帮客户“多开点票”，属于虚开发票，是违法的。","只收钱不给票也不申报，属于偷逃税风险。","合同里没写付款节点和逾期责任，尾款拖到没脾气。"]},"sources":[{"name":"中华人民共和国发票管理办法实施细则（国务院公报）","url":"https://www.gov.cn/gongbao/2024/issue_11286/202404/content_6945583.html","note":"页面含“发票”（203 处）、“开具”（43 处），规定发票开具、取得与保管要求。"},{"name":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释（全文，辽宁省阜新市中级人民法院）","url":"https://fx.lncourt.gov.cn/article/detail/2023/12/id/7676914.shtml","note":"用于核对合同成立、格式条款效力、履行与违约责任等一般规则；已 curl 核验页面含「合同编通则」4 处、「格式条款」7 处、「违约责任」11 处"}]},{"id":"job-25","title":"第一次招人和第一次给员工发工资","merged_from":["第一次招人","第一次给员工发工资"],"tags":["创业","用工","工资"],"cost":{"money":"工资+社保公积金单位部分","time":"每月固定 1–2 天","willpower":"高"},"evidence":"A","body":{"plain":"一旦开始招人，你就从“个体”变成“用人单位”：要签书面劳动合同、依法缴社保、按月发工资并代扣个税。这些是法定义务，不因为公司小就可以省。","steps":["招人前想清楚岗位职责和薪酬区间，面试时说明试用期和社保安排。","用工之日起一个月内签书面劳动合同，办理社保、公积金增员。","固定发薪日，工资条写明应发、社保公积金个人部分、个税、实发。","每月按时申报个税，工资凭证和考勤记录留存备查。"],"pitfalls":["用“劳务协议”代替劳动合同来规避社保，被认定劳动关系后要补缴并承担赔偿。","口头约定工资、不写进合同，争议时说不清。","拖欠工资不仅伤人心，还可能被列入失信名单。"]},"sources":[{"name":"中华人民共和国劳动合同法（国务院公报全文）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"页面含“书面劳动合同”“试用期”“经济补偿”，规定用工之日起一个月内订立书面合同等义务。"},{"name":"工资支付暂行规定（中国政府网）","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"页面含“工资”“用人单位”，规定工资支付项目、周期、代扣情形和凭证保存。"}]},{"id":"job-26","title":"第一次亏掉自己的钱、创业失败和重新开始","merged_from":["第一次亏掉自己的钱创业","第一次创业失败","第一次重新开始"],"tags":["创业","失败","征信"],"cost":{"money":"视投入而定","time":"数月到数年","willpower":"高"},"evidence":"B","body":{"plain":"创业失败最常见的善后是四件事：清税、注销或转让主体、处理债务、保住个人信用。不做注销就放着不管，会带来年报异常、税务异常，甚至影响个人征信和以后再创业。","steps":["先盘点：欠谁的钱、谁欠你的、还有什么资产和设备可以变现。","结清税款后办理注销（简易注销适用于符合条件的个体户和小微企业），或把公司依法转让。","个人债务和公司债务分清：有限责任公司以出资额为限，但个人担保、抽逃出资等情况会突破这个界限。","保留所有清算、注销、还款凭证，重新就业或再创业时用得上。"],"pitfalls":["公司不注销也不年报，被吊销后法定代表人会被限制担任新公司职务。","个人账户和公司账户长期混用，最后债务边界说不清。","为了翻本借高息资金继续投入，把小亏变成大亏。"]},"sources":[{"name":"中华人民共和国市场主体登记管理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2021-08/24/content_5632964.htm","note":"页面含“登记”“注销”，规定注销登记程序与不履行义务的后果。"},{"name":"征信业管理条例（中国政府网）","url":"https://www.gov.cn/zhengce/2013-01/29/content_2602614.htm","note":"页面含“征信”（145 处）、“信用报告”“异议”，用于了解信用记录与异议处理。"}]},{"id":"job-a1","title":"第一次查一家公司是不是真的","merged_from":[],"tags":["求职","防骗"],"cost":{"money":"0","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"面试前后花十分钟查公司底细：有没有真实经营、是否被列入经营异常、有没有行政处罚，能过滤掉大部分空壳招聘。","steps":["在国家企业信用信息公示系统查公司全称，看成立时间、经营范围、经营状态","看「经营异常名录」和「行政处罚」信息","核对面试地址与注册地址是否一致，异常偏僻要警惕","把查询结果截图留档"],"pitfalls":["公司名与招聘信息里的名字不一致，先问清主体","查不到任何工商信息，基本可以直接放弃"]},"sources":[{"name":"国家市场监督管理总局（企业信用信息公示主管）","url":"https://www.samr.gov.cn/","note":"国家企业信用信息公示系统由国家市场监督管理总局主管，可查询企业登记与经营异常信息"}],"addition":true,"why":"面试前后确认公司是否真实存在，避免掉进空壳招聘"},{"id":"job-a2","title":"第一次办失业登记与就业创业证","merged_from":[],"tags":["求职","社保"],"cost":{"money":"0","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"要领失业保险金、享受就业服务与补贴，通常要先做失业登记。很多人失业后才知道这一步。","steps":["到户籍地或常住地的公共就业服务机构（或线上政务平台）办理失业登记","准备身份证、解除或终止劳动关系证明等材料","符合条件的同时申请失业保险金，注意申领时限","保存受理回执，跟进审核结果"],"pitfalls":["以为失业金会自动到账，结果错过申领期","离职证明写「个人原因」，可能影响领取资格"]},"sources":[{"name":"《中华人民共和国社会保险法》","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647616.htm","note":"失业保险与失业登记的制度依据"},{"name":"《失业保险条例》","url":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2521625.html","note":"失业保险金申领条件与期限"}],"addition":true,"why":"要领失业保险金通常要先做失业登记，很多人失业后才知道"},{"id":"job-a3","title":"第一次面对竞业限制和保密协议","merged_from":[],"tags":["求职","合同"],"cost":{"money":"可能影响下一份工作","time":"30 分钟","willpower":"中"},"evidence":"A","body":{"plain":"入职时一并签的竞业限制协议，会影响你离职后能不能去同行。看清三件事：限制范围、期限、有没有补偿。","steps":["确认自己是否属于「负有保密义务的人员」，普通岗位一般不受竞业限制约束","看限制期限（最长不超过二年）、地域与业务范围","竞业限制必须约定并支付经济补偿，没补偿的可主张不受约束","离职时书面确认是否启动竞业限制"],"pitfalls":["签了没补偿的竞业协议就自我限制，白白错过机会","把保密义务和竞业限制混为一谈"]},"sources":[{"name":"《中华人民共和国劳动合同法》（国务院公报版）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"竞业限制的人员范围、期限（不超过二年）与经济补偿要求"}],"addition":true,"why":"入职一并签的协议会影响下一份工作，离职前必须知道范围与补偿"},{"id":"job-a4","title":"第一次在试用期被辞退","merged_from":[],"tags":["求职","劳动"],"cost":{"money":"可能涉及赔偿","time":"数天","willpower":"中"},"evidence":"A","body":{"plain":"试用期不是「随便辞」：用人单位要证明你不符合录用条件，并说明理由。被辞退时先要书面通知与理由。","steps":["要求出具书面解除通知，写明理由与依据","核对试用期长度是否合法（劳动合同法对试用期上限有规定）","问清工资结算、社保缴纳到哪一天，出具离职证明","认为违法解除的，可申请劳动仲裁主张赔偿金"],"pitfalls":["口头让走人就走人，事后无法证明被辞退","签「自愿离职」文件，等于放弃主张权利"]},"sources":[{"name":"《中华人民共和国劳动合同法》（国务院公报版）","url":"https://www.gov.cn/gongbao/content/2007/content_711013.htm","note":"试用期期限上限、解除条件与违法解除的赔偿规则"}],"addition":true,"why":"试用期不是「随便辞」，需要符合法定情形并说明理由"}],"additions":[],"excluded":[{"title":"第一次商务宴请","moved_to":"17 餐饮娱乐篇（按分工去重）"}],"_file":"08-求职与工作篇.json","label":"求职与工作篇"},{"section":"09 医疗健康篇","source_count":60,"merged_count":26,"note":"合并后每条是一个能独立成文的场景；merged_from 保留原始大纲条目。excluded 列出按分工移到别篇、本篇不重复写的条目。","entries":[{"id":"med-01","title":"第一次去医院：挂号、分诊台和找科室","merged_from":["第一次去医院","第一次线上挂号","第一次现场挂号","第一次找分诊台","第一次找科室"],"tags":["医疗","挂号","流程"],"cost":{"money":"挂号费 10–100 元不等","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"去医院的顺序是：挂号→到科室所在楼层报到/分诊→等叫号→进诊室。现在多数医院可以线上挂号（医院公众号、App、本地健康平台），线下窗口和自助机也还开着，号源紧张时线上更早放号。","steps":["先在医院官方公众号或 App 上选科室和医生，看清楚是普通号、专家号还是特需号，以及就诊时间段。","带上身份证和医保凭证（医保卡或医保码）；第一次去这家医院可能要先去人工窗口建档。","到医院后先找科室的分诊台/自助报到机扫码报到，不报到叫不到你的号。","不确定挂哪个科，就去一楼分诊台说清主要症状和持续时间，让护士指路。"],"pitfalls":["挂错科要重新挂号，专家号当天可能已经没了。","迟到过号要重新排队，很多医院规定过号需重新报到。","轻信“加号”“内部号”的黄牛，钱花了还可能办不成。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”（96 处）、“执业”“诊疗”，规定医疗机构执业与诊疗活动的基本要求。"},{"name":"国务院办公厅关于促进“互联网+医疗健康”发展的意见（北京市人民政府网站）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/201905/t20190522_61099.html","note":"页面含“预约诊疗”“互联网”“医疗健康”，是线上挂号、预约诊疗服务的政策依据。"}]},{"id":"med-02","title":"第一次见医生：怎么把症状说清楚","merged_from":["第一次见医生","第一次向医生描述症状"],"tags":["医疗","就诊"],"cost":{"money":"0 元","time":"5–15 分钟","willpower":"低"},"evidence":"A","body":{"plain":"门诊给每个病人的时间通常只有几分钟，说清楚比说得多重要。按“哪里不舒服—多久了—什么情况下加重或缓解—吃过什么药—有没有相关病史”这个顺序讲，医生就能快速判断。","steps":["进诊室先给一句总结：“我咳嗽两周了，最近三天发烧。”","带上之前的检查报告、化验单和正在吃的药（或药盒照片）。","医生问什么答什么，别自己下诊断，也别隐瞒病史、过敏史和用药情况。","没听懂就问：这个检查为什么做、结果什么时候出、下次什么时候复诊。"],"pitfalls":["从半年前的事开始讲，讲到叫号结束还没说到重点。","自己先在网上查了结论，反复要求医生按你的判断开检查。","不同医院/不同科室的病历和报告不带着，重复检查又要花钱。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“执业”“诊疗”，规定医疗机构及其人员执业活动的基本规范。"},{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”（25 处）、“调解”（69 处），规定患者查阅复制病历资料、知情同意的权利。"}]},{"id":"med-03","title":"第一次测血压、抽血和验尿","merged_from":["第一次测血压","第一次抽血","第一次验尿"],"tags":["医疗","检查"],"cost":{"money":"血常规/尿常规几十元","time":"30–90 分钟","willpower":"低"},"evidence":"A","body":{"plain":"这三项是最基础的检查：血压当场出结果，抽血和验尿要去检验科，结果通常当天或次日取。抽血前是否需要空腹，按医生和检验科的要求来，别自己猜。","steps":["医生开单后先去缴费（自助机或手机都能交），再拿缴费单去检验科取号排队。","抽血前确认是否要求空腹；需要空腹的项目，前一天晚饭后就别吃东西，具体以检验科告知为准。","验尿一般取中段
