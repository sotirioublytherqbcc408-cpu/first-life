尿，容器上写清姓名和编号，避免污染样本。","按回执上的时间取报告，很多医院可以在公众号或 App 上直接看电子报告。"],"pitfalls":["没空腹就去抽血，结果不准要重抽一次。","抽血后按压时间不够，针眼淤青一片。","报告随手丢，复诊时医生看不到趋势，只能重做。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“诊疗”“执业”等，用于核对医疗机构开展检验检查的基本要求。"},{"name":"卫生部《健康体检管理暂行规定》（北京市人民政府网站）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201811/t20181123_776800.html","note":"页面含“健康体检”（71 处），规定体检项目、体检报告与体检机构的管理要求。"}]},{"id":"med-04","title":"第一次做心电图、B 超、X 光、CT 和核磁","merged_from":["第一次做心电图","第一次做 B 超","第一次拍 X 光","第一次做 CT","第一次做核磁共振"],"tags":["医疗","影像检查"],"cost":{"money":"几十元到上千元不等","time":"每项 10–40 分钟，CT/核磁可能预约","willpower":"中"},"evidence":"A","body":{"plain":"心电图、B 超、X 光、CT、核磁是五类不同的检查，开哪一项由医生根据病情决定。X 光和 CT 有电离辐射，属于放射诊疗，机构必须有相应许可；核磁没有电离辐射，但体内有金属植入物、心脏起搏器的人不能随便做，必须提前告知医生。","steps":["缴费后到相应科室（放射科/超声科/心电图室）预约或取号，CT、核磁常常要排到几天后。","检查前如实告诉医生：是否怀孕或可能怀孕、体内有没有金属/植入物、有没有造影剂过敏史。","做检查时按要求去除金属物品、按要求屏气或保持不动，动了就要重做。","取报告时连同影像胶片/电子影像一起保存，复诊和转院都要用。"],"pitfalls":["把核磁当成“更高级的 CT”主动要求做，检查项目应由医生判断。","隐瞒怀孕或金属植入物，可能造成风险和检查失败。","只拿文字报告不拿影像，换医院时可能要重做。"]},"sources":[{"name":"放射诊疗管理规定（中国政府网）","url":"https://www.gov.cn/zhengce/2006-01/24/content_5713774.htm","note":"页面含“放射诊疗”（84 处）、“射线”，规定放射诊疗许可、防护与受检者告知要求。"},{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”，用于核对开展检查项目需具备的执业条件。"}]},{"id":"med-05","title":"第一次做胃镜（含无痛胃镜）","merged_from":["第一次做胃镜"],"tags":["医疗","内镜"],"cost":{"money":"普通胃镜几百元，无痛更贵","time":"半天（含等待与苏醒）","willpower":"高"},"evidence":"A","body":{"plain":"胃镜是医生把内镜从口腔送进食道、胃和十二指肠看一遍，必要时取一小块组织做病理。做不做无痛（麻醉）由医生评估，麻醉需要家属陪同，当天不能自己开车。","steps":["按医嘱做术前准备：通常需要禁食禁水若干小时，具体时间以医院告知为准。","如实告知病史和用药（尤其是抗凝、抗血小板类药物）、过敏史，由医生判断是否需要调整。","检查时按医生指令吞咽、呼吸；无痛胃镜会在麻醉下完成，醒来可能有喉咙不适。","取活检的，按告知的时间取病理报告，再带着报告复诊。"],"pitfalls":["没按要求禁食，只能改期重约。","做无痛胃镜没人陪同，医院可能不给做。","做完就开车或骑车走，麻醉残留有风险。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“诊疗”“执业”，用于核对医疗机构开展内镜等诊疗活动的执业要求。"},{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”“知情”，规定实施手术、特殊检查等应当向患者说明并取得同意。"}]},{"id":"med-06","title":"第一次做体检，第一次陪家人做体检","merged_from":["第一次做体检","第一次陪家人做体检"],"tags":["医疗","体检"],"cost":{"money":"几百元到数千元","time":"半天","willpower":"低"},"evidence":"A","body":{"plain":"体检是给没有明显症状的人做健康检查，和看病是两条线。单位体检一般有固定套餐，自费体检可以按年龄、性别和家族史选加项，但不必“越贵越好”。","steps":["提前预约，问清是否需要空腹、几点前到、哪些项目要憋尿（如妇科/前列腺 B 超）。","体检当天带身份证，先做需要空腹的项目（抽血、腹部 B 超），再做其他项目。","报告出来后看“结论与建议”那一页，标红的指标带着报告找对应科室复查。","陪家人体检时帮着核对项目、记医生说的话，并把历年的报告按年份收好。"],"pitfalls":["把体检报告当诊断书，指标异常就自己吓自己或者不当回事。","隐瞒病史或漏做项目，报告结论会失真。","去年的报告随手扔，看不出指标变化趋势。"]},"sources":[{"name":"卫生部《健康体检管理暂行规定》（北京市人民政府网站）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201811/t20181123_776800.html","note":"页面含“健康体检”（71 处），规定健康体检的机构条件、项目与报告要求。"}]},{"id":"med-07","title":"第一次看化验单和检查报告，第一次知道自己的血型","merged_from":["第一次看化验单","第一次看检查报告","第一次知道自己的血型"],"tags":["医疗","报告"],"cost":{"money":"0 元","time":"10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"报告单上会有“结果值、参考区间、箭头”三样东西，超出参考区间不等于有病，单一指标也不能下结论。血型一般在血常规之外的专门检验或献血时确定，以检验报告上写的为准，不要凭记忆。","steps":["先看报告单上的姓名、日期、项目名称，确认是自己的、是这一次的。","对照参考区间看箭头，把异常项抄下来，连同报告一起给开单医生看。","需要转院或复诊，去医院病案室/自助机打印或复印病历资料，法律上患者有权查阅复制。","血型、过敏史这类信息记在手机备忘录里，急用时能立刻说出来。"],"pitfalls":["自己在网上搜指标，把正常波动当成重病。","只看箭头不看参考区间（不同医院、不同方法的区间不一样）。","报告原件交出去后不留复印件，后面要用时拿不出。"]},"sources":[{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”（25 处），规定患者有权查阅、复制病历资料，医疗机构应提供。"},{"name":"卫生部《健康体检管理暂行规定》（北京市人民政府网站）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201811/t20181123_776800.html","note":"页面含“健康体检”“体检报告”，用于核对体检报告的出具与告知要求。"}]},{"id":"med-08","title":"第一次拿处方、缴费和取药","merged_from":["第一次拿处方","第一次去医院缴费","第一次去医院取药"],"tags":["医疗","药品","缴费"],"cost":{"money":"药费按处方","time":"30–60 分钟","willpower":"低"},"evidence":"A","body":{"plain":"看完病后的顺序是：缴费→取药（或先做检查再回诊）。处方药必须凭医生处方购买，药店不能随便卖；取药时药师会交代用法用量，这是最该听清的一段话。","steps":["在自助机、手机或窗口缴费，保留缴费凭证和发票。","到药房取药先取号，叫到号把处方和缴费单一起给药师。","核对药名、数量、用法用量、疗程，当场问清饭前饭后、漏服怎么办。","把药盒和说明书留好，复诊时告诉医生你在吃什么药。"],"pitfalls":["不看处方直接去外面药店买，处方药买不到或买错规格。","把不同科室开的药混着吃，不告诉医生自己在用的其他药。","剩余药品随手扔，过期药继续吃。"]},"sources":[{"name":"中华人民共和国药品管理法（国家市场监督管理总局网站）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_b73ec9dabb2d468281d6c994b4bcdaf8.html","note":"页面含“处方药”“非处方药”，规定处方药凭处方销售、药品经营的基本要求。"},{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”，用于核对医疗机构药事与诊疗服务的基本规范。"}]},{"id":"med-09","title":"第一次用医保，第一次异地就医","merged_from":["第一次使用医保","第一次异地就医"],"tags":["医疗","医保","异地就医"],"cost":{"money":"个人自付部分","time":"备案线上几分钟","willpower":"中"},"evidence":"A","body":{"plain":"医保结算现在主要靠医保码或社保卡：挂号、缴费、取药都能刷。跨省就医要不要先备案、能直接结算还是先垫付后报销，取决于你就医的类型（异地安置、长期居住、转诊、临时外出），出发前先查清楚。","steps":["先在手机上激活医保电子凭证（国家医保服务平台 App、微信/支付宝里的医保码都行），或带上社保卡。","跨省就医前，通过国家医保服务平台 App 或参保地医保窗口办理异地就医备案，按提示选备案类型。","在就医地选择已开通跨省直接结算的定点医院，挂号时说明“异地医保、要直接结算”。","结算时看清楚报销明细和自付金额；不能直接结算的，保留发票、费用清单、病历回参保地手工报销。"],"pitfalls":["没备案就直接去外地住院，可能降低报销比例甚至要全额垫付。","以为医保什么都报，目录外的药品和项目是自费的。","把医保卡借给别人用，属于违规，可能被暂停结算。"]},"sources":[{"name":"国家医保局 财政部关于进一步做好基本医疗保险跨省异地就医直接结算工作的通知（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2022-07/26/content_5702881.htm","note":"页面含“异地就医”（446 处）、“备案”（138 处）、“直接结算”（156 处），列明各类备案人员所需材料和结算规则。"},{"name":"跨省异地就医如何直接报销？（国家医疗保障局）","url":"https://www.nhsa.gov.cn/art/2025/3/16/art_14_16010.html","note":"国家医保局官方解读，页面含“异地就医”“备案”“直接结算”，讲备案与直接结算的办理方式。"}]},{"id":"med-10","title":"第一次挂急诊，第一次半夜去医院","merged_from":["第一次急诊","第一次半夜去医院"],"tags":["医疗","急诊"],"cost":{"money":"急诊挂号与检查费用","time":"数小时","willpower":"高"},"evidence":"A","body":{"plain":"急诊是按病情轻重排序，不是按先来后到：分诊护士会先测生命体征、分级，危重病人优先。半夜去急诊流程和白天差不多，但只有急诊科、检验和影像的值班力量。","steps":["到急诊先找分诊台，说清最要紧的症状和开始时间，配合测量体温、血压、血氧。","带身份证、医保凭证和以往病历；如果有在吃的药，带上药盒或拍照。","按分级等待叫号，期间如果症状明显加重，立刻再找分诊护士，不要硬等。","离开前问清：回家后什么情况要立刻再来、复诊挂哪个科、药怎么吃。"],"pitfalls":["因为等待时间长就和护士争吵，反而耽误自己的分诊评估。","半夜独自去急诊又没人陪同，需要做检查或缴费时手忙脚乱。","症状缓解就自行离院，没有办离院手续，病历和费用都不完整。"]},"sources":[{"name":"院前医疗急救管理办法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2014/content_2580977.htm","note":"页面含“急救”（116 处）、“院前”（56 处），规定院前急救与院内急诊衔接的要求。"},{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”，用于核对医疗机构急诊救治的执业要求。"}]},{"id":"med-11","title":"第一次住院：办住院手续、手术到出院（含陪护）","merged_from":["第一次住院","第一次陪别人住院","第一次办理住院手续","第一次办理出院","第一次手术"],"tags":["医疗","住院","手术"],"cost":{"money":"押金+自付部分，视病情","time":"数天到数周","willpower":"高"},"evidence":"A","body":{"plain":"住院是一条固定流程：门诊开住院单→住院处办手续交押金→进病区→检查和治疗→出院结算。手术前必须由医生说明情况并签署同意书，这是法定的知情同意程序。","steps":["拿住院单到住院处办手续：带身份证、医保凭证，交押金，办好后到病区护士站报到。","住院期间留好每日费用清单，问清哪些是医保内、哪些自费。","手术或特殊检查前，医生会说明风险并让你签同意书；听不懂就问，签字前你有权了解。","出院时先到护士站办出院、拿出院小结和病历复印件，再去结算窗口办医保结算，最后按医嘱复诊。"],"pitfalls":["医保卡没带或没办异地备案，出院结算时只能先自费再回参保地报销。","出院小结和费用清单不拿，后面报销、复查、请假证明都缺材料。","陪护时不清楚病区的探视和陪护规定，被反复劝离。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“执业”“诊疗”，规定医疗机构住院、诊疗活动的基本要求。"},{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”“调解”“知情”，规定手术等需说明并取得书面同意、病历资料查阅复制。"}]},{"id":"med-12","title":"第一次打针、打点滴和缝针","merged_from":["第一次打针","第一次打点滴","第一次缝针"],"tags":["医疗","治疗"],"cost":{"money":"几十元到几百元","time":"30 分钟到数小时","willpower":"中"},"evidence":"A","body":{"plain":"打针、输液、缝针都属于有创操作，在门诊治疗室或急诊清创室完成。输液前护士会核对姓名、药名和过敏史，这一步一定要配合确认，不要嫌麻烦。","steps":["输液先去缴费、取药，再到输液室交药和输液单，取号等叫号。","护士核对姓名和药名时认真应答，主动说出药物过敏史。","输液过程中不要自己调滴速；出现发冷、皮疹、心慌，立刻按呼叫铃。","缝针后问清换药时间、拆线时间和伤口护理要求，按时间去复诊。"],"pitfalls":["为了赶时间自己调快滴速，可能引起不良反应。","针眼按压时间不够，淤青或者出血。","缝针后不按时换药、不拆线，伤口感染或留疤。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”“执业”，规定诊疗活动与护理工作的基本规范。"},{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”，用于核对诊疗记录与知情告知要求。"}]},{"id":"med-13","title":"第一次骨折和第一次受伤","merged_from":["第一次骨折","第一次受伤"],"tags":["医疗","外伤"],"cost":{"money":"几百元到数万元（视是否手术）","time":"数周到数月","willpower":"高"},"evidence":"A","body":{"plain":"外伤后的流程是：先判断有没有危及生命的情况，再去急诊→拍片→医生判断是固定还是手术。骨科的片子（X 光/CT）和病历要一路留好，复诊、换医院、走保险都用得上。","steps":["怀疑骨折时不要反复搬动受伤部位，用硬物临时固定后尽快去急诊。","到急诊挂骨科或创伤外科，配合拍片、必要时做 CT。","医生给出治疗方案（保守固定或手术）时，问清愈合时间、复查频率和注意事项。","把所有影像资料、诊断证明、发票留档；需要请假或报销时都要用。"],"pitfalls":["觉得“能动能走”就不是骨折，拖几天才去医院，错过复位时机。","自行找推拿、正骨处理明显变形或剧痛的部位。","不按时复查，内固定或石膏出问题时才发现。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”，用于核对急诊、外科诊疗的执业要求。"},{"name":"放射诊疗管理规定（中国政府网）","url":"https://www.gov.cn/zhengce/2006-01/24/content_5713774.htm","note":"页面含“放射诊疗”“射线”，规定 X 光、CT 等放射检查的许可与防护要求。"}]},{"id":"med-14","title":"第一次严重发烧和第一次突发疼痛","merged_from":["第一次严重发烧","第一次遇到突发疼痛"],"tags":["医疗","急症"],"cost":{"money":"急诊费用","time":"数小时","willpower":"高"},"evidence":"A","body":{"plain":"发烧和疼痛是症状不是诊断，该不该去急诊看的是“危险信号”：持续高热、意识不清、剧烈且突然的疼痛、伴随呕吐或呼吸困难等，出现这些要马上去医院。判断这部分请交给医生，本条只说流程。","steps":["先记录：什么时候开始、体温多少、疼在哪里、有没有其他症状、吃了什么药。","情况紧急或夜间加重，直接去急诊，到分诊台如实说明，配合分级评估。","带上身份证、医保凭证、近期化验单和正在服用的药。","离开医院前问清：什么情况下必须立刻再来、什么时候复诊、用药怎么用。"],"pitfalls":["自己加大药量或混吃多种退烧、止痛药。","白天拖着不去、晚上才挂急诊，检查科室夜里不一定全开。","因为不想麻烦别人，一个人硬扛着去，路上出事没人知道。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“诊疗”“执业”“医疗机构”，规定医疗机构救治与转诊的基本要求。"},{"name":"院前医疗急救管理办法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2014/content_2580977.htm","note":"页面含“急救”“院前”，说明院前急救与院内急诊的衔接与呼叫响应。"}]},{"id":"med-15","title":"第一次一个人生病、一个人在医院","merged_from":["第一次一个人生病","第一次一个人在医院"],"tags":["医疗","独自生活"],"cost":{"money":"交通与餐饮等额外支出","time":"半天到数天","willpower":"高"},"evidence":"B","body":{"plain":"一个人看病最难的不是流程，而是没人帮你排队、拿药、听医嘱。办法是提前把能线上办的都线上办，把医生说的话当场记下来，并让一个可信任的人知道你在哪家医院。","steps":["出门前充好手机电、带充电宝，把身份证、医保凭证、就诊卡放进同一个袋子。","能用手机完成的（挂号、缴费、取报告）都线上办，减少跑动和排队。","医生交代的内容用手机备忘录记下来，或者请医生写在病历上。","告诉一位家人或朋友你在哪家医院、大概什么时候结束，需要做麻醉类检查时通常必须有人陪同。"],"pitfalls":["以为所有事都能一个人扛，需要家属签字的检查和手术会被卡住。","拎着一堆药和报告挤地铁，现金和证件容易丢。","生病期间瞒着所有人，出事时没人知道去哪里找你。"]},"sources":[{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”，用于核对门诊、急诊与住院服务的基本流程。"},{"name":"国务院办公厅关于促进“互联网+医疗健康”发展的意见（北京市人民政府网站）","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/201905/t20190522_61099.html","note":"页面含“互联网”“医疗健康”，是线上挂号、线上缴费、线上查询报告的政策依据。"}]},{"id":"med-16","title":"第一次照顾生病的人，第一次照顾父母","merged_from":["第一次照顾生病的人","第一次照顾父母"],"tags":["医疗","照护"],"cost":{"money":"陪护与误工成本","time":"数天到数月","willpower":"高"},"evidence":"A","body":{"plain":"照顾病人实际是三件事：跑手续、记医嘱、盯变化。你是家属，不是医生，做的是把信息对齐、把流程走完，并把变化及时反馈给医护。","steps":["第一天就把关键信息记在一张纸上：主管医生、责任护士、病区电话、每日查房时间。","把检查安排、用药、费用清单按时间整理，避免漏做检查和重复缴费。","医生说明病情时，问清下一步方案和可选项；重要谈话可以请医生在病历中记录。","自己也要排班休息，长期陪护可以请护工或家人轮换。"],"pitfalls":["家属之间互相传话，医嘱越传越走样。","凭网上说法擅自给病人停药、加药。","一个人连轴转，病人还没好，自己先垮掉。"]},"sources":[{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”（25 处）、“调解”，规定患者与家属的知情、查阅复制病历等权利。"},{"name":"医疗机构管理条例（安徽省卫生健康委员会）","url":"https://wjw.ah.gov.cn/public/7001/56314051.html","note":"页面含“医疗机构”“诊疗”，用于核对住院、探视与陪护相关的机构管理要求。"}]},{"id":"med-17","title":"第一次给别人买药、买家用器械和急救用品","merged_from":["第一次给别人买药","第一次使用体温计","第一次使用血压计","第一次买急救用品"],"tags":["医疗","药品","家庭常备"],"cost":{"money":"几十元到几百元","time":"1 小时","willpower":"低"},"evidence":"A","body":{"plain":"药店里的药分处方药和非处方药，处方药必须凭处方买。给别人买药时，最容易出错的不是买贵了，而是买错品种、剂量或剂型（成人/儿童、缓释/普通）。","steps":["带着处方或药盒照片去买，写清用药人的年龄、体重、过敏史和正在吃的其他药。","买器械（体温计、血压计）先看有没有说明书和正规厂家信息，按说明书操作，测血压前静坐几分钟。","家里常备的急救用品按用途买：消毒、包扎、止血、烫伤处理类，放在固定位置并定期检查有效期。","把过期药挑出来，送到药店的过期药回收点，不要冲厕所或混进生活垃圾。"],"pitfalls":["凭印象买药，把成人药给孩子按成人剂量吃。","把几种成分重复的感冒药一起吃，导致同一成分过量。","急救包放在柜子最深处或车里暴晒，真要用时找不到或用不了。"]},"sources":[{"name":"中华人民共和国药品管理法（国家市场监督管理总局网站）","url":"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_b73ec9dabb2d468281d6c994b4bcdaf8.html","note":"页面含“处方药”“非处方药”，规定处方药凭处方销售与药品经营管理要求。"}]},{"id":"med-18","title":"第一次食物中毒和第一次严重过敏","merged_from":["第一次遇到食物中毒","第一次严重过敏"],"tags":["医疗","急症","食品安全"],"cost":{"money":"急诊费用","time":"数小时到数天","willpower":"高"},"evidence":"A","body":{"plain":"这两类情况的共同点是起病急，处理顺序也一样：先就医，再保留证据。如果怀疑是吃出来的，剩下的食物、包装、小票、同餐的人，都是后面维权要用的证据。","steps":["出现明显不适尽快去医院急诊，症状重时按急救流程呼叫 120。","把吃剩的食物、外包装、点餐订单和付款记录留好，不要全部丢掉。","同行的人有相同症状，一起记录时间和症状，就医时告诉医生。","需要投诉或索赔时，可通过 12315 平台向市场监管部门投诉举报，提交证据材料。"],"pitfalls":["把可疑食物全部扔了，后面无法取证。","自行催吐、自行服药，尤其是意识不清或儿童。","过了很久才投诉，样品和记录都没了。"]},"sources":[{"name":"院前医疗急救管理办法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2014/content_2580977.htm","note":"页面含“急救”“院前”，规定院前急救呼叫与转运的基本要求。"},{"name":"市场监督管理投诉举报处理暂行办法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2020/content_5483878.htm","note":"页面含“投诉”（104 处）、“举报”（67 处），规定投诉举报的受理范围、渠道与时限。"}]},{"id":"med-19","title":"第一次做心理咨询，第一次面对自己的心理问题","merged_from":["第一次做心理咨询","第一次面对自己的心理问题"],"tags":["医疗","心理健康"],"cost":{"money":"医院心理门诊几十到几百元/次，社会机构更高","time":"每次约 50 分钟","willpower":"高"},"evidence":"A","body":{"plain":"心理问题和其他疾病一样，是可以去医院看的：综合医院有心理科/精神科，专科医院有精神卫生中心。心理咨询和心理治疗不是一回事，是否需要用哪种方式、是否需要用药，由专业人员评估。","steps":["先挂号：综合医院心理科/精神科，或当地精神卫生中心；就诊时如实说明睡眠、情绪、持续时间和影响。","第一次通常是评估和访谈，可能会做量表；把最近的压力事件、既往病史和用药如实说出来。","按医嘱复诊，不要自行停药；心理咨询通常需要固定频率、持续一段时间。","紧急情况下（有自伤/伤人想法）立刻去急诊或拨打当地心理援助热线，不要独自扛着。"],"pitfalls":["把心理咨询当成“聊聊天”，期待一次就解决。","找没有资质的“大师”做高价疗程，钱花了问题没解决。","自己停药或改剂量，症状反弹更难受。"]},"sources":[{"name":"中华人民共和国精神卫生法（广东省人民政府政策法规库）","url":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2724529.html","note":"页面含“精神障碍”（153 处）、“心理咨询”（9 处），规定心理健康促进、心理咨询与精神障碍诊疗的基本规则。"}]},{"id":"med-20","title":"第一次购买商业医疗保险和第一次申请理赔","merged_from":["第一次购买医疗保险","第一次申请医疗理赔"],"tags":["医疗","保险"],"cost":{"money":"保费按年龄和保障范围","time":"投保 1 小时，理赔数天到数周","willpower":"中"},"evidence":"A","body":{"plain":"商业医疗险是补充医保的：医保先报，剩下的按合同约定的范围和比例报。买之前要看清三件事：保什么、不保什么（责任免除）、理赔要什么材料。","steps":["投保时如实填写健康告知，问清楚等待期、免赔额、报销比例、是否限社保内用药。","看病时保留全套材料：发票原件、费用清单、出院小结/病历、检查报告、医保结算单。","出院或就诊后尽快报案（多数公司要求一定期限内），按理赔指引提交材料。","收到理赔结论后有异议，按合同申请复核，或向金融监管部门投诉渠道反映。"],"pitfalls":["健康告知随便填，理赔时被认定未如实告知而拒赔。","把发票原件交出去又不留复印件，其他报销渠道走不了。","以为“什么都赔”，实际免赔额、等待期、既往症都不在赔付范围内。"]},"sources":[{"name":"健康保险管理办法（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2019-12/04/content_5458542.htm","note":"页面含“医疗保险”（56 处）、“理赔”（16 处），规定健康保险的经营、销售与理赔服务要求。"}]},{"id":"med-21","title":"第一次献血","merged_from":["第一次献血"],"tags":["医疗","公益"],"cost":{"money":"0 元","time":"30–60 分钟","willpower":"低"},"evidence":"A","body":{"plain":"国家实行无偿献血制度，献血要在正规献血点（血站、流动采血车）进行，献血前会做健康征询和简单体检，合格才能献。献血不会给钱，任何“有偿卖血”都是违法的。","steps":["带身份证到血站或流动献血车，填写健康征询表，如实回答病史、用药和近期出行情况。","现场会测血压、血红蛋白等指标，符合条件才安排采血。","采血过程几分钟到十几分钟，结束后按压针眼、休息观察一会儿再走。","领献血证（现在多为电子献血证），下次献血或本人及家属用血时按规定享受相关待遇。"],"pitfalls":["空腹去献血，容易头晕甚至晕倒。","隐瞒近期手术、用药或传染病风险情况，对己对人都不负责。","为了拿补贴去非正规渠道“卖血”，既违法又有感染风险。"]},"sources":[{"name":"中华人民共和国献血法（山西省沁水县政府信息公开平台转载）","url":"https://xxgk.qinshui.gov.cn/xzf/qswtj/fdzdgknr/ylws/202108/t20210830_1460817.shtml","note":"页面含“献血”（38 处）、“无偿献血”（7 处），规定国家实行无偿献血制度、献血年龄与健康检查要求。"}]},{"id":"med-22","title":"第一次面对亲人生病，第一次意识到健康的重要","merged_from":["第一次面对亲人生病","第一次真正意识到健康的重要性"],"tags":["医疗","家庭"],"cost":{"money":"因人而异","time":"因人而异","willpower":"高"},"evidence":"A","body":{"plain":"亲人生病时，家属要做的是三件事：把治疗流程走顺、把关键信息问清、把该留的材料留住。同时也要照顾自己的情绪，长期照护本身就是一件消耗很大的事。","steps":["确认三件事：谁主管、下一步方案是什么、什么时候需要家属签字或决定。","把病历、检查报告、费用清单按时间收在一个文件袋里，复诊和报销都用得上。","和家里人说清楚分工：谁陪护、谁跑手续、谁对接医生，避免都到场又都没听清。","自己撑不住时，向医院社工、心理门诊或朋友求助；照护者也需要被照顾。"],"pitfalls":["家属之间因为治疗方案争吵，耽误的是病人的时间。","擅自对病人隐瞒或夸大病情，后续沟通越来越难。","把自己的身体和情绪完全放到最后，最后倒下两个人。"]},"sources":[{"name":"医疗纠纷预防和处理条例（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"页面含“病历”“调解”，规定患者与家属的知情同意、病历查阅复制权利。"},{"name":"中华人民共和国精神卫生法（广东省人民政府政策法规库）","url":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2724529.html","note":"页面含“精神障碍”“心理咨询”，用于了解心理健康服务与求助渠道。"}]},{"id":"med-a1","title":"第一次复印病历（病案室流程）","merged_from":[],"tags":["医疗","办事"],"cost":{"money":"按页收费","time":"1–3 天","willpower":"中"},"evidence":"A","body":{"plain":"转院、报销、保险理赔、纠纷处理都可能要病历复印件。出院后到病案室申请，本人带身份证，代办要带委托书。","steps":["出院时先问清病案室位置、复印办理时间和所需材料","本人办理：身份证；代办：患者身份证复印件 + 代办人身份证 + 委托书","明确要复印的范围：住院病案首页、入院记录、病程记录、检查报告、出院小结","核对页数与盖章，保留一份电子扫描件"],"pitfalls":["出院后隔太久才去，部分医院归档需要等待","只复印了出院小结，理赔时才发现材料不全"]},"sources":[{"name":"《医疗纠纷预防和处理条例》（国务院令第 701 号）","url":"https://www.gov.cn/zhengce/zhengceku/2018-08/31/content_5318057.htm","note":"患者有权查阅、复制病历资料，医疗机构应当提供"}],"addition":true,"why":"转院、报销、理赔、纠纷都要病历复印件，很多人出院后才发现"},{"id":"med-a2","title":"第一次办门诊慢特病待遇认定","merged_from":[],"tags":["医疗","医保"],"cost":{"money":"0","time":"数周","willpower":"中"},"evidence":"A","body":{"plain":"长期用药的门诊费用能不能按更高比例报销，取决于有没有办门诊慢特病备案。认定通过后，门诊拿药也能按住院比例走。","steps":["确认自己所在地区把哪些病种纳入门诊慢特病范围","准备诊断证明、病历、检查报告，到定点医院或医保经办机构提交","在医保 App 或经办窗口查询认定进度与结果","认定后到定点医院和药店就医购药，按对应待遇结算"],"pitfalls":["先自费买了几个月药才去办，之前的费用不一定能追补","病种范围各地不同，别照搬外地经验"]},"sources":[{"name":"国家医疗保障局（门诊慢特病、药品目录与定点机构）","url":"http://www.nhsa.gov.cn/","note":"门诊慢特病病种范围与待遇认定由统筹地区医保部门规定"}],"addition":true,"why":"长期用药能否按更高比例报销，取决于是否办了慢特病备案"},{"id":"med-a3","title":"第一次带孩子打疫苗（预防接种证）","merged_from":[],"tags":["医疗","育儿"],"cost":{"money":"免疫规划疫苗免费","time":"半天","willpower":"中"},"evidence":"B","body":{"plain":"孩子出生后要办预防接种证，入托入学都要查验。免疫规划疫苗免费，非免疫规划疫苗自费自愿。","steps":["出生后在接种单位办理预防接种证，妥善保管","按接种程序预约，接种前如实告知孩子健康状况","接种后留观 30 分钟再离开","入托入学前做接种证查验，缺针及时补种"],"pitfalls":["接种证丢失会影响入托入学，需回原接种单位补办","孩子发热或急性病期间应暂缓接种，别硬打"]},"sources":[{"name":"中国疾病预防控制中心（疫苗接种与免疫规划）","url":"https://www.chinacdc.cn/","note":"国家免疫规划疫苗接种程序与预防接种证查验要求"}],"addition":true,"why":"入托入学要用接种证，补种和查验流程是新手家长的常见难题"},{"id":"med-a4","title":"第一次在医保 App 查药品目录和定点医院","merged_from":[],"tags":["医疗","医保"],"cost":{"money":"影响自付比例","time":"5 分钟","willpower":"低"},"evidence":"B","body":{"plain":"同一个药，目录内和目录外自付差别很大；去非定点机构就医可能无法直接结算。出门前在医保 App 查一下能省不少钱。","steps":["在国家医保服务平台 App 查药品是否在目录内、属于甲类还是乙类","查定点医疗机构与定点零售药店名单","异地就医前先做备案，否则报销比例会降低","结算时核对费用明细，有疑问当场问清"],"pitfalls":["不做异地备案就去外地看病，报销比例明显偏低","只看药名不看剂型规格，同名的不同规格报销规则可能不同"]},"sources":[{"name":"国家医疗保障局（门诊慢特病、药品目录与定点机构）","url":"http://www.nhsa.gov.cn/","note":"国家医保药品目录、定点机构与异地就医备案的官方查询入口"}],"addition":true,"why":"同样的药目录内和目录外自付差别很大，出门前查一下能省钱"}],"additions":[],"excluded":[{"title":"第一次叫救护车","moved_to":"18 安全与紧急情况篇（按分工去重）"},{"title":"第一次处理烫伤","moved_to":"18 安全与紧急情况篇（按分工去重）"},{"title":"第一次处理割伤","moved_to":"18 安全与紧急情况篇（按分工去重）"}],"_file":"09-医疗健康篇.json","label":"医疗健康篇"},{"section":"10 证件/政务/法律篇","source_count":60,"merged_count":26,"note":"合并后每条是一个能独立成文的场景；merged_from 保留原始大纲条目。excluded 列出按分工移到别篇、本篇不重复写的条目。","entries":[{"id":"gov-01","title":"第一次办身份证：首次申领、补办和到期换证","merged_from":["第一次办理身份证","第一次补办身份证","第一次换身份证"],"tags":["证件","身份证"],"cost":{"money":"首次申领与换领工本费按当地规定，多为几十元","time":"现场 30 分钟，制证数个工作日","willpower":"低"},"evidence":"A","body":{"plain":"居民身份证由公安机关签发，第一次申领一般要到户籍地派出所办，换领和丢失补领现在多数地方可以异地受理。有效期按办证时的年龄不同，具体以证件上印的为准。","steps":["首次申领：带户口簿到户籍地派出所（未满 16 周岁由监护人陪同），现场采集人像和指纹。","到期换证：可在居住地公安机关的异地受理点办，带原身份证和当地要求的居住证明材料，先线上预约更省时间。","丢失补办：先通过公安 App 或窗口挂失，再申请补领；急用可以同时办临时身份证。","领证时核对姓名、号码、有效期，按当地要求交回旧证。"],"pitfalls":["身份证借给别人开卡、注册公司，是给自己埋雷，出事要自证清白。","换证期间旧证被剪角后不能再用，出差住店、坐飞机要用临时身份证或电子证照。","照片不合规（戴美瞳、浓妆、遮挡面部）会被要求重拍。"]},"sources":[{"name":"中华人民共和国居民身份证法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2003/content_62254.htm","note":"页面含“居民身份证”（68 处）、“十六周岁”（10 处），规定申领、换领、补领与有效期等基本规则。"},{"name":"国务院办公厅关于加快推进政务服务“跨省通办”的指导意见（中国政府网）","url":"https://www.gov.cn/zhengce/content/2020-09/29/content_5548125.htm","note":"页面含“跨省通办”“异地”，列举可在异地办理的证件类事项。"}]},{"id":"gov-02","title":"第一次办护照、港澳通行证，第一次去出入境大厅和办签证","merged_from":["第一次办理护照","第一次办理港澳通行证","第一次办理签证","第一次去出入境大厅"],"tags":["证件","出入境"],"cost":{"money":"护照/通行证工本费按国家规定，签证费按目的地国","time":"办证约 7–15 个工作日（以受理回执为准）","willpower":"中"},"evidence":"A","body":{"plain":"护照和往来港澳通行证由公安机关出入境管理机构签发，签证则由目的地国家的驻华使领馆或签证中心签发——顺序是先有护照，再谈签证。办证现在基本都要先线上预约，再去出入境大厅现场办理。","steps":["在国家移民管理局 App 或当地政务平台预约，选办理地点和时间。","按预约到出入境大厅：带身份证、现场拍照、采集指纹、填写申请表、缴费，选择邮寄或自取。","拿到护照后，按目的地要求准备签证材料（行程、住宿、在职或在读证明、资金证明等），通过使领馆官网或授权签证中心递交。","港澳出行还要选对签注类型（个人旅游、团队旅游、探亲等），签注有效期和次数按出行计划选。"],"pitfalls":["护照有效期不足（很多国家要求剩余 6 个月以上）会影响签证和入境，出行前先看有效期。","首次办护照必须本人到场，找人代办是违规的。","轻信“包过签证”的中介，材料造假会被拒签并留下记录。"]},"sources":[{"name":"中华人民共和国护照法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2006/content_320583.htm","note":"页面含“护照”（92 处）、“普通护照”（12 处），规定护照的申请、签发与有效期。"},{"name":"普通护照签发服务指南（商务部国家层面海外综合服务平台转载）","url":"https://fec.mofcom.gov.cn/article/ggfw/crjfw/crjfwxx/202512/2496.html","note":"页面含“护照”（82 处）、“申请”（86 处）、“出入境”（36 处），列明申请材料与办理流程。"},{"name":"往来港澳通行证和签注签发服务指南（商务部国家层面海外综合服务平台转载）","url":"https://hzf.mofcom.gov.cn/article/ggfw/crjfw/crjfwxx/202512/2521.html","note":"页面含“港澳”（107 处）、“签注”（123 处），列明通行证与各类签注的申请材料。"},{"name":"中国领事服务网（外交部）出国签证栏目","url":"https://cs.mfa.gov.cn/zggmcg/cgqz/","note":"页面含“签证”（32 处），是外交部发布各国签证信息与提醒的官方栏目。"}]},{"id":"gov-03","title":"第一次办银行卡实名和手机号实名","merged_from":["第一次办理银行卡实名","第一次办理手机号实名"],"tags":["证件","实名制","金融"],"cost":{"money":"开卡与入网一般免费","time":"各 30–60 分钟","willpower":"低"},"evidence":"A","body":{"plain":"开银行卡和办手机号都必须实名登记。个人银行账户分 I、II、III 类，功能和使用限额不同；手机号按电话用户真实身份信息登记的规定办理。这两样现在都是骗子最喜欢借用的东西。","steps":["本人带身份证到银行网点或运营商营业厅办理，配合人脸识别和身份核验。","开卡时问清是几类账户：I 类功能最全，II/III 类有额度和场景限制。","手机号入网后，可在运营商 App 查询名下号码，发现不是自己办的号码立即申诉注销。","换号、销户前先解绑银行卡、支付软件和各类账号，避免收不到验证码。"],"pitfalls":["把银行卡、手机卡借给或卖给他人使用，可能构成帮助信息网络犯罪活动罪。","名下有多张不用的卡和号，不注销就一直是风险敞口。","随便把验证码告诉“客服”，等于把账户交出去。"]},"sources":[{"name":"中国人民银行有关负责人就《关于改进个人银行账户分类管理有关事项的通知》答记者问（中国政府网）","url":"https://www.gov.cn/zhengce/2018-01/20/content_5258798.htm","note":"页面含“银行账户”（34 处）、“分类”（16 处），解释 I、II、III 类个人账户的功能与限额。"},{"name":"《电话用户真实身份信息登记规定》（工业和信息化部令第 25 号）","url":"https://www.miit.gov.cn/ztzl/lszt/dhhkzlzxxd/flfg/art/2015/art_31d384b12c474bc8aaf4ccd972833e4b.html","note":"页面含“真实身份”（30 处）、“电话用户”（24 处），规定入网实名登记与查验要求。"}]},{"id":"gov-04","title":"第一次去政务大厅和第一次申请行政服务","merged_from":["第一次去政务大厅","第一次申请行政服务"],"tags":["政务","办事"],"cost":{"money":"多数事项不收费","time":"半天（能线上办则几分钟）","willpower":"低"},"evidence":"A","body":{"plain":"现在办事的原则是“线上为主、线下兜底”：能在政务服务网或 App 办的先线上办，必须到场的去政务服务中心。跨地区的事项，很多已经纳入“跨省通办”，不用回户籍地。","steps":["先在省级政务服务网或 App 搜事项名称，看办事指南：要什么材料、多久办结、收不收费。","能预约的先预约，按预约时段到大厅取号，到综合窗口交材料。","交完材料要受理回执或受理编号，之后可以凭编号查进度。","被退回时问清“缺什么、怎么补”，把补正要求在回执上写清楚。"],"pitfalls":["不看指南直接去大厅，材料不齐白跑一趟。","不拿受理回执，办到哪一步只能靠问。","花钱找“加急代办”，多数事项本身免费且可以自己办。"]},"sources":[{"name":"国务院办公厅关于加快推进政务服务“跨省通办”的指导意见（中国政府网）","url":"https://www.gov.cn/zhengce/content/2020-09/29/content_5548125.htm","note":"页面含“跨省通办”（76 处）、“异地”（132 处），规定政务服务线上线下融合与异地办理方式。"}]},{"id":"gov-05","title":"第一次打印个人征信报告","merged_from":["第一次打印个人征信"],"tags":["金融","征信"],"cost":{"money":"每年有免费次数，超出按官方标准收费","time":"线上几分钟，线下当场","willpower":"低"},"evidence":"A","body":{"plain":"个人信用报告由中国人民银行征信中心提供，记录了你的信贷和还款情况，是办贷款、信用卡时银行主要看的东西。查自己的报告属于“本人查询”，不影响信用。","steps":["线上：通过征信中心官网或部分银行 App 提交申请，做身份验证后下载报告。","线下：带身份证到人民银行分支机构或商业银行代理查询网点，现场打印详版报告。","拿到报告先核对基本信息、信贷记录、查询记录三部分，有没有不是自己办的业务。","发现错误信息，向征信中心或报数机构提出异议申请，要求更正。"],"pitfalls":["短时间内被多家机构频繁查询（多为贷款审批），会让银行觉得你在到处借钱。","相信“征信修复”“洗白”广告，官方不存在这类服务。","把完整报告随手发给中介或陌生人，报告含身份证号等敏感信息。"]},"sources":[{"name":"征信业管理条例（国务院令第 631 号，中国政府网）","url":"https://www.gov.cn/zhengce/2013-01/29/content_2602614.htm","note":"页面含“征信”（145 处）、“信用报告”“异议”（10 处），规定信息采集、查询与异议处理规则。"},{"name":"个人征信查询（中国人民银行征信中心）","url":"https://www.pbccrc.org.cn/zxfw/gr/cx/20241029/6bb3ada5b92641779ee33e06c30f1e4c.html","note":"页面含“信用报告”（20 处）、“查询”（38 处），是征信中心官方的个人报告查询入口说明。"}]},{"id":"gov-06","title":"第一次开无犯罪记录证明","merged_from":["第一次开无犯罪记录证明"],"tags":["证件","证明","公安"],"cost":{"money":"免费","time":"线上 1–3 个工作日，线下当场或次日","willpower":"低"},"evidence":"A","body":{"plain":"无犯罪记录证明由公安机关出具，用于特定的入职、入学、出国等场景。近几年多地已支持线上申请和跨省通办，同时也在推行以专项信用报告替代“无违法违规记录证明”。","steps":["先问受理单位要什么：纸质的还是电子的、有没有有效期要求、抬头怎么写。","通过当地公安 App、政务服务网或公安窗口提交申请，带身份证，说明用途。","按提示领取电子证明或到窗口领取纸质证明。","如果属于“有无违法违规记录”类用途，问清能否用专项信用报告替代，少跑一趟。"],"pitfalls":["用途写得太笼统被退回，重办要重新等。","证明有有效期（多为 1–3 个月，以出具单位标注为准），开太早作废。","伪造、变造证明属于违法行为。"]},"sources":[{"name":"公安部答网民关于“自助机上没法办理无犯罪记录证明”问题的留言（中国政府网）","url":"https://www.gov.cn/hudong/2023-03/29/content_5749222.htm","note":"页面含“无犯罪记录证明”（9 处）、“派出所”，是公安部对办理渠道的官方答复。"},{"name":"国家发展改革委 公安部 国家数据局关于全面推行以专项信用报告替代有无违法违规记录证明的通知（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/202505/content_7022881.htm","note":"页面含“信用报告”（56 处）、“证明”（24 处），说明哪些场景可以用专项信用报告替代证明。"}]},{"id":"gov-07","title":"第一次开收入证明、工作证明和在职证明","merged_from":["第一次开收入证明","第一次开在读证明","第一次开工作证明"],"tags":["证明","职场","学校"],"cost":{"money":"免费","time":"1–3 个工作日","willpower":"低"},"evidence":"A","body":{"plain":"这类证明都是“别人要你证明某件事”，所以先问清对方要什么格式、谁盖章。工作与收入证明由单位人事开具，在读与学历证明由学校或学信网出具。","steps":["问清用途和格式要求：需要盖章吗、要原件吗、有没有指定模板。","在职/收入证明找 HR 开，一般写岗位、入职时间、收入金额并加盖公章。","在读证明找学校教务或院系开；学历学籍可以在学信网申请在线验证报告，很多单位直接认。","需要更正式效力时（出国、诉讼等），可以到公证处办理相关公证。"],"pitfalls":["让单位把收入写高以便贷款，一旦被查出属于提供虚假材料，责任在你。","只给复印件不给盖章原件，对方不认，来回折腾。","在职证明和社保缴纳单位不一致，办签证时会被追问。"]},"sources":[{"name":"中国高等教育学生信息网（学信网）","url":"https://www.chsi.com.cn/","note":"页面含“学籍”（11 处）、“学历”（16 处），是教育部指定的学籍学历查询与在线验证报告出具平台。"},{"name":"工资支付暂行规定（中国政府网）","url":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm","note":"页面含“工资”“用人单位”，规定工资支付凭证的保存与提供，可用于核对收入证明材料。"}]},{"id":"gov-08","title":"第一次办社保、领社保卡和使用电子社保卡","merged_from":["第一次办理社保","第一次查询社保","第一次领取社保卡","第一次使用电子社保卡"],"tags":["社保","证件"],"cost":{"money":"在职由单位和个人共同缴，个人部分从工资扣","time":"参保当天办，制卡数个工作日","willpower":"低"},"evidence":"A","body":{"plain":"职工社保由单位办理参保缴费，个人不需要自己去开户；灵活就业人员可以自己缴。社保卡是看病结算、领待遇的凭证，现在手机上还能领电子社保卡，很多场景直接亮码就行。","steps":["入职后确认单位是否已为你办理参保增员，可以在当地人社 App、12333 或国家社会保险公共服务平台查到缴费记录。","社保卡到合作银行网点或线上渠道申领，拿到后激活社保功能和金融功能。","在人社 App、微信或支付宝领取电子社保卡，用于就医购药、查询和待遇领取。","换工作时注意社保关系转移接续，别让缴费中断影响待遇。"],"pitfalls":["社保卡只激活了社保功能，金融功能没激活，补贴和待遇打不进来。","把社保卡当普通银行卡随便借人，风险和银行卡一样。","以为“不交社保能多拿现金”，实际损失的是医保报销、养老和工伤保障。"]},"sources":[{"name":"中华人民共和国社会保险法（中国政府网）","url":"https://www.gov.cn/guoqing/2021-10/29/content_5647616.htm","note":"页面含“基本医疗保险”（30 处）、“失业保险”（26 处），规定各项社会保险的参保、缴费与待遇。"},{"name":"人力资源社会保障部办公厅关于全面开展电子社会保障卡应用工作的通知（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2019-09/26/content_5433483.htm","note":"页面含“电子社会保障卡”（11 处）、“医保”，规定电子社保卡的签发与应用场景。"},{"name":"【人社办事通】如何申领和使用社保卡？（福建省人力资源和社会保障厅）","url":"http://rst.fj.gov.cn/zw/jgszyzn/zsdw/cxjmshylbx/gzdt/202407/t20240731_6492303.htm","note":"页面含“社保卡”（31 处）、“申领”（15 处），讲实体卡与电子卡的申领和使用。"}]},{"id":"gov-09","title":"第一次办住房公积金","merged_from":["第一次办理公积金"],"tags":["公积金","住房"],"cost":{"money":"单位和个人按比例共同缴存","time":"开户由单位办，提取线上几分钟","willpower":"低"},"evidence":"A","body":{"plain":"住房公积金是单位和职工共同缴存的长期住房储金，可用于购房、租房、还贷等提取，也能申请公积金贷款。缴存和提取的规则由条例和地方细则共同规定，各地额度与条件差别不小。","steps":["入职后确认单位为你在当地公积金中心开户并缴存，用公积金 App 或小程序查询余额和缴存明细。","需要提取时，先看自己符合哪种情形（购房、租房、还贷、退休等），按当地要求准备材料线上申请。","想用公积金贷款，先查当地最高额度、缴存月数要求和首付比例。","换城市工作时办理异地转移接续，缴费年限通常可以累计。"],"pitfalls":["找人“代提公积金”多数是骗提，被发现要退回并影响信用。","以为缴存比例越高越好，实际到手工资会同步变少，需自己权衡。","离职后不办转移，账户长期封存，买房时才发现年限断档。"]},"sources":[{"name":"住房公积金管理条例（国务院令第 844 号修订，国务院公报）","url":"https://www.gov.cn/gongbao/2026/issue_12946/202608/content_7079363.html","note":"页面含“住房公积金”（241 处）、“提取”（32 处）、“缴存”（56 处），规定缴存、提取与贷款的基本规则。"}]},{"id":"gov-10","title":"第一次办居住证","merged_from":["第一次办理居住证"],"tags":["证件","居住证"],"cost":{"money":"首次申领一般免费","time":"先登记，通常需满足居住时限后申领","willpower":"低"},"evidence":"A","body":{"plain":"居住证是你在常住城市享受基本公共服务和便利的凭证。《居住证暂行条例》规定，公民离开常住户口所在地、到其他城市居住半年以上，符合有合法稳定就业、合法稳定住所、连续就读条件之一的，可以申领居住证，具体执行以当地规定为准。","steps":["先办居住登记：到社区、派出所或线上平台登记住址和入住时间，很多城市要求登记满一定期限才能申领。","准备材料：身份证、住所证明（租赁合同/房产证）、就业或就读证明，具体清单看当地要求。","线上或到社区事务受理中心/派出所提交申请，审核通过后领证。","注意居住证有效期，到期前办理签注，住址变化及时变更。"],"pitfalls":["一搬家忘了变更登记，办证时间要重新计算。","以为办了居住证就等于落户，两者不是一回事。","用虚假住址或劳动合同办理，被查实会注销。"]},"sources":[{"name":"居住证暂行条例（国务院令第 663 号，中国政府网）","url":"https://www.gov.cn/zhengce/content/2015-12/12/content_10398.htm","note":"页面含“居住证”（56 处）、“居住地”（15 处）、“半年”（1 处），规定申领条件、材料与基本公共服务。"}]},{"id":"gov-11","title":"第一次异地办理证件（跨省通办）","merged_from":["第一次异地办理证件"],"tags":["政务","异地办理"],"cost":{"money":"多数事项按标准收费或免费","time":"视事项 1 天到数周","willpower":"低"},"evidence":"A","body":{"plain":"身份证换补领、护照、社保转移、公积金转移等一大批事项已经纳入“跨省通办”，可以不在户籍地办理。每项的条件、材料和办理地点不一样，动手前先查清单。","steps":["在政务服务网或 App 搜事项名称，看“跨省通办”专栏里的办事指南。","确认异地办理的额外条件：很多事项需要居住证或居住登记，有的要求本人到场。","选择线上提交或就近的政务服务中心大厅办理，按要求邮寄或自取。","保留受理回执和快递单号，随时查进度。"],"pitfalls":["默认所有事项都能异地办，个别事项仍需回户籍地。","材料按户籍地要求准备，异地窗口可能另有规定。","把证件原件寄给不明中介代办，有被冒用的风险。"]},"sources":[{"name":"国务院办公厅关于加快推进政务服务“跨省通办”的指导意见（中国政府网）","url":"https://www.gov.cn/zhengce/content/2020-09/29/content_5548125.htm","note":"页面含“跨省通办”（76 处）、“异地”（132 处），列出可异地办理的事项范围与办理方式。"}]},{"id":"gov-12","title":"第一次处理交通违章和第一次交罚款","merged_from":["第一次处理交通违章","第一次交罚款"],"tags":["交通","违章","罚款"],"cost":{"money":"罚款按违法情形，逾期可能加处罚款","time":"线上 5 分钟","willpower":"低"},"evidence":"A","body":{"plain":"交通违法处理走的是《道路交通安全违法行为处理程序规定》：可以在交管 12123 App 或交警窗口处理，缴款走指定渠道。逾期不缴，可能被加处罚款，记分也会跟着走。","steps":["在交管 12123 App 里查违法记录，看清时间、地点、照片和记分。","确认是不是本人或本人名下的车；对处罚有异议的，按规定申请行政复议或提起诉讼。","线上处理并缴纳罚款，或到交警窗口/指定银行办理，保留缴款凭证。","注意记分周期：记分达到规定分值的，要按规定参加学习考试。"],"pitfalls":["找人“代扣分”属于违法行为，双方都要担责。","只交钱不处理记分，或只处理记分不交钱，问题都还在。","拖着不缴，产生加处罚款，还可能影响车辆年检和驾驶证业务。"]},"sources":[{"name":"道路交通安全违法行为处理程序规定（中国政府网）","url":"https://www.gov.cn/zhengce/2021-12/25/content_5712868.htm","note":"页面含“违法”（178 处）、“罚款”（23 处）、“记分”（4 处），规定违法处理程序、缴款与记分规则。"}]},{"id":"gov-13","title":"第一次做笔录（作为当事人、证人或报案人）","merged_from":["第一次做笔录"],"tags":["法律","公安","笔录"],"cost":{"money":"0 元","time":"1–3 小时","willpower":"中"},"evidence":"A","body":{"plain":"做笔录就是把你经历的事按时间顺序说清楚，由办案人员记录成书面材料，你核对无误后签字。它是证据材料，所以要按事实说，不要猜、不要替别人说。","steps":["先弄清自己的身份：是被侵害人、证人还是违法嫌疑人，不同身份的权利义务不一样。","按时间顺序讲，能记住的细节就说，记不清的直接说“记不清”，不确定的不要编。","笔录做完要求通读一遍，写错的地方可以要求更正，改过的地方按规定捺印确认。","拿到受案回执或案件编号，后面查询进度、申请复议都用得上；需要时可以请律师。"],"pitfalls":["没看就签字，事后发现记录和你说的事实不一致，很难改。","被引导着说“应该是这样”，把推测说成事实。","把无关的人牵扯进来，或者替别人承担责任。"]},"sources":[{"name":"公安机关办理行政案件程序规定（中国政府网）","url":"https://www.gov.cn/zhengce/2021-12/25/content_5712865.htm","note":"页面含“询问”（67 处）、“笔录”（49 处）、“传唤”（27 处），规定询问、笔录制作与核对签名的程序要求。"}]},{"id":"gov-14","title":"第一次找律师、咨询律师和收到律师函","merged_from":["第一次找律师","第一次咨询律师","第一次收到律师函"],"tags":["法律","律师"],"cost":{"money":"咨询费几百元/小时起，代理费按标的额","time":"咨询 1 小时，案件按阶段数月","willpower":"中"},"evidence":"A","body":{"plain":"找律师先看两件事：执业资格和收费方式。律师服务收费有规范要求，收费项目、标准和方式应当写进委托合同。收到律师函不等于被起诉，它通常是一种正式的催告或警告。","steps":["在司法行政机关或律师协会的公开渠道核实律师执业信息，别只看短视频和广告。","咨询前把材料按时间整理好：合同、转账记录、聊天记录、对方信息。","问清收费：按件、按小时还是按标的比例，费用包含哪些阶段，签书面委托合同。","收到律师函先看三件事：谁发的、要求你做什么、期限是多久，再决定是回复、协商还是应诉。"],"pitfalls":["找没有执业资格的“法律咨询公司”承揽诉讼业务。","只口头约定费用，中途加价扯不清。","收到律师函就慌着打钱，或干脆不理导致对方直接起诉。"]},"sources":[{"name":"司法部 国家发展改革委 国家市场监督管理总局印发《关于进一步规范律师服务收费的意见》的通知（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2022-03/25/content_5681313.htm","note":"页面含“律师”（251 处）、“收费”（135 处），规定律师服务收费项目、方式与明码标价要求。"},{"name":"最高人民法院 最高人民检察院 公安部 国家安全部 司法部关于印发《法律援助值班律师工作办法》的通知（中国政府网）","url":"https://www.gov.cn/zhengce/zhengceku/2020-09/12/content_5542936.htm","note":"页面含“值班律师”（204 处）、“法律援助”（78 处），说明没有律师时如何获得法律援助与值班律师帮助。"}]},{"id":"gov-15","title":"第一次签合同：看条款、识陷阱，知道“合同不能随便签”","merged_from":["第一次签法律合同","第一次签服务合同","第一次看合同条款","第一次发现合同陷阱","第一次看懂法律条款","第一次意识到“合同不能随便签”"],"tags":["法律","合同"],"cost":{"money":"0 元（律师审阅另计）","time":"30 分钟到数天","willpower":"中"},"evidence":"A","body":{"plain":"合同一旦签字，原则上就按上面写的算。所以签字前要看清楚四件事：谁和你签、你要付出什么、对方要交付什么、出问题怎么办。格式条款里排除你主要权利、加重你责任的部分，法律上有相应的效力规则。","steps":["确认相对方：单位全称、统一社会信用代码、有没有签约资格，别和“业务员个人”签。","把关键条款圈出来：金额与支付节点、交付标准与时间、验收方式、违约责任、争议解决方式、解除条件。","对格式条款里的免责条款、单方变更权、自动续费、最低消费等，要求对方明确说明，必要时书面修改。","签字前把整份合同（含附件）拍照或复印留存，空白处划掉，不给对方事后补填的空间。"],"pitfalls":["只听口头承诺就签字，“口头说的”在争议时很难证明。","合同留白、只签一份、不给附件，都是常见陷阱。","自动续费、违约金过高、单方解释权这些条款没看就签。"]},"sources":[{"name":"合同行政监督管理办法（市场监管总局令第 77 号，国务院公报）","url":"https://www.gov.cn/gongbao/2023/issue_10606/202307/content_6894764.html","note":"页面含“合同行政监督”（10 处）、“格式条款”（10 处）、“消费者”（28 处），规范合同订立中的告知义务与不公平格式条款的纠正。"},{"name":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释（全文，辽宁省阜新市中级人民法院）","url":"https://fx.lncourt.gov.cn/article/detail/2023/12/id/7676914.shtml","note":"用于核对合同成立、格式条款效力、履行与违约责任等一般规则；已 curl 核验页面含「合同编通则」4 处、「格式条款」7 处、「违约责任」11 处"}]},{"id":"gov-16","title":"第一次发生合同纠纷：劳动仲裁、财产纠纷怎么走","merged_from":["第一次发生合同纠纷","第一次申请劳动仲裁","第一次处理财产纠纷","第一次处理劳动纠纷"],"tags":["法律","纠纷","仲裁"],"cost":{"money":"劳动仲裁不收费，诉讼按标的收费","time":"仲裁一般 45 日内结案（可延长）","willpower":"高"},"evidence":"A","body":{"plain":"发生纠纷先分清性质：劳动争议一般要先申请劳动仲裁（前置程序），普通合同和财产纠纷直接向法院起诉或先协商、调解。不管走哪条路，先固定证据再谈别的。","steps":["把证据按时间整理：合同、付款凭证、聊天记录、邮件、录音、发票，列一份清单。","劳动争议向劳动合同履行地或用人单位所在地的劳动人事争议仲裁委员会申请仲裁，注意仲裁时效。","普通合同/财产纠纷可以先发书面催告或协商，谈不拢再向有管辖权的法院起诉。","仲裁或诉讼中按时出庭、按时举证，逾期可能承担不利后果。"],"pitfalls":["拖太久超过时效（劳动争议申请仲裁的时效期间为一年，从知道或应当知道权利被侵害之日起算，具体以法律为准）。","聊天记录删除、录音丢失，证据链断掉。","私下和解没写书面协议，对方反悔又得重来。"]},"sources":[{"name":"中华人民共和国劳动争议调解仲裁法（中国公共招聘网，人社部）","url":"https://chinajob.mohrss.gov.cn/c/2022-07-15/356212.shtml","note":"页面含“仲裁”（147 处）、“争议”（98 处），规定劳动争议的调解、仲裁程序与时效。"},{"name":"中华人民共和国民事诉讼法（最高人民法院公报）","url":"http://gongbao.court.gov.cn/Details/886331ece0f6611a370642e89f08c6.html","note":"页面含“起诉”（18 处）、“证据”（31 处）、“传票”（2 处），规定起诉条件、管辖、举证与审理程序。"}]},{"id":"gov-17","title":"第一次起诉、收到法院传票、当原告或被告、第一次出庭","merged_from":["第一次起诉","第一次收到法院传票","第一次出庭","第一次当原告","第一次当被告"],"tags":["法律","诉讼"],"cost":{"money":"诉讼费按标的额，败诉方通常承担","time":"立案数日，审结数月","willpower":"高"},"evidence":"A","body":{"plain":"打官司的流程是：写起诉状→向有管辖权的法院立案→送达→开庭→判决。收到传票不要躲，按时出庭是你的程序权利；不出庭可能被缺席判决。","steps":["原告：写起诉状（当事人信息、诉讼请求、事实与理由），带证据材料到法院立案窗口或线上立案。","被告：收到起诉状副本和传票后，在答辩期内提交答辩状，准备证据。","开庭前整理证据清单，准备好原件，按通知的时间到庭、带身份证。","庭审后按判决履行或在上诉期内决定是否上诉；材料全程留存。"],"pitfalls":["收到传票不理不睬，法院可以缺席判决，结果对你不利。","证据只在开庭时口头说，没有提交书面材料。","错过上诉期，判决生效后再想改就难了。"]},"sources":[{"name":"中华人民共和国民事诉讼法（最高人民法院公报）","url":"http://gongbao.court.gov.cn/Details/886331ece0f6611a370642e89f08c6.html","note":"页面含“起诉”（18 处）、“传票”（2 处）、“证据”（31 处），规定起诉、受理、送达、开庭与判决程序。"}]},{"id":"gov-18","title":"第一次处理交通事故","merged_from":["第一次处理交通事故"],"tags":["交通","事故","保险"],"cost":{"money":"视责任与保险","time":"当场 1 小时，定损理赔数天","willpower":"高"},"evidence":"A","body":{"plain":"事故处理分两条线：现场这条线是报警、保护现场、救伤员、报保险；后面这条线是责任认定、定损、赔偿。机动车必须投保交强险，赔偿先由保险公司在责任限额内承担。","steps":["有人受伤先救人并拨打 120、110/122；车辆能移动且仅轻微财损的，按规定拍照后移到不妨碍交通处协商或线上快处。","拍照取证：前后全景、车辆位置、车牌、碰撞部位、路面标线、周边参照物。","报警后拿事故认定书（简易程序当场出），同时通知自己的保险公司报案。","按责任比例协商赔偿，协商不成可申请交管部门调解或向法院起诉。"],"pitfalls":["擅自离开现场，可能被认定为逃逸，后果严重得多。","只和对方口头私了、不留书面协议和转账凭证，事后被反咬。","没报警也没报保险，后面责任认定和理赔都缺依据。"]},"sources":[{"name":"道路交通事故处理程序规定（浙江省公安厅转载）","url":"https://gat.zj.gov.cn/col/col1229098252/art/2026/art_36d972978208495e82b7496ccabeef52.html","note":"页面含“交通事故”（184 处）、“认定”（65 处）、“简易程序”（7 处），规定现场处置、责任认定与损害赔偿调解程序。"},{"name":"机动车交通事故责任强制保险条例（国务院公报）","url":"https://www.gov.cn/gongbao/content/2019/content_5468886.htm","note":"页面含“强制保险”（56 处）、“交通事故”（84 处）、“赔偿责任”，规定交强险的投保与赔付责任。"}]},{"id":"gov-19","title":"第一次处理租房纠纷","merged_from":["第一次处理租房纠纷"],"tags":["法律","租房","纠纷"],"cost":{"money":"按争议金额，诉讼按标的收费","time":"协商数天，诉讼数月","willpower":"高"},"evidence":"A","body":{"plain":"租房纠纷集中在三件事：押金退不退、东西坏了谁修、提前解约怎么算。判断依据是合同约定加法律规则，所以最有力的证据是合同、转账记录和交接时的照片。","steps":["先把合同、转账记录、聊天记录、交房照片整理出来，确认争议金额和诉求。","与房东或中介书面沟通（微信/邮件都算），提出明确方案和期限。","谈不成可以向街道/社区调解组织申请调解，或向住建部门、12345 反映中介违规问题。","金额较大且协商无果的，向有管辖权的法院起诉，走小额诉讼可以更快。"],"pitfalls":["退租时没有交房验收记录，押金扣多少全凭对方说。","把押金条、合同原件弄丢。","口头答应“押金下个月退”，拖过诉讼时效或对方失联。"]},"sources":[{"name":"最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释（全文，辽宁省阜新市中级人民法院）","url":"https://fx.lncourt.gov.cn/article/detail/2023/12/id/7676914.shtml","note":"用于核对合同成立、格式条款效力、履行与违约责任等一般规则；已 curl 核验页面含「合同编通则」4 处、「格式条款」7 处、「违约责任」11 处"},{"name":"中华人民共和国民事诉讼法（最高人民法院公报）","url":"http://gongbao.court.gov.cn/Details/886331ece0f6611a370642e89f08c6.html","note":"页面含“起诉”“证据”，用于核对起诉条件与举证要求。"}]},{"id":"gov-20","title":"第一次遇到网络侵权和第一次投诉平台","merged_from":["第一次遇到网络侵权","第一次投诉平台"],"tags":["法律","网络","投诉"],"cost":{"money":"0 元","time":"数天到数周","willpower":"中"},"evidence":"A","body":{"plain":"网上被造谣、被盗图、被泄露个人信息，第一步都是固定证据（截图、链接、时间），然后走平台投诉通道要求删除，平台不处理再向监管部门投诉或起诉。电子商务法规定平台对平台内经营者和交易纠纷承担相应责任。","steps":["先截图并保存链接、发布时间、账号信息，重要内容可以做时间戳或公证。","用平台的举报/投诉入口提交材料，要求删除或断开链接，记下工单号。","平台不处理或涉及消费纠纷的，通过全国 12315 平台向市场监管部门投诉举报。","涉及侮辱诽谤、隐私泄露、财产损失的，可以报警或向法院起诉，要求停止侵害并赔偿。"],"pitfalls":["只在评论区对骂，不保存证据，事后什么都拿不出。","把身份证、住址等个人信息发给“帮你维权”的陌生人。","过了很久才投诉，平台以超期为由不受理。"]},"sources":[{"name":"中华人民共和国电子商务法（商务部全球法规网收录）","url":"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=65186","note":"页面含“电子商务”（182 处）、“平台”（100 处），规定平台经营者对平台内经营行为的管理责任与知识产权保护义务。"},{"name":"市场监督管理投诉举报处理暂行办法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2020/content_5483878.htm","note":"页面含“投诉”（104 处）、“举报”（67 处），规定投诉举报渠道、受理条件与处理时限。"}]},{"id":"gov-21","title":"第一次知道什么叫证据：聊天记录和录音怎么留","merged_from":["第一次知道什么叫证据","第一次保存聊天记录作为证据","第一次录音取证","第一次意识到法律真的和自己有关"],"tags":["法律","证据"],"cost":{"money":"0 元（公证另计）","time":"10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"证据就是能证明事实的东西：合同、转账记录、聊天记录、邮件、录音、票据。法律把电子数据列为证据种类之一，关键是能证明“谁在什么时候说了什么”，并且没有被删改。","steps":["聊天记录不要删：保留原始载体（原手机、原账号），同时截图保存对方头像、昵称、时间。","转账走实名渠道，备注写清用途（借款、租金、货款），比现金更有力。","重要通话可以录音，但录制和使用要合法，不得侵入他人住宅、窃听他人隐私场所。","关键证据可以做公证或时间戳固定，防止对方否认；原件、原始设备一直留到事情结束。"],"pitfalls":["只保存截图、把原聊天记录删了，对方否认时证明力大打折扣。","用非法方式获取录音（如窃听、私装设备），可能不被采纳还可能担责。","证据只留一份在对方拿得到的设备或账号里，被删就没了。"]},"sources":[{"name":"最高人民法院关于民事诉讼证据的若干规定（最高人民法院网站）","url":"https://www.court.gov.cn/fabu/xiangqing/212721.html","note":"页面含“电子数据”（24 处）、“证据”（111 处）、“录音”（1 处），规定电子数据等证据的提交与审查规则。"},{"name":"中华人民共和国民事诉讼法（最高人民法院公报）","url":"http://gongbao.court.gov.cn/Details/886331ece0f6611a370642e89f08c6.html","note":"页面含“证据”（31 处），规定证据种类与举证责任。"}]},{"id":"gov-22","title":"第一次公证：什么情况需要，怎么办","merged_from":["第一次公证"],"tags":["法律","公证"],"cost":{"money":"按事项收费，几百元到数千元","time":"数个工作日","willpower":"低"},"evidence":"A","body":{"plain":"公证是公证机构按你的申请，对某件事的真实性、合法性予以证明，常见于委托、继承、赠与、合同、证据保全、出国材料等场景。公证书在国内外通常具有较强证明力，很多场合必须有。","steps":["先问受理单位要求办哪种公证（如委托书公证、亲属关系公证、译文相符公证）。","找当地的公证处（可通过司法行政机关网站或政务平台查询），预约并确认材料清单。","带身份证、户口簿和与事项相关的证明（合同、产权证明、亲属关系材料等）到公证处办理。","领取公证书后核对姓名、证件号、事项表述；用于出国的还可能要做认证。"],"pitfalls":["材料造假骗公证，属于违法，公证可能被撤销。","需要本人到场的事项让人代办，办不成。","以为公证就能保证对方履约，公证只证明事实，不等于能强制执行。"]},"sources":[{"name":"中华人民共和国公证法（国务院公报）","url":"https://www.gov.cn/gongbao/content/2005/content_77745.htm","note":"页面含“公证”（202 处）、“公证员”（34 处），规定公证机构、公证事项范围、程序与效力。"}]},{"id":"legal-a1","title":"第一次发现自己被冒名注册了公司","merged_from":[],"tags":["法律","身份"],"cost":{"money":"0","time":"数周到数月","willpower":"高"},"evidence":"B","body":{"plain":"身份证丢失后被拿去注册公司并不罕见。发现后要尽快走撤销登记程序，否则可能影响征信、考公、领补贴。","steps":["在公示系统查自己名下是否有未知企业，截图留证","向登记机关（市场监管部门）提交撤销登记申请，附身份证挂失记录、笔迹鉴定等材料","涉及税务异常的先处理税务，避免被列入异常名录","同步向公安机关报案，保留受案回执"],"pitfalls":["发现后拖延，期间产生的债务或违法记录会先找上你","只报警不走撤销登记，工商登记状态不会自动消失"]},"sources":[{"name":"国家市场监督管理总局（经营主体登记与撤销登记）","url":"https://www.samr.gov.cn/","note":"对冒名登记可向登记机关申请撤销，登记机关应依法调查处理"}],"addition":true,"why":"身份证丢失后被拿去注册公司并不罕见，要尽快走撤销登记程序"},{"id":"legal-a2","title":"第一次申请法律援助","merged_from":[],"tags":["法律","维权"],"cost":{"money":"0","time":"数天到数周","willpower":"中"},"evidence":"A","body":{"plain":"经济困难又需要打官司的人，可以申请免费的法律援助：由法律援助机构指派律师，费用由政府承担。","steps":["确认事项是否在援助范围内（请求支付劳动报酬、工伤、赡养、抚养等常见事项）","准备经济困难证明（低保证明、收入证明或承诺书）与案件材料","到案件办理地或住所地的法律援助机构（司法局/公共法律服务中心）申请","也可先打 12348 咨询，由值班律师给出初步意见"],"pitfalls":["以为只有刑事案件才有法律援助，错过申请","材料不齐反复跑，先打电话问清清单再去"]},"sources":[{"name":"《法律援助值班律师工作办法》（司法部等部门印发）","url":"https://www.gov.cn/zhengce/zhengceku/2020-09/12/content_5542936.htm","note":"值班律师与法律援助的提供方式"},{"name":"中国法律服务网（12348）","url":"https://www.12348.gov.cn/","note":"公共法律服务平台提供咨询与援助申请指引"}],"addition":true,"why":"经济困难又需要打官司的人可以申请免费法律援助，多数人不知道这个渠道"},{"id":"legal-a3","title":"第一次申请行政复议","merged_from":[],"tags":["法律","维权"],"cost":{"money":"0","time":"数十天","willpower":"中"},"evidence":"B","body":{"plain":"对政府部门的具体处理不服（比如处罚、不予受理），行政复议往往比诉讼更快更省事，而且有明确的申请期限。","steps":["先确认作出决定的机关和复议机关（通常向上一级机关或本级政府申请）","在法定期限内提交申请书，写清请求、事实与理由","附身份证明、原决定书复印件与证据材料","对复议结果仍不服，可在期限内向人民法院起诉"],"pitfalls":["超过申请期限，复议机关不再受理","把复议和信访混为一谈，信访不产生复议的法律效果"]},"sources":[{"name":"中国政府网 政策文件库（行政复议等法律服务入口）","url":"https://www.gov.cn/zhengce/","note":"行政复议的申请渠道与文书要求，可通过政府网与公共法律服务平台查询"},{"name":"中国法律服务网（12348）","url":"https://www.12348.gov.cn/","note":"公共法律服务平台提供行政复议咨询"}],"addition":true,"why":"对政府部门的处理不服，复议往往比诉讼更快，且有明确期限"},{"id":"legal-a4","title":"第一次用电子证照（身份证、驾照、社保卡）","merged_from":[],"tags":["证件","数码"],"cost":{"money":"0","time":"5 分钟","willpower":"低"},"evidence":"A","body":{"plain":"忘带实体证件的应急办法：电子社保卡、电子驾驶证、居民身份证电子凭证在多数场景已被承认，但并非所有场合都认。","steps":["在官方渠道申领：电子社保卡（人社部/国家医保服务平台）、电子驾驶证（交管 12123）、身份证电子凭证（本地政务 App）","出门前确认目的地是否接受电子证照（酒店、政务窗口、交警执法认可度不同）","把电子证照页面离线保存或加桌面快捷方式","重要场合仍带实体证件，电子证照多为补充"],"pitfalls":["银行、机场等场景通常仍要求实体证件","把截图当电子证照用，多数核验要求现场动态展示"]},"sources":[{"name":"人力资源社会保障部《关于全面开展电子社会保障卡应用工作的通知》","url":"https://www.gov.cn/zhengce/zhengceku/2019-09/26/content_5433483.htm","note":"电子社会保障卡的申领与应用范围"},{"name":"中国政府网 政策文件库（行政复议等法律服务入口）","url":"https://www.gov.cn/zhengce/","note":"各地电子证照互认范围以当地政府公告为准"}],"addition":true,"why":"很多场景可以直接用电子证照，是忘带实体证的应急办法"}],"additions":[],"excluded":[{"title":"第一次报警","moved_to":"18 安全与紧急情况篇（按分工去重）"},{"title":"第一次去派出所","moved_to":"18 安全与紧急情况篇（按分工去重）"},{"title":"第一次消费维权","moved_to":"06 消费与网购篇（按分工去重）"},{"title":"第一次投诉商家","moved_to":"06 消费与网购篇（按分工去重）"},{"title":"第一次走保险","moved_to":"11 驾驶与汽车篇（按分工去重）"},{"title":"第一次签租房合同","moved_to":"04 独立生活篇（按分工去重）"},{"title":"第一次签劳动合同","moved_to":"08 求职与工作篇（按分工去重，本篇不重复写）"}],"_file":"10-证件政务法律篇.json","label":"证件、政务、法律篇"},{"section":"11 驾驶与汽车篇","source_count":50,"merged_count":24,"note":"由原大纲 50 条合并为 21 条；正文与出处均由本机 curl 实抓核验（中国政府网国务院公报、公安部令、市场监管总局令、交通运输部、财政部、广东省应急管理厅、光明网等）","entries":[{"id":"drive-01","title":"第一次报名驾校：选校、签合同、学时与费用","merged_from":["第一次报名驾校","第一次学车"],"tags":["交通","驾照"],"cost":{"money":"各地差异大，以当地驾校报价为准","time":"报名半天，拿证通常 2–6 个月","willpower":"中"},"evidence":"A","body":{"plain":"驾校只是培训方，考试由公安交管部门组织，科目一（法规知识）、科目二（场地驾驶）、科目三（道路驾驶和安全文明常识）都要自己去考。报名前把「总共花多少钱、多久能考完」问清楚再交钱。","steps":["先看训练场离住处远不远——练车方便比便宜几百块更重要","问清报价包含什么：培训费、考试费、补考费、模拟费、体检拍照费","签书面培训合同，写清车型（C1/C2）、学时、退费规则","交费后索要发票或收据，完成体检、拍照、建档","下载「交管12123」App，之后约考、查成绩、领电子驾驶证都在上面"],"pitfalls":["低价班常在补考费、模拟费上找回来，口头承诺不写进合同等于没有","「包过」「免考拿证」全是骗局，驾驶证只能考","退费条款不写清楚，中途不学了很难退"]},"sources":[{"name":"《机动车驾驶证申领和使用规定》（公安部令第162号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679696.htm","note":"第三十条：考试内容分为科目一（道路交通安全法律法规和相关知识）、科目二（场地驾驶技能）、科目三（道路驾驶技能和安全文明驾驶常识）"}]},{"id":"drive-02","title":"第一次练科目二：倒车入库、侧方停车、坡道起步","merged_from":["第一次练科目二","第一次倒车入库","第一次侧方停车","第一次坡道起步","第一次科目二考试"],"tags":["交通","驾照"],"cost":{"money":"补考费按当地标准","time":"练车 1–4 周，考试半天","willpower":"中"},"evidence":"A","body":{"plain":"科目二是封闭场地内的固定动作：倒车入库、坡道定点停车和起步、侧方停车、曲线行驶、直角转弯（小型自动挡车不考坡道）。它靠肌肉记忆，练到不用想就会。","steps":["每次上车先按同一套姿势调好座椅和后视镜，点位才准","把教练教的「看哪个点打多少方向」记成固定顺序，重复练","车速压到最慢，让每个动作都有时间反应","考前去考场模拟一遍，熟悉场地和考试车","考试带身份证，上车调好座椅后视镜、系安全带，听到语音再起步"],"pitfalls":["坡道起步离合松太快会熄火后溜，直接扣分甚至挂科","倒库压线是最高频失误，宁慢勿快","当场一般还有一次补考机会，第一次没过先深呼吸再上，别慌着下车"]},"sources":[{"name":"《机动车驾驶证申领和使用规定》（公安部令第162号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679696.htm","note":"第三十条：小型汽车考试倒车入库、坡道定点停车和起步、侧方停车、曲线行驶、直角转弯；小型自动挡汽车不考坡道"}]},{"id":"drive-03","title":"第一次考科目三、科目四，拿到驾驶证","merged_from":["第一次科目三考试","第一次科目四考试","第一次拿驾驶证"],"tags":["交通","驾照"],"cost":{"money":"补考费按当地标准","time":"每科约半天","willpower":"中"},"evidence":"A","body":{"plain":"科目三是实际道路驾驶（灯光、起步、变道、靠边停车），科目四是安全文明驾驶常识机考，过了就能领证。拿到证不等于会开车，实习期有专门限制。","steps":["上车前绕车一周，上车系安全带、调座椅、听后座语音指令","转弯、变道、超车先打灯再回头观察，路口提前减速","靠边停车后拉手刹、挂空挡/P挡、解安全带再开门","科目四考安全文明驾驶常识，当场出成绩","拿证后在「交管12123」申领电子驾驶证，车后贴实习标志"],"pitfalls":["科目三最容易死在忘记打灯、不观察这类细节上","初次领证后 12 个月是实习期，上高速必须由持相应或更高准驾车型驾驶证三年以上的驾驶人陪同","实习期内记分、注销等后果以《机动车驾驶证申领和使用规定》为准，别抱侥幸"]},"sources":[{"name":"《机动车驾驶证申领和使用规定》（公安部令第162号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679696.htm","note":"实习期：初次取得汽车类或摩托车类准驾车型后 12 个月为实习期，应粘贴或悬挂实习标志；实习期上高速须由持相应或包含其准驾车型驾驶证三年以上的驾驶人陪同"}]},{"id":"drive-04","title":"第一次一个人开车上路","merged_from":["第一次一个人开车","第一次真正成为“老司机”"],"tags":["交通","驾驶"],"cost":{"money":"油费/电费","time":"因人而异","willpower":"中"},"evidence":"A","body":{"plain":"独自上路最大的变化是没人帮你踩副刹。先在熟悉的路段短途开，把「起步—变道—停车」整套动作在脑子里过一遍，比硬着头皮上高架强。","steps":["车后贴实习标志（实习期 12 个月内必须）","出发前调好座椅后视镜、看清油量/电量、把导航设好再起步","先走熟悉的路，避开早晚高峰和复杂立交","变道提前打灯三秒以上，看后视镜再回头看盲区","走错路就绕回去，别在路口急刹或倒车"],"pitfalls":["并线和路口是新手最慌的地方，宁可多绕一圈","开车时操作手机会严重分心，导航支架和路线都在出发前弄好","被按喇叭不用慌，按自己的节奏稳住速度"]},"sources":[{"name":"《机动车驾驶证申领和使用规定》（公安部令第162号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679696.htm","note":"实习期 12 个月，实习期内驾驶机动车应当在车身后部粘贴或悬挂统一式样的实习标志"}]},{"id":"drive-05","title":"第一次停车与倒车：地下车库、路边车位","merged_from":["第一次停车","第一次倒车"],"tags":["交通","驾驶"],"cost":{"money":"停车费，按当地标准","time":"因人而异","willpower":"中"},"evidence":"B","body":{"plain":"停车难的往往不是技术，是找位和判断距离。地下车库优先选宽敞、有柱子可参照的车位；路边停车先看清有没有禁停标线和收费牌。","steps":["进车库先看清限高、单行箭头，跟着车流走，别逆行","倒库前把车开到库位旁边，给自己留出打方向的余地","慢速倒车，靠后视镜加倒车影像，拿不准就下车看一眼","停好拉手刹、挂 P 挡、熄火，记住车位号和区域","路边临时停车要遵守禁停标志标线，扫码缴费留好凭证"],"pitfalls":["地下车库的柱子和低矮消防管是剐蹭高发点","商场「消费免停车费」要看清规则和时限","占消防通道、残疾人车位会被处罚，甚至被拖车"]},"sources":[{"name":"《中华人民共和国道路交通安全法实施条例》","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_3745.htm","note":"第六十三条：机动车在道路上临时停车应当遵守的规定（禁停标志标线路段、隔离设施路段等）"}]},{"id":"drive-06","title":"第一次上高速与进服务区","merged_from":["第一次上高速","第一次进入高速服务区"],"tags":["交通","高速"],"cost":{"money":"通行费、油费/电费","time":"因人而异","willpower":"中"},"evidence":"A","body":{"plain":"高速的特点是车速快、只能往前开。实习期内不能一个人上，副驾要有符合条件的陪驾；错过出口就开到下一个出口，倒车和逆行是最危险也最严重的违法。","steps":["出发前确认实习期是否需要符合条件的驾驶人陪同","检查胎压、油量/电量、玻璃水，导航设好","收费站走 ETC 或人工车道，减速通过","匝道汇入主路要先把速度提起来，看后视镜打灯并入","服务区提前一两公里变到最右侧车道，减速进场休息、加油/充电，出区后从加速车道再汇入"],"pitfalls":["错过出口只能往前开到下一个出口，绝不能倒车、掉头","节假日服务区加油、充电排队久，油箱/电量过半就补","长时间驾驶容易疲劳，每两小时左右进一次服务区"]},"sources":[{"name":"《机动车驾驶证申领和使用规定》（公安部令第162号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679696.htm","note":"驾驶人在实习期内驾驶机动车上高速公路行驶，应当由持相应或者包含其准驾车型驾驶证三年以上的驾驶人陪同"},{"name":"《全国高速公路服务区服务质量等级评定办法》（交公路规〔2025〕4号）","url":"https://xxgk.mot.gov.cn/2020/xzgfxwj/202505/W020250512387195879235.docx","note":"第二条：适用于全国所有已投入运营满一年的高速公路服务区（含停车区）"}]},{"id":"drive-07","title":"第一次加油、第一次给电车充电","merged_from":["第一次加油","第一次给汽车充电"],"tags":["交通","用车"],"cost":{"money":"油费/电费","time":"加油 5–10 分钟；快充 30 分钟左右","willpower":"低"},"evidence":"B","body":{"plain":"油车加油几分钟搞定；电车分快充慢充，快充半小时左右能到八成，慢充适合过夜。两件事的共同点是：先知道自己的车「喝什么」，再看价格和规则。","steps":["看油箱盖内侧或说明书确认汽油标号；电车先认清自己的充电接口标准","进站停车熄火，告诉工作人员加多少钱或多少升，或自己操作加油机","加油时不要打手机、不要吸烟、不要发动车辆","电车在充电 App 里找桩、看清快充/慢充、单价和是否收停车费，扫码启动","付款后拿好凭证，确认油枪或充电枪归位再开走"],"pitfalls":["加错标号（该加 95 加了 92）对发动机不友好，别赌","很多充电站收超时占位费，充完要及时挪车","节假日高速服务区充电排队，规划好下一个补能点"]},"sources":[{"name":"广东省应急管理厅《加油时，这些事项要注意！》","url":"https://yjgl.gd.gov.cn/kp/yjjy/content/post_4673613.html","note":"加油站安全事项：熄火加油、禁止吸烟、不能接打电话"},{"name":"《关于进一步提升电动汽车充电基础设施服务保障能力的实施意见》（发改能源规〔2022〕53号）","url":"https://www.gov.cn/gongbao/content/2022/content_5688793.htm","note":"国务院公报刊载，明确充电基础设施服务保障要求，含高速公路服务区充电覆盖"}]},{"id":"drive-08","title":"第一次夜间、雨天、雾天开车","merged_from":["第一次夜间开车","第一次雨天开车","第一次雾天开车"],"tags":["交通","驾驶"],"cost":{"money":"无额外费用","time":"因人而异","willpower":"中"},"evidence":"A","body":{"plain":"三种天气的核心是同一条：降速、开对灯、拉大车距。看不清就别硬开，找服务区或安全地点停下来等。","steps":["夜间会车提前改近光灯，跟车不要开远光","雨天减速、开近光灯和雾灯，遇积水松油门、不猛打方向","雾天开雾灯和近光灯（别开远光），按能见度控制车速和车距","能见度极低时从最近出口驶离高速或进服务区停靠，开双闪","出发前擦净车窗、检查雨刮、灯光和轮胎"],"pitfalls":["雾天开远光会被雾气反射，反而更看不清","雨天高速过积水容易「水滑」，急刹会失控","夜间高速视野差，跟车距离要比白天明显更远"]},"sources":[{"name":"《中华人民共和国道路交通安全法实施条例》","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_3745.htm","note":"第八十一条：在高速公路上遇雾、雨、雪、沙尘、冰雹等低能见度气象条件时的行驶规定；夜间会车应在 150 米以外改用近光灯"}]},{"id":"drive-09","title":"第一次长途自驾、跨省开车","merged_from":["第一次开长途","第一次跨省自驾","第一次一个人开几百公里"],"tags":["交通","自驾"],"cost":{"money":"油费/电费+过路费+住宿","time":"按里程，通常一整天","willpower":"中"},"evidence":"B","body":{"plain":"长途拼的不是技术，是体力和规划。把路线拆成几段，每段不超过两三小时，中间有服务区或城市落脚。","steps":["出发前查路线、天气和沿途服务区、充电桩分布","检查胎压、备胎、机油、玻璃水、雨刮和灯光","每两小时或两百公里左右进服务区休息，能换人开更好","跨省注意不同省份的限速、限行和收费站规则","带齐身份证、驾驶证、行驶证和保险信息，少量现金备用"],"pitfalls":["疲劳驾驶是长途最大的风险，困了就进服务区睡一会儿","山区和隧道限速变化快，听导航播报别靠感觉","重大节假日免费通行安排以交通运输部门当年公告为准，别卡着免费时间点挤出入口"]},"sources":[{"name":"《中华人民共和国道路交通安全法实施条例》","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_3745.htm","note":"高速公路车道行驶与限速、低能见度行驶等规定"},{"name":"《全国高速公路服务区服务质量等级评定办法》（交公路规〔2025〕4号）","url":"https://xxgk.mot.gov.cn/2020/xzgfxwj/202505/W020250512387195879235.docx","note":"服务区（含停车区）服务与设施的基本要求"}]},{"id":"drive-10","title":"第一次租车与验车","merged_from":["第一次租车","第一次验租赁车辆"],"tags":["交通","租车"],"cost":{"money":"租金+押金+可选保险","time":"取还车各 20–30 分钟","willpower":"低"},"evidence":"A","body":{"plain":"租车真正的钱花在押金、保险和「车损认定」上。取车时拍的那段验车视频，就是你还车时唯一的证据。","steps":["线上比价，看清租金是否含基础保险、有没有里程限制","取车带身份证、驾驶证，确认押金支付和退还方式","绕车拍视频：四角、保险杠、轮毂、玻璃、内饰、仪表盘油量/电量，已经有划痕的地方重点拍","问清油量/电量归还标准、还车时间和地点、超时怎么计费","还车时和工作人员一起验车，当场索取结算单"],"pitfalls":["不拍验车视频，还车时的小划痕可能算在你头上","「全险」「不计免赔」要不要买，先算清自付额再决定","押金退还时限要写进合同，别只听口头承诺"]},"sources":[{"name":"《小微型客车租赁经营服务管理办法》（交通运输部令2020年第22号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-12/31/content_5575818.htm","note":"经营者和承租人权利义务：应以显著方式明示服务项目、租赁流程、收费标准、押金收取与退还等事项"}]},{"id":"drive-11","title":"第一次剐蹭、第一次交通事故：现场怎么处理","merged_from":["第一次发生剐蹭","第一次发生交通事故","第一次报警处理事故"],"tags":["交通","事故"],"cost":{"money":"修车与赔偿，视责任而定","time":"现场处理 30 分钟–数小时","willpower":"高"},"evidence":"A","body":{"plain":"先保证人的安全，再谈车。有人受伤先打 120 和 110；只是车损、责任清楚，可以拍照后挪车，走快速处理，别堵在路上。","steps":["立即停车、开双闪、放三角警示牌（高速放在来车方向 150 米以外），人员撤到护栏外","有人员伤亡先打 120 急救，再打 110/122 报警","拍照取证：前后左右、碰撞部位、路面标线、双方车牌和位置","责任无争议的财产损失事故，可以自行协商处理并填写快速处理单","交换姓名、电话、车牌、保险公司和保单号，随后各自报保险"],"pitfalls":["千万别逃逸，哪怕只是剐蹭，性质完全不同","高速上不要站在车道里争论，先撤人再谈事","私了要写清「一次性了结」并双方签字，否则后续可能被再追讨"]},"sources":[{"name":"《中华人民共和国道路交通安全法》","url":"https://www.gov.cn/gongbao/content/2004/content_62789.htm","note":"第七十条：发生交通事故应立即停车、保护现场；造成人身伤亡的应立即抢救受伤人员并迅速报告；第六十八条：高速故障警示标志设在来车方向一百五十米以外，人员转移到右侧路肩或应急车道并迅速报警"},{"name":"《道路交通事故处理程序规定》（公安部令第146号）","url":"https://www.gov.cn/zhengce/2021-12/25/content_5712900.htm","note":"第四条：财产损失事故可以由当事人自行协商处理；第四章「自行协商」、第五章「简易程序」"}]},{"id":"drive-12","title":"第一次走保险：报案、定损、理赔","merged_from":["第一次联系保险公司","第一次走保险"],"tags":["交通","保险"],"cost":{"money":"视险种与责任","time":"数天到数周","willpower":"中"},"evidence":"A","body":{"plain":"保险不是「出了事就全赔」，赔不赔要看责任、险种和免责条款。流程就三步：报案、定损、修车理赔。","steps":["事故后尽快打保险公司客服报案，具体时限以保单约定为准","按客服指引现场拍照上传，或等查勘员到场","先定损再修车，确认定损单金额和项目后再动工","涉及人伤的，交强险在责任限额内赔付，符合条件时保险公司垫付抢救费用","修完凭发票、定损单、事故证明等材料申请赔付"],"pitfalls":["报案拖太久，保险公司可能拒赔或少赔","不定损先修车，超出定损的差价常要自己承担","出险次数多会影响次年保费，小额剐蹭可以先算账再决定报不报"]},"sources":[{"name":"《机动车交通事故责任强制保险条例》","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_1783.htm","note":"交强险在全国范围内实行统一的责任限额，分为死亡伤残赔偿限额、医疗费用赔偿限额、财产损失赔偿限额等；符合情形时保险公司在责任限额内垫付抢救费用"},{"name":"《中华人民共和国保险法》第二十一条","url":"http://www.npc.gov.cn/zgrdw/npc/xinwen/lfgz/zxfl/2009-02/28/content_1476572.htm","note":"投保人、被保险人或者受益人知道保险事故发生后，应当及时通知保险人"}]},{"id":"drive-13","title":"第一次处理违章与扣分","merged_from":["第一次处理违章","第一次被扣分"],"tags":["交通","违章"],"cost":{"money":"罚款，按违法情形","time":"线上 10 分钟","willpower":"低"},"evidence":"A","body":{"plain":"违章记录一般几天内上传，可以在交管 12123 上查并直接缴罚。记分记在驾驶证上，一个记分周期是 12 分。","steps":["在交管 12123 或当地交警公众号绑定车辆和驾驶证，查看未处理违法","核对违法照片、时间地点无误后再处理","线上缴罚款，或按提示到窗口、银行办理","对处罚有异议的，可以依法申请行政复议或向交管部门提出","符合条件的可以在交管 12123 申请「学法减分」"],"pitfalls":["有异议先别急着缴款，缴了再申诉很麻烦","买分卖分是违法行为，别碰","记分周期从驾驶证初次领证日期起算，不是自然年"]},"sources":[{"name":"《道路交通安全违法行为记分管理办法》（公安部令第163号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679697.htm","note":"参加交通安全教育并达到规定要求的，可以申请在现有累积记分分值中扣减记分，一个记分周期内累计最高扣减 6 分"}]},{"id":"drive-14","title":"第一次汽车保养与日常自检","merged_from":["第一次汽车保养","第一次换机油","第一次自己检查汽车"],"tags":["用车","保养"],"cost":{"money":"常规保养几百元起，以门店报价为准","time":"1–2 小时","willpower":"低"},"evidence":"A","body":{"plain":"保养按随车保养手册来，不按 4S 店口头说的来。机油、机滤、空滤是常规项，其他项目先问一句「不做会怎样」。","steps":["翻随车保养手册，看厂家规定的保养周期和项目","每周自查：胎压、机油尺、冷却液、玻璃水、灯光","进店先要项目清单和报价，确认后再施工","换机油确认标号和用量，剩下的机油可以带走","保留保养记录和发票，卖车时是加分项，有纠纷时是证据"],"pitfalls":["「发动机清洗」「油路清洗」这类项目新车一般不需要","维修店应当把原厂配件、同质配件、修复配件分别标识、明码标价，你有权选择","把厂家规定的保养周期悄悄缩短，是最常见的加项套路"]},"sources":[{"name":"《机动车维修管理规定》（交通运输部）","url":"https://www.gov.cn/zhengce/2021-08/11/content_5711524.htm","note":"机动车维修经营者应当将原厂配件、同质配件和修复配件分别标识、明码标价，供用户选择；二级维护、总成修理、整车修理应当实行维修前诊断"},{"name":"《家用汽车产品修理更换退货责任规定》（市场监管总局令第43号）","url":"https://www.gov.cn/zhengce/zhengceku/2021-07/27/content_5627788.htm","note":"家用汽车产品的三包条款、包修期、三包有效期等应当明示"}]},{"id":"drive-15","title":"第一次抛锚、叫道路救援","merged_from":["第一次汽车抛锚","第一次遇到汽车故障","第一次叫道路救援"],"tags":["用车","救援"],"cost":{"money":"拖车费按公里计，部分车险含免费拖车","time":"等救援 30 分钟–数小时","willpower":"中"},"evidence":"A","body":{"plain":"车坏在路上，第一件事不是修车，是让后车看见你：开双闪、放三角牌、人撤到安全位置，然后再打电话求援。","steps":["尽量把车靠到应急车道或路边，拉手刹、开双闪，夜间开示廓灯","在车后放三角警示牌，高速放在来车方向 150 米以外","车上人员迅速转移到右侧路肩或应急车道内以外，不要在车里等","打 110/122，或联系保险公司、4S 店救援，说清路段、行驶方向、公里桩号","听从交警和路政安排，不要私自找社会车辆上高速拖车"],"pitfalls":["在高速车道上放牌最危险，先看清来车再动作","问清起步价和每公里单价，避免「天价拖车」","不少车险含免费拖车和搭电，先打保险公司电话再花钱"]},"sources":[{"name":"《中华人民共和国道路交通安全法》","url":"https://www.gov.cn/gongbao/content/2004/content_62789.htm","note":"第六十八条：机动车在高速公路上发生故障时，警告标志应当设置在故障车来车方向一百五十米以外，车上人员应当迅速转移到右侧路肩上或者应急车道内，并且迅速报警"}]},{"id":"drive-16","title":"第一次爆胎、补胎与换备胎","merged_from":["第一次补胎","第一次换轮胎"],"tags":["用车","应急"],"cost":{"money":"补胎几十元，换胎几百元起","time":"换备胎 20–40 分钟","willpower":"中"},"evidence":"B","body":{"plain":"爆胎时最忌讳急刹和猛打方向。握稳方向盘、松油门、让车自然减速靠边，再决定是换胎还是叫救援。","steps":["爆胎后握紧方向盘，缓抬油门，让车慢慢减速，找安全位置靠边停稳","开双闪、放三角警示牌，人员撤到护栏外等安全地带","确认车上有备胎和工具（千斤顶、扳手），顶起前先把轮胎螺丝拧松半圈","换好后按对角顺序拧紧螺丝，尽快去店里复查胎压和扭矩","没有备胎或不会操作就直接叫救援，别在车流里硬扛"],"pitfalls":["在高速应急车道自己换胎风险很高，能等救援就等救援","补过的胎尽量不要长期跑高速，更不要放在前轮","备胎多为非全尺寸，限速一般低于正常胎，以胎侧标注为准"]},"sources":[{"name":"《中华人民共和国道路交通安全法》","url":"https://www.gov.cn/gongbao/content/2004/content_62789.htm","note":"第六十八条：高速公路上车辆故障时的警示标志位置（来车方向一百五十米以外）与人员转移要求"}]},{"id":"drive-17","title":"第一次买车：试驾、谈价、签合同","merged_from":["第一次买车","第一次试驾","第一次谈车价","第一次签购车合同"],"tags":["用车","购车"],"cost":{"money":"车价+购置税+保险+上牌","time":"看车到提车数天到数周","willpower":"中"},"evidence":"A","body":{"plain":"买车先定需求和预算，再看车。真正要谈的是「落地价」——裸车价加购置税、保险、上牌费，别只砍裸车价。","steps":["试驾时坐进后排、开空调、走一段烂路，感受空间和噪音","谈价直接谈落地价，要求把车价和各项收费列成清单","签合同写清车型配置、颜色、车架号、交车日期、赠品明细、违约责任","分清「定金」和「订金」的区别，交钱前问清能不能退","提车时核对车架号、生产日期、里程数，验完再签字"],"pitfalls":["经销商应当在经营场所以适当形式明示汽车、配件价格和服务收费标准，不得在标价之外加价销售或收取额外费用","口头承诺的赠品、保养不写进合同等于没有","「金融服务费」「出库费」等名目要问清依据，不合理可以拒付并拨打 12315"]},"sources":[{"name":"《汽车销售管理办法》（商务部令2017年第1号）","url":"https://www.gov.cn/zhengce/2017-04/14/content_5712354.htm","note":"第十条：经销商应当在经营场所以适当形式明示销售汽车、配件及其他相关产品的价格和各项服务收费标准，不得在标价之外加价销售或收取额外费用"},{"name":"《中华人民共和国车辆购置税法》","url":"https://gtm-cn-uqm3dbhc20k.guangdong.chinatax.gov.cn/gdsw/zjfg/2019-01/02/content_dacae35d385847529582d4f273cc36e9.shtml","note":"第四条：车辆购置税的税率为百分之十"}]},{"id":"drive-18","title":"第一次买车险：交强险与商业险","merged_from":["第一次买车保险"],"tags":["用车","保险"],"cost":{"money":"交强险+商业险，按车型和保额","time":"线上 20 分钟","willpower":"低"},"evidence":"A","body":{"plain":"交强险是国家强制的，不买不能上路；商业险是自愿的，三者险和车损险是大多数人会买的两项。","steps":["先买交强险，它在全国范围内实行统一的责任限额（死亡伤残、医疗费用、财产损失等分项）","按需加商业险：三者险保别人，车损险保自己的车，座位险保车上的人","看清免赔额、免赔率和免责条款（酒驾、无证驾驶、肇事逃逸等情形一般不赔）","比价时比「同险种同保额」的总价，不要只看折扣力度","保单电子化后存好保单号和客服电话，出险时第一时间报案"],"pitfalls":["只买交强险，撞到人或豪车时超出限额的部分要自己掏","「全险」并不等于什么都赔，免责条款一定要读","脱保期间上路会被处罚，续保别断档"]},"sources":[{"name":"《机动车交通事故责任强制保险条例》","url":"https://www.gov.cn/zhengce/content/2008-03/28/content_1783.htm","note":"机动车交通事故责任强制保险在全国范围内实行统一的责任限额，分为死亡伤残赔偿限额、医疗费用赔偿限额、财产损失赔偿限额等"}]},{"id":"drive-19","title":"第一次上牌：临牌、购置税、选号","merged_from":["第一次上牌"],"tags":["用车","手续"],"cost":{"money":"购置税+保险+工本费，代办另收费","time":"半天到一天","willpower":"中"},"evidence":"A","body":{"plain":"新车上牌就是四件事：交购置税、买交强险、验车、选号领牌。4S 店代办省事但收代办费，自己去车管所办也不难。","steps":["提车时确认拿到合格证、发票、车辆一致性证书等材料","到税务机关或电子税务局申报缴纳车辆购置税，新能源汽车按最新减免政策执行","买好交强险，取得保单","到车管所或登记服务站验车、提交材料，办理注册登记","选号（现场随机或网上自选），领取号牌、行驶证和机动车登记证书，贴好检验合格标志"],"pitfalls":["没有合格证原件办不了牌，提车时就要拿到","临时行驶车号牌有有效期，过期上路按无牌处理","限牌城市要先取得指标再买车，顺序不能反"]},"sources":[{"name":"《机动车登记规定》（公安部令第164号）","url":"https://www.gov.cn/gongbao/content/2022/content_5682413.htm","note":"第一节「注册登记」、第三节「检验合格标志核发」；临时行驶车号牌核发与有效期规定"},{"name":"《关于延续和优化新能源汽车车辆购置税减免政策的公告》（财政部 税务总局 工业和信息化部公告2023年第10号）","url":"http://m.mof.gov.cn/zcfb/202306/t20230620_3891500.htm","note":"对购置日期在2026年1月1日至2027年12月31日期间的新能源汽车减半征收车辆购置税，每辆新能源乘用车减税额不超过1.5万元"}]},{"id":"drive-20","title":"第一次办车贷","merged_from":["第一次处理车贷"],"tags":["用车","贷款"],"cost":{"money":"利息与手续费","time":"审批 1–7 天","willpower":"中"},"evidence":"A","body":{"plain":"车贷是银行或汽车金融公司借钱给你买车，车要抵押给放款方。签之前先算清「总共还多少」，而不是只问月供。","steps":["先问年化利率或总利息，算清总还款额再决定","准备身份证、收入证明、银行流水，可以先自查征信","签贷款合同，确认期限、还款方式、提前还款是否收违约金","贷款购车要办理机动车抵押登记，一般由 4S 店或金融机构代办","还清后及时办理解除抵押，否则车辆在法律上仍处于抵押状态"],"pitfalls":["「零利率」常常在手续费、装潢、保险上找回来，算总账","逾期会影响个人征信，进而影响以后房贷、信用卡","提前还款违约金一定要写进合同，口头不算"]},"sources":[{"name":"《机动车登记规定》（公安部令第164号）","url":"https://www.gov.cn/gongbao/content/2022/content_5682413.htm","note":"第四节「抵押登记」；抵押登记期间申请转让登记的，应由原机动车所有人、现机动车所有人和抵押权人共同申请"},{"name":"《汽车贷款管理办法》","url":"https://www.gov.cn/zhengce/2017-10/13/content_5712689.htm","note":"第四条：自用车是指借款人通过汽车贷款购买的、不以营利为目的的汽车；商用车是以营利为目的的汽车"}]},{"id":"drive-21","title":"第一次卖车与二手车过户","merged_from":["第一次卖车","第一次二手车交易"],"tags":["用车","二手车"],"cost":{"money":"过户费，按当地标准","time":"过户半天","willpower":"中"},"evidence":"A","body":{"plain":"卖车有两条路：卖给车商（快、价低）和卖给个人（慢、价可能高）。无论走哪条，最后都要到车管所办转让登记。","steps":["先查维保和出险记录，对车况和底价心里有数","多问几家车商报价，别只问一家","卖给个人要签书面合同，写清车况、价款、过户时间和违约责任","双方到车管所办理转让登记，交验车辆并提交身份证、登记证书、行驶证","过户完成后变更保险，退掉剩余的商业险"],"pitfalls":["只交车不过户，之后产生的违章、事故还可能找上你","隐瞒重大事故、泡水、调表等车况可能构成欺诈","「先过户再付款」还是「先付款再过户」，都要有书面约定"]},"sources":[{"name":"《机动车登记规定》（公安部令第164号）","url":"https://www.gov.cn/gongbao/content/2022/content_5682413.htm","note":"第三节「转让登记」；办理后核发有效期为三十日的临时行驶车号牌，应在有效期内到转入地车辆管理所申请转入"},{"name":"《二手车流通管理办法》","url":"https://www.gov.cn/zhengce/2005-08/29/content_5712430.htm","note":"第一条、第三条：规范二手车经营行为，明确二手车交易市场的定义与功能"}]},{"id":"drive-a1","title":"第一次用交管 12123 办业务","merged_from":[],"tags":["汽车","办事"],"cost":{"money":"0","time":"10 分钟","willpower":"低"},"evidence":"B","body":{"plain":"约考、查违章、缴罚款、申领电子驾驶证和检验标志，都能在「交管 12123」上办，不必跑车管所。","steps":["用本人身份证注册并完成实名认证，绑定驾驶证与机动车","常用功能：考试预约、违法处理与缴款、电子驾驶证、检验标志电子化、期满换证","线上处理有记分的违法通常有次数限制，超了要去窗口","线下办事前先在 App 预约，省排队时间"],"pitfalls":["把账号借给别人处理违章，属于代扣分，违法","线上缴款后没留凭证，重复缴款难退"]},"sources":[{"name":"交管 12123 全国互联网交通安全综合服务管理平台","url":"https://gab.122.gov.cn/","note":"交管 12123 为公安部交通管理局官方平台，具体业务范围以 App 内说明为准"},{"name":"《机动车驾驶证申领和使用规定》（公安部令第 162 号）","url":"https://www.gov.cn/gongbao/content/2022/content_5679696.htm","note":"驾驶证申领、换证与记分管理的规定"}],"addition":true,"why":"约考、查违章、缴罚款、申领电子证照都在这个 App 上，原大纲漏了它"},{"id":"drive-a2","title":"第一次给车做年检（上线检验）","merged_from":[],"tags":["汽车","办事"],"cost":{"money":"几百元","time":"半天","willpower":"中"},"evidence":"A","body":{"plain":"非营运小微型客车的检验周期分线上申领与上线检验两种：部分年份只需申领电子检验标志，部分年份要上检测线。","steps":["先确认自己车辆的检验周期（以行驶证签注和交管 12123 提示为准）","需要上线检验的，提前处理完违章、检查灯光刹车，再预约检测站","免检年份在 App 上申领电子检验标志，不用贴纸","检验有效期届满前办理，逾期上路会被处罚"],"pitfalls":["逾期未检验仍上路，出事故时保险可能拒赔","把「免检」理解成「什么都不用办」，忘记申领标志"]},"sources":[{"name":"《机动车登记规定》（公安部令第 164 号）","url":"http://ga.sz.gov.cn/gkmlpt/content/11/11637/mpost_11637953.html","note":"机动车检验与登记的相关规定"},{"name":"交管 12123 全国互联网交通安全综合服务管理平台","url":"https://gab.122.gov.cn/","note":"检验标志电子化与预约渠道"}],"addition":true,"why":"第几年上线、第几年只申领标志，很多人记不清"},{"id":"drive-a3","title":"第一次处理限行与外地牌照进市区","merged_from":[],"tags":["汽车","出行"],"cost":{"money":"可能罚款扣分","time":"10 分钟","willpower":"低"},"evidence":"C","body":{"plain":"很多城市对非本地号牌和尾号限行有规定，跨省自驾或刚买车上路都会遇到。出发前查清当天的限行规则最省事。","steps":["出发前查目的地城市的限行政策：尾号限行、外地牌照限行时段与区域","确认是否需要办理通行证或预约进京证等手续","导航 App 开启限行提醒，把车牌录入","被处罚后按通知渠道处理，有异议可申请复议"],"pitfalls":["把「限行」当成全天候禁行或完全不管，都可能吃罚单","不同城市规则差异大，别用本地经验套外地"]},"sources":[{"name":"《机动车登记规定》（公安部令第 164 号）","url":"http://ga.sz.gov.cn/gkmlpt/content/11/11637/mpost_11637953.html","note":"机动车通行管理由各地公安机关交通管理部门依法制定，出行前以当地公告为准"}],"addition":true,"why":"跨省自驾或刚买车上路都会遇到，规则各城市不同"}],"additions":[],"_file":"11-驾驶与汽车篇.json","label":"驾驶与汽车篇"},{"section":"12 社交与沟通篇","source_count":60,"merged_count":27,"note":"由原大纲 60 条合并为 24 条（按跨篇去重裁定，「第一次向别人借钱」归 05 金钱篇、「第一次参加葬礼」归 14 家庭篇、「第一次给老师发消息」归 07 学校与大学篇，本篇不重复收录）；出处均由本机 curl 实抓核验","entries":[{"id":"social-01","title":"第一次主动和陌生人搭话、要到联系方式","merged_from":["第一次主动认识陌生人","第一次和陌生人聊天","第一次主动加别人微信","第一次主动结束聊天"],"tags":["社交","沟通"],"cost":{"money":"因人而异（一杯咖啡/一顿饭）","time":"10–30 分钟","willpower":"中"},"evidence":"B","body":{"plain":"搭话的关键不是话术，是「有由头」和「会收尾」。从共同处境切入（排队、同桌、同一个活动），聊几句就够，不必一次变成熟人。","steps":["找一个自然由头开口：问路、问活动安排、评论当下场景","多用开放式问题，让对方有话说，自己少讲履历","聊到合适的时候主动收尾：「我先去那边，加个微信回头联系」","加微信时备注好自己是谁、在哪认识的","后续一两天内发一条具体的信息（如分享对方提过的东西），别只发表情包"],"pitfalls":["一上来就问收入、婚恋、住址这类私人问题，很容易让人警惕","把加微信当成果，加完就不说话，等于没认识","被冷淡回应很正常，别解读成「我很差」，换个对象继续"]},"sources":[{"name":"中国青年报《维系深度社交怎么就成了难事》","url":"http://news.cyol.com/gb/articles/2024-07/18/content_77jVe0UeEY.html","note":"讨论年轻人社交关系维系困难的现状与原因"},{"name":"央视网《「情绪价值」标签下，大学生如何定位人际关系》","url":"https://news.cctv.cn/2025/10/24/ARTI2AqGDGuJbPDEfPsohHT3251024.shtml","note":"分析当下年轻人对人际关系的期待与实际相处方式"}]},{"id":"social-02","title":"第一次加领导微信、给上级发消息","merged_from":["第一次加领导微信"],"tags":["职场","沟通"],"cost":{"money":"无","time":"5 分钟","willpower":"低"},"evidence":"C","body":{"plain":"加领导微信，本质是「让对方知道你是谁」。工作消息的原则是：先说事、再说人，一条说清，不刷屏。","steps":["添加时写清验证信息：部门+姓名+事由","通过后先自我介绍一句，说明是谁给的微信或什么场合加的","工作消息一条说完：什么事、需要什么、什么时候要","重要事项用文字，别发长语音；文件加上一句说明","收到任务回复「收到，我在几点前反馈」，办完再汇报一句"],"pitfalls":["半夜和休息日发工作消息，除非真的紧急","在群里直接 @ 领导追问私事，让人下不来台","把「方便吗」当开场，问了三轮还没说正事，最耗人耐心"]},"sources":[{"name":"中国青年报《九成受访者感到职场软技能重要》","url":"http://zqb.cyol.com/html/2022-11/03/nw.D110000zgqnb_20221103_4-10.htm","note":"调查显示沟通表达等软技能被职场人视为重要能力"}]},{"id":"social-03","title":"第一次打业务电话：陌生客户与预约电话","merged_from":["第一次给陌生客户打电话","第一次打电话预约"],"tags":["沟通","办事"],"cost":{"money":"话费","time":"5–15 分钟","willpower":"中"},"evidence":"B","body":{"plain":"打陌生电话和预约电话的套路是一样的：先自报家门，再说清要什么，最后确认时间地点和需要带的东西。提前把要点写在纸上，紧张也能照着念。","steps":["打电话前写好三行提纲：我是谁、我为什么打、我希望对方做什么","挑对时间：工作电话避开午休和下班前十分钟，预约电话避开整点高峰","开口先问「现在方便说两分钟吗」，不方便就约时间再打","预约时确认：时间、地点、找谁、带什么材料、有没有预约号","挂电话前把关键信息复述一遍，让对方确认"],"pitfalls":["预约类事项现在多数可以线上办，医院普遍实行分时段预约，先看 App 或公众号能不能直接约","被拒绝或转接很正常，别在电话里纠缠","口头预约要记下工号或预约号，事后有据可查"]},"sources":[{"name":"《国家卫生健康委办公厅关于进一步完善预约诊疗制度加强智慧医院建设的通知》","url":"https://www.gov.cn/zhengce/zhengceku/2020-05/22/content_5513897.htm","note":"二级以上医院应当普遍建立预约诊疗制度，提供门诊分时段预约，分时段预约精确到 30 分钟"},{"name":"中国青年网《职场人最需要提升的软技能 受访者首推演讲与表达能力》","url":"http://news.youth.cn/jsxw/202211/t20221102_14101298.htm","note":"沟通表达能力在职场软技能中排在首位"}]},{"id":"social-04","title":"第一次投诉：12315 与 12345","merged_from":["第一次投诉"],"tags":["维权","政务"],"cost":{"money":"无","time":"提交 10 分钟，处理数天到数十天","willpower":"中"},"evidence":"A","body":{"plain":"投诉之前先分清两件事：消费纠纷找 12315（市场监管），政务服务、公共事业、政策咨询找 12345。剩下的，就是把证据备齐、把诉求说具体。","steps":["先找商家或平台客服走一遍流程，留存聊天记录和工单号","拨打 12315 或通过全国 12315 平台在线提交投诉，写清时间、地点、金额、诉求","上传证据：订单截图、付款记录、合同、照片、聊天记录","记住受理时限：市场监督管理部门应自收到投诉之日起七个工作日内作出是否受理的决定","不属于消费纠纷的（如水电气、公交、办事窗口），打 12345 政务服务便民热线"],"pitfalls":["只说「太差了」没有具体诉求，处理起来很慢，直接写「要求退款 XX 元」","证据只存在手机里没导出，换设备或清理缓存就没了","12345 是转办和督办渠道，不代替部门职能，复杂事项要有耐心跟进"]},"sources":[{"name":"《市场监督管理投诉举报处理办法》（市场监管总局令第121号）","url":"https://www.gov.cn/gongbao/2026/issue_12686/202604/content_7066102.html","note":"第八条：应当通过全国12315平台、12315 热线电话或者公布的邮寄地址、受理窗口等渠道提出；第二十一条：自收到投诉之日起七个工作日内作出受理或不予受理的决定"},{"name":"《国务院办公厅关于进一步优化地方政务服务便民热线的指导意见》（国办发〔2020〕53号）","url":"https://www.gov.cn/gongbao/content/2021/content_5581062.htm","note":"各地区归并后的热线统一为「12345 政务服务便民热线」，提供 7×24 小时全天候人工服务"}]},{"id":"social-05","title":"第一次拒绝别人、第一次说「不」","merged_from":["第一次拒绝别人","第一次说“不”","第一次拒绝别人表白"],"tags":["社交","边界"],"cost":{"money":"无","time":"几分钟","willpower":"高"},"evidence":"B","body":{"plain":"拒绝不是翻脸，是把自己的边界说清楚。一句到位的拒绝 = 明确态度 + 简短理由 + 不给回旋余地，不必道歉三次。","steps":["先给对方一个明确答复：「这件事我帮不了」，别用「再说吧」拖","理由短而具体，一次说清，不展开辩解","涉及借钱的，直接说自己的原则，比编理由更干净","拒绝表白时肯定对方的心意，但把态度说死，不留暧昧","拒绝之后不要反复回头解释，反复反而让人觉得还有机会"],"pitfalls":["「我考虑考虑」在很多人听来等于「有戏」，容易招来二次请求","喝不喝酒、加不加班这类事，含糊一次后面就得次次让步","不好意思拒绝而勉强答应，最后办不好更伤关系"]},"sources":[{"name":"人民网科普中国《「不」字难以说出口？你的「心理界限」可能出了问题》","url":"https://cloud.kepuchina.cn/search/imgText?id=402279","note":"整理四类心理界限问题与重建方法，指出在人际关系中不敢说「不」是典型表现"},{"name":"人民网《如何培养和维护边界意识》","url":"http://cq.people.com.cn/n2/2024/1018/c365414-41012645.html","note":"边界意识的养成与维护建议"}]},{"id":"social-06","title":"第一次道歉，第一次接受别人的道歉","merged_from":["第一次向别人道歉","第一次接受别人道歉"],"tags":["社交","关系"],"cost":{"money":"无","time":"几分钟到几天","willpower":"中"},"evidence":"B","body":{"plain":"有效的道歉只有三部分：承认具体做错了什么、说清下次怎么改、不要求对方马上原谅。接受道歉也一样，可以说「我知道了」，不必立刻热络。","steps":["先说事实：「我昨天在会上打断了你三次」，比「对不起啦」有用","不解释、不甩锅，理由放到对方问的时候再说","给出补救：重做、补偿、下次怎么做","给对方时间，别追问「你原谅我了吗」","轮到自己接受道歉，先确认对方说的是不是自己在意的点，再决定恢复到什么程度"],"pitfalls":["「对不起，但是你也……」是辩解不是道歉","道歉完马上要求对方表态，等于二次施压","关系里不是从不争吵，吵完能不能修复才是关键"]},"sources":[{"name":"人民日报夜读《一段好的关系，不是从不争吵》","url":"https://www.peopleapp.com/column/30052855989-500007636335","note":"讨论亲密关系中冲突与修复的常态"},{"name":"中国青年报《双向付出是受访青年认为最重要的恋爱能力》","url":"https://zqb.cyol.com/pad/content/202608/24/content_429815.html","note":"受访青年对关系中双向付出的看法"}]},{"id":"social-07","title":"第一次和朋友、室友吵架后和好","merged_from":["第一次当面解决矛盾","第一次和朋友吵架","第一次和室友吵架"],"tags":["社交","关系"],"cost":{"money":"无","time":"当晚到几天","willpower":"中"},"evidence":"B","body":{"plain":"室友矛盾大多不是大事，是生活习惯和公共空间的边界没说清。当面谈比在群里阴阳、比冷战都有效。","steps":["先冷静下来再谈，情绪上来时先离开现场几分钟","用「我」开头说感受和事实：几点需要安静、哪些东西不要动","把可执行的约定定下来：值日表、声音时段、公共物品分摊","谈完各自让一步，写进群里避免下次再吵","如果是自己的问题，先道歉；对方不接也没关系，态度到位就够"],"pitfalls":["在共同群里开火，会让所有人站队，问题更难解","翻旧账、做人身攻击，会把一件小事变成长期敌对","冷战超过一两天，双方都在等对方先开口，最后往往直接断交"]},"sources":[{"name":"人民日报夜读《一段好的关系，不是从不争吵》","url":"https://www.peopleapp.com/column/30052855989-500007636335","note":"冲突在关系中的位置与修复方式"},{"name":"中国青年报《维系深度社交怎么就成了难事》","url":"http://news.cyol.com/gb/articles/2024-07/18/content_77jVe0UeEY.html","note":"年轻人维系日常人际关系的现实困难"}]},{"id":"social-08","title":"第一次和同事、领导意见不同","merged_from":["第一次和同事发生矛盾","第一次和领导意见不同","第一次面对职场甩锅","第一次面对别人阴阳怪气"],"tags":["职场","沟通"],"cost":{"money":"无","time":"因人而异","willpower":"高"},"evidence":"B","body":{"plain":"职场分歧的原则：对事不对人，留痕不自证。把分歧记到具体的工作项上，用书面沟通代替情绪对线。","steps":["先说共同目标，再说分歧点：「都是想按期上线，我担心的是测试时间」","重要沟通走邮件或工作群，把结论抄送给相关人","被甩锅时不要当场翻脸，先把事实和时间线列清楚，用记录说话","遇到阴阳怪气，可以直接问需求：「你是希望我改哪一部分？」把话逼到具体","确实解决不了，按流程找直属上级或 HR，带上记录而不是情绪"],"pitfalls":["当场争赢一时，事后被孤立，得不偿失","没有任何书面记录，事后只有你的口头说法","把工作矛盾升级成人身攻击，最后变成双方都有责任"]},"sources":[{"name":"《中华人民共和国劳动合同法》","url":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2521208.html","note":"劳动合同的订立、履行、变更与解除等基本规则，是处理职场纠纷的法定依据"},{"name":"中国青年报《九成受访者感到职场软技能重要》","url":"http://zqb.cyol.com/html/2022-11/03/nw.D110000zgqnb_20221103_4-10.htm","note":"沟通、协作等软技能在职场中的重要性"}]},{"id":"social-09","title":"第一次和陌生人起争执、被陌生人骂","merged_from":["第一次和陌生人争论","第一次被陌生人骂"],"tags":["社交","冲突"],"cost":{"money":"无","time":"几分钟","willpower":"中"},"evidence":"C","body":{"plain":"和陌生人冲突，第一原则是尽快脱身，不是讲赢道理。对方在情绪上，你讲逻辑也听不进去，还可能升级成肢体冲突。","steps":["先判断环境：人多的地方别围观，人少的地方尽快走到有监控和工作人员的场所","只说一句止损的话：「这事我不跟你争了」，然后离开","被辱骂时不要对骂，掏出手机录像并保留时间地点","涉及推搡、威胁、损坏财物的，直接打 110","事后不要在社交平台挂人，未经核实的曝光可能给自己惹麻烦"],"pitfalls":["为了「讲道理」站在原地挨骂，是把自己置于风险里","先动手的一方通常要承担主要责任，推搡也算","把对方的话反复回味，情绪会被带走很久，允许自己翻篇"]},"sources":[{"name":"央视网《「情绪价值」标签下，大学生如何定位人际关系》","url":"https://news.cctv.cn/2025/10/24/ARTI2AqGDGuJbPDEfPsohHT3251024.shtml","note":"年轻人处理人际摩擦与情绪消耗的常见方式"},{"name":"人民网《如何培养和维护边界意识》","url":"http://cq.people.com.cn/n2/2024/1018/c365414-41012645.html","note":"边界意识与自我保护的关系"}]},{"id":"social-10","title":"第一次冷场、第一次处理尴尬局面","merged_from":["第一次处理尴尬局面","第一次冷场"],"tags":["社交","沟通"],"cost":{"money":"无","time":"几分钟","willpower":"低"},"evidence":"C","body":{"plain":"冷场很正常，多数人不会把它记在你头上。与其硬找话题，不如承认它，然后换个更容易聊的方向。","steps":["沉默三秒不用急着填，先笑一下或者说「刚才说到哪了」","把话题从抽象换到具体：最近看的剧、附近好吃的、正在做的事","实在聊不下去就自然收尾：「我去拿点吃的，一会儿聊」","说错话时直接承认「说错了，我重说」，比硬圆更快解围","一对一的场子冷场，可以换成一起做点什么，比如走走、点单"],"pitfalls":["为了破冰而追问隐私，反而更尴尬","低头刷手机是最差的救场方式，等于告诉对方「我不想聊」","把一次冷场当成自己社交能力差，是过度归因"]},"sources":[{"name":"中国青年报《维系深度社交怎么就成了难事》","url":"http://news.cyol.com/gb/articles/2024-07/18/content_77jVe0UeEY.html","note":"年轻人日常社交中的压力与应对"},{"name":"央视网《「情绪价值」标签下，大学生如何定位人际关系》","url":"https://news.cctv.cn/2025/10/24/ARTI2AqGDGuJbPDEfPsohHT3251024.shtml","note":"对社交期待与实际相处落差的讨论"}]},{"id":"social-11","title":"第一次参加饭局、第一次敬酒","merged_from":["第一次参加饭局","第一次敬酒","第一次拒绝喝酒"],"tags":["社交","饭局"],"cost":{"money":"无（若被请则 AA 或回请）","time":"2–4 小时","willpower":"中"},"evidence":"A","body":{"plain":"饭局先看场合：商务局、亲戚局、朋友局，规矩差别很大。敬酒的重点是表达，不是喝多少；不喝酒完全可以，理由给足就行。","steps":["入座听安排，不确定坐哪就问一句「我坐这儿可以吗」","敬酒从主位或长辈开始，起身、杯沿低于对方，说一句具体的客气话","不喝酒就提前说明并倒上茶或饮料，同样起身敬，态度不减","别人劝酒，用「我开车」「我吃药」「医生不让」这类硬理由，说一次就够","散场前跟主人打个招呼再走，别悄悄溜"],"pitfalls":["酒后开车是违法，饮酒后不得驾驶机动车，这一点没有商量余地","同桌饮酒出事，劝酒、放任的人可能要担责，团建饮酒致死的案例已有判罚","酒桌上答应的事第二天要落实，否则比不答应更伤关系"]},"sources":[{"name":"《中华人民共和国道路交通安全法》","url":"https://www.gov.cn/gongbao/content/2004/content_62789.htm","note":"第二十二条：饮酒后不得驾驶机动车；第九十一条：饮酒后驾驶机动车的处罚规定"},{"name":"湖南省公安厅《团建饮酒过量致死 公司同饮均须担责》","url":"https://gat.hunan.gov.cn/gat/ztzl2/fzyd/yasf/202412/t20241218_33529145.html","note":"以案释法：共同饮酒场合中劝酒、未尽照顾义务者的责任"}]},{"id":"social-12","title":"第一次请客、被请客与主持饭局","merged_from":["第一次请别人吃饭","第一次接受别人请客","第一次主持饭局"],"tags":["社交","饭局"],"cost":{"money":"一顿饭钱，按人均和城市","time":"2–3 小时","willpower":"低"},"evidence":"B","body":{"plain":"请客的核心是「让对方舒服」：地点合适、点菜照顾忌口、买单不拉扯。主持饭局则多一件事——让每个人都有话说。","steps":["订位前问清忌口、人数和大概预算，选交通方便的地方","点菜宁少勿多，先点招牌和两个素菜，不够再加","主人先动筷、先举杯，把话头引给最不熟的人","买单提前去前台结，别在桌上抢单让客人尴尬","被请客后过几天回个消息或回请，关系才长久"],"pitfalls":["当众问「你一个月挣多少」「怎么还不结婚」，饭桌变审讯","点菜只点自己爱吃的、或者一次点一大桌吃不完","被请客时抢着买单，有时是不给主人面子，看关系再定"]},"sources":[{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"提出对天价彩礼、铺张浪费、低俗婚闹、随礼攀比等不正之风开展整治"}]},{"id":"social-13","title":"第一次参加婚礼、第一次参加生日宴","merged_from":["第一次参加婚礼","第一次参加生日宴"],"tags":["社交","礼仪"],"cost":{"money":"随礼金额，按关系和当地行情","time":"半天","willpower":"低"},"evidence":"B","body":{"plain":"参加这类场合就三件事：随礼到位、穿着得体、别抢流程。礼金按关系和当地行情来，写清名字，方便主家记账。","steps":["提前问清时间地点，酒店婚礼要看清厅名，别跑错厅","随礼当面交给礼金台或提前转账，红包上写清自己名字","穿着干净得体即可，婚礼避免全白或过于隆重抢镜","按主持人和新人安排就座、拍照，不擅自上台","结束后可以发一条祝福消息，比在现场刷手机更得体"],"pitfalls":["礼金攀比是被官方点名整治的风气，按能力来就好","迟到早退、席间大声劝酒，是最容易被记住的失礼","别人家的隐私（彩礼多少、房子谁买）别当场打听"]},"sources":[{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"开展对天价彩礼、铺张浪费、低俗婚闹、随礼攀比等不正之风的整治"}]},{"id":"social-14","title":"第一次参加公司团建","merged_from":["第一次参加公司团建"],"tags":["职场","活动"],"cost":{"money":"一般公司出，个人消费自理","time":"半天到两天","willpower":"中"},"evidence":"B","body":{"plain":"团建是工作场合的延伸，不是纯玩。核心是「到场、参与、不喝多」——尤其酒，别在领导面前逞能。","steps":["确认时间、地点、是否占用周末、能不能报销交通","提前了解活动内容，涉及体能或自费项目可以问清","参与但量力而行，身体不适直接说，不必硬撑","喝酒控制在自己能清醒回家的量，别接受连续劝酒","团建照片发之前先问同不同意，别擅自发同事的糗照"],"pitfalls":["团建饮酒过量出事故，组织者和同饮者都可能被追责","在团建上抱怨公司、吐槽同事，第二天一定传开","以团建名义的强制自费，可以问清依据再决定"]},"sources":[{"name":"湖南省公安厅《团建饮酒过量致死 公司同饮均须担责》","url":"https://gat.hunan.gov.cn/gat/ztzl2/fzyd/yasf/202412/t20241218_33529145.html","note":"以案释法：团建饮酒中公司、同饮者的责任划分"}]},{"id":"social-15","title":"第一次给别人送礼、第一次收贵重礼物","merged_from":["第一次给别人送礼","第一次收别人贵重礼物"],"tags":["社交","礼仪"],"cost":{"money":"礼物预算，按关系和场合","time":"半天","willpower":"低"},"evidence":"B","body":{"plain":"送礼送的是「被记住的细节」，不是价格。收贵重礼物则要先想清楚「这份人情我还不还得起」。","steps":["先想对方的实际需求：常用、能用完、不占地方的东西最合适","附一张手写卡片，写清为什么送这个，比礼物本身更打动人","当面送或快递都行，避开对方不方便的场合","收到贵重礼物先表达感谢，再判断对方意图，拿不准就暂不拆封使用","还不起的人情，坦率说明并退回，比收下后长期不安好"],"pitfalls":["给有职权关系的人送贵重礼物，容易踩红线，保持克制","在人多场合送差别很大的礼物，会让别人难堪","把「随礼攀比」当人情往来，最后累的是自己"]},"sources":[{"name":"民政部《关于开展婚俗改革试点工作的指导意见》","url":"https://xxzx.mca.gov.cn/n786/c36363/content.html","note":"对随礼攀比等不正之风开展整治，倡导文明节俭的人情往来"}]},{"id":"social-16","title":"第一次求人帮忙：借东西、求助、被拒绝","merged_from":["第一次向别人借东西","第一次向别人求助","第一次被人拒绝"],"tags":["社交","边界"],"cost":{"money":"因人而异","time":"几分钟到几天","willpower":"中"},"evidence":"C","body":{"plain":"开口求助的关键是「把成本说清楚」：借什么、多久还、坏了怎么办。对方拒绝是人家的权利，不是对你的评价。","steps":["先说清要什么、用多久、什么时间归还","给对方台阶：「不方便就直说，我再想办法」","借来的东西按期归还，最好还的时候比借走时更干净","贵重或私人物品被拒绝很正常，不要反复争取","被拒绝后道谢再走，这一次的体面就是下一次的机会"],"pitfalls":["临时抱佛脚式的求助，对方多半为难，平时就该有来往","把「你都不帮我」当武器，是消耗关系的做法","借钱给别人要量力而行，借条和转账记录都要留"]},"sources":[{"name":"人民网科普中国《「不」字难以说出口？你的「心理界限」可能出了问题》","url":"https://cloud.kepuchina.cn/search/imgText?id=402279","note":"讨论在人际关系中不敢拒绝、也难以接受被拒绝的心理机制"},{"name":"人民网《如何培养和维护边界意识》","url":"http://cq.people.com.cn/n2/2024/1018/c365414-41012645.html","note":"边界意识在求助与拒绝中的具体运用"}]},{"id":"social-17","title":"第一次催别人还钱","merged_from":["第一次催别人还钱"],"tags":["社交","钱"],"cost":{"money":"可能损失本金","time":"数周到数年","willpower":"高"},"evidence":"A","body":{"plain":"催款的第一原则是留证据，第二原则是别把话说死。约定了还款期限的，到期就该开口；没有借条和转账记录，后面很难主张。","steps":["先核实证据：借条或聊天里写明的金额、期限，加上银行/微信转账记录","用文字沟通催收，把「欠多少、什么时候还」再确认一次，对方回复就是证据","给对方一个可执行的方案：分期、先还一部分、约定具体日期","一直不还的，可以发正式的书面催告，并注意诉讼时效","金额较大又谈不拢，咨询律师或通过诉讼解决，别用堵门、曝光隐私的方式"],"pitfalls":["现金交付又没有借条，事后很难说清","约定利率过高不受法律保护：民间借贷利率司法保护上限与一年期贷款市场报价利率挂钩，超出部分法院不予支持","长期不主张权利可能超过诉讼时效，具体以《民法典》规定为准"]},"sources":[{"name":"《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》（2020 年修正）解读","url":"https://ytyhfy.jxfy.gov.cn/article/detail/2020/11/id/5630641.shtml","note":"民间借贷利率的司法保护上限为合同成立时一年期贷款市场报价利率的四倍，超出部分不予支持"},{"name":"《中华人民共和国民法典》","url":"http://gongbao.court.gov.cn/Details/7f184078694d811fb3314f6af9accf.html","note":"诉讼时效等总则编规定（最高人民法院公报刊载文本）"}]},{"id":"social-18","title":"第一次被网络攻击：网暴、争吵与负面评论","merged_from":["第一次处理网络争吵","第一次被网络攻击","第一次面对负面评论"],"tags":["网络","维权"],"cost":{"money":"无（如需律师则另计）","time":"数天到数月","willpower":"高"},"evidence":"A","body":{"plain":"被网暴先做三件事：截图取证、停止对骂、用平台举报和 12377 走正式渠道。情绪上的输赢不重要，把证据留住才重要。","steps":["第一时间截图和录屏，保留链接、账号 ID、发布时间","不再回复对骂，关闭私信或设置评论权限，减少暴露","用平台的举报入口投诉，要求删除、屏蔽、断开链接","平台不处理或涉及侮辱、诽谤、威胁的，向 12377 举报中心举报，必要时报警","情况严重、影响生活的，可以咨询律师，通过诉讼主张名誉权等人格权益"],"pitfalls":["把对方信息「人肉」出来反曝光，自己也可能违法","对骂会把单向攻击变成互相侵权，双方都留案底","删号跑路会丢掉证据，先备份再处理账号"]},"sources":[{"name":"《网络暴力信息治理规定》（国家网信办等四部门）","url":"https://www.gov.cn/gongbao/2024/issue_11526/202408/content_6969181.html","note":"要求网络信息服务提供者建立网暴信息预警、举报和处置机制，包括弹窗提示、违规警示、限制流量等措施"},{"name":"中央网信办违法和不良信息举报中心（12377）举报指南","url":"https://www.12377.cn/h5/jbzn.html","note":"举报受理范围与举报渠道说明"}]},{"id":"social-19","title":"第一次拍视频、第一次开直播","merged_from":["第一次拍视频","第一次直播","第一次拥有陌生粉丝","第一次被陌生人认可"],"tags":["网络","创作"],"cost":{"money":"设备几百元起（手机也行）","time":"每条视频数小时","willpower":"中"},"evidence":"A","body":{"plain":"拍视频和直播都受平台规则约束：内容要真实、标注要清楚、别人的素材不能随便用。第一次开播不用追求人气，先把设备和流程跑通。","steps":["先定一个持续做得下去的方向，比如记录一件事的过程","手机加一个稳定支架就够了，光线比设备重要","直播前测试网络、麦克风和画面，准备好开场白和话题","涉及带货、广告的内容按平台要求标注，不夸大宣传","收到陌生人的认可别飘，收到负面评论也别对线，把精力放回内容"],"pitfalls":["直播间和评论区要有人管，出现违法和不良信息要及时处置","未经允许拍摄、传播他人肖像和隐私，容易引发纠纷","为流量编造信息、蹭未核实的传闻，可能触犯平台规则甚至法律"]},"sources":[{"name":"《互联网直播服务管理规定》","url":"https://www.beijing.gov.cn/zhengce/zhengcefagui/201905/t20190522_59665.html","note":"直播服务的许可、内容审核与用户管理要求"},{"name":"《网络信息内容生态治理规定》（国家互联网信息办公室令第5号）","url":"https://www.gov.cn/zhengce/zhengceku/2020-11/25/content_5564110.htm","note":"网络信息内容生产者不得制作、复制、发布违法信息，应当防范和抵制不良信息"}]},{"id":"social-20","title":"第一次公开表达：发言、演讲与接受采访","merged_from":["第一次公开表达观点","第一次公开演讲","第一次接受采访"],"tags":["沟通","表达"],"cost":{"money":"无","time":"准备数小时，讲 5–20 分钟","willpower":"中"},"evidence":"B","body":{"plain":"公开表达的紧张是正常的，解法不是「不紧张」，是准备到不用想。三句话结构最好用：我要说什么、为什么重要、希望大家做什么。","steps":["先写一句话结论，再补两三个支撑点，每点一个例子","写出口语化的讲稿并读两遍，掐时间，删掉一半形容词","提前到场地试麦、试 PPT，站到台前走一遍位置","上台先停一秒、看一眼观众再开口，语速放慢","接受采访时不确定的问题说「这个我需要核实后回复」，别硬编"],"pitfalls":["照着稿子念会让人听不进去，把要点写成卡片就好","被问到不懂的硬答，后患比自己承认不知道更大","事先把可能被追问的三个问题想好答案，现场会从容很多"]},"sources":[{"name":"中国青年网《职场人最需要提升的软技能 受访者首推演讲与表达能力》","url":"http://news.youth.cn/jsxw/202211/t20221102_14101298.htm","note":"调查显示演讲与表达能力是受访者最想提升的职场软技能"},{"name":"中国青年报《九成受访者感到职场软技能重要》","url":"http://zqb.cyol.com/html/2022-11/03/nw.D110000zgqnb_20221103_4-10.htm","note":"职场软技能的构成与提升途径"}]},{"id":"social-21","title":"第一次见重要人物、谈长期合作","merged_from":["第一次见重要人物","第一次和别人建立长期合作"],"tags":["职场","合作"],"cost":{"money":"差旅等成本","time":"一次见面 1 小时，准备数小时","willpower":"中"},"evidence":"B","body":{"plain":"见重要人物，准备比临场发挥重要：你只有很短时间说清三件事——你是谁、你能提供什么、希望对方做什么。长期合作则一定要落到书面。","steps":["提前查清对方的身份、业务和近期公开动态，准备好一句话自我介绍","带三个问题去，比带三页 PPT 更能聊起来","谈合作当场明确：做什么、谁负责、什么时候交付、怎么算钱","能签合同的就签合同，线上达成一致的用邮件确认","重要约定用可留痕的方式确认，电子数据同样可以作为证据"],"pitfalls":["只谈感情不谈条件，后期扯皮最多","口头答应「先用着」，事后没有付款依据","把对方的名片和信息转发给第三方，是很失分的行为"]},"sources":[{"name":"《中华人民共和国电子签名法》","url":"https://www.gov.cn/gongbao/content/2004/content_62978.htm","note":"可靠的电子签名与手写签名或者盖章具有同等的法律效力（电子合同的效力依据）"}]},{"id":"social-22","title":"第一次参加一群陌生人的聚会","merged_from":["第一次主动认识一群陌生人","第一次参加陌生人的聚会"],"tags":["社交","活动"],"cost":{"money":"活动费用","time":"2–4 小时","willpower":"中"},"evidence":"C","body":{"plain":"一屋子陌生人时，最好的策略是「先找一个落点」：从一个人聊起，再通过他进入群体，比一进门就满场敬酒自然得多。","steps":["进门先找主办方或已经认识的人，让他帮你介绍一两个人","从场地、活动本身切入，比直接问职业更容易接话","记住对方的名字和一件小事，下次见面能接上","聊半小时左右主动和几个人加联系方式，不必全场都认识","离场前和主办方道谢，下次还会有人叫你"],"pitfalls":["一直贴着熟人，等于没来","喝多了说大话，是这类聚会最常见的翻车方式","把「认识多少人」当目标，不如留下两三个能再联系的人"]},"sources":[{"name":"中国青年报《维系深度社交怎么就成了难事》","url":"http://news.cyol.com/gb/articles/2024-07/18/content_77jVe0UeEY.html","note":"年轻人社交广度增加但深度不足的现象"},{"name":"央视网《「情绪价值」标签下，大学生如何定位人际关系》","url":"https://news.cctv.cn/2025/10/24/ARTI2AqGDGuJbPDEfPsohHT3251024.shtml","note":"对社交关系定位的讨论"}]},{"id":"social-23","title":"第一次结束一段友谊、第一次学会保持边界","merged_from":["第一次结束一段友谊","第一次学会保持边界"],"tags":["社交","边界"],"cost":{"money":"无","time":"数周到数年","willpower":"高"},"evidence":"B","body":{"plain":"不是所有关系都要维系到底。疏远可以是渐进的：减少见面、不再倾诉、保留礼貌。这不算背叛，是成年人的常态。","steps":["先想清楚要结束的是什么：是整天黏在一起的模式，还是这段关系本身","优先做减法而不是宣告：减少见面频率，不主动分享私事","对方追问时直接说：「我最近想自己待着」，不必列举对方的错","涉及金钱、工作、共同朋友圈的，提前把自己的那份理清","把精力移回自己的生活，新的关系会自然长出来"],"pitfalls":["在共同群里公开指责对方，会波及所有人","一刀两断式的决裂常带来反复和拉扯，渐进更省力","不必为「先退出的人」负罪，维护边界不是伤害别人"]},"sources":[{"name":"人民网《如何培养和维护边界意识》","url":"http://cq.people.com.cn/n2/2024/1018/c365414-41012645.html","note":"边界意识的培养与维护"},{"name":"人民网科普中国《「不」字难以说出口？你的「心理界限」可能出了问题》","url":"https://cloud.kepuchina.cn/search/imgText?id=402279","note":"重建心理界限的方法"}]},{"id":"social-24","title":"第一次帮陌生人：搭把手与让座","merged_from":["第一次帮助陌生人","第一次给陌生人让座"],"tags":["社交","公共"],"cost":{"money":"无（可能耽误自己的时间）","time":"几分钟","willpower":"低"},"evidence":"A","body":{"plain":"帮陌生人是最低成本的善意：公交上让个座、地铁扶一把、路上指个路。分寸是「帮到实处，不越界、不冒犯」。","steps":["让座直接起身示意对方坐，不用大声说「您坐这儿」，避免对方尴尬","看到搬重物、推婴儿车的，先问一句「需要帮忙吗」再伸手","指路时尽量说清方向、距离和地标，实在不确定就说不确定","遇到不适或纠缠，帮完就走，别留下来继续纠缠","对方道谢或拒绝都正常，笑着点头就好"],"pitfalls":["未经同意碰别人的随身物品或身体，帮忙也会变成冒犯","公共交通工具上应为老、幼、病、残、孕乘客提供必要的帮助，这是运营方和乘客共同的文明要求","看到伤情、纠纷等复杂情况，先报警求助比自己上手更稳妥"]},"sources":[{"name":"《城市公共汽车和电车客运管理规定》（交通运输部）","url":"https://xxgk.mot.gov.cn/gz/202112/t20211228_3633629.html","note":"运营企业及从业人员应当为老、幼、病、残、孕乘客提供必要的帮助"},{"name":"《志愿服务条例》（国务院令第685号）","url":"https://www.gov.cn/zhengce/content/2017-09/06/content_5223028.htm","note":"志愿服务的组织、支持与保障规定，为长期参与志愿服务提供依据"}]},{"id":"social-a1","title":"第一次用微信、邮件做工作留痕","merged_from":[],"tags":["职场","沟通"],"cost":{"money":"0","time":"养成习惯","willpower":"中"},"evidence":"B","body":{"plain":"重要沟通留文字记录，是避免扯皮最有效的一招：口头说的、电话讲的，事后用一条消息确认一遍。","steps":["口头或电话沟通后，发一条消息复述结论：「刚才确认的是……对吧」","关键节点用邮件抄送相关人，主题写清项目与事项","保存原始记录，别只保留截图；工作群别随意清理","涉及金额、时间、责任的内容必须落到文字"],"pitfalls":["只打电话不留痕，事后各说各话","把重要记录存在私人手机里，换设备就丢了"]},"sources":[{"name":"《中华人民共和国劳动争议调解仲裁法》（人社部中国公共招聘网）","url":"https://chinajob.mohrss.gov.cn/c/2022-07-15/356212.shtml","note":"劳动争议处理中，当事人对自己提出的主张有责任提供证据"}],"addition":true,"why":"重要沟通留文字记录，是避免扯皮最有效的一招"},{"id":"social-a2","title":"第一次体面地拒绝亲戚的过度打听","merged_from":[],"tags":["社交","家庭"],"cost":{"money":"0","time":"几分钟","willpower":"中"},"evidence":"C","body":{"plain":"被追问工资、对象、婚期是年轻人的高频困扰。有效的应对不是硬顶，而是把话题接住再转移，或者把边界说清楚。","steps":["准备两三句通用回复：先给一句模糊的答案，再反问对方近况","对反复追问的，直接用一句「这个暂时不方便聊」并转到别的话题","配偶/伴侣在场时提前对好口径，避免互相拆台","涉及催婚催生，把决定权表述为两个人的共同安排，减少针对个人的施压"],"pitfalls":["为了面子随口承诺时间表，后面年年被追问","当场翻脸，后续家庭场合更难相处"]},"sources":[{"name":"中国法律服务网（12348）","url":"https://www.12348.gov.cn/","note":"家庭沟通与个人边界属于经验性话题，无对应法规；遇到人身权益受侵害可通过公共法律服务平台咨询"}],"addition":true,"why":"过年过节被问工资、对象、婚期是年轻人的高频困扰，需要一个体面又有效的应对"},{"id":"social-a3","title":"第一次开线上会议（摄像头、发言与纪要）","merged_from":[],"tags":["职场","沟通"],"cost":{"money":"0","time":"30 分钟","willpower":"低"},"evidence":"C","body":{"plain":"远程办公常态化，线上会议有几条基本礼貌：提前两分钟进会、不发言时静音、重要结论当场落到文字。","steps":["提前测试麦克风、摄像头与网络，准备一份一页纸要点","进会后先静音，发言前自报姓名再说结论","屏幕上共享的内容注意遮挡私人信息（通知、聊天窗口）","会后 24 小时内发出纪要，写明结论、分工与时间点"],"pitfalls":["开着麦克风吃东西、家人突然入镜","把会议纪要做成流水账，没有结论和责任人"]},"sources":[{"name":"工业和信息化部（电信服务与用户权益）","url":"https://www.miit.gov.cn/","note":"远程办公工具与网络服务由运营商与平台提供，使用规范以单位制度与平台规则为准"}],"addition":true,"why":"远程办公常态化，但原大纲完全没有覆盖线上沟通场景"}],"additions":[],"_file":"12-社交与沟通篇.json","label":"社交与沟通篇"},{"section":"13 恋爱与婚姻篇","source_count":60,"merged_count":27,"note":"由原大纲 60 条合并为 24 条；正文与出处均由本机 curl 实抓核验（中国政府网、最高人民法院公报、民政部、国家卫健委、国家医保局、中国青年报、新华网、科普中国等）。涉及身体与生育的部分只写流程与依据，不写医疗、法律意见","entries":[{"id":"love-01","title":"第一次喜欢一个人、第一次暗恋","merged_from":["第一次喜欢一个人","第一次暗恋"],"tags":["恋爱","情感"],"cost":{"money":"无","time":"因人而异","willpower":"中"},"evidence":"B","body":{"plain":"喜欢一个人是先有感觉、后有判断的事，暗恋则是把这份感觉收在自己这里。暗恋不丢人，但要分清你喜欢的是这个人，还是自己想象出来的他。","steps":["先观察真实的他：怎么对待服务员、怎么处理麻烦、说的话和做的事一致吗","记下让你心动的具体事，一周后回看，很多「喜欢」会自己降温","判断要不要说：能承受被拒绝，就说；只是想有个寄托，就先放在心里","暗恋期间别做过度投入的事（借钱、旷课、天天蹲点）","如果长时间走不出来，把注意力挪回自己的生活节奏"],"pitfalls":["把对方的礼貌和客气解读成喜欢，是暗恋最常见的误判","在朋友圈、社交平台发暗示性的内容试探，往往只会让自己更难受","喜欢是一种需要培养的能力，不是一次考试，学会表达和承受结果比「成功」更重要"]},"sources":[{"name":"中国青年报《86.6%受访青年认为「爱」是一种需要培养的能力》","url":"https://zqb.cyol.com/pc/content/202608/20/content_429640.html","note":"调查显示多数受访青年认为爱是需要培养的能力，而非天生就会"}]},{"id":"love-02","title":"第一次追人、第一次表白（含被表白）","merged_from":["第一次主动追人","第一次表白","第一次被表白"],"tags":["恋爱","表达"],"cost":{"money":"约会与礼物开销","time":"数周到数月","willpower":"高"},"evidence":"B","body":{"plain":"表白是把关系挑明的一句话，不是开始追求的仪式。更好的顺序是：先有稳定的互动和明确的回应，
